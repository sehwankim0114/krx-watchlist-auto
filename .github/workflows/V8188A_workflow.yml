          }

          upstream=set(subprocess.check_output(
              ["git","diff","--name-only","HEAD..origin/main"],text=True
          ).splitlines())

          bad=sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if bad:
              raise SystemExit("V8188A_CONCURRENT_PROTECTED_DRIFT:"+",".join(bad))

          print("V8188A_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

