              "latest/investment_score_price_elasticity_production_v8188a_run_log_latest.txt",
              "docs/investment_score_price_elasticity_production_v8188a.md",
          }

          changed=set()
          for line in subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"],text=True
          ).splitlines():
              if line:
                  changed.add(line[3:].split(" -> ")[-1])

          bad=sorted(changed-allowed)
          if bad:
              raise SystemExit("V8188A_UNEXPECTED_CHANGED_FILES:"+",".join(bad))

          print("V8188A_CHANGED_FILES_RESTRICTED=PASS")
          PY

