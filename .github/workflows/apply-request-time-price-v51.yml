name: Apply request-time price overlay v5.1

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-request-time-price-overlay-v51
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      LIVE_PRICE_API_BASE_URL: https://krx-live-price-ksh.diaconos.workers.dev

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependencies
        run: python -m pip install --quiet pandas pyyaml

      - name: Verify live price Worker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          base = os.environ["LIVE_PRICE_API_BASE_URL"].rstrip("/")

          def get_json(url):
              request = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "GitHub-Actions-KRX-v5.1",
                      "Accept": "application/json",
                  },
              )
              with urllib.request.urlopen(
                  request,
                  timeout=30,
              ) as response:
                  return json.loads(
                      response.read().decode("utf-8")
                  )

          health = get_json(base + "/health")
          if health.get("status") != "OK":
              raise SystemExit(f"WORKER_HEALTH_FAILED={health}")
          if health.get("version") != "1.1.0":
              raise SystemExit(
                  f"WORKER_VERSION_MISMATCH={health.get('version')}"
              )

          items = urllib.parse.quote(
              "005930|KOSPI,000660|KOSPI",
              safe=",|",
          )
          quotes = get_json(base + "/quotes?items=" + items)

          if quotes.get("requested_count") != 2:
              raise SystemExit(f"WORKER_REQUEST_COUNT_FAILED={quotes}")
          if quotes.get("ok_count") != 2:
              raise SystemExit(f"WORKER_QUOTE_TEST_FAILED={quotes}")

          rows = quotes.get("quotes") or []
          if any(row.get("current_price") is None for row in rows):
              raise SystemExit(f"WORKER_PRICE_NULL={quotes}")

          print("LIVE_PRICE_WORKER_HEALTH=PASS")
          print("LIVE_PRICE_WORKER_VERSION=1.1.0")
          print("LIVE_PRICE_TWO_STOCK_TEST=PASS")
          PY

      - name: Apply robust v5.1 repository contract
        shell: bash
        run: |
          set -euo pipefail
          echo "" | base64 --decode > /tmp/apply_v51_fixed.py
          python -m py_compile /tmp/apply_v51_fixed.py
          python /tmp/apply_v51_fixed.py

      - name: Compile, rebuild, and validate API
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile build_api_json.py validate_api_sync.py
          python build_api_json.py
          python validate_api_sync.py --api-dir api

      - name: Verify all-table v5.1 contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          expected_version = "2026-06-30-v5.1-request-time-price-overlay"
          expected_url = os.environ["LIVE_PRICE_API_BASE_URL"].rstrip("/")

          def load(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8")
              )

          status = load("api/status.json")
          manifest = load("api/manifest.json")
          rules = load("api/stock_table_rules.json")
          report = load("api/validation_report.json")

          if status.get("rules_version") != expected_version:
              raise SystemExit(
                  f"RULES_VERSION_MISMATCH={status.get('rules_version')}"
              )
          if report.get("status") != "PASS":
              raise SystemExit(
                  f"API_VALIDATION_FAILED={report.get('errors')}"
              )

          policy = status.get("request_time_price_policy") or {}
          required = {
              "enabled": True,
              "mode": "request_time_dynamic_overlay",
              "lookup_scope": "all_rows_in_requested_table",
              "action_operation_id": "getRequestTimePrices",
              "api_base_url": expected_url,
              "max_batch_size": 50,
              "preserve_official_history": True,
              "allow_last_confirmed_official_when_delayed": True,
          }

          for key, value in required.items():
              if policy.get(key) != value:
                  raise SystemExit(
                      f"POLICY_MISMATCH={key}:"
                      f"{policy.get(key)!r} != {value!r}"
                  )

          if manifest.get("request_time_price_policy") != policy:
              raise SystemExit("MANIFEST_POLICY_MISMATCH")
          if rules.get("request_time_price_policy") != policy:
              raise SystemExit("RULES_POLICY_MISMATCH")

          table_count = 0
          for item in manifest.get("tables", []):
              payload = load(item["api_file"])
              table_count += 1

              if payload.get("request_time_price_policy") != policy:
                  raise SystemExit(
                      f"TABLE_POLICY_MISMATCH={item.get('table_id')}"
                  )

              columns = set(payload.get("columns") or [])
              if payload.get("row_count", 0) and not (
                  columns & {"ticker", "code", "종목코드"}
              ):
                  raise SystemExit(
                      f"TABLE_QUOTE_KEY_MISSING={item.get('table_id')}"
                  )

          if table_count != 12:
              raise SystemExit(
                  f"UNEXPECTED_TABLE_COUNT={table_count}"
              )

          print("REQUEST_TIME_PRICE_CONTRACT=PASS")
          print(f"RULES_VERSION={expected_version}")
          print(
              "ALL_TABLES_REQUEST_PRICE_POLICY=PASS:"
              f"{table_count}"
          )
          print("API_VALIDATION_STATUS=PASS")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name '__pycache__' -prune -exec rm -rf {} +
          find . -type f \( -name '*.pyc' -o -name '*.pyo' \) -delete

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add build_api_json.py validate_api_sync.py docs api

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            exit 0
          fi

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          git commit -m "Apply request-time price overlay v5.1"

          if [ -n "$(git status --porcelain)" ]; then
            echo "POST_COMMIT_WORKTREE_NOT_CLEAN=true"
            git status --short
            exit 1
          fi

          echo "POST_COMMIT_WORKTREE_CLEAN=true"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "REQUEST_TIME_PRICE_PUSH_SUCCESS=true"
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
