name: Audit current exact OCF candidates

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build API JSON
    types:
      - completed
    branches:
      - main
  schedule:
    # KST Monday 18:45 = UTC Monday 09:45
    - cron: "45 9 * * 1"
  push:
    branches: [main]
    paths:
      - ".github/workflows/audit-current-ocf-candidates.yml"
      - "audit_current_ocf_candidates.py"
      - "promote_current_ocf_candidates.py"

permissions:
  contents: write

concurrency:
  group: krx-main-data-writers
  cancel-in-progress: false

jobs:
  audit:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Check current OCF audit coverage
        id: gate
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import csv
          import json
          import os
          from pathlib import Path

          run_audit = True
          reason = "manual_push_or_weekly_schedule"
          if os.environ["EVENT_NAME"] == "workflow_run":
              manifest = json.loads(
                  Path("api/two_table_v1/manifest.json").read_text(encoding="utf-8-sig")
              )
              candidate_path = Path("latest/investment_score_current_ocf_candidate_latest.json")
              if candidate_path.is_file():
                  prior = json.loads(candidate_path.read_text(encoding="utf-8-sig"))
                  universe = set()
                  for table in ("kospi", "decliners", "decliners24"):
                      payload = json.loads(
                          Path(f"api/two_table_v1/{table}.json").read_text(encoding="utf-8-sig")
                      )
                      universe.update(row["ticker"] for row in payload.get("rows", []))
                  with Path("latest/investment_score_ocf_source_latest.csv").open(
                      encoding="utf-8-sig", newline=""
                  ) as source:
                      ready = {
                          row["ticker"] for row in csv.DictReader(source)
                          if row.get("source_status") == "READY"
                      }
                  outstanding = universe - ready
                  audited = {
                      row["ticker"] for row in prior.get("unresolved", [])
                  } | set(prior.get("new_exact_ocf_candidate_tickers", []))
                  if (prior.get("source_basis_date") == manifest.get("basis_date")
                          and outstanding.issubset(audited)):
                      run_audit = False
                      reason = "same_basis_and_outstanding_targets_audited"
                  else:
                      reason = "new_basis_or_unaudited_targets"
              else:
                  reason = "candidate_audit_missing"
          print("run_audit=" + str(run_audit).lower())
          print("reason=" + reason)
          PY
      - name: Show OCF audit decision
        run: |
          echo "run_audit=${{ steps.gate.outputs.run_audit }}"
          echo "reason=${{ steps.gate.outputs.reason }}"

      - name: Audit exact 2025 annual OCF without production writes
        if: steps.gate.outputs.run_audit == 'true'
        run: |
          set -euo pipefail
          python -m py_compile audit_current_ocf_candidates.py investment_score_dry_run_v882.py
          python audit_current_ocf_candidates.py

      - name: Promote verified exact OCF source and refresh readiness
        if: >-
          steps.gate.outputs.run_audit == 'true' &&
          (github.event_name == 'schedule' ||
           github.event_name == 'workflow_dispatch' ||
           (github.event_name == 'push' &&
            contains(github.event.head_commit.modified, 'promote_current_ocf_candidates.py')))
        run: |
          set -euo pipefail
          python -m py_compile promote_current_ocf_candidates.py
          python promote_current_ocf_candidates.py

      - name: Commit candidate audit and verified source
        if: steps.gate.outputs.run_audit == 'true'
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add latest/investment_score_current_ocf_candidate_latest.csv
          git add latest/investment_score_current_ocf_candidate_latest.json
          git add latest/investment_score_ocf_source_latest.csv
          git add latest/investment_score_ocf_source_latest.json
          git add latest/investment_score_current_readiness_latest.json
          git add latest/investment_score_current_blockers_latest.json
          if [ -f latest/investment_score_current_ocf_promotion_run_log_latest.txt ]; then
            git add latest/investment_score_current_ocf_promotion_run_log_latest.txt
          fi
          if git diff --cached --quiet; then
            echo "NO_CANDIDATE_AUDIT_CHANGE=true"
            exit 0
          fi
          git commit -m "Audit current official OCF candidates"
          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
          fi
          git push origin HEAD:main
          echo "CURRENT_OCF_CANDIDATE_PUSH=PASS"
