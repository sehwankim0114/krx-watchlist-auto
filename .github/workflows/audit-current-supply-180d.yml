name: Audit current 180d supply evidence

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "audit_current_supply_180d.py"
      - ".github/workflows/audit-current-supply-180d.yml"
  schedule:
    - cron: "35 10 * * 1"

permissions:
  contents: write

concurrency:
  group: krx-main-data-writers
  cancel-in-progress: false

jobs:
  audit-current-supply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Install supply policy dependencies
        run: python -m pip install pandas
      - name: Audit complete issuer-specific DART window
        run: |
          set -euo pipefail
          python -m py_compile audit_current_supply_180d.py supply_burden_enricher.py
          python audit_current_supply_180d.py
      - name: Commit audit-only evidence
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add latest/investment_score_current_supply_180d_latest.json
          if git diff --cached --quiet; then
            echo "NO_AUDIT_CHANGE=true"
            exit 0
          fi
          git commit -m "Refresh current targeted 180-day DART supply evidence"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
