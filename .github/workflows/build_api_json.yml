name: Build API JSON

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - collect-krx-watchlist
    types:
      - completed
    branches:
      - main

  schedule:
    # 한국시간 평일 17:25: workflow_run 누락에 대비한 보조 안전망
    - cron: "25 8 * * 1-5"

permissions:
  contents: write

concurrency:
  group: build-api-json-main
  cancel-in-progress: true

jobs:
  build-api-json:
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pandas

      - name: Synchronize canonical official status
        run: |
          set -euo pipefail
          python -m py_compile sync_official_status.py
          python sync_official_status.py --output-dir latest

      - name: Refresh human-readable freshness notice
        shell: bash
        run: |
          set -euo pipefail
          if [ -f render_data_freshness_notice.py ]; then
            MODE="$(python - <<'PY'
          import json
          from pathlib import Path
          path = Path("latest/official_data_status_latest.json")
          data = json.loads(path.read_text(encoding="utf-8")) if path.exists() else {}
          mode = str(data.get("run_mode") or data.get("final_run_mode") or "official")
          print(mode if mode in {"official", "aux"} else "official")
          PY
          )"
            python render_data_freshness_notice.py --output-dir latest --mode "$MODE"
          else
            echo "FRESHNESS_RENDERER=NOT_FOUND"
          fi

      - name: Build synchronized API JSON files
        run: |
          set -euo pipefail
          python -m py_compile build_api_json.py
          python build_api_json.py

      - name: Validate API synchronization
        id: validate
        shell: bash
        run: |
          set +e
          python -m py_compile validate_api_sync.py
          python validate_api_sync.py --api-dir api
          CODE=$?
          echo "validation_exit_code=$CODE" >> "$GITHUB_OUTPUT"
          echo "VALIDATION_EXIT_CODE=$CODE"
          exit 0

      - name: Show generated status
        run: |
          set -euo pipefail
          echo "----- api/status.json -----"
          cat api/status.json
          echo "----- api/validation_report.json -----"
          cat api/validation_report.json
          echo "----- generated API files -----"
          find api -maxdepth 1 -type f -name "*.json" -printf "%f\n" | sort

      - name: Commit and push synchronized latest and API data
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add -A api
          git add \
            latest/official_data_status_latest.json \
            latest/official_data_status_latest.txt \
            latest/data_freshness_notice_latest.json \
            latest/data_freshness_notice_latest.md \
            latest/data_freshness_notice_latest.txt \
            2>/dev/null || true

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            exit 0
          fi

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          git commit -m "Synchronize latest KRX API data"

          PUSHED=false
          for attempt in 1 2 3; do
            echo "PUSH_ATTEMPT=$attempt"
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "REBASE_FAILED=true"
              sleep $((attempt * 5))
              continue
            fi
            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi
            sleep $((attempt * 5))
          done

          if [ "$PUSHED" != "true" ]; then
            echo "PUSH_SUCCESS=false"
            exit 1
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"

      - name: Fail workflow after publishing error status
        if: steps.validate.outputs.validation_exit_code != '0'
        run: |
          echo "::error::API structural validation failed. Error status was committed so Custom GPT will not treat it as latest."
          exit 1
