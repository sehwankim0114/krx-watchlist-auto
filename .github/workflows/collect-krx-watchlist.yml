name: collect-krx-watchlist

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 모드: auto / official / aux"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - official
          - aux

  schedule:
    # KST 월~금 08:10 = UTC 전날 23:10
    # 공식 KRX 자료 1차 수집
    - cron: "10 23 * * 0-4"

    # KST 월~토 08:40 = UTC 전날 23:40
    # 공식 KRX 자료 해당일자 미갱신 시 재시도, 아니면 보조 현재가 갱신
    - cron: "40 23 * * 0-5"

    # KST 월~토 15:35 = UTC 당일 06:35
    # 공식 KRX 자료 해당일자 미갱신 시 재시도, 아니면 보조 현재가 갱신
    - cron: "35 6 * * 1-6"

    # KST 월~일 18:10 = UTC 당일 09:10
    # 공식 KRX 자료 해당일자 미갱신 시 재시도, 아니면 보조 현재가 갱신
    - cron: "10 9 * * *"

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine run mode with stale official fallback
        id: mode
        run: |
          python - <<'PY' | tee /tmp/run_mode_env
          import json
          import re
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          manual_mode = "${{ github.event.inputs.run_mode }}".strip()
          explicit_manual_mode = manual_mode in {"official", "aux"}

          if explicit_manual_mode:
              desired_mode = manual_mode
              mode_source = "manual_explicit"
          else:
              now = datetime.now(ZoneInfo("Asia/Seoul"))
              hhmm = now.hour * 100 + now.minute

              if 800 <= hhmm <= 825:
                  desired_mode = "official"
              elif 830 <= hhmm <= 1900:
                  desired_mode = "aux"
              else:
                  desired_mode = "official"

              if manual_mode == "auto":
                  mode_source = "manual_auto"
              else:
                  mode_source = "schedule_or_default"

          final_mode = desired_mode
          stale_upgrade = "false"
          stale_reason = "not_checked"

          def read_json(path: Path):
              if not path.exists():
                  return None
              try:
                  return json.loads(path.read_text(encoding="utf-8"))
              except Exception as e:
                  return {
                      "_parse_error": type(e).__name__,
                      "_path": str(path),
                  }

          def read_key_value_txt(path: Path):
              if not path.exists():
                  return None

              try:
                  text = path.read_text(encoding="utf-8").strip()
                  matches = list(re.finditer(r"([A-Za-z_][A-Za-z0-9_]*)=", text))

                  if not matches:
                      return {
                          "_parse_error": "NO_KEY_VALUE_PAIRS",
                          "_path": str(path),
                      }

                  data = {}
                  for idx, match in enumerate(matches):
                      key = match.group(1)
                      value_start = match.end()
                      value_end = matches[idx + 1].start() if idx + 1 < len(matches) else len(text)
                      value = text[value_start:value_end].strip()

                      if value in {"True", "true"}:
                          data[key] = True
                      elif value in {"False", "false"}:
                          data[key] = False
                      else:
                          data[key] = value

                  return data

              except Exception as e:
                  return {
                      "_parse_error": type(e).__name__,
                      "_path": str(path),
                  }

          def parse_dt(value):
              if not value:
                  return None

              try:
                  dt = datetime.fromisoformat(str(value).replace("Z", "+00:00"))
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=ZoneInfo("Asia/Seoul"))
                  return dt
              except Exception:
                  return None

          def sort_key(candidate: dict):
              dt = parse_dt(candidate.get("run_at"))
              if not dt:
                  return 0
              return dt.timestamp()

          def normalize_candidate(raw: dict, source: str, official_fresh_key: str):
              if not raw:
                  return None

              return {
                  "source": source,
                  "run_at": raw.get("run_at_kst"),
                  "official_fresh": raw.get(official_fresh_key),
                  "expected_date": raw.get("expected_official_trading_date"),
                  "kospi_actual_date": raw.get("kospi_actual_date"),
                  "kosdaq_actual_date": raw.get("kosdaq_actual_date"),
                  "parse_error": raw.get("_parse_error"),
              }

          def choose_freshness_candidate():
              notice_json = read_json(Path("latest/data_freshness_notice_latest.json"))
              official_json = read_json(Path("latest/krx_official_retry_status_latest.json"))
              official_txt = read_key_value_txt(Path("latest/krx_official_retry_status_latest.txt"))

              candidates = [
                  normalize_candidate(
                      notice_json,
                      "data_freshness_notice_latest.json",
                      "official_fresh",
                  ),
                  normalize_candidate(
                      official_json,
                      "krx_official_retry_status_latest.json",
                      "fresh",
                  ),
                  normalize_candidate(
                      official_txt,
                      "krx_official_retry_status_latest.txt",
                      "fresh",
                  ),
              ]

              candidates = [c for c in candidates if c is not None]

              if not candidates:
                  return None

              # 핵심 보완:
              # freshness notice json만 오래되었거나,
              # official status json이 오래되어도,
              # official status txt가 더 최신이면 txt 기준으로 판단한다.
              candidates.sort(key=sort_key, reverse=True)
              return candidates[0]

          def is_stale(candidate: dict):
              if not candidate:
                  return True, ["freshness_status_missing"]

              if candidate.get("parse_error"):
                  return True, [f"freshness_parse_error:{candidate.get('parse_error')}"]

              official_fresh = candidate.get("official_fresh")
              expected_date = candidate.get("expected_date")
              kospi_actual_date = candidate.get("kospi_actual_date")
              kosdaq_actual_date = candidate.get("kosdaq_actual_date")

              stale = False
              reasons = []

              if official_fresh is not True:
                  stale = True
                  reasons.append("official_fresh_not_true")

              if expected_date and kospi_actual_date and kospi_actual_date != expected_date:
                  stale = True
                  reasons.append(f"kospi_actual_{kospi_actual_date}_expected_{expected_date}")

              if expected_date and kosdaq_actual_date and kosdaq_actual_date != expected_date:
                  stale = True
                  reasons.append(f"kosdaq_actual_{kosdaq_actual_date}_expected_{expected_date}")

              return stale, reasons

          if desired_mode == "aux" and not explicit_manual_mode:
              candidate = choose_freshness_candidate()
              stale, reasons = is_stale(candidate)

              if stale:
                  final_mode = "official"
                  stale_upgrade = "true"
                  stale_reason = ",".join(reasons) if reasons else "stale_detected"
              else:
                  stale_reason = (
                      "fresh_aux_allowed"
                      f":source={candidate.get('source')}"
                      f":run_at={candidate.get('run_at')}"
                  )

          print(f"RUN_MODE={final_mode}")
          print(f"DESIRED_RUN_MODE={desired_mode}")
          print(f"RUN_MODE_SOURCE={mode_source}")
          print(f"STALE_UPGRADE={stale_upgrade}")
          print(f"STALE_REASON={stale_reason}")
          PY

          cat /tmp/run_mode_env >> "$GITHUB_ENV"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auxiliary current price update
        if: env.RUN_MODE == 'aux'
        run: |
          python -m py_compile supplement_current_prices.py
          python supplement_current_prices.py --output-dir latest --sleep-seconds 0.08

          python -m py_compile apply_current_price_basis.py
          python apply_current_price_basis.py --output-dir latest

          python -m py_compile render_data_freshness_notice.py
          python render_data_freshness_notice.py --output-dir latest --mode aux

          echo "----- 보조 현재가 참고판 생성 결과 -----"
          cat latest/supplement_current_prices_run_log_latest.txt || true

          echo "----- 현재가 기준 보정 결과 -----"
          cat latest/current_price_basis_run_log_latest.txt || true

          echo "----- 데이터 최신성 색상 안내 -----"
          cat latest/data_freshness_notice_latest.txt || true

      - name: Collect watchlist data
        if: env.RUN_MODE == 'official'
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect_watchlist.py --source auto --lookback-months 3 --output-dir latest

      - name: Collect KOFIA three API data
        if: env.RUN_MODE == 'official'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KOFIA_CMA_API_URL: ${{ secrets.KOFIA_CMA_API_URL }}
          KOFIA_CREDIT_API_URL: ${{ secrets.KOFIA_CREDIT_API_URL }}
          KOFIA_MARKET_FUNDS_API_URL: ${{ secrets.KOFIA_MARKET_FUNDS_API_URL }}
        run: |
          python -m py_compile kofia_market_status.py
          python kofia_market_status.py --output-dir latest

          echo "----- KOFIA API 실행 결과 -----"
          cat latest/kofia_market_funds_run_log_latest.txt || true

      - name: Collect official KRX universe and update all official tables
        if: env.RUN_MODE == 'official'
        env:
          PYTHONWARNINGS: ignore::FutureWarning
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          mkdir -p /tmp/latest_universe_backup

          cp -f latest/universe_raw_history_latest.csv /tmp/latest_universe_backup/ || true
          cp -f latest/kospi_universe_summary_latest.csv /tmp/latest_universe_backup/ || true
          cp -f latest/kosdaq_universe_summary_latest.csv /tmp/latest_universe_backup/ || true
          cp -f latest/kospi_candidates_30_latest.csv /tmp/latest_universe_backup/ || true
          cp -f latest/kospi_recommend_7_latest.csv /tmp/latest_universe_backup/ || true
          cp -f latest/kosdaq_candidates_10_latest.csv /tmp/latest_universe_backup/ || true
          cp -f latest/kosdaq_recommend_5_latest.csv /tmp/latest_universe_backup/ || true
          cp -f latest/kospi_gainers_1m_latest.csv /tmp/latest_universe_backup/ || true

          python -m py_compile run_universe_latest.py
          python run_universe_latest.py --days 180 --keep-months 7 --output-dir latest

          python -m py_compile universe_output_guard.py
          python universe_output_guard.py \
            --output-dir latest \
            --backup-dir /tmp/latest_universe_backup \
            --kospi-min-rows 800 \
            --kosdaq-min-rows 1500 \
            --gainers-min-rows 15 \
            --restore-on-fail

          echo "----- KRX 공식자료 확정판 상태 -----"
          cat latest/krx_official_retry_status_latest.txt || true

          echo "----- KRX universe 산출물 보호 결과 -----"
          cat latest/universe_output_guard_latest.txt || true

          python -m py_compile operating_loss_enricher.py
          python operating_loss_enricher.py --output-dir latest --workers 4 --max-api-calls 5000

          python -m py_compile short_term_kospi.py
          python short_term_kospi.py --output-dir latest --top-n 30 --recommend-n 7

          python -m py_compile currency_weakness_kospi.py
          python currency_weakness_kospi.py --output-dir latest --top-n 30 --recommend-n 7

          python monthly_cycle.py --output-dir latest --lookback-months 6 --top-n 40

          python -m py_compile supply_burden_enricher.py
          python supply_burden_enricher.py --output-dir latest --lookback-days 180 --sleep-seconds 0.12

          python market_status.py --output-dir latest --lookback-months 7

          python official_index_status.py --output-dir latest --lookback-months 7

          python -m py_compile kofia_macro_bridge.py
          python kofia_macro_bridge.py --output-dir latest --lookback-days 370

          python macro_leverage_status.py --output-dir latest --lookback-days 370 > /tmp/macro_leverage_stdout.txt 2>&1

          if [ -f latest/macro_leverage_run_log_latest.txt ]; then
            grep -Ev "KOFIA_(CREDIT|MARKET_FUNDS|CMA)_API_URL_MISSING|HTTP_FAIL KOFIA_CUSTOM|HTTP_FINAL_FAIL KOFIA_CUSTOM|KOFIA_CUSTOM_FAIL" latest/macro_leverage_run_log_latest.txt > /tmp/macro_leverage_run_log_cleaned.txt || true
            mv /tmp/macro_leverage_run_log_cleaned.txt latest/macro_leverage_run_log_latest.txt
          fi

          python -m py_compile official_index_validation.py
          python official_index_validation.py --output-dir latest

          python -m py_compile table_health_check.py
          python table_health_check.py --output-dir latest --freshness-warn-days 4 --freshness-error-days 10

          python -m py_compile supplement_current_prices.py
          python supplement_current_prices.py --output-dir latest --sleep-seconds 0.08

          python -m py_compile apply_current_price_basis.py
          python apply_current_price_basis.py --output-dir latest

          python -m py_compile render_data_freshness_notice.py
          python render_data_freshness_notice.py --output-dir latest --mode official

          python -m py_compile dart_corp_code_cache.py
          python dart_corp_code_cache.py --output-dir latest --sleep-seconds 1.0 || true

          echo "----- DART 기업코드 캐시 생성 결과 -----"
          cat latest/dart_corp_code_cache_run_log_latest.txt || true

          echo "----- 영업손실 자동판별 결과 -----"
          cat latest/operating_loss_run_log_latest.txt || true

          echo "----- 수급부담 자동감지 결과 -----"
          cat latest/supply_burden_run_log_latest.txt || true

          echo "----- 단상표 자동산출 결과 -----"
          cat latest/kospi_short_term_run_log_latest.txt || true

          echo "----- 환율약세표 자동산출 결과 -----"
          cat latest/kospi_fx_weakness_run_log_latest.txt || true

          echo "----- DART 기업코드 캐시 생성 결과 -----"
          cat latest/dart_corp_code_cache_run_log_latest.txt || true

          echo "----- 보조 현재가 참고판 생성 결과 -----"
          cat latest/supplement_current_prices_run_log_latest.txt || true

          echo "----- 현재가 기준 보정 결과 -----"
          cat latest/current_price_basis_run_log_latest.txt || true

          echo "----- 데이터 최신성 색상 안내 -----"
          cat latest/data_freshness_notice_latest.txt || true

          echo "----- 표 전체 통합점검 결과 -----"
          cat latest/table_health_run_log_latest.txt || true

          echo "----- KOFIA 연결 결과 -----"
          cat latest/kofia_macro_bridge_run_log_latest.txt || true

          echo "----- 거시·레버리지 위험분석 결과 -----"
          cat latest/macro_leverage_run_log_latest.txt || true

          echo "----- 공식지수 교차검증 결과 -----"
          cat latest/official_index_validation_run_log_latest.txt || true

      - name: Commit latest data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add latest/*.csv latest/*.txt latest/*.xlsx latest/*.json latest/*.md || true
          git commit -m "Update latest KRX watchlist data" || echo "No changes to commit"
          git push
