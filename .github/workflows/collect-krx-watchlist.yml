name: collect-krx-watchlist

on:
  workflow_dispatch:
  schedule:
    # 한국시간 16:10 = UTC 07:10
    - cron: "10 7 * * 1-5"
    # 한국시간 21:10 = UTC 12:10
    - cron: "10 12 * * 1-5"
    # 한국시간 23:40 = UTC 14:40
    # KRX 당일 전종목 데이터가 늦게 열리는 날을 보정
    - cron: "40 14 * * 1-5"
    # 한국시간 다음날 08:20 = UTC 23:20
    # 전날 장마감 데이터가 밤늦게/익일 오전 확정되는 경우 보정
    - cron: "20 23 * * 1-5"

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect watchlist data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect_watchlist.py --source auto --lookback-months 3 --output-dir latest

      - name: Collect KOFIA three API data
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KOFIA_CMA_API_URL: ${{ secrets.KOFIA_CMA_API_URL }}
          KOFIA_CREDIT_API_URL: ${{ secrets.KOFIA_CREDIT_API_URL }}
          KOFIA_MARKET_FUNDS_API_URL: ${{ secrets.KOFIA_MARKET_FUNDS_API_URL }}
        run: |
          python -m py_compile kofia_market_status.py
          python kofia_market_status.py --output-dir latest
          echo "----- KOFIA API 실행 결과 -----"
          cat latest/kofia_market_funds_run_log_latest.txt || true

      - name: Collect universe with latest-data retry and update market risk
        env:
          PYTHONWARNINGS: ignore::FutureWarning
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python -m py_compile run_universe_latest.py
          python run_universe_latest.py --days 180 --keep-months 7 --output-dir latest --attempts 4 --sleep-minutes 4

          echo "----- KRX 최신자료 재시도 상태 -----"
          cat latest/krx_latest_retry_status_latest.txt || true

          python monthly_cycle.py --output-dir latest --lookback-months 6 --top-n 40
          python market_status.py --output-dir latest --lookback-months 7
          python official_index_status.py --output-dir latest --lookback-months 7

          python -m py_compile kofia_macro_bridge.py
          python kofia_macro_bridge.py --output-dir latest --lookback-days 370

          python macro_leverage_status.py --output-dir latest --lookback-days 370 > /tmp/macro_leverage_stdout.txt 2>&1

          if [ -f latest/macro_leverage_run_log_latest.txt ]; then
            grep -Ev "KOFIA_(CREDIT|MARKET_FUNDS|CMA)_API_URL_MISSING|HTTP_FAIL KOFIA_CUSTOM|HTTP_FINAL_FAIL KOFIA_CUSTOM|KOFIA_CUSTOM_FAIL" latest/macro_leverage_run_log_latest.txt > /tmp/macro_leverage_run_log_cleaned.txt || true
            mv /tmp/macro_leverage_run_log_cleaned.txt latest/macro_leverage_run_log_latest.txt
          fi

          python -m py_compile official_index_validation.py
          python official_index_validation.py --output-dir latest

          echo "----- KOFIA 연결 결과 -----"
          cat latest/kofia_macro_bridge_run_log_latest.txt || true

          echo "----- 거시·레버리지 위험분석 결과 -----"
          cat latest/macro_leverage_run_log_latest.txt || true

          echo "----- 공식지수 교차검증 결과 -----"
          cat latest/official_index_validation_run_log_latest.txt || true

      - name: Build precise DART FX exposure table
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python -m py_compile dart_fx_exposure_kospi.py
          python dart_fx_exposure_kospi.py \
            --output-dir latest \
            --universe latest/kospi_universe_summary_latest.csv \
            --lookback-days 900 \
            --sleep 0.12

          echo "----- DART 환율노출 정밀분석 결과 -----"
          cat latest/kospi_fx_exposure_run_log_latest.txt || true

      - name: Commit latest data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add latest/*.csv latest/*.txt latest/*.xlsx latest/*.json || true
          git commit -m "Update latest KRX watchlist data" || echo "No changes to commit"
          git push
