name: collect-krx-watchlist

on:
  workflow_dispatch:
  schedule:
    # 한국시간 16:50 = UTC 07:50
    - cron: "50 7 * * 1-5"
    # 한국시간 18:10 = UTC 09:10
    - cron: "10 9 * * 1-5"

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect watchlist data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect_watchlist.py --source auto --lookback-months 3 --output-dir latest

      - name: Collect KOSPI/KOSDAQ universe data
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect_universe.py --days 180 --keep-months 7 --output-dir latest
          python monthly_cycle.py --output-dir latest --lookback-months 6 --top-n 40

      - name: Commit latest data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add latest/*.csv latest/*.txt latest/*.xlsx || true
          git commit -m "Update watchlist universe and monthly cycle data" || echo "No changes to commit"
          git push
