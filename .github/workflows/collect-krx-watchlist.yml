name: collect-krx-watchlist

on:
  workflow_dispatch:
    inputs:
      run_mode:
        description: "실행 모드: auto / official / aux"
        required: false
        default: "auto"
        type: choice
        options:
          - auto
          - official
          - aux

  schedule:
    # KST 08:10 = UTC 전날 23:10
    # 공식 코피표 확정판 1차: KRX 익일 오전 업데이트 확인
    - cron: "10 23 * * 0-4"

    # KST 08:35 = UTC 전날 23:35
    # 공식 코피표 최종 안전망: GitHub 지연·KRX 반영 지연 대비
    - cron: "35 23 * * 0-4"

    # KST 15:35 = UTC 06:35
    # 장마감 직후 보조 현재가 참고판
    - cron: "35 6 * * 1-5"

    # KST 18:10 = UTC 09:10
    # 시간외 종료 직후 보조 현재가 참고판
    - cron: "10 9 * * 1-5"

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine run mode
        id: mode
        run: |
          python - <<'PY' >> "$GITHUB_ENV"
          from datetime import datetime
          from zoneinfo import ZoneInfo

          manual_mode = "${{ github.event.inputs.run_mode }}"

          if manual_mode and manual_mode != "auto":
              mode = manual_mode
          else:
              now = datetime.now(ZoneInfo("Asia/Seoul"))
              hhmm = now.hour * 100 + now.minute

              # 공식판 시간대:
              # 08:10, 08:35 예약 실행이 GitHub 지연으로 조금 늦어져도 공식판으로 처리
              if 750 <= hhmm <= 930:
                  mode = "official"

              # 보조판 시간대:
              # 15:35, 18:10 예약 실행이 조금 늦어져도 보조판으로 처리
              elif 1500 <= hhmm <= 1830:
                  mode = "aux"

              # 수동실행 또는 애매한 시간대는 공식판으로 처리
              else:
                  mode = "official"

          print(f"RUN_MODE={mode}")
          PY

          echo "RUN_MODE=$RUN_MODE"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Auxiliary current price update
        if: env.RUN_MODE == 'aux'
        run: |
          python -m py_compile supplement_current_prices.py
          python supplement_current_prices.py --output-dir latest --sleep-seconds 0.08

          python -m py_compile apply_current_price_basis.py
          python apply_current_price_basis.py --output-dir latest

          python -m py_compile render_data_freshness_notice.py
          python render_data_freshness_notice.py --output-dir latest --mode aux

          echo "----- 보조 현재가 참고판 생성 결과 -----"
          cat latest/supplement_current_prices_run_log_latest.txt || true

          echo "----- 현재가 기준 보정 결과 -----"
          cat latest/current_price_basis_run_log_latest.txt || true

          echo "----- 데이터 최신성 색상 안내 -----"
          cat latest/data_freshness_notice_latest.txt || true

      - name: Collect watchlist data
        if: env.RUN_MODE == 'official'
        env:
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python collect_watchlist.py --source auto --lookback-months 3 --output-dir latest

      - name: Collect KOFIA three API data
        if: env.RUN_MODE == 'official'
        env:
          DATA_GO_KR_SERVICE_KEY: ${{ secrets.DATA_GO_KR_SERVICE_KEY }}
          KOFIA_CMA_API_URL: ${{ secrets.KOFIA_CMA_API_URL }}
          KOFIA_CREDIT_API_URL: ${{ secrets.KOFIA_CREDIT_API_URL }}
          KOFIA_MARKET_FUNDS_API_URL: ${{ secrets.KOFIA_MARKET_FUNDS_API_URL }}
        run: |
          python -m py_compile kofia_market_status.py
          python kofia_market_status.py --output-dir latest

          echo "----- KOFIA API 실행 결과 -----"
          cat latest/kofia_market_funds_run_log_latest.txt || true

      - name: Collect official KRX universe and update all official tables
        if: env.RUN_MODE == 'official'
        env:
          PYTHONWARNINGS: ignore::FutureWarning
          KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          ECOS_API_KEY: ${{ secrets.ECOS_API_KEY }}
        run: |
          python -m py_compile run_universe_latest.py
          python run_universe_latest.py --days 180 --keep-months 7 --output-dir latest

          echo "----- KRX 공식자료 확정판 상태 -----"
          cat latest/krx_official_retry_status_latest.txt || true

          python -m py_compile operating_loss_enricher.py
          python operating_loss_enricher.py --output-dir latest --workers 4 --max-api-calls 5000

          python -m py_compile short_term_kospi.py
          python short_term_kospi.py --output-dir latest --top-n 30 --recommend-n 7

          python -m py_compile currency_weakness_kospi.py
          python currency_weakness_kospi.py --output-dir latest --top-n 30 --recommend-n 7

          python monthly_cycle.py --output-dir latest --lookback-months 6 --top-n 40

          python market_status.py --output-dir latest --lookback-months 7
          python official_index_status.py --output-dir latest --lookback-months 7

          python -m py_compile kofia_macro_bridge.py
          python kofia_macro_bridge.py --output-dir latest --lookback-days 370

          python macro_leverage_status.py --output-dir latest --lookback-days 370 > /tmp/macro_leverage_stdout.txt 2>&1

          if [ -f latest/macro_leverage_run_log_latest.txt ]; then
            grep -Ev "KOFIA_(CREDIT|MARKET_FUNDS|CMA)_API_URL_MISSING|HTTP_FAIL KOFIA_CUSTOM|HTTP_FINAL_FAIL KOFIA_CUSTOM|KOFIA_CUSTOM_FAIL" latest/macro_leverage_run_log_latest.txt > /tmp/macro_leverage_run_log_cleaned.txt || true
            mv /tmp/macro_leverage_run_log_cleaned.txt latest/macro_leverage_run_log_latest.txt
          fi

          python -m py_compile official_index_validation.py
          python official_index_validation.py --output-dir latest

          python -m py_compile table_health_check.py
          python table_health_check.py --output-dir latest --freshness-warn-days 4 --freshness-error-days 10

          python -m py_compile supplement_current_prices.py
          python supplement_current_prices.py --output-dir latest --sleep-seconds 0.08

          python -m py_compile apply_current_price_basis.py
          python apply_current_price_basis.py --output-dir latest

          python -m py_compile render_data_freshness_notice.py
          python render_data_freshness_notice.py --output-dir latest --mode official

          echo "----- 영업손실 자동판별 결과 -----"
          cat latest/operating_loss_run_log_latest.txt || true

          echo "----- 단상표 자동산출 결과 -----"
          cat latest/kospi_short_term_run_log_latest.txt || true

          echo "----- 환율약세표 자동산출 결과 -----"
          cat latest/kospi_fx_weakness_run_log_latest.txt || true

          echo "----- 보조 현재가 참고판 생성 결과 -----"
          cat latest/supplement_current_prices_run_log_latest.txt || true

          echo "----- 현재가 기준 보정 결과 -----"
          cat latest/current_price_basis_run_log_latest.txt || true

          echo "----- 데이터 최신성 색상 안내 -----"
          cat latest/data_freshness_notice_latest.txt || true

          echo "----- 표 전체 통합점검 결과 -----"
          cat latest/table_health_run_log_latest.txt || true

          echo "----- KOFIA 연결 결과 -----"
          cat latest/kofia_macro_bridge_run_log_latest.txt || true

          echo "----- 거시·레버리지 위험분석 결과 -----"
          cat latest/macro_leverage_run_log_latest.txt || true

          echo "----- 공식지수 교차검증 결과 -----"
          cat latest/official_index_validation_run_log_latest.txt || true

      - name: Commit latest data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add latest/*.csv latest/*.txt latest/*.xlsx latest/*.json latest/*.md || true
          git commit -m "Update latest KRX watchlist data" || echo "No changes to commit"
          git push
