name: dart-fx-exposure-safe

on:
  workflow_dispatch:
    inputs:
      lookback_days:
        description: "DART 보고서 조회 기간"
        required: false
        default: "370"
      sleep_seconds:
        description: "DART API 호출 간격"
        required: false
        default: "0.20"
      timeout_minutes:
        description: "최대 실행 시간"
        required: false
        default: "45"

permissions:
  contents: write

concurrency:
  group: dart-fx-exposure-safe
  cancel-in-progress: false

jobs:
  dart_fx_exposure:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build DART corp code cache
        run: |
          python -m py_compile dart_corp_code_cache.py
          python dart_corp_code_cache.py --output-dir latest --sleep-seconds 1.0 || true

          echo "----- DART 기업코드 캐시 생성 결과 -----"
          cat latest/dart_corp_code_cache_run_log_latest.txt || true

      - name: Run DART FX exposure analysis with timeout
        run: |
          python -m py_compile dart_fx_exposure_kospi.py

          FX_UNIVERSE="latest/kospi_universe_summary_current_basis_latest.csv"
          if [ ! -f "$FX_UNIVERSE" ]; then
            FX_UNIVERSE="latest/kospi_universe_summary_latest.csv"
          fi

          echo "FX_UNIVERSE=$FX_UNIVERSE"
          echo "lookback_days=${{ github.event.inputs.lookback_days }}"
          echo "sleep_seconds=${{ github.event.inputs.sleep_seconds }}"
          echo "timeout_minutes=${{ github.event.inputs.timeout_minutes }}"

          set +e
          timeout "${{ github.event.inputs.timeout_minutes }}m" python dart_fx_exposure_kospi.py \
            --output-dir latest \
            --universe "$FX_UNIVERSE" \
            --lookback-days "${{ github.event.inputs.lookback_days }}" \
            --sleep "${{ github.event.inputs.sleep_seconds }}"
          EXIT_CODE=$?
          set -e

          if [ "$EXIT_CODE" = "124" ]; then
            echo "status=TIMEOUT" > latest/kospi_fx_exposure_timeout_latest.txt
            echo "message=DART FX exposure analysis exceeded timeout_minutes=${{ github.event.inputs.timeout_minutes }}" >> latest/kospi_fx_exposure_timeout_latest.txt
            echo "DART FX exposure timed out."
          elif [ "$EXIT_CODE" != "0" ]; then
            echo "status=ERROR" > latest/kospi_fx_exposure_timeout_latest.txt
            echo "exit_code=$EXIT_CODE" >> latest/kospi_fx_exposure_timeout_latest.txt
            echo "DART FX exposure exited with error code $EXIT_CODE."
          else
            echo "status=OK" > latest/kospi_fx_exposure_timeout_latest.txt
            echo "message=DART FX exposure completed." >> latest/kospi_fx_exposure_timeout_latest.txt
          fi

          echo "----- DART 환율노출 정밀분석 결과 -----"
          cat latest/kospi_fx_exposure_run_log_latest.txt || true

          echo "----- DART 환율노출 timeout 상태 -----"
          cat latest/kospi_fx_exposure_timeout_latest.txt || true

      - name: Commit DART FX exposure results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add latest/kospi_fx_exposure*.csv latest/kospi_fx_exposure*.txt latest/kospi_fx_weakness*.csv latest/dart_corp_code_cache*.csv latest/dart_corp_code_cache*.txt || true
          git commit -m "Update DART FX exposure analysis" || echo "No changes to commit"
          git push
