name: dart-fx-exposure

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dart-fx-exposure
  cancel-in-progress: false

jobs:
  build-dart-fx-exposure:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build precise DART FX exposure table
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          python -m py_compile dart_fx_exposure_kospi.py

          FX_UNIVERSE="latest/kospi_universe_summary_current_basis_latest.csv"
          if [ ! -f "$FX_UNIVERSE" ]; then
            FX_UNIVERSE="latest/kospi_universe_summary_latest.csv"
          fi

          echo "FX_UNIVERSE=$FX_UNIVERSE"

          python dart_fx_exposure_kospi.py \
            --output-dir latest \
            --universe "$FX_UNIVERSE" \
            --lookback-days 900 \
            --sleep 0.12

          echo "----- DART 환율노출 정밀분석 결과 -----"
          cat latest/kospi_fx_exposure_run_log_latest.txt || true

      - name: Commit DART FX exposure data
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add latest/kospi_fx_exposure_raw_latest.csv || true
          git add latest/kospi_fx_exposure_precision_latest.csv || true
          git add latest/kospi_fx_weakness_candidates_30_latest.csv || true
          git add latest/kospi_fx_weakness_recommend_7_latest.csv || true
          git add latest/kospi_fx_exposure_run_log_latest.txt || true
          git add latest/kospi_fx_weakness_run_log_latest.txt || true
          git add latest/dart_corp_code_cache.csv || true
          git add latest/dart_fx_exposure_cache.csv || true
          git commit -m "Update DART FX exposure data" || echo "No changes to commit"
          git push
