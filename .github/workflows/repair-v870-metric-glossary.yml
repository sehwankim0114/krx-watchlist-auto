name: Repair V8.7 metric glossary and rebuild API

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/repair-v870-metric-glossary.yml

permissions:
  contents: write

concurrency:
  group: repair-v870-metric-glossary
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install "pykrx==1.2.8"

      - name: Patch sector RS glossary contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          source_path = Path("swing_anchor_source_v859.py")
          text = source_path.read_text(encoding="utf-8")

          sector_block = '''        "rs_sector": {
              "label": "업종 RS 1M/3M",
              "short": "같은 기간 공식 KRX 업종지수 대비 상대수익률 차이(%p)",
              "detail": "양수면 같은 기간 해당 공식 KRX 업종지수보다 강했고 음수면 약했다는 뜻이다. KOSPI 대비 RS와는 별개의 상대강도다.",
          },
          '''
          marker = '        "streak": {\n'
          if '"rs_sector": {' not in text:
              if marker not in text:
                  raise SystemExit("SOURCE_STREAK_MARKER_NOT_FOUND")
              text = text.replace(marker, sector_block + marker, 1)

          rs_test = 'assert GLOSSARY["terms"]["rs_kospi"]["short"].endswith("(%p)")'
          sector_test = 'assert GLOSSARY["terms"]["rs_sector"]["short"].endswith("(%p)")'
          if sector_test not in text:
              if rs_test not in text:
                  raise SystemExit("SOURCE_RS_SELF_TEST_MARKER_NOT_FOUND")
              text = text.replace(rs_test, rs_test + "\n    " + sector_test, 1)

          text = text.replace(
              " · 연속등락=현재 연속 상승/하락 일수와 누적등락률",
              " · 업종RS=공식 KRX 업종지수 대비 상대수익률 차이 · 연속등락=현재 연속 상승/하락 일수와 누적등락률",
          )
          text = text.replace("GLOSSARY_TERMS=5", "GLOSSARY_TERMS=6")
          text = text.replace(
              'len(glossary.get("terms") or {}) != 5',
              'len(glossary.get("terms") or {}) != 6',
          )
          source_path.write_text(text, encoding="utf-8")

          glossary_path = Path("latest/stock_table_metric_glossary_latest.json")
          glossary = json.loads(glossary_path.read_text(encoding="utf-8"))
          terms = glossary.setdefault("terms", {})
          terms["rs_sector"] = {
              "label": "업종 RS 1M/3M",
              "short": "같은 기간 공식 KRX 업종지수 대비 상대수익률 차이(%p)",
              "detail": "양수면 같은 기간 해당 공식 KRX 업종지수보다 강했고 음수면 약했다는 뜻이다. KOSPI 대비 RS와는 별개의 상대강도다.",
          }

          footer = str(glossary.get("compact_footer_text") or "")
          if "업종RS=" not in footer:
              footer = footer.replace(
                  " · 연속등락=",
                  " · 업종RS=공식 KRX 업종지수 대비 상대수익률 차이 · 연속등락=",
              )
          glossary["compact_footer_text"] = footer
          glossary_path.write_text(
              json.dumps(glossary, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          expected = {"swing", "ma", "atr14", "rs_kospi", "rs_sector", "streak"}
          if set(glossary["terms"]) != expected:
              raise SystemExit(f"GLOSSARY_SET_INVALID:{sorted(glossary['terms'])}")
          if "GLOSSARY_TERMS=5" in text:
              raise SystemExit("SOURCE_OLD_GLOSSARY_LOG_COUNT_REMAINS")
          if 'len(glossary.get("terms") or {}) != 5' in text:
              raise SystemExit("SOURCE_OLD_GLOSSARY_VALIDATION_COUNT_REMAINS")

          print("V870_GLOSSARY_REPAIR=PASS")
          print("GLOSSARY_TERMS=6")
          PY

          python -m py_compile swing_anchor_source_v859.py build_stock_table_preview_v850.py
          python swing_anchor_source_v859.py --self-test

      - name: Synchronize canonical official status
        run: |
          set -euo pipefail
          python -m py_compile sync_official_status.py render_data_freshness_notice.py
          python sync_official_status.py --output-dir latest
          python render_data_freshness_notice.py --output-dir latest --mode official

      - name: Rebuild synchronized API JSON
        run: |
          set -euo pipefail
          python -m py_compile build_api_json.py
          python build_api_json.py
          python -m py_compile validate_api_sync.py
          python validate_api_sync.py --api-dir api

      - name: Verify V8.7 production two-table release
        run: |
          set -euo pipefail
          python -m py_compile \
            stock_table_metrics_v850.py \
            build_stock_table_preview_v850.py \
            build_two_table_shadow_v851.py \
            sector_rs_source_v870.py \
            two_table_release_v870.py
          python two_table_release_v870.py --repo .
          python two_table_release_v870.py --repo . --check-only
          echo "V870_TWO_TABLE_RELEASE=PASS"

      - name: Show repaired status
        run: |
          set -euo pipefail
          echo "----- api/status.json -----"
          cat api/status.json
          echo "----- api/validation_report.json -----"
          cat api/validation_report.json
          echo "----- two-table manifest -----"
          cat api/two_table_v1/manifest.json

      - name: Commit and push repaired source and rebuilt data
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add swing_anchor_source_v859.py api latest

          echo "REPAIR_CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "REPAIR_CHANGED_FILES_END"

          if git diff --cached --quiet; then
            echo "::error::Expected repair/build changes were not produced."
            exit 1
          fi

          git commit -m "Fix V8.7 sector RS glossary and rebuild API"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "REPAIR_COMMIT_SHA=$(git rev-parse HEAD)"
          echo "REPAIR_PUSH_SUCCESS=true"
