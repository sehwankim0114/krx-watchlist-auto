name: KODEX 200 vs Inverse - 60 Trading Days Hourly Research
on:
  push:
    branches:
      - research/kodex-hourly-60d-20261021
    paths:
      - .github/workflows/research-kodex-hourly-60d.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install market data libraries
        run: python -m pip install --quiet "yfinance>=0.2.50" "pandas>=2.0" "requests>=2.31"
      - name: Backtest 60 completed sessions (through October 20)
        shell: bash
        run: |
          python - <<'PY'
          import csv, json, os, sys, time, traceback
          from datetime import date, datetime
          from pathlib import Path
          import pandas as pd
          import yfinance as yf
          import requests

          STOP=date(2026,10,20)
          START="2026-06-15"
          END="2026-10-21"
          SYMBOLS={"KODEX200":"069500.KS", "INVERSE":"114800.KS"}
          FRAMES={}
          QUALITY={}
          OUT=Path("results/kodex_hourly_20261020")
          OUT.mkdir(parents=True,exist_ok=True)
          def say(s):
              print(s, flush=True)
          def canon(df, intraday=False):
              if df is None or df.empty:
                  return pd.DataFrame()
              df=df.copy()
              if isinstance(df.columns,pd.MultiIndex):
                  df.columns=df.columns.get_level_values(0)
              df=df.loc[:,~df.columns.duplicated()].copy()
              if "Close" not in df.columns:
                  return pd.DataFrame()
              if intraday:
                  if df.index.tz is None:
                      df.index=df.index.tz_localize("Asia/Seoul")
                  else:
                      df.index=df.index.tz_convert("Asia/Seoul")
              else:
                  if df.index.tz is not None:
                      df.index=df.index.tz_convert("Asia/Seoul")
              df=df.sort_index()
              return df[df["Close"].notna() & (df["Close"]>0)]
          def yahoo_direct(sym,interval):
              url="https://query1.finance.yahoo.com/v8/finance/chart/"+requests.utils.quote(sym,safe="")
              p={"period1":int(pd.Timestamp(START,tz="Asia/Seoul").timestamp()),"period2":int(pd.Timestamp(END,tz="Asia/Seoul").timestamp()),"interval":interval}
              for host in ("query1.finance.yahoo.com","query2.finance.yahoo.com"):
                  url=url.replace("query1.finance.yahoo.com",host)
                  try:
                      r=requests.get(url,params=p,timeout=25,headers={"User-Agent":"Mozilla/5.0 (compatible; market-hour-research/1.0)","Accept":"application/json"})
                      say(f"direct {sym} {interval} {host}: HTTP {r.status_code}")
                      r.raise_for_status()
                      result=r.json()["chart"]["result"][0]
                      v=result["indicators"]["quote"][0]
                      dt=pd.to_datetime(result["timestamp"],unit="s",utc=True).tz_convert("Asia/Seoul")
                      df=pd.DataFrame({"Open":v["open"],"Close":v["close"]},index=dt)
                      return canon(df,interval!="1d")
                  except Exception as e:
                      say("direct error "+str(e)[:180])
              return pd.DataFrame()
          def get(sym,interval):
              for k in range(2):
                  try:
                      say(f"yfinance {sym} {interval}, attempt {k+1}")
                      df=canon(yf.Ticker(sym).history(start=START,end=END,interval=interval,auto_adjust=False,raise_errors=True),interval!="1d")
                      say(f"yfinance {sym} {interval} bars={len(df)} range={df.index.min() if len(df) else 'NONE'} -> {df.index.max() if len(df) else 'NONE'}")
                      if len(df)>40:return df
                  except Exception as e:
                      say("yfinance error "+repr(e)[:240])
                  time.sleep(2)
              return yahoo_direct(sym,interval)
          for name,sym in SYMBOLS.items():
              for interval in ("1d","1h"):
                  key=(name,interval)
                  FRAMES[key]=get(sym,interval)
                  QUALITY[name+"_"+interval]={"rows":len(FRAMES[key]),"first":str(FRAMES[key].index.min()) if len(FRAMES[key]) else None,"last":str(FRAMES[key].index.max()) if len(FRAMES[key]) else None}
          # For selection, prefer index data only if coherent enough, else ETF closes are proxy.
          idx=get("^KS200","1d")
          etf=FRAMES[("KODEX200","1d")]
          inv=FRAMES[("INVERSE","1d")]
          if len(etf)<61 or len(inv)<61:
              raise RuntimeError("Insufficient daily OHLC: "+json.dumps(QUALITY))
          for f in (etf,inv,idx):
              if len(f):
                  f["day"]=f.index.date
          valid=sorted((set(etf["day"]) & set(inv["day"])) & set(d for d in etf["day"] if d<=STOP))
          valid=valid[-60:]
          if len(valid)!=60:raise RuntimeError(f"Only {len(valid)} valid complete trading days")
          # daily index may be incomplete; only use it if it covers at least 58 of the 60 session dates plus previous day.
          idxdata=idx.drop_duplicates("day").set_index("day")["Close"] if len(idx) else pd.Series(dtype=float)
          index_day_coverage=sum(d in idxdata.index for d in valid)
          use_index=index_day_coverage>=58
          etfclose=etf.drop_duplicates("day").set_index("day")["Close"]
          invclose=inv.drop_duplicates("day").set_index("day")["Close"]
          filter_series=idxdata if use_index else etfclose
          ret=filter_series.pct_change(fill_method=None)*100
          up=[d for d in valid if d in ret.index and pd.notna(ret.loc[d]) and ret.loc[d]>0]
          source="KOSPI200_INDEX_^KS200" if use_index else "KODEX200_ETF_PROXY"
          say("SELECTION source="+source+" sessions="+str(len(valid))+" updays="+str(len(up))+" index_days="+str(index_day_coverage))
          days_data=[]
          for name in SYMBOLS:
              hourly=FRAMES[(name,"1h")].copy()
              if len(hourly)<100:
                  say(f"INSUFFICIENT HOURLY BARS {name}: {len(hourly)}")
                  continue
              hourly["day"]=hourly.index.date
              hourly["hour"]=hourly.index.hour
              previous_close=FRAMES[(name,"1d")].drop_duplicates("day").set_index("day")["Close"].shift(1)
              for dt,row in hourly.iterrows():
                  d=row["day"]
                  if d not in up or dt.hour not in range(9,16):continue
                  if d not in previous_close.index:continue
                  prev=previous_close.loc[d]
                  if pd.isna(prev) or prev<=0:continue
                  interval=f"{dt.hour:02d}:00-{dt.hour+1:02d}:00" if dt.hour<15 else "15:00-15:30"
                  days_data.append({"date":d.isoformat(),"symbol":name,"slot":interval,"hour":int(dt.hour),"bar_open":float(row["Open"]),"bar_close":float(row["Close"]),"prev_close":float(prev),"hour_pct":100*(float(row["Close"])/float(row["Open"])-1),"cumulative_pct":100*(float(row["Close"])/float(prev)-1)})
          with open(OUT/"hourly_observations.csv","w",newline="") as f:
              w=csv.DictWriter(f,fieldnames=["date","symbol","slot","hour","bar_open","bar_close","prev_close","hour_pct","cumulative_pct"])
              w.writeheader();w.writerows(days_data)
          result={"asof":str(STOP),"universe_trading_days":60,"first_day":valid[0].isoformat(),"last_day":valid[-1].isoformat(),"positive_days":len(up),"positive_filter":source,"index_day_coverage":index_day_coverage,"source_checks":QUALITY,"hourly_summary":[],"daily_summary":[],"quality_warnings":[]}
          result["up_dates"]=[d.isoformat() for d in up]
          for name in SYMBOLS:
              dframe=FRAMES[(name,"1d")]
              dclose=dframe.drop_duplicates("day").set_index("day")["Close"]
              dailyret=dclose.pct_change(fill_method=None)*100
              vals=dailyret.reindex(up).dropna()
              result["daily_summary"].append({"symbol":name,"days":len(vals),"average_close_to_close_pct":round(float(vals.mean()),4) if len(vals) else None})
          obs=pd.DataFrame(days_data)
          for name in SYMBOLS:
              for hour in range(9,16):
                  slot=f"{hour:02d}:00-{hour+1:02d}:00" if hour<15 else "15:00-15:30"
                  sub=obs[(obs.symbol==name)&(obs.hour==hour)] if not obs.empty else pd.DataFrame()
                  if sub.empty:
                      item={"symbol":name,"slot":slot,"n":0,"avg_hour_pct":None,"avg_from_prev_pct":None,"up_probability_pct":None,"median_hour_pct":None}
                  else:
                      item={"symbol":name,"slot":slot,"n":len(sub),"avg_hour_pct":round(float(sub.hour_pct.mean()),4),"avg_from_prev_pct":round(float(sub.cumulative_pct.mean()),4),"up_probability_pct":round(float((sub.hour_pct>0).mean()*100),2),"median_hour_pct":round(float(sub.hour_pct.median()),4)}
                  result["hourly_summary"].append(item)
                  if item["n"] < len(up)*.90:result["quality_warnings"].append(name+" "+slot+f" insufficient coverage {item['n']}/{len(up)}")
          (OUT/"summary.json").write_text(json.dumps(result,indent=2,ensure_ascii=False),encoding="utf8")
          md=["# KODEX 200 · KODEX INVERSE: recent 60 trading days (completed through 2026-10-20)","","- Historical interval: Yahoo Finance 1h bars; within-hour return = bar close / bar open - 1.","- Last date: "+str(STOP),"- Universe: "+valid[0].isoformat()+" ~ "+valid[-1].isoformat()," - Positive sessions: "+str(len(up)),"- Positive-day selection: "+source,"","| Symbol | Time (KST) | N | Avg bar change % | Avg vs prev close % | Probability positive % |","|---|---|---:|---:|---:|---:|"]
          for row in result["hourly_summary"]:
              fmt=lambda x:("NA" if x is None else str(x))
              md.append(f"| {row['symbol']} | {row['slot']} | {row['n']} | {fmt(row['avg_hour_pct'])} | {fmt(row['avg_from_prev_pct'])} | {fmt(row['up_probability_pct'])} |")
          md.extend(["","## Daily average close-to-close returns",json.dumps(result["daily_summary"],ensure_ascii=False),"","## Quality warnings"])
          md.extend(result["quality_warnings"] or ["None"])
          txt="\n".join(md)+"\n"
          (OUT/"README.md").write_text(txt,encoding="utf8")
          say("=== BACKTEST_RESULTS_START ===\n"+txt+"=== BACKTEST_RESULTS_END ===")
          if os.getenv("GITHUB_STEP_SUMMARY"):
              with open(os.environ["GITHUB_STEP_SUMMARY"],"a") as fh:fh.write(txt)
          if not days_data:
              raise RuntimeError("No hourly observations - please inspect data-source availability.")
          PY
      - name: Validate last 1h bar against official day close
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          import yfinance as yf
          result={}
          for name,sym in [("KODEX200","069500.KS"),("INVERSE","114800.KS")]:
              h=yf.Ticker(sym).history(start="2026-07-20",end="2026-10-21",interval="1h",auto_adjust=False)
              d=yf.Ticker(sym).history(start="2026-07-20",end="2026-10-21",interval="1d",auto_adjust=False)
              if h.index.tz is not None:h.index=h.index.tz_convert("Asia/Seoul")
              if d.index.tz is not None:d.index=d.index.tz_convert("Asia/Seoul")
              last=h.groupby(h.index.date).tail(1)
              daily=d.groupby(d.index.date).tail(1)
              daymap={k:float(x) for k,x in zip(daily.index.date,daily.Close)}
              pairs=[{"date":t.date().isoformat(),"last_hour_start":t.strftime("%H:%M"),"hour_last_close":float(v),"daily_close":daymap.get(t.date()),"difference":round(float(v-daymap.get(t.date(),v)),4)} for t,v in zip(last.index,last.Close) if t.date() in daymap and t.date().isoformat()<="2026-10-20"]
              equals=sum(abs(x["difference"])<0.01 for x in pairs)
              result[name]={"compared_sessions":len(pairs),"matched_close":equals,"rate_pct":round(100*equals/len(pairs),2) if pairs else None,"last_5":pairs[-5:]}
          print("=== LAST HOURLY BAR / DAILY CLOSE CHECK ===")
          print(json.dumps(result,ensure_ascii=False,indent=2),flush=True)
          Path("results/kodex_hourly_20261020/last_bar_quality_check.json").write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding="utf8")
          PY
      - name: Archive computed observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: kodex-hourly-60d-20261020
          path: results/kodex_hourly_20261020/
          if-no-files-found: warn
          retention-days: 14
