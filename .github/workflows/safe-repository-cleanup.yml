# V8.5.3 final read-only audit; production two-table release and Custom GPT contract
name: Safe repository audit v8.5.3

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-repository-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Checkout repository without stored credentials
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install audit dependencies
        run: python -m pip install --quiet --timeout 30 --retries 1 -r requirements.txt PyYAML

      - name: Audit V8.5.3 production contract
        shell: bash
        run: |
          set -euo pipefail

          if test -n "$(git status --porcelain)"; then
            echo "::error::Audit requires a clean checkout."
            git status --short
            exit 1
          fi

          export PYTHONPYCACHEPREFIX="$(mktemp -d)"

          python -m py_compile \
            validate_api_sync.py \
            validate_daily_integrated_health_v731.py \
            stock_table_metrics_v850.py \
            build_two_table_shadow_v851.py \
            two_table_release_v853.py \
            validate_two_table_clients_v853.py \
            validate_table_command_routes_v82.py \
            test_stock_table_metrics_v850.py \
            test_two_table_shadow_v851.py \
            test_worker_rollout_health_v852.py \
            test_two_table_release_v853.py

          validation_hash_before="$(sha256sum api/validation_report.json | awk '{print $1}')"
          python -W error::DeprecationWarning validate_api_sync.py --check-only
          validation_hash_after="$(sha256sum api/validation_report.json | awk '{print $1}')"
          if test "$validation_hash_before" != "$validation_hash_after"; then
            echo "::error::validate_api_sync.py --check-only changed api/validation_report.json"
            exit 1
          fi
          echo "LIVE_API_VALIDATION_CHECK_ONLY=PASS"

          python two_table_release_v853.py --repo . --check-only
          python validate_two_table_clients_v853.py --repo .
          python validate_table_command_routes_v82.py

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          from pathlib import Path

          import yaml

          root = Path.cwd()
          RELEASE = "2026-09-04-v8.5.3-two-table-layout-release"
          INSTRUCTIONS = "2026-09-04-v6.9.0-two-table-layout"
          ACTION_VERSION = "7.1.0"
          MISSING = [
              "investment_score_100",
              "earnings_outlook_change",
              "rs_sector",
              "confirmed_swing_low_stop",
          ]
          EXPECTED_HEADERS = [
              "추천/종목",
              "요청시점 현재가",
              "평균등락일수",
              "연속등락",
              "가치매수→1차익절",
              "3개월 저~고·현재위치",
              "큰 스윙 위치·방향",
              "추세(5·20·60·120)",
              "1M/3M 흐름",
              "거래·탄력/변동폭",
              "수급·위험",
              "기업가치·실적",
              "실적전망 변화",
              "1M/3M 상대강도",
              "ATR·하루변동폭",
              "추적손절 기준",
              "투자종합점수·진입판단",
              "시장·티커",
              "섹터·업종강도",
          ]

          def fail(message: str):
              raise SystemExit(message)

          def read_json(path: Path):
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  fail("JSON_OBJECT_REQUIRED=" + str(path))
              return value

          workflow_dir = root / ".github" / "workflows"
          expected_workflows = {
              "build_api_json.yml",
              "collect-krx-watchlist.yml",
              "dart-fx-exposure-safe.yml",
              "kospi-consecutive-decliners.yml",
              "maintenance-repair.yml",
              "safe-repository-cleanup.yml",
              "v6-apply-us-sp500-production.yml",
              "v731-daily-integrated-health.yml",
              "v77-runtime-freshness-gate.yml",
          }
          actual_workflows = {
              p.name for p in workflow_dir.iterdir()
              if p.is_file() and p.suffix in {".yml", ".yaml"}
          }
          if actual_workflows != expected_workflows:
              fail(
                  "FINAL_WORKFLOW_SET_MISMATCH="
                  + json.dumps(
                      {
                          "missing": sorted(expected_workflows - actual_workflows),
                          "unexpected": sorted(actual_workflows - expected_workflows),
                      },
                      ensure_ascii=False,
                  )
              )

          status = read_json(root / "api" / "status.json")
          manifest = read_json(root / "api" / "two_table_v1" / "manifest.json")
          release_config = read_json(root / "config" / "two_table_release.json")
          holdings = read_json(root / "api" / "stock_reference_manifest.json")

          for key in ("api_sync_ok", "official_fresh_now", "safe_to_analyze_as_latest"):
              if status.get(key) is not True:
                  fail("STATUS_GATE_FAILED=" + key)
          if status.get("status") != "READY":
              fail("API_STATUS_NOT_READY")

          expected_release_config = {
              "version": RELEASE,
              "enabled": True,
              "standalone_swing_table_enabled": False,
              "scope": "LAYOUT_AND_VERIFIED_INDICATORS_WITH_DECLARED_GAPS",
              "unavailable_fields": MISSING,
              "missing_score_policy": "NO_SCORE_NO_AUTO_BUY_UPGRADE",
          }
          if release_config != expected_release_config:
              fail("V853_RELEASE_CONFIG_MISMATCH")

          if manifest.get("version") != RELEASE:
              fail("V853_MANIFEST_VERSION_MISMATCH")
          if manifest.get("release_stage") != "PRODUCTION":
              fail("V853_NOT_PRODUCTION")
          if manifest.get("status") != "READY":
              fail("V853_MANIFEST_NOT_READY")
          for key in (
              "production_activation_allowed",
              "custom_gpt_route_enabled",
              "safe_to_analyze_as_latest",
          ):
              if manifest.get(key) is not True:
                  fail("V853_PRODUCTION_GATE_FAILED=" + key)
          if manifest.get("standalone_swing_table_enabled") is not False:
              fail("STANDALONE_SWING_TABLE_MUST_REMAIN_DISABLED")

          identity_pairs = (
              ("source_build_id", "build_id"),
              ("source_rules_version", "rules_version"),
              ("source_rules_sha256", "rules_sha256"),
              ("basis_date", "confirmed_basis_date"),
          )
          for manifest_key, status_key in identity_pairs:
              if manifest.get(manifest_key) != status.get(status_key):
                  fail(
                      f"V853_SOURCE_IDENTITY_MISMATCH={manifest_key}:{status_key}"
                  )

          display = manifest.get("display_contract") or {}
          if display.get("version") != RELEASE:
              fail("V853_DISPLAY_CONTRACT_VERSION_MISMATCH")
          if display.get("coverage") != "PARTIAL_DECLARED":
              fail("V853_DISPLAY_COVERAGE_MISMATCH")
          if display.get("unavailable_fields") != MISSING:
              fail("V853_MISSING_FIELDS_NOT_EXPLICIT")
          if display.get("request_time_prices") != "REQUIRED_10_5_2_NO_STATIC_FALLBACK":
              fail("V853_REQUEST_TIME_PRICE_CONTRACT_MISMATCH")
          if display.get("investment_score_100") != "NOT_AVAILABLE_DO_NOT_RESCALE_LEGACY_SCORE":
              fail("V853_SCORE_GAP_POLICY_MISMATCH")
          if display.get("recommendation_floor") != "OBSERVE_NOT_AUTOMATIC_BUY":
              fail("V853_RECOMMENDATION_FLOOR_MISMATCH")

          files = manifest.get("files") or {}
          tables = manifest.get("tables") or {}
          if set(tables) != {"kospi", "decliners", "decliners24"}:
              fail("V853_TABLE_SET_MISMATCH")
          if tables["kospi"].get("row_count") != 30:
              fail("V853_KOSPI_ROW_COUNT_NOT_30")

          for table_name in ("kospi", "decliners", "decliners24"):
              entry = tables[table_name]
              pages = entry.get("pages")
              expected_total = entry.get("row_count")
              if not isinstance(pages, list) or not pages:
                  fail("V853_PAGE_LIST_INVALID=" + table_name)
              if not isinstance(expected_total, int) or expected_total < 0:
                  fail("V853_ROW_COUNT_INVALID=" + table_name)

              collected = []
              for expected_page_no, filename in enumerate(pages, start=1):
                  path = root / "api" / "two_table_v1" / filename
                  raw = path.read_bytes()
                  meta = files.get(filename)
                  if not isinstance(meta, dict):
                      fail("V853_FILE_METADATA_MISSING=" + filename)
                  if len(raw) != meta.get("bytes"):
                      fail("V853_PAGE_BYTES_MISMATCH=" + filename)
                  if hashlib.sha256(raw).hexdigest() != meta.get("sha256"):
                      fail("V853_PAGE_SHA256_MISMATCH=" + filename)
                  if len(raw) > 28500:
                      fail("V853_PAGE_TRANSPORT_HEADROOM_EXCEEDED=" + filename)

                  page = json.loads(raw)
                  if page.get("version") != RELEASE or page.get("status") != "READY":
                      fail("V853_PAGE_RELEASE_STATUS_MISMATCH=" + filename)
                  if page.get("release_stage") != "PRODUCTION":
                      fail("V853_PAGE_NOT_PRODUCTION=" + filename)
                  if page.get("source_build_id") != manifest.get("source_build_id"):
                      fail("V853_PAGE_BUILD_MISMATCH=" + filename)
                  if page.get("headers") != EXPECTED_HEADERS:
                      fail("V853_19_COLUMN_HEADERS_MISMATCH=" + filename)
                  if page.get("explicit_missing") != MISSING:
                      fail("V853_PAGE_MISSING_FIELDS_MISMATCH=" + filename)
                  if page.get("page") != expected_page_no:
                      fail("V853_PAGE_NUMBER_MISMATCH=" + filename)
                  if page.get("page_count") != len(pages):
                      fail("V853_PAGE_COUNT_MISMATCH=" + filename)
                  if page.get("total_rows") != expected_total:
                      fail("V853_TOTAL_ROWS_MISMATCH=" + filename)
                  rows = page.get("rows")
                  if not isinstance(rows, list) or page.get("row_count") != len(rows):
                      fail("V853_PAGE_ROW_COUNT_MISMATCH=" + filename)
                  collected.extend(rows)

              if len(collected) != expected_total:
                  fail("V853_ALL_PAGES_INCOMPLETE=" + table_name)
              tickers = [row[1] for row in collected]
              if len(tickers) != len(set(tickers)):
                  fail("V853_DUPLICATE_TICKER=" + table_name)
              print(
                  "V853_TABLE_COMPLETE="
                  + table_name
                  + ":"
                  + str(len(collected))
                  + ":pages="
                  + str(len(pages))
              )

          price_policy = status.get("request_time_price_policy") or {}
          expected_price_policy = {
              "enabled": True,
              "action_operation_id": "getRequestTimePrices",
              "max_batch_size": 10,
              "initial_batch_size": 10,
              "retry_failed_quotes": True,
              "retry_only_failed": True,
              "retry_rounds": 2,
              "retry_batch_sizes": [5, 2],
              "preserve_input_order": True,
              "deduplicate_quote_keys": True,
          }
          for key, expected in expected_price_policy.items():
              if price_policy.get(key) != expected:
                  fail("REQUEST_TIME_PRICE_POLICY_MISMATCH=" + key)
          if "do_not_fake_price" not in str(price_policy.get("failed_quote_behavior")):
              fail("REQUEST_TIME_PRICE_FAILURE_POLICY_MISMATCH")

          if holdings.get("privacy_policy", {}).get("contains_user_holdings") is not False:
              fail("HOLDINGS_PRIVACY_CONTRACT_FAILED")
          action_contract = holdings.get("action_contract") or {}
          if action_contract.get("required_parameters") != ["prefix", "ticker"]:
              fail("HOLDINGS_EXACT_TICKER_PARAMETERS_MISMATCH")
          if action_contract.get("prefix_only_call_forbidden") is not True:
              fail("HOLDINGS_PREFIX_ONLY_NOT_FORBIDDEN")

          schema_path = root / "docs" / "custom_gpt_action_schema.yaml"
          schema_text = schema_path.read_text(encoding="utf-8")
          schema = yaml.safe_load(schema_text)
          if schema.get("openapi") != "3.1.0":
              fail("OPENAPI_VERSION_MISMATCH")
          if str(schema.get("info", {}).get("version")) != ACTION_VERSION:
              fail("ACTION_SCHEMA_VERSION_MISMATCH")
          if schema.get("servers") != [
              {"url": "https://krx-live-price-ksh.diaconos.workers.dev"}
          ]:
              fail("ACTION_SERVER_MISMATCH")
          if "https://raw.githubusercontent.com" in schema_text:
              fail("RAW_GITHUB_ACTION_PRESENT")

          operation_ids = []
          for path, path_item in (schema.get("paths") or {}).items():
              for method, operation in (path_item or {}).items():
                  if not isinstance(operation, dict):
                      continue
                  operation_id = operation.get("operationId")
                  if operation_id:
                      operation_ids.append(operation_id)
          if len(operation_ids) != 30 or len(set(operation_ids)) != 30:
              fail("ACTION_OPERATION_ID_COUNT_MISMATCH")

          two_table_action = (
              (schema.get("paths") or {})
              .get("/tables/v1/{table}", {})
              .get("get", {})
          )
          if two_table_action.get("operationId") != "getKospiWatchlist":
              fail("V853_ACTION_OPERATION_ID_MISMATCH")
          parameters = {
              item.get("name"): item
              for item in two_table_action.get("parameters") or []
              if isinstance(item, dict)
          }
          if list(parameters) != ["table", "page", "build_id"]:
              fail("V853_ACTION_PARAMETERS_MISMATCH")
          table_enum = parameters["table"].get("schema", {}).get("enum")
          if table_enum != ["kospi", "decliners", "decliners24"]:
              fail("V853_ACTION_TABLE_ENUM_MISMATCH")

          instructions_text = (
              root / "docs" / "custom_gpt_instructions.md"
          ).read_text(encoding="utf-8")
          required_instruction_tokens = (
              "- 버전: " + INSTRUCTIONS,
              "## 13. V8.5.3 새 코피표·연속하락표 — 이 절 우선",
              "형식 버전: " + RELEASE,
              "getKospiWatchlist(table=kospi)",
              "연속하락표=decliners",
              "2.4연속하락표=decliners24",
              "page_count까지 모두 조회",
              "모든 행 조회 뒤 ticker|KOSPI로 전체 현재가를 10→5→2 조회한다.",
              "투자종합점수100·실적전망변화·업종RS·확정 스윙저점 추적손절은 자료 미제공.",
              "구형 점수를 환산/잘라내기/임의 점수로 채우지 않는다.",
              "가격만으로 ✅ 승격하지 않는다.",
              "추천 아이콘은 첫 열 1개",
              "개인정보 비저장",
              "구형 API·CSV·preview 모드 대체 금지.",
          )
          for token in required_instruction_tokens:
              if token not in instructions_text:
                  fail("CUSTOM_GPT_INSTRUCTIONS_TOKEN_MISSING=" + token)

          print("FINAL_WORKFLOW_SET=PASS")
          print("V853_LAYOUT_RELEASE=PASS")
          print("V853_19_COLUMN_DISPLAY_CONTRACT=PASS")
          print("V853_ALL_LOCAL_PAGES_AND_SHA256=PASS")
          print("ACTION_SCHEMA_VERSION=7.1.0")
          print("ACTION_OPERATION_ID_COUNT=30")
          print("CUSTOM_GPT_INSTRUCTIONS_VERSION=" + INSTRUCTIONS)
          print("REQUEST_TIME_PRICE_10_5_2=PASS")
          print("HOLDINGS_PRIVACY_CONTRACT=PASS")
          print("INCOMPLETE_METRICS_EXPLICIT=true")
          print("STANDALONE_SWING_TABLE_ENABLED=false")
          PY

          python -m unittest -v \
            test_stock_table_metrics_v850 \
            test_two_table_shadow_v851 \
            test_worker_rollout_health_v852 \
            test_two_table_release_v853

          node worker/validate_worker.mjs .
          node worker/validate_two_table_proxy_v852.mjs .
          node worker/validate_two_table_release_v853.mjs .

          health_dir="$(mktemp -d)"
          python validate_daily_integrated_health_v731.py \
            --repo-root . \
            --output-json "$health_dir/health.json" \
            --output-md "$health_dir/health.md"
          python - "$health_dir/health.json" <<'PY'
          import json
          import sys

          report = json.load(open(sys.argv[1], encoding="utf-8"))
          if (
              report.get("status") != "PASS"
              or report.get("critical_count") != 0
              or report.get("warning_count") != 0
          ):
              raise SystemExit("V853_DAILY_HEALTH_NOT_CLEAN")
          print("V853_DAILY_HEALTH_LOCAL_AND_LIVE=PASS")
          PY

          python - <<'PY'
          from __future__ import annotations

          import json
          import urllib.error
          import urllib.parse
          import urllib.request
          from pathlib import Path

          BASE = "https://krx-live-price-ksh.diaconos.workers.dev"
          EXPECTED_WORKER = "1.4.0-two-table-guarded-preview"
          repo = Path.cwd()
          local_manifest = json.loads(
              (repo / "api" / "two_table_v1" / "manifest.json").read_text(
                  encoding="utf-8"
              )
          )

          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, msg, headers, newurl):
                  return None

          opener = urllib.request.build_opener(NoRedirect())

          def get(path: str, max_bytes: int = 100000):
              request = urllib.request.Request(
                  BASE + path,
                  method="GET",
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "krx-watchlist-health-v7.3",
                      "Cache-Control": "no-cache",
                  },
              )
              try:
                  with opener.open(request, timeout=35) as response:
                      raw = response.read(max_bytes + 1)
                      if len(raw) > max_bytes:
                          raise SystemExit("LIVE_RESPONSE_TOO_LARGE=" + path)
                      if response.status != 200:
                          raise SystemExit(
                              "LIVE_HTTP_NOT_200=" + path + ":" + str(response.status)
                          )
                      return json.loads(raw), {
                          key.lower(): value
                          for key, value in response.headers.items()
                      }
              except urllib.error.HTTPError as exc:
                  raise SystemExit(
                      "LIVE_HTTP_ERROR=" + path + ":" + str(exc.code)
                  ) from None
              except (OSError, TimeoutError, json.JSONDecodeError) as exc:
                  raise SystemExit(
                      "LIVE_FETCH_FAILED=" + path + ":" + str(exc)
                  ) from None

          health, _ = get("/health")
          if health.get("status") != "OK":
              raise SystemExit("LIVE_WORKER_HEALTH_NOT_OK")
          if health.get("build_version") != EXPECTED_WORKER:
              raise SystemExit("LIVE_WORKER_BUILD_MISMATCH")
          proxy = health.get("two_table_proxy") or {}
          expected_proxy = {
              "version": "1",
              "page_limit_bytes": 30000,
              "page_limit_rows": 30,
              "sha256_required": True,
              "later_pages_require_build_id": True,
              "cache_mode": "NO_STORE_CONTROL_RECHECK",
              "values_recalculated": False,
              "standalone_swing_table_enabled": False,
              "paths": [
                  "/tables/v1/kospi",
                  "/tables/v1/decliners",
                  "/tables/v1/decliners24",
              ],
          }
          for key, expected in expected_proxy.items():
              if proxy.get(key) != expected:
                  raise SystemExit("LIVE_WORKER_PROXY_MISMATCH=" + key)
          print("LIVE_WORKER_V140_HEALTH=PASS")

          for table in ("kospi", "decliners", "decliners24"):
              entry = local_manifest["tables"][table]
              collected = []
              next_path = f"/tables/v1/{table}?page=1"

              for page_no, local_filename in enumerate(entry["pages"], start=1):
                  payload, headers = get(next_path, 30000)
                  if payload.get("status") != "READY":
                      raise SystemExit("LIVE_TABLE_NOT_READY=" + table)
                  if payload.get("release_stage") != "PRODUCTION":
                      raise SystemExit("LIVE_TABLE_NOT_PRODUCTION=" + table)
                  if payload.get("source_build_id") != local_manifest["source_build_id"]:
                      raise SystemExit("LIVE_TABLE_BUILD_MISMATCH=" + table)

                  transport = payload.get("transport") or {}
                  if transport.get("mode") != "production":
                      raise SystemExit("LIVE_TRANSPORT_MODE_MISMATCH=" + table)
                  if transport.get("values_recalculated") is not False:
                      raise SystemExit("LIVE_VALUES_RECALCULATED=" + table)

                  local_page = json.loads(
                      (
                          repo / "api" / "two_table_v1" / local_filename
                      ).read_text(encoding="utf-8")
                  )
                  without_transport = dict(payload)
                  without_transport.pop("transport", None)
                  if without_transport != local_page:
                      raise SystemExit(
                          "LIVE_PAGE_NOT_EXACT_LOCAL_SOURCE=" + local_filename
                      )

                  if headers.get("cache-control") != "no-store":
                      raise SystemExit("LIVE_CACHE_CONTROL_MISMATCH=" + table)
                  if headers.get("x-two-table-build-id") != local_manifest["source_build_id"]:
                      raise SystemExit("LIVE_BUILD_HEADER_MISMATCH=" + table)
                  if headers.get("x-two-table-sha256-verified") != "true":
                      raise SystemExit("LIVE_SHA_HEADER_MISMATCH=" + table)

                  collected.extend(payload.get("rows") or [])
                  next_url = transport.get("next_page_url")
                  if page_no < len(entry["pages"]):
                      if not next_url:
                          raise SystemExit("LIVE_NEXT_PAGE_MISSING=" + table)
                      parsed = urllib.parse.urlparse(next_url)
                      qs = urllib.parse.parse_qs(parsed.query)
                      if qs.get("build_id", [None])[0] != local_manifest["source_build_id"]:
                          raise SystemExit("LIVE_NEXT_PAGE_BUILD_NOT_PINNED=" + table)
                      next_path = parsed.path + "?" + parsed.query
                  else:
                      if next_url is not None:
                          raise SystemExit("LIVE_FINAL_NEXT_PAGE_NOT_NULL=" + table)

              if len(collected) != entry["row_count"]:
                  raise SystemExit("LIVE_ALL_PAGES_INCOMPLETE=" + table)
              tickers = [row[1] for row in collected]
              if len(tickers) != len(set(tickers)):
                  raise SystemExit("LIVE_DUPLICATE_TICKER=" + table)
              print(
                  "LIVE_V853_TABLE="
                  + table
                  + ":"
                  + str(len(collected))
                  + ":pages="
                  + str(len(entry["pages"]))
              )

          print("LIVE_V853_ALL_PRODUCTION_PAGES=PASS")
          PY

          if test -n "$(git status --porcelain)"; then
            echo "::error::Read-only audit changed the repository worktree."
            git status --short
            exit 1
          fi

          echo "READ_ONLY_NO_REPOSITORY_CHANGES=PASS"
          echo "SAFE_REPOSITORY_AUDIT=PASS"
