# V8.2.6 live read-only repository audit
name: Safe repository audit v8.2.6

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-repository-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: python -m pip install --quiet pyyaml

      - name: Audit current repository contract
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            build_api_json.py \
            build_stock_reference_api.py \
            validate_api_sync.py

          validation_hash_before="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          python -W error::DeprecationWarning \
            validate_api_sync.py --check-only
          validation_hash_after="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          if test "$validation_hash_before" != \
            "$validation_hash_after"; then
            echo "::error::Check-only validation changed the report."
            exit 1
          fi
          echo "LIVE_API_VALIDATION_CHECK_ONLY=PASS"

          python - <<'PY'
          from __future__ import annotations

          import json
          from pathlib import Path

          import yaml


          root = Path.cwd()
          workflow_dir = root / ".github" / "workflows"
          expected_workflows = {
              "build_api_json.yml",
              "collect-krx-watchlist.yml",
              "dart-fx-exposure-safe.yml",
              "maintenance-repair.yml",
              "safe-repository-cleanup.yml",
              "v6-apply-us-sp500-production.yml",
              "v731-daily-integrated-health.yml",
              "v77-runtime-freshness-gate.yml",
          }
          actual_workflows = {
              path.name
              for path in workflow_dir.glob("*.yml")
          } | {
              path.name
              for path in workflow_dir.glob("*.yaml")
          }
          missing = sorted(expected_workflows - actual_workflows)
          unexpected = sorted(actual_workflows - expected_workflows)
          if missing:
              raise SystemExit(f"MISSING_OPERATIONAL_WORKFLOWS={missing}")
          if unexpected:
              raise SystemExit(f"UNEXPECTED_WORKFLOWS={unexpected}")

          def read_json(path: Path) -> dict:
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"JSON_OBJECT_REQUIRED={path}")
              return value


          status = read_json(root / "api" / "status.json")
          manifest = read_json(root / "api" / "manifest.json")
          rules = read_json(root / "api" / "stock_table_rules.json")
          validation = read_json(root / "api" / "validation_report.json")
          holdings = read_json(
              root / "api" / "stock_reference_manifest.json"
          )

          if status.get("status") != "READY":
              raise SystemExit("API_STATUS_NOT_READY")
          if status.get("api_sync_ok") is not True:
              raise SystemExit("API_SYNC_NOT_OK")
          if validation.get("status") != "PASS":
              raise SystemExit("API_VALIDATION_NOT_PASS")
          if validation.get("errors"):
              raise SystemExit("API_VALIDATION_ERRORS_PRESENT")

          build_ids = {
              item.get("build_id")
              for item in (status, manifest, rules)
          }
          rule_versions = {
              item.get("rules_version")
              for item in (status, manifest, rules)
          }
          rule_hashes = {
              item.get("rules_sha256")
              for item in (status, manifest, rules)
          }
          if len(build_ids) != 1 or None in build_ids:
              raise SystemExit(f"BUILD_ID_MISMATCH={sorted(build_ids)}")
          if len(rule_versions) != 1 or None in rule_versions:
              raise SystemExit(
                  f"RULES_VERSION_MISMATCH={sorted(rule_versions)}"
              )
          if len(rule_hashes) != 1 or None in rule_hashes:
              raise SystemExit(
                  f"RULES_HASH_MISMATCH={sorted(rule_hashes)}"
              )
          if "2026-06-30-v5" in next(iter(rule_versions)):
              raise SystemExit("OBSOLETE_V5_RULES_VERSION_ACTIVE")

          contract = holdings.get("action_contract") or {}
          usage = holdings.get("usage") or {}
          if contract.get("version") != (
              "2026-07-16-v8.2.4-exact-ticker-filter"
          ):
              raise SystemExit("HOLDINGS_CONTRACT_VERSION_MISMATCH")
          if contract.get("required_parameters") != [
              "prefix",
              "ticker",
          ]:
              raise SystemExit("HOLDINGS_REQUIRED_PARAMETERS_MISMATCH")
          if contract.get("prefix_only_call_forbidden") is not True:
              raise SystemExit("HOLDINGS_PREFIX_ONLY_NOT_FORBIDDEN")
          if usage.get("prefix_only_call_forbidden") is not True:
              raise SystemExit("HOLDINGS_USAGE_PREFIX_ONLY_NOT_FORBIDDEN")
          if holdings.get("privacy_policy", {}).get(
              "contains_user_holdings"
          ) is not False:
              raise SystemExit("HOLDINGS_PRIVACY_CONTRACT_FAILED")

          schema_path = root / "docs" / "custom_gpt_action_schema.yaml"
          schema_text = schema_path.read_text(encoding="utf-8")
          schema = yaml.safe_load(schema_text)
          if schema.get("openapi") != "3.1.0":
              raise SystemExit("OPENAPI_VERSION_MISMATCH")
          if str(schema.get("info", {}).get("version")) != "7.0.1":
              raise SystemExit("ACTION_SCHEMA_VERSION_MISMATCH")
          servers = schema.get("servers") or []
          if servers != [{
              "url": "https://krx-live-price-ksh.diaconos.workers.dev"
          }]:
              raise SystemExit(f"ACTION_SERVER_MISMATCH={servers}")
          if "https://raw.githubusercontent.com" in schema_text:
              raise SystemExit("RAW_GITHUB_ACTION_PRESENT")

          operations = []
          operation_map = {}
          for path, path_item in (schema.get("paths") or {}).items():
              for method, operation in (path_item or {}).items():
                  if not isinstance(operation, dict):
                      continue
                  operation_id = operation.get("operationId")
                  if operation_id:
                      operations.append(operation_id)
                      operation_map[operation_id] = operation
          if len(operations) != 30 or len(set(operations)) != 30:
              raise SystemExit(
                  f"ACTION_OPERATION_ID_COUNT={len(operations)}"
              )
          shard_operation = operation_map.get("getStockReferenceShard")
          if not shard_operation:
              raise SystemExit("STOCK_REFERENCE_OPERATION_MISSING")
          parameters = {
              item.get("name"): item
              for item in shard_operation.get("parameters") or []
          }
          if list(parameters) != ["prefix", "ticker", "market"]:
              raise SystemExit(
                  f"STOCK_REFERENCE_PARAMETERS={list(parameters)}"
              )
          if parameters["prefix"].get("required") is not True:
              raise SystemExit("PREFIX_PARAMETER_NOT_REQUIRED")
          if parameters["ticker"].get("required") is not True:
              raise SystemExit("TICKER_PARAMETER_NOT_REQUIRED")

          instructions = (
              root / "docs" / "custom_gpt_instructions.md"
          ).read_text(encoding="utf-8")
          required_instruction_tokens = (
              "2026-07-16-v6.8.1-holdings-exact-filter",
              "## 12. 보유종목표 개인정보 비저장 런타임",
              "getStockReferenceShard를 prefix만으로 호출하지 않는다.",
          )
          for token in required_instruction_tokens:
              if token not in instructions:
                  raise SystemExit(
                      "CUSTOM_GPT_INSTRUCTIONS_TOKEN_MISSING=" + token
                  )

          validator_text = (
              root / "validate_api_sync.py"
          ).read_text(encoding="utf-8")
          validator_tokens = (
              "validate_api_sync.py v1.7_read_only_check_v826",
              'parser.add_argument("--check-only", action="store_true")',
              "datetime.now(timezone.utc)",
          )
          for token in validator_tokens:
              if token not in validator_text:
                  raise SystemExit(
                      "VALIDATOR_V826_TOKEN_MISSING=" + token
                  )

          readme = (root / "README_사용법.md").read_text(
              encoding="utf-8"
          )
          structure = (
              root / "docs" / "REPOSITORY_STRUCTURE.md"
          ).read_text(encoding="utf-8")
          stale_tokens = (
              "2026-06-30-v5-strict-contract",
              "apply-custom-gpt-v5-hardening.yml",
              "fix-rules-version-contract.yml",
          )
          combined_docs = readme + "\n" + structure
          for token in stale_tokens:
              if token in combined_docs:
                  raise SystemExit("STALE_DOCUMENT_TOKEN=" + token)

          active_legacy_schema = (
              root / "docs" / "custom_gpt_live_price_action_schema.yaml"
          )
          archived_legacy_schema = (
              root
              / "docs"
              / "archive"
              / "legacy-schemas"
              / "custom_gpt_live_price_action_schema-v1.1.0.yaml"
          )
          if active_legacy_schema.exists():
              raise SystemExit("SEPARATE_LIVE_PRICE_SCHEMA_STILL_ACTIVE")
          if not archived_legacy_schema.exists():
              raise SystemExit("LEGACY_SCHEMA_ARCHIVE_MISSING")

          print("SAFE_REPOSITORY_AUDIT=PASS")
          print("WORKFLOW_COUNT=8")
          print("API_SYNC_OK=true")
          print("API_VALIDATION=PASS")
          print("BUILD_ID=" + next(iter(build_ids)))
          print("RULES_VERSION=" + next(iter(rule_versions)))
          print("ACTION_OPERATION_ID_COUNT=30")
          print("SINGLE_ACTION_DOMAIN=PASS")
          print("RAW_GITHUB_ACTION_PRESENT=false")
          print("HOLDINGS_EXACT_TICKER_CONTRACT=PASS")
          print("SEPARATE_LIVE_PRICE_SCHEMA_ACTIVE=false")
          print("VALIDATOR_CHECK_ONLY_MODE=PASS")
          PY

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          if test -n "$(git status --porcelain)"; then
            echo "::error::Read-only audit changed the worktree."
            git status --short
            exit 1
          fi

          echo "READ_ONLY_NO_REPOSITORY_CHANGES=PASS"
