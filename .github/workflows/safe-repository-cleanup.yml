# V8.4.1 read-only repository audit; Worker V1.3.9 / KOSPI 90KB sources
name: Safe repository audit v8.4.1

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: safe-repository-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install schema validator
        run: python -m pip install --quiet pyyaml

      - name: Audit current repository contract
        shell: bash
        run: |
          set -euo pipefail

          # Keep Python cache files outside the repository; do not delete files.
          export PYTHONPYCACHEPREFIX="$(mktemp -d)"
          python -m py_compile \
            build_api_json.py \
            build_stock_reference_api.py \
            apply_kr_sector_theme_v72.py \
            apply_display_normalization_v74.py \
            apply_recommendation_icon_v79.py \
            validate_daily_integrated_health_v731.py \
            validate_api_sync.py

          validation_hash_before="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          python -W error::DeprecationWarning \
            validate_api_sync.py --check-only
          validation_hash_after="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          if test "$validation_hash_before" != \
            "$validation_hash_after"; then
            echo "::error::Check-only validation changed the report."
            exit 1
          fi
          echo "LIVE_API_VALIDATION_CHECK_ONLY=PASS"

          python - <<'PY'
          from __future__ import annotations

          import ast
          import json
          from pathlib import Path

          import yaml


          root = Path.cwd()
          workflow_dir = root / ".github" / "workflows"
          expected_workflows = {
              "build_api_json.yml",
              "collect-krx-watchlist.yml",
              "dart-fx-exposure-safe.yml",
              "kospi-consecutive-decliners.yml",
              "maintenance-repair.yml",
              "safe-repository-cleanup.yml",
              "v6-apply-us-sp500-production.yml",
              "v731-daily-integrated-health.yml",
              "v77-runtime-freshness-gate.yml",
          }
          actual_workflows = {
              path.name
              for path in workflow_dir.glob("*.yml")
          } | {
              path.name
              for path in workflow_dir.glob("*.yaml")
          }
          missing = sorted(expected_workflows - actual_workflows)
          unexpected = sorted(actual_workflows - expected_workflows)
          if missing:
              raise SystemExit(f"MISSING_OPERATIONAL_WORKFLOWS={missing}")
          if unexpected:
              raise SystemExit(f"UNEXPECTED_WORKFLOWS={unexpected}")

          us_workflow_path = (
              workflow_dir / "v6-apply-us-sp500-production.yml"
          )
          us_workflow_text = us_workflow_path.read_text(
              encoding="utf-8"
          )
          us_workflow = yaml.safe_load(us_workflow_text)
          if us_workflow.get("name") != (
              "US S&P500 Production v8.2.7"
          ):
              raise SystemExit("US_PRODUCTION_WORKFLOW_VERSION_MISMATCH")
          if "patch_us_watchlist_production_routes.py" in (
              us_workflow_text
          ):
              raise SystemExit("LEGACY_US_ROUTE_PATCHER_STILL_ACTIVE")
          us_workflow_tokens = (
              "US_UNIFIED_ACTION_CONTRACT=PASS",
              "US_ROUTE_PATCHER_USED=false",
              "TABLE_SYSTEM_VERSION=V8.2.7",
              'cron: "20 22 * * 1-5"',
          )
          for token in us_workflow_tokens:
              if token not in us_workflow_text:
                  raise SystemExit(
                      "US_PRODUCTION_WORKFLOW_TOKEN_MISSING=" + token
                  )

          def read_json(path: Path) -> dict:
              value = json.loads(path.read_text(encoding="utf-8"))
              if not isinstance(value, dict):
                  raise SystemExit(f"JSON_OBJECT_REQUIRED={path}")
              return value


          status = read_json(root / "api" / "status.json")
          manifest = read_json(root / "api" / "manifest.json")
          rules = read_json(root / "api" / "stock_table_rules.json")
          validation = read_json(root / "api" / "validation_report.json")
          holdings = read_json(
              root / "api" / "stock_reference_manifest.json"
          )

          if status.get("status") != "READY":
              raise SystemExit("API_STATUS_NOT_READY")
          if status.get("api_sync_ok") is not True:
              raise SystemExit("API_SYNC_NOT_OK")
          if status.get("official_fresh_now") is not True:
              raise SystemExit("OFFICIAL_DATA_NOT_FRESH")
          if status.get("safe_to_analyze_as_latest") is not True:
              raise SystemExit("API_NOT_SAFE_TO_ANALYZE_AS_LATEST")
          if validation.get("status") != "PASS":
              raise SystemExit("API_VALIDATION_NOT_PASS")
          if validation.get("errors"):
              raise SystemExit("API_VALIDATION_ERRORS_PRESENT")
          if validation.get("script") != (
              "validate_api_sync.py v1.9_single_recommendation_icon_v833"
          ):
              raise SystemExit("API_VALIDATION_SCRIPT_VERSION_MISMATCH")

          build_ids = {
              item.get("build_id")
              for item in (status, manifest, rules, validation)
          }
          rule_versions = {
              item.get("rules_version")
              for item in (status, manifest, rules)
          }
          rule_hashes = {
              item.get("rules_sha256")
              for item in (status, manifest, rules)
          }
          if len(build_ids) != 1 or None in build_ids:
              raise SystemExit(f"BUILD_ID_MISMATCH={sorted(build_ids)}")
          if len(rule_versions) != 1 or None in rule_versions:
              raise SystemExit(
                  f"RULES_VERSION_MISMATCH={sorted(rule_versions)}"
              )
          if len(rule_hashes) != 1 or None in rule_hashes:
              raise SystemExit(
                  f"RULES_HASH_MISMATCH={sorted(rule_hashes)}"
              )
          if "2026-06-30-v5" in next(iter(rule_versions)):
              raise SystemExit("OBSOLETE_V5_RULES_VERSION_ACTIVE")

          contract = holdings.get("action_contract") or {}
          usage = holdings.get("usage") or {}
          if contract.get("version") != (
              "2026-07-16-v8.2.4-exact-ticker-filter"
          ):
              raise SystemExit("HOLDINGS_CONTRACT_VERSION_MISMATCH")
          if contract.get("required_parameters") != [
              "prefix",
              "ticker",
          ]:
              raise SystemExit("HOLDINGS_REQUIRED_PARAMETERS_MISMATCH")
          if contract.get("prefix_only_call_forbidden") is not True:
              raise SystemExit("HOLDINGS_PREFIX_ONLY_NOT_FORBIDDEN")
          if usage.get("prefix_only_call_forbidden") is not True:
              raise SystemExit("HOLDINGS_USAGE_PREFIX_ONLY_NOT_FORBIDDEN")
          if holdings.get("privacy_policy", {}).get(
              "contains_user_holdings"
          ) is not False:
              raise SystemExit("HOLDINGS_PRIVACY_CONTRACT_FAILED")

          schema_path = root / "docs" / "custom_gpt_action_schema.yaml"
          schema_text = schema_path.read_text(encoding="utf-8")
          schema = yaml.safe_load(schema_text)
          if schema.get("openapi") != "3.1.0":
              raise SystemExit("OPENAPI_VERSION_MISMATCH")
          if str(schema.get("info", {}).get("version")) != "7.0.1":
              raise SystemExit("ACTION_SCHEMA_VERSION_MISMATCH")
          servers = schema.get("servers") or []
          if servers != [{
              "url": "https://krx-live-price-ksh.diaconos.workers.dev"
          }]:
              raise SystemExit(f"ACTION_SERVER_MISMATCH={servers}")
          if "https://raw.githubusercontent.com" in schema_text:
              raise SystemExit("RAW_GITHUB_ACTION_PRESENT")

          operations = []
          operation_map = {}
          for path, path_item in (schema.get("paths") or {}).items():
              for method, operation in (path_item or {}).items():
                  if not isinstance(operation, dict):
                      continue
                  operation_id = operation.get("operationId")
                  if operation_id:
                      operations.append(operation_id)
                      operation_map[operation_id] = operation
          if len(operations) != 30 or len(set(operations)) != 30:
              raise SystemExit(
                  f"ACTION_OPERATION_ID_COUNT={len(operations)}"
              )
          shard_operation = operation_map.get("getStockReferenceShard")
          if not shard_operation:
              raise SystemExit("STOCK_REFERENCE_OPERATION_MISSING")
          parameters = {
              item.get("name"): item
              for item in shard_operation.get("parameters") or []
          }
          if list(parameters) != ["prefix", "ticker", "market"]:
              raise SystemExit(
                  f"STOCK_REFERENCE_PARAMETERS={list(parameters)}"
              )
          if parameters["prefix"].get("required") is not True:
              raise SystemExit("PREFIX_PARAMETER_NOT_REQUIRED")
          if parameters["ticker"].get("required") is not True:
              raise SystemExit("TICKER_PARAMETER_NOT_REQUIRED")

          instructions = (
              root / "docs" / "custom_gpt_instructions.md"
          ).read_text(encoding="utf-8")
          required_instruction_tokens = (
              "2026-07-18-v6.8.3-single-recommendation-icon",
              "### 5-1. V8.0 요청시점 최종 표시",
              "request_time_final_recommendation_mark",
              "중간권 · 범위위치 42.3%",
              "가치매수구간 위 · 1차 익절구간 전",
              "추천 아이콘은 각 본표 행 전체에서 정확히 1개만 사용한다.",
              "추천 아이콘 `✅·🟡·⚠️·🔻`은 첫 열 `추천/종목`의 맨 앞에만 표시한다.",
              "`점수·추천·주의사유` 칸에는 추천 아이콘을 반복하지 않고",
              "## 12. 보유종목표 개인정보 비저장 런타임",
              "getStockReferenceShard를 prefix만으로 호출하지 않는다.",
          )
          for token in required_instruction_tokens:
              if token not in instructions:
                  raise SystemExit(
                      "CUSTOM_GPT_INSTRUCTIONS_TOKEN_MISSING=" + token
                  )

          validator_text = (
              root / "validate_api_sync.py"
          ).read_text(encoding="utf-8")
          validator_tokens = (
              "validate_api_sync.py v1.9_single_recommendation_icon_v833",
              'parser.add_argument("--check-only", action="store_true")',
              "datetime.now(timezone.utc)",
          )
          for token in validator_tokens:
              if token not in validator_text:
                  raise SystemExit(
                      "VALIDATOR_V833_TOKEN_MISSING=" + token
                  )

          readme = (root / "README_사용법.md").read_text(
              encoding="utf-8"
          )
          structure = (
              root / "docs" / "REPOSITORY_STRUCTURE.md"
          ).read_text(encoding="utf-8")
          stale_tokens = (
              "2026-06-30-v5-strict-contract",
              "apply-custom-gpt-v5-hardening.yml",
              "fix-rules-version-contract.yml",
          )
          combined_docs = readme + "\n" + structure
          for token in stale_tokens:
              if token in combined_docs:
                  raise SystemExit("STALE_DOCUMENT_TOKEN=" + token)
          if "읽기 전용 V8.4.1 감사 도구" not in structure:
              raise SystemExit("V841_STRUCTURE_DOCUMENTATION_MISSING")

          active_legacy_schema = (
              root / "docs" / "custom_gpt_live_price_action_schema.yaml"
          )
          archived_legacy_schema = (
              root
              / "docs"
              / "archive"
              / "legacy-schemas"
              / "custom_gpt_live_price_action_schema-v1.1.0.yaml"
          )
          if active_legacy_schema.exists():
              raise SystemExit("SEPARATE_LIVE_PRICE_SCHEMA_STILL_ACTIVE")
          if not archived_legacy_schema.exists():
              raise SystemExit("LEGACY_SCHEMA_ARCHIVE_MISSING")

          worker_source = root / "worker" / "krx-live-price-worker.js"
          worker_validator = root / "worker" / "validate_worker.mjs"
          worker_readme = root / "worker" / "README.md"
          for worker_path in (
              worker_source,
              worker_validator,
              worker_readme,
          ):
              if not worker_path.is_file():
                  raise SystemExit(
                      "WORKER_CONTRACT_FILE_MISSING=" + str(worker_path)
                  )
          worker_text = worker_source.read_text(encoding="utf-8")
          if 'BUILD_VERSION = "1.3.9-kospi-action-compact-v2"' not in (
              worker_text
          ):
              raise SystemExit("WORKER_BUILD_VERSION_MISMATCH")
          worker_tokens = (
              "COMPACT_US_WATCHLIST_V1",
              "COMPACT_TABLE_V1",
              "compact_table_path_count: 10",
              '"KOSPI_ACTION_V2"',
              "kospi_watchlist_max_bytes: 30000",
              "kospi_watchlist_static_position_omitted: true",
              "fallback_on_primary_fetch_error: true",
              "GITHUB_PROXY_PRIMARY_FETCH_TIMEOUT_MS = 6000",
              "GITHUB_PROXY_FALLBACK_FETCH_TIMEOUT_MS = 6000",
              'relativePath === "kospi_watchlist.json" ? "1.2" : "1.0"',
          )
          for token in worker_tokens:
              if token not in worker_text:
                  raise SystemExit(
                      "WORKER_V139_TOKEN_MISSING=" + token
                  )
          if "worker/krx-live-price-worker.js" not in structure:
              raise SystemExit("WORKER_STRUCTURE_DOCUMENTATION_MISSING")

          if "WORKER_V139_VALIDATION=PASS" not in (
              worker_validator.read_text(encoding="utf-8")
          ):
              raise SystemExit("WORKER_V139_VALIDATOR_MISSING")

          def literal_setting(filename: str, name: str):
              tree = ast.parse((root / filename).read_text(encoding="utf-8"))
              values = []
              for node in tree.body:
                  if isinstance(node, ast.Assign):
                      targets = node.targets
                  elif isinstance(node, ast.AnnAssign):
                      targets = [node.target]
                  else:
                      continue
                  if any(isinstance(t, ast.Name) and t.id == name for t in targets):
                      values.append(ast.literal_eval(node.value))
              if len(values) != 1:
                  raise SystemExit(f"SOURCE_SETTING_NOT_UNIQUE={filename}:{name}")
              return values[0]

          if literal_setting("apply_kr_sector_theme_v72.py", "MAX_PAYLOAD_BYTES") != 90000:
              raise SystemExit("KOSPI_SECTOR_STAGE_LIMIT_MISMATCH")
          for filename, setting in (
              ("apply_display_normalization_v74.py", "TARGETS"),
              ("apply_recommendation_icon_v79.py", "TARGETS"),
              ("validate_daily_integrated_health_v731.py", "TABLE_SPECS"),
          ):
              targets = literal_setting(filename, setting)
              kospi_limits = [
                  item.get("max_payload_bytes") for item in targets
                  if item.get("filename") == "kospi_watchlist.json"
              ]
              if kospi_limits != [90000]:
                  raise SystemExit(f"KOSPI_SOURCE_LIMIT_MISMATCH={filename}:{kospi_limits}")
          if literal_setting(
              "validate_daily_integrated_health_v731.py", "EXPECTED_WORKER_BUILD_PREFIX"
          ) != "1.3.9-":
              raise SystemExit("DAILY_HEALTH_WORKER_BUILD_MISMATCH")

          print("REPOSITORY_CONTRACT_CHECK=PASS")
          print("WORKFLOW_COUNT=9")
          print("API_SYNC_OK=true")
          print("OFFICIAL_FRESH_NOW=true")
          print("SAFE_TO_ANALYZE_AS_LATEST=true")
          print("API_VALIDATION=PASS")
          print("BUILD_ID=" + next(iter(build_ids)))
          print("RULES_VERSION=" + next(iter(rule_versions)))
          print("ACTION_OPERATION_ID_COUNT=30")
          print("SINGLE_ACTION_DOMAIN=PASS")
          print("RAW_GITHUB_ACTION_PRESENT=false")
          print("HOLDINGS_EXACT_TICKER_CONTRACT=PASS")
          print("SEPARATE_LIVE_PRICE_SCHEMA_ACTIVE=false")
          print("VALIDATOR_CHECK_ONLY_MODE=PASS")
          print("CUSTOM_GPT_INSTRUCTIONS_VERSION=2026-07-18-v6.8.3-single-recommendation-icon")
          print("REQUEST_TIME_FINAL_DISPLAY_CONTRACT=PASS")
          print("SINGLE_RECOMMENDATION_ICON_CONTRACT=PASS")
          print("US_PRODUCTION_NO_LEGACY_PATCHER=PASS")
          print("US_PRODUCTION_UNIFIED_ACTION_CONTRACT=PASS")
          print("WORKER_SOURCE_BUILD=1.3.9-kospi-action-compact-v2")
          print("KOSPI_SOURCE_BUILD_STAGES_LIMIT_90000=PASS")
          print("DAILY_HEALTH_WORKER_CONTRACT=PASS")
          print("WORKER_KOSPI_COMPACT_TRANSFORM_VERSION=1.2")
          print("WORKER_COMPACT_TABLE_PATH_COUNT=10")
          print("WORKER_KOSPI_ACTION_RESPONSE_PROFILE=KOSPI_ACTION_V2")
          print("WORKER_KOSPI_ACTION_MAX_BYTES=30000")
          print("WORKER_KOSPI_STATIC_POSITION_OMITTED=true")
          print("WORKER_GITHUB_FETCH_ERROR_FALLBACK=true")
          print("WORKER_TABLE_RESPONSE_COMPACT_CONTRACT=PASS")
          print("WORKER_SOURCE_CONTRACT=PASS")
          PY

          node worker/validate_worker.mjs .
          echo "WORKER_REGRESSION_VALIDATION=PASS"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Read-only audit changed the worktree."
            git status --short
            exit 1
          fi

          echo "READ_ONLY_NO_REPOSITORY_CHANGES=PASS"
          echo "SAFE_REPOSITORY_AUDIT=PASS"
