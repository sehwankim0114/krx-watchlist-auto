name: Update Custom GPT instructions to V8.7 sector RS

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/update-custom-gpt-instructions-v870.yml

permissions:
  contents: write

concurrency:
  group: update-custom-gpt-instructions-v870
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch only the canonical Custom GPT instructions
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json

          path = Path("docs/custom_gpt_instructions.md")
          text = path.read_text(encoding="utf-8")
          original = text

          replacements = [
              (
                  "버전: 2026-09-11-v6.9.1-metric-glossary-footer",
                  "버전: 2026-09-15-v6.9.2-v870-sector-rs-production",
              ),
              (
                  "13. V8.5.3 새 코피표·연속하락표 — 이 절 우선",
                  "13. V8.7.0 코피표·연속하락표 계열 — 이 절 우선",
              ),
              (
                  "형식 버전: 2026-09-04-v8.5.3-two-table-layout-release. 독립 스윙분석표는 보류, 두 표 내부 큰 스윙 항목은 포함한다.",
                  "형식 버전: 2026-09-12-v8.7.0-sector-rs-production-release. 독립 스윙분석표는 보류, 표 내부 큰 스윙 항목은 포함한다. V8.7 production은 공식 KRX 업종지수 기반 업종 RS 1M/3M을 제공한다.",
              ),
              (
                  "19항목 2열 통합 표시",
                  "V8.7 묶음열 2열 통합 표시",
              ),
              (
                  "rows/columns의 원천 19항목은 모두 쓰되 채팅에는 아래 2열 본표 1개만 만든다.",
                  "현재 V8.7 production의 rows/columns는 15개 묶음열(V2: rs_sector_pp 포함)을 사용한다. 각 묶음열의 세부항목을 빠뜨리지 말고 채팅에는 아래 2열 본표 1개만 만든다. manifest가 업종 RS 제공을 선언한 상태에서 14열 V1이 오면 업종 RS를 자료 미제공으로 바꾸지 말고 계약 불일치로 중단한다.",
              ),
              (
                  "⑤ 판단·시장: KOSPI 대비 1M/3M RS·추적손절 참고·투자종합점수/진입·반등판단·시장/티커·sector_theme/업종강도.",
                  "⑤ 판단·시장: KOSPI 대비 1M/3M RS·공식 KRX 업종지수 대비 업종 RS 1M/3M·추적손절 참고·투자종합점수/진입·반등판단·시장/티커·sector_theme.",
              ),
              (
                  "returns=[1M%,3M%], rs_kospi_pp=[1M,3M]는 KOSPI 대비 %p, 업종RS 아님.",
                  "returns=[1M%,3M%]. rs_kospi_pp=[1M,3M]는 KOSPI 대비 상대수익률 차이(%p). rs_sector_pp=[1M,3M]는 같은 기간 공식 KRX 업종지수 대비 상대수익률 차이(%p)이며 KOSPI RS와 별개다. 양수면 해당 업종지수보다 강했고 음수면 약했다는 뜻이다.",
              ),
              (
                  "sector_theme은 확인된 업종/테마명이며 이름만으로 업종 강도를 추정하지 않는다.",
                  "sector_theme은 확인된 업종/테마명이다. 업종 강도는 이름으로 추정하지 않고 rs_sector_pp가 제공한 공식 KRX 업종지수 대비 1M/3M %p만 사용한다.",
              ),
              (
                  "투자종합점수100·실적전망변화·업종RS·확정 스윙저점 추적손절은 자료 미제공. 구형 점수를 환산/잘라내기/임의 점수로 채우지 않는다. 해당 열은 유지하고 사유를 짧게 쓴다.",
                  "투자종합점수100·실적전망변화·확정 스윙저점 추적손절은 자료 미제공. 업종RS는 V8.7의 rs_sector_pp가 제공하는 공식 KRX 업종지수 대비 1M/3M 상대수익률 차이(%p)를 사용하며 임의 추정하지 않는다. 구형 점수를 환산/잘라내기/임의 점수로 채우지 않는다. 미제공 항목은 유지하고 사유를 짧게 쓴다.",
              ),
              (
                  "상단에 형식버전·source_build_id·공식 기준일·페이지/전체행수·현재가 성공/실패, 각주에 미완성 지표를 고지한다.",
                  "상단에 형식버전·source_build_id·공식 기준일·페이지/전체행수·현재가 성공/실패를 표시한다. 각주에는 미완성 3항목(투자종합점수100·실적전망변화·확정 스윙저점 추적손절)을 고지하고, metric_glossary_footer가 있으면 업종RS 설명을 포함한 원문을 정확히 1회 사용한다.",
              ),
              (
                  "최종 검사: 정확한 Action·전체행·빌드/규칙/최신성·현재가10→5→2·위치재계산·통합본표2셀·헤더 종목별 통합분석|빈칸·파이프3개·데이터행2셀·둘째셀 ①~⑤ 라벨·원천19항목 반영·굵은 가격범위·추천 첫열1개·개인정보 비저장·우회 없음. 양식 연결과 모든 지표 완성/실제 GPT 출력 검증은 별개다.",
                  "최종 검사: 정확한 Action·전체행·빌드/규칙/최신성·현재가10→5→2·위치재계산·통합본표2셀·헤더 종목별 통합분석|빈칸·파이프3개·데이터행2셀·둘째셀 ①~⑤ 라벨·V8.7 15개 묶음열과 rs_sector_pp 반영·굵은 가격범위·추천 첫열1개·개인정보 비저장·우회 없음. 양식 연결과 실제 GPT 출력 검증은 별개다.",
              ),
          ]

          for old, new in replacements:
              if old in text:
                  text = text.replace(old, new, 1)
              elif new not in text:
                  raise SystemExit(f"PATCH_TARGET_NOT_FOUND: {old[:80]}")

          required = [
              "버전: 2026-09-15-v6.9.2-v870-sector-rs-production",
              "13. V8.7.0 코피표·연속하락표 계열 — 이 절 우선",
              "2026-09-12-v8.7.0-sector-rs-production-release",
              "rs_sector_pp=[1M,3M]",
              "공식 KRX 업종지수 대비 1M/3M 상대수익률 차이(%p)",
              "미완성 3항목",
              "V8.7 15개 묶음열과 rs_sector_pp 반영",
          ]
          for needle in required:
              if needle not in text:
                  raise SystemExit(f"REQUIRED_TEXT_MISSING: {needle}")

          forbidden = [
              "투자종합점수100·실적전망변화·업종RS·확정 스윙저점 추적손절은 자료 미제공",
              "원천19항목 반영",
              "19항목 2열 통합 표시",
          ]
          for needle in forbidden:
              if needle in text:
                  raise SystemExit(f"STALE_V853_TEXT_REMAINS: {needle}")

          if text == original:
              raise SystemExit("NO_INSTRUCTION_CHANGE_PRODUCED")

          path.write_text(text, encoding="utf-8")
          print("GPT_INSTRUCTIONS_V870_PATCH=PASS")
          PY

      - name: Validate schema, API and V8.7 instruction contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import json
          import yaml

          schema_path = Path("docs/custom_gpt_action_schema.yaml")
          schema = yaml.safe_load(schema_path.read_text(encoding="utf-8"))
          assert schema["openapi"] == "3.1.0"
          assert str(schema["info"]["version"]) == "7.1.2"
          route = schema["paths"]["/tables/v1/{table}"]["get"]
          assert route["operationId"] == "getKospiWatchlist"

          params = {p["name"]: p for p in route["parameters"]}
          assert params["table"]["schema"]["enum"] == ["kospi", "decliners", "decliners24"]
          assert "mode" not in params  # GPT must not request preview mode.

          two = schema["components"]["schemas"]["TwoTablePage"]
          rows = two["properties"]["rows"]["items"]
          assert rows["minItems"] == 14 and rows["maxItems"] == 15
          assert two["properties"]["transport"]["properties"]["mode"]["enum"] == ["production"]

          status = json.loads(Path("api/status.json").read_text(encoding="utf-8"))
          manifest = json.loads(Path("api/two_table_v1/manifest.json").read_text(encoding="utf-8"))
          report = json.loads(Path("api/validation_report.json").read_text(encoding="utf-8"))

          assert status["status"] == "READY"
          assert status["api_sync_ok"] is True
          assert status["official_fresh_now"] is True
          assert status["safe_to_analyze_as_latest"] is True
          assert report["status"] == "PASS"

          assert manifest["release_stage"] == "PRODUCTION"
          assert manifest["production_activation_allowed"] is True
          assert manifest["custom_gpt_route_enabled"] is True
          assert manifest["safe_to_analyze_as_latest"] is True
          assert manifest["display_contract"]["rs_sector"] == "AVAILABLE_OFFICIAL_KRX_INDUSTRY_INDEX_1M_3M_PERCENTAGE_POINTS"
          assert manifest["sector_rs_source"]["rs_values_ready"] == manifest["sector_rs_source"]["rs_values_expected"]
          assert set(manifest["explicit_missing"]) == {
              "investment_score_100",
              "earnings_outlook_change",
              "confirmed_swing_low_stop",
          }

          instructions = Path("docs/custom_gpt_instructions.md").read_text(encoding="utf-8")
          assert "rs_sector_pp=[1M,3M]" in instructions
          assert "업종RS·확정 스윙저점 추적손절은 자료 미제공" not in instructions
          assert "구형 API·CSV·preview 모드 대체 금지" in instructions

          print("ACTION_SCHEMA_7_1_2_PRESERVED=PASS")
          print("V870_PRODUCTION_API_CONTRACT=PASS")
          print("SECTOR_RS_INSTRUCTION_ALIGNMENT=PASS")
          PY

      - name: Commit and push canonical instruction update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add docs/custom_gpt_instructions.md

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          if git diff --cached --quiet; then
            echo "::error::Expected instruction change was not produced."
            exit 1
          fi

          changed="$(git diff --cached --name-only)"
          if [ "$changed" != "docs/custom_gpt_instructions.md" ]; then
            echo "::error::Unexpected files staged: $changed"
            exit 1
          fi

          git commit -m "Align Custom GPT instructions with V8.7 sector RS"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "GPT_INSTRUCTIONS_UPDATE_SHA=$(git rev-parse HEAD)"
          echo "GPT_INSTRUCTIONS_UPDATE_PUSH=true"
