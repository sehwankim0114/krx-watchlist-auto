name: V74 Apply Display Normalization

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v74-apply-display-normalization
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "lxml>=5.0"

      - name: Check required files
        run: |
          set -euo pipefail
          test -f apply_display_normalization_v74.py
          test -f patch_display_normalization_v74.py
          test -f apply_kr_sector_theme_v72.py
          test -f build_api_json.py
          test -f validate_api_sync.py
          test -f docs/stock_table_rules_latest.md
          echo "V74_PREREQUISITES=OK"

      - name: Apply V7.4 patch
        run: |
          set -euo pipefail
          python patch_display_normalization_v74.py
          python -m py_compile \
            apply_display_normalization_v74.py \
            patch_display_normalization_v74.py \
            build_api_json.py
          echo "V74_PATCH=OK"

      - name: Build all API JSON
        run: |
          set -euo pipefail
          python build_api_json.py

      - name: Validate synchronized API
        run: |
          set -euo pipefail
          python validate_api_sync.py --api-dir api

      - name: Verify V7.4 display normalization
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          expected = {
              "kospi_watchlist.json": (30, 70000),
              "kosdaq_watchlist.json": (10, 50000),
              "us_watchlist.json": (30, 110000),
          }

          duplicate_pattern = re.compile(
              r"(?i)(CB,CB발행|BW,BW발행|EB,EB발행)"
          )

          for filename, (exact_rows, max_bytes) in expected.items():
              path = Path("api") / filename
              payload = json.loads(path.read_text(encoding="utf-8"))
              rows = payload.get("rows")
              if not isinstance(rows, list) or len(rows) != exact_rows:
                  raise SystemExit(f"{filename}: row mismatch")

              if payload.get("display_contract_version") != (
                  "2026-07-09-v7.4-display-normalization"
              ):
                  raise SystemExit(f"{filename}: contract mismatch")

              contract = payload.get("output_contract") or {}
              if contract.get("show_rank_numbers_default") is not False:
                  raise SystemExit(f"{filename}: rank display policy")
              if contract.get("rank_field_use") != "sorting_only":
                  raise SystemExit(f"{filename}: rank use policy")
              if contract.get("supply_burden_display_field") != (
                  "supply_burden_display"
              ):
                  raise SystemExit(f"{filename}: supply display policy")

              size = path.stat().st_size
              if size > max_bytes:
                  raise SystemExit(
                      f"{filename}: payload {size} > {max_bytes}"
                  )

              for index, row in enumerate(rows, start=1):
                  display = row.get("recommendation_display")
                  if not isinstance(display, str):
                      raise SystemExit(
                          f"{filename} row {index}: display missing"
                      )
                  if re.match(r"^\s*\d+\.", display):
                      raise SystemExit(
                          f"{filename} row {index}: rank prefix"
                      )
                  supply_display = row.get("supply_burden_display")
                  if not isinstance(supply_display, str):
                      raise SystemExit(
                          f"{filename} row {index}: supply display missing"
                      )
                  keywords = row.get("supply_burden_keywords") or ""
                  if duplicate_pattern.search(str(keywords)):
                      raise SystemExit(
                          f"{filename} row {index}: duplicate alias"
                      )

          kosdaq = json.loads(
              Path("api/kosdaq_watchlist.json").read_text(
                  encoding="utf-8"
              )
          )
          rows_by_code = {
              str(row.get("code")): row
              for row in kosdaq.get("rows") or []
          }
          dd = rows_by_code.get("347850")
          park = rows_by_code.get("140860")
          if dd and "CB발행" in str(dd.get("supply_burden_keywords")):
              raise SystemExit("D&D CB alias remains")
          if park and "BW발행" in str(park.get("supply_burden_keywords")):
              raise SystemExit("Park BW alias remains")

          status = json.loads(
              Path("api/status.json").read_text(encoding="utf-8")
          )
          if status.get("rules_version") != (
              "2026-07-09-v7.4-display-normalization"
          ):
              raise SystemExit("status rules version mismatch")
          display_status = status.get("display_normalization") or {}
          if display_status.get("status") != "OK":
              raise SystemExit("status display normalization missing")

          rules = Path(
              "docs/stock_table_rules_latest.md"
          ).read_text(encoding="utf-8")
          for token in (
              "DISPLAY_NORMALIZATION_V74",
              "supply_burden_display",
              "자동 번호를 붙이지 않는다",
          ):
              if token not in rules:
                  raise SystemExit(f"rules token missing: {token}")

          report = json.loads(
              Path("api/validation_report.json").read_text(
                  encoding="utf-8"
              )
          )
          if report.get("status") != "PASS":
              raise SystemExit(
                  f"validation report={report.get('status')}"
              )

          print("DISPLAY_NORMALIZATION_V74=PASS")
          print("RANK_NUMBERS_DEFAULT=OFF")
          print("SUPPLY_ALIAS_DEDUP=PASS")
          print("RECOMMENDATION_DISPLAY=PASS")
          print("KOSPI_ROWS=30")
          print("KOSDAQ_ROWS=10")
          print("US_ROWS=30")
          print("PAYLOAD_LIMITS=PASS")
          PY

      - name: Run V7.3.1 health regression
        run: |
          set -euo pipefail
          if test -f validate_daily_integrated_health_v731.py; then
            python validate_daily_integrated_health_v731.py \
              --repo-root . \
              --worker-base \
                https://krx-live-price-ksh.diaconos.workers.dev \
              --output-json \
                latest/daily_integrated_health_latest.json \
              --output-md \
                latest/daily_integrated_health_latest.md \
              --exit-zero

            python - <<'PY'
            import json
            from pathlib import Path

            report = json.loads(
                Path(
                    "latest/daily_integrated_health_latest.json"
                ).read_text(encoding="utf-8")
            )
            if report.get("critical_count") != 0:
                raise SystemExit(
                    f"health critical={report.get('critical_count')}"
                )
            print(
                "V731_HEALTH_REGRESSION="
                f"{report.get('status')}"
            )
            PY
          else
            echo "V731_HEALTH_REGRESSION=SKIPPED_FILE_NOT_FOUND"
          fi

      - name: Commit and push
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            apply_display_normalization_v74.py \
            patch_display_normalization_v74.py \
            build_api_json.py \
            docs/stock_table_rules_latest.md \
            api \
            latest/daily_integrated_health_latest.json \
            latest/daily_integrated_health_latest.md

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            exit 0
          fi

          git commit -m \
            "Normalize recommendation and supply displays v7.4"

          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then
              echo "PUSH_SUCCESS=true"
              exit 0
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "PUSH_SUCCESS=false"
              exit 1
            fi
            sleep 3
          done
