name: V75 Restore Activity And Elasticity

on:
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: v75-restore-activity-elasticity
  cancel-in-progress: false

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install requirements
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install "lxml>=5.0"

      - name: Check required files
        run: |
          set -euo pipefail
          test -f patch_activity_elasticity_v75.py
          test -f build_lightweight_watchlist_api_v66.py
          test -f build_stock_reference_api.py
          test -f build_api_json.py
          test -f validate_api_sync.py
          test -f validate_daily_integrated_health_v731.py
          test -f docs/stock_table_rules_latest.md
          echo "V75_PREREQUISITES=OK"

      - name: Apply V7.5 patch and self-test
        run: |
          set -euo pipefail
          python patch_activity_elasticity_v75.py --self-test
          python -m py_compile \
            patch_activity_elasticity_v75.py \
            build_lightweight_watchlist_api_v66.py \
            build_stock_reference_api.py \
            validate_daily_integrated_health_v731.py
          echo "V75_PATCH_AND_SELF_TEST=OK"

      - name: Build all API JSON
        run: |
          set -euo pipefail
          python build_api_json.py

      - name: Validate synchronized API
        run: |
          set -euo pipefail
          python validate_api_sync.py --api-dir api

      - name: Verify restored labels
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          def activity(value):
              value = abs(float(value))
              if value >= 100_000_000_000:
                  return "매우활발"
              if value >= 30_000_000_000:
                  return "활발"
              if value >= 5_000_000_000:
                  return "보통"
              if value >= 1_000_000_000:
                  return "부족"
              return "매우부족"

          def elasticity(value):
              value = abs(float(value))
              if value >= 5.0:
                  return "탄력 불안정"
              if value >= 3.0:
                  return "탄력 높음"
              if value >= 1.5:
                  return "탄력 보통"
              return "탄력 낮음"

          specs = {
              "kospi_watchlist.json": (30, 70000),
              "kosdaq_watchlist.json": (10, 50000),
          }

          for filename, (expected_rows, limit) in specs.items():
              path = Path("api") / filename
              payload = json.loads(path.read_text(encoding="utf-8"))
              rows = payload.get("rows") or []

              if len(rows) != expected_rows:
                  raise SystemExit(
                      f"{filename}: rows={len(rows)}"
                  )
              if path.stat().st_size > limit:
                  raise SystemExit(
                      f"{filename}: {path.stat().st_size}>{limit}"
                  )

              policy = payload.get("activity_elasticity_policy") or {}
              if policy.get("version") != (
                  "2026-07-09-v7.5-activity-elasticity"
              ):
                  raise SystemExit(
                      f"{filename}: policy missing"
                  )

              for index, row in enumerate(rows, start=1):
                  actual_activity = row.get("trading_activity")
                  expected_activity = activity(
                      row["avg_trading_value_krw"]
                  )
                  if actual_activity != expected_activity:
                      raise SystemExit(
                          f"{filename} row {index}: "
                          f"activity {actual_activity}!="
                          f"{expected_activity}"
                      )

                  actual_elasticity = row.get("price_elasticity")
                  expected_elasticity = elasticity(
                      row["price_elasticity_pct"]
                  )
                  if actual_elasticity != expected_elasticity:
                      raise SystemExit(
                          f"{filename} row {index}: "
                          f"elasticity {actual_elasticity}!="
                          f"{expected_elasticity}"
                      )

              print(
                  f"{filename}="
                  f"{len(rows)}:"
                  "ACTIVITY_ELASTICITY_PASS"
              )

          kosdaq = json.loads(
              Path("api/kosdaq_watchlist.json").read_text(
                  encoding="utf-8"
              )
          )
          by_code = {
              str(row.get("code")): row
              for row in kosdaq.get("rows") or []
          }

          expected_samples = {
              "196170": ("매우활발", "탄력 높음"),
              "028300": ("활발", "탄력 높음"),
              "096530": ("보통", "탄력 보통"),
              "347850": ("매우활발", "탄력 불안정"),
          }
          for code, expected in expected_samples.items():
              row = by_code.get(code)
              if row is None:
                  continue
              actual = (
                  row.get("trading_activity"),
                  row.get("price_elasticity"),
              )
              if actual != expected:
                  raise SystemExit(
                      f"sample {code}: {actual}!={expected}"
                  )

          status = json.loads(
              Path("api/status.json").read_text(encoding="utf-8")
          )
          if status.get("rules_version") != (
              "2026-07-09-v7.5-activity-elasticity"
          ):
              raise SystemExit(
                  f"rules={status.get('rules_version')}"
              )

          print("ACTIVITY_ELASTICITY_V75=PASS")
          print("KOSPI_ACTIVITY_COVERAGE=30/30")
          print("KOSPI_ELASTICITY_COVERAGE=30/30")
          print("KOSDAQ_ACTIVITY_COVERAGE=10/10")
          print("KOSDAQ_ELASTICITY_COVERAGE=10/10")
          print("PAYLOAD_LIMITS=PASS")
          PY

      - name: Run updated daily health regression
        run: |
          set -euo pipefail
          python validate_daily_integrated_health_v731.py \
            --repo-root . \
            --worker-base \
              https://krx-live-price-ksh.diaconos.workers.dev \
            --output-json \
              latest/daily_integrated_health_latest.json \
            --output-md \
              latest/daily_integrated_health_latest.md \
            --exit-zero

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path(
                  "latest/daily_integrated_health_latest.json"
              ).read_text(encoding="utf-8")
          )
          if report.get("critical_count") != 0:
              raise SystemExit(
                  f"critical={report.get('critical_count')}"
              )

          ids = {
              item.get("check_id"): item.get("status")
              for item in report.get("checks") or []
          }
          required = {
              "kospi_watchlist_trading_activity",
              "kospi_watchlist_price_elasticity",
              "kosdaq_watchlist_trading_activity",
              "kosdaq_watchlist_price_elasticity",
          }
          bad = {
              key: ids.get(key)
              for key in required
              if ids.get(key) != "PASS"
          }
          if bad:
              raise SystemExit(f"health activity checks={bad}")

          print(
              "V75_HEALTH_REGRESSION="
              f"{report.get('status')}"
          )
          print("ACTIVITY_HEALTH_CHECKS=PASS")
          PY

      - name: Commit clean worktree and push
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m \
              "Restore compact activity and elasticity labels v7.5"
          else
            echo "NO_CHANGES_TO_COMMIT=true"
          fi

          echo "WORKTREE_AFTER_COMMIT_BEGIN"
          git status --porcelain
          echo "WORKTREE_AFTER_COMMIT_END"

          if test -n "$(git status --porcelain)"; then
            echo "UNCOMMITTED_CHANGES_REMAIN=true"
            exit 1
          fi

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
          echo "PUSH_SUCCESS=true"
