name: V79 Recommendation Icon Integrity

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v79-recommendation-icon-integrity
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check V7.9 files
        run: |
          set -euo pipefail
          test -f apply_recommendation_icon_v79.py
          test -f validate_recommendation_icon_v79.py
          test -f patch_recommendation_icon_v79.py
          test -f build_api_json.py
          test -f docs/stock_table_rules_latest.md
          echo "V79_PREREQUISITES=OK"

      - name: Install V7.9
        run: |
          set -euo pipefail
          python patch_recommendation_icon_v79.py
          python -m py_compile \
            apply_recommendation_icon_v79.py \
            validate_recommendation_icon_v79.py \
            patch_recommendation_icon_v79.py \
            build_api_json.py
          if [ -f validate_daily_integrated_health_v731.py ]; then
            python -m py_compile \
              validate_daily_integrated_health_v731.py
          fi
          echo "V79_INSTALL=OK"

      - name: Run V7.9 self-test
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import tempfile
          from pathlib import Path

          from apply_recommendation_icon_v79 import (
              apply_recommendation_icon_v79,
          )

          base = [
              {
                  "name": "핵심",
                  "recommendation_display": "✅ 핵심",
                  "operating_loss": False,
                  "supply_burden": False,
              },
              {
                  "name": "누락",
                  "recommendation_display": "_ 누락",
                  "operating_loss": False,
                  "supply_burden": True,
              },
              {
                  "name": "적자수급",
                  "recommendation_display": "-_ 적자수급",
                  "operating_loss": True,
                  "supply_burden": True,
              },
              {
                  "name": "주의",
                  "recommendation_display": "⚠️ 주의",
                  "operating_loss": False,
                  "supply_burden": False,
              },
              {
                  "name": "약세",
                  "recommendation_display": "🔻 약세",
                  "operating_loss": False,
                  "supply_burden": False,
              },
          ]

          with tempfile.TemporaryDirectory() as tmp:
              root = Path(tmp)
              api = root / "api"
              api.mkdir()

              for filename, count in (
                  ("kospi_watchlist.json", 30),
                  ("kosdaq_watchlist.json", 10),
                  ("us_watchlist.json", 30),
              ):
                  rows = []
                  for index in range(count):
                      row = dict(base[index % len(base)])
                      row["name"] = f"{row['name']}-{index + 1}"
                      rows.append(row)
                  (api / filename).write_text(
                      json.dumps(
                          {
                              "columns": list(rows[0]),
                              "rows": rows,
                          },
                          ensure_ascii=False,
                      ),
                      encoding="utf-8",
                  )

              for filename in (
                  "status.json",
                  "manifest.json",
                  "validation_report.json",
                  "stock_table_rules.json",
              ):
                  (api / filename).write_text(
                      "{}",
                      encoding="utf-8",
                  )

              result = apply_recommendation_icon_v79(root)
              payload = json.loads(
                  (api / "kosdaq_watchlist.json").read_text(
                      encoding="utf-8"
                  )
              )
              rows = payload["rows"]
              assert rows[0]["recommendation_display"].startswith(
                  "✅ "
              )
              assert rows[1]["recommendation_display"].startswith(
                  "🟡_ "
              )
              assert rows[2]["recommendation_display"].startswith(
                  "-🟡_ "
              )
              assert rows[3]["recommendation_display"].startswith(
                  "⚠️ "
              )
              assert rows[4]["recommendation_display"].startswith(
                  "🔻 "
              )
              assert result["status"] == "PASS"
              assert result["rows_checked"] == 70
              assert result["error_count"] == 0

          print("V79_SELF_TEST=PASS")
          print("MISSING_ICON_TO_YELLOW=PASS")
          print("LOSS_SUPPLY_ORDER=PASS")
          print("EXISTING_ICONS_PRESERVED=PASS")
          PY

      - name: Build synchronized API with V7.9
        run: |
          set -euo pipefail
          python build_api_json.py | tee /tmp/build_api_v79.txt
          grep -q "RECOMMENDATION_ICON_V79=PASS" \
            /tmp/build_api_v79.txt

      - name: Validate API synchronization
        run: |
          set -euo pipefail
          python validate_api_sync.py --api-dir api

      - name: Validate V7.9 actual API
        run: |
          set -euo pipefail
          python validate_recommendation_icon_v79.py \
            --api-dir api \
            --write-report \
            | tee /tmp/validate_recommendation_icon_v79.txt
          grep -q \
            "RECOMMENDATION_ICON_VALIDATION_V79=PASS" \
            /tmp/validate_recommendation_icon_v79.txt

      - name: Verify compact watchlist icons
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          icons = ("✅", "🟡", "⚠️", "🔻", "⚪")
          pattern = re.compile(
              r"^-?(?:✅|🟡|⚠️|🔻|⚪)_?\s+\S"
          )
          total = 0
          counts = {icon: 0 for icon in icons}

          for filename in (
              "kospi_watchlist.json",
              "kosdaq_watchlist.json",
              "us_watchlist.json",
          ):
              payload = json.loads(
                  (Path("api") / filename).read_text(
                      encoding="utf-8"
                  )
              )
              for row in payload.get("rows") or []:
                  display = str(
                      row.get("recommendation_display") or ""
                  )
                  if not pattern.search(display):
                      raise SystemExit(
                          f"{filename}: invalid display: {display}"
                      )
                  found = [
                      icon for icon in icons if icon in display
                  ]
                  if len(found) != 1:
                      raise SystemExit(
                          f"{filename}: icon count invalid: {display}"
                      )
                  counts[found[0]] += 1
                  total += 1

          if total != 70:
              raise SystemExit(
                  f"Expected 70 compact rows, got {total}"
              )
          print("V79_ACTUAL_WATCHLIST_CHECK=PASS")
          print(f"CHECKED_ROWS={total}")
          print(f"ICON_COUNTS={counts}")
          PY

      - name: Run local daily health check
        run: |
          set -euo pipefail
          if [ -f validate_daily_integrated_health_v731.py ]; then
            python validate_daily_integrated_health_v731.py \
              --repo-root . \
              --skip-remote \
              --exit-zero
          else
            echo "DAILY_HEALTH=SKIPPED_NOT_FOUND"
          fi

      - name: Commit and push V7.9
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            apply_recommendation_icon_v79.py \
            validate_recommendation_icon_v79.py \
            patch_recommendation_icon_v79.py \
            build_api_json.py \
            validate_daily_integrated_health_v731.py \
            docs \
            api \
            latest

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
          else
            git commit -m \
              "Enforce recommendation icon integrity v7.9"
          fi

          echo "WORKTREE_AFTER_COMMIT_BEGIN"
          git status --porcelain
          echo "WORKTREE_AFTER_COMMIT_END"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != \
               "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
