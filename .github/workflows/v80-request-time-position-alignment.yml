name: V80 Request Time Position Alignment

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v80-request-time-position-alignment
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check V8.0 files
        run: |
          set -euo pipefail
          test -f patch_request_time_position_v80.py
          test -f validate_request_time_position_v80.py
          test -f request_time_explanation_refresher.py
          test -f docs/stock_table_rules_latest.md
          test -f build_api_json.py
          test -f validate_api_sync.py
          echo "V80_PREREQUISITES=OK"

      - name: Apply V8.0 patch
        run: |
          set -euo pipefail
          python patch_request_time_position_v80.py
          python -m py_compile \
            patch_request_time_position_v80.py \
            validate_request_time_position_v80.py \
            request_time_explanation_refresher.py \
            build_api_json.py
          echo "V80_INSTALL=OK"

      - name: Run refresher built-in self-test
        run: |
          set -euo pipefail
          python request_time_explanation_refresher.py \
            --self-test \
            | tee /tmp/v80_self_test.txt
          grep -q "V80_OUT_OF_RANGE_POSITION=PASS" \
            /tmp/v80_self_test.txt
          grep -q "SELF_TEST_STATUS=OK" \
            /tmp/v80_self_test.txt

      - name: Run V8.0 validator
        run: |
          set -euo pipefail
          python validate_request_time_position_v80.py \
            | tee /tmp/v80_validation.txt
          grep -q \
            "REQUEST_TIME_POSITION_VALIDATION_V80=PASS" \
            /tmp/v80_validation.txt

      - name: Write V8.0 policy JSON
        run: |
          set -euo pipefail
          python request_time_explanation_refresher.py \
            --write-policy-json \
            api/request_time_position_policy.json
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("api/request_time_position_policy.json")
          payload = json.loads(path.read_text(encoding="utf-8"))

          assert payload["policy_version"] == (
              "2026-07-14-v8.0-request-time-position-alignment"
          )

          fields = set(payload["refresh_fields"])
          required = {
              "request_time_position_display",
              "request_time_range_break_status",
              "request_time_range_break_pct",
          }
          assert required.issubset(fields)
          print("V80_POLICY_JSON=PASS")
          PY

      - name: Rebuild synchronized API
        run: |
          set -euo pipefail
          python build_api_json.py | tee /tmp/v80_build_api.txt
          grep -q "BUILD_ID=" /tmp/v80_build_api.txt
          echo "V80_API_REBUILD=PASS"

      - name: Validate rebuilt API synchronization
        run: |
          set -euo pipefail
          python validate_api_sync.py --api-dir api \
            | tee /tmp/v80_api_validation.txt
          grep -q "API_VALIDATION_STATUS=PASS" \
            /tmp/v80_api_validation.txt

      - name: Commit and push V8.0
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            patch_request_time_position_v80.py \
            validate_request_time_position_v80.py \
            request_time_explanation_refresher.py \
            docs \
            api \
            latest

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
          else
            git commit -m \
              "Align request-time price position logic v8.0"
          fi

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          if test -n "$(git status --porcelain)"; then
            echo "RESIDUAL_STATUS_BEFORE_AMEND_BEGIN"
            git status --porcelain
            echo "RESIDUAL_STATUS_BEFORE_AMEND_END"

            git add -A \
              patch_request_time_position_v80.py \
              validate_request_time_position_v80.py \
              request_time_explanation_refresher.py \
              docs \
              api \
              latest

            if ! git diff --cached --quiet; then
              git commit --amend --no-edit
            fi
          fi

          echo "WORKTREE_AFTER_COMMIT_BEGIN"
          git status --porcelain
          echo "WORKTREE_AFTER_COMMIT_END"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD)" != \
               "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
