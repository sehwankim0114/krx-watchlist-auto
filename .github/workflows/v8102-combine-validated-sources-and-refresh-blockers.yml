      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              "investment_score_combined_reconciliation_v8102.py",
              "latest/investment_score_v880_dry_run_v8102_latest.csv",
              "latest/investment_score_v880_dry_run_v8102_summary_latest.json",
              "latest/investment_score_v880_dry_run_v8102_run_log_latest.txt",
              "latest/investment_score_remaining_blockers_v8102.csv",
              "latest/investment_score_remaining_blockers_v8102_summary_latest.json",
              "latest/investment_score_remaining_blockers_v8102_run_log_latest.txt",
              "docs/investment_score_v880_dry_run_v8102.md",
              "docs/investment_score_combined_reconciliation_v8102.md",
          }

          for path in allowed:
              if not Path(path).exists():
                  raise SystemExit("EXPECTED_OUTPUT_MISSING=" + path)

          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("CHANGE_SCOPE_UNEXPECTED=" + repr(sorted(unexpected)))
          if not changed:
              raise SystemExit("NO_CHANGES_DETECTED")

          print("CHANGE_SCOPE=PASS")
          print("CHANGED_FILES=" + ",".join(sorted(changed)))
          PY


