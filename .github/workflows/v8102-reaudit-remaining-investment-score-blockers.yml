      - name: Verify protected files unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            config/investment_score_policy_v880.json \
            latest/investment_score_v880_dry_run_v8101_latest.csv \
            latest/investment_score_v880_dry_run_v8101_summary_latest.json \
            latest/investment_score_supply_source_v8101.csv \
            latest/investment_score_supply_source_v8101_summary_latest.json \
            latest/investment_score_remaining_blockers_v896.csv \
            latest/investment_score_remaining_blockers_v896_summary_latest.json \
            > /tmp/v8102_protected.after
          diff -u /tmp/v8102_protected.before /tmp/v8102_protected.after

      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_remaining_blocker_audit_v8102.py",
              "latest/investment_score_remaining_blockers_v8102.csv",
              "latest/investment_score_remaining_blockers_v8102_summary_latest.json",
              "latest/investment_score_remaining_blockers_v8102_run_log_latest.txt",
              "docs/investment_score_remaining_blockers_v8102.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain"], text=True
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit("UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected))
          print("V8102_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse concurrent protected input drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "latest/investment_score_v880_dry_run_v8101_latest.csv",
              "latest/investment_score_v880_dry_run_v8101_summary_latest.json",
              "latest/investment_score_supply_source_v8101.csv",
              "latest/investment_score_supply_source_v8101_summary_latest.json",
              "latest/investment_score_remaining_blockers_v896.csv",
              "latest/investment_score_remaining_blockers_v896_summary_latest.json",
          }
          upstream = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(protected & upstream)
          if dangerous:
              raise SystemExit(
                  "CONCURRENT_PROTECTED_INPUT_DRIFT:" + ",".join(dangerous)
              )
          print("V8102_NO_CONCURRENT_PROTECTED_INPUT_DRIFT=PASS")
          PY

