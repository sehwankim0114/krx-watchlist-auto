      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_missing_source_cache_recovery_audit_v8106.py",
              "latest/investment_score_missing_source_cache_recovery_v8106.csv",
              "latest/investment_score_missing_source_cache_recovery_v8106_summary_latest.json",
              "latest/investment_score_missing_source_cache_recovery_v8106_run_log_latest.txt",
              "docs/investment_score_missing_source_cache_recovery_v8106.md",
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain"], text=True
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected)
              )
          print("V8106_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse concurrent protected input drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_source_enricher_v854.py",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_source_cache_root_causes_v8105.csv",
