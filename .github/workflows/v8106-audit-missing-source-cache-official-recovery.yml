          from pathlib import Path

          s = json.loads(
              Path("latest/investment_score_missing_source_cache_recovery_v8106_summary_latest.json")
              .read_text(encoding="utf-8")
          )
          with Path("latest/investment_score_missing_source_cache_recovery_v8106.csv").open(
