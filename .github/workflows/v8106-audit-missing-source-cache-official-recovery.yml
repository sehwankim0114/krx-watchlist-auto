              "latest/investment_score_da_exact_id_audit_v883.csv",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_source_cache_latest.csv",
          }
          upstream = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(protected & upstream)
          if dangerous:
              raise SystemExit(
                  "CONCURRENT_PROTECTED_INPUT_DRIFT:" + ",".join(dangerous)
              )
          print("V8106_NO_CONCURRENT_PROTECTED_INPUT_DRIFT=PASS")
          PY

