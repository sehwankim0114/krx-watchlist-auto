              for path in (
                  SOURCE_SCRIPT, SOURCE_CACHE, SOURCE_RUN_LOG, FIN,
                  V8112_CSV, V8112_JSON, V8113_JSON,
              ):
                  if not path.is_file():
                      raise RuntimeError("V8114_MISSING_INPUT:" + str(path))

              validate_static_patch_scope()
              evidence = validate_evidence()
              current_universe_regression(evidence)
              print("V8114_NARROW_FINANCIAL_REVENUE_CONTRACT_AUDIT=PASS")


          if __name__ == "__main__":
              main()
          PY

