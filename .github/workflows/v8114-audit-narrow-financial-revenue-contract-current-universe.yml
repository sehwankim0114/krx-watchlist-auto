              "latest/investment_score_v880_dry_run_v8113_summary_latest.json",
          }
          upstream = set(
              subprocess.check_output(
                  ["git","diff","--name-only","HEAD..origin/main"], text=True
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "CONCURRENT_PROTECTED_INPUT_DRIFT:" + ",".join(dangerous)
              )
          print("V8114_NO_CONCURRENT_PROTECTED_INPUT_DRIFT=PASS")
          PY

