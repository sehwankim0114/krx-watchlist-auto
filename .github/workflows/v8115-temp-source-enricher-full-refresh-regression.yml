      - name: Verify production inputs unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum             config/investment_score_policy_v880.json             investment_score_source_enricher_v854.py             investment_score_dry_run_v882.py             latest/investment_score_source_cache_latest.csv             latest/investment_score_source_run_log_latest.txt             latest/financial_valuation_cache_latest.csv             latest/investment_score_narrow_revenue_contract_v8114_summary_latest.json             latest/investment_score_financial_revenue_semantic_v8112.csv             > /tmp/v8115_protected.after

          diff -u /tmp/v8115_protected.before /tmp/v8115_protected.after

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0             | sort -z | xargs -0 sha256sum             > /tmp/v8115_api.after
          diff -u /tmp/v8115_api.before /tmp/v8115_api.after

          echo "V8115_PRODUCTION_INPUTS_UNCHANGED=PASS"

      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_source_enricher_v8115_shadow.py",
              "investment_score_temp_source_refresh_regression_v8115.py",
              "latest/investment_score_temp_source_refresh_v8115.csv",
              "latest/investment_score_temp_source_refresh_v8115_summary_latest.json",
              "latest/investment_score_temp_source_refresh_v8115_run_log_latest.txt",
              "latest/investment_score_temp_source_patch_v8115.json",
              "docs/investment_score_temp_source_refresh_v8115.md",
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git","status","--porcelain"], text=True
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected)
              )
          print("V8115_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse concurrent protected input drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_source_enricher_v854.py",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_narrow_revenue_contract_v8114_summary_latest.json",
              "latest/investment_score_financial_revenue_semantic_v8112.csv",
          }
          upstream = set(
              subprocess.check_output(
                  ["git","diff","--name-only","HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "CONCURRENT_PROTECTED_INPUT_DRIFT:"
                  + ",".join(dangerous)
              )
          print("V8115_NO_CONCURRENT_PROTECTED_INPUT_DRIFT=PASS")
          PY

