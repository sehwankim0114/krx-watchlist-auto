name: Production source refresh and post-apply regression v8.11.8 validation-fix

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8118-production-source-refresh-post-apply-regression.yml"

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 70

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      ORIGINAL_V8118_COMMIT: "0234611dbdd450e154dd88633f92f8be39220462"
      ORIGINAL_V8118_BLOB: "0f78a79df074f9674e422e7feb3d9b61afa31c9b"
      ORIGINAL_V8118_PATH: ".github/workflows/v8118-production-source-refresh-post-apply-regression.yml"

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify failed V8.11.8 lineage and capture protected hashes
        shell: bash
        run: |
          set -euo pipefail

          test -n "${DART_API_KEY:-}" || {
            echo "::error::DART_API_KEY secret is missing"
            exit 1
          }

          git merge-base --is-ancestor "${ORIGINAL_V8118_COMMIT}" HEAD

          actual_blob="$(
            git rev-parse "${ORIGINAL_V8118_COMMIT}:${ORIGINAL_V8118_PATH}"
          )"
          test "${actual_blob}" = "${ORIGINAL_V8118_BLOB}" || {
            echo "::error::V8118 original workflow blob mismatch: ${actual_blob}"
            exit 1
          }

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_source_enricher_v854.py \
            investment_score_dry_run_v882.py \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_source_contract_apply_v8117_summary_latest.json \
            latest/investment_score_financial_revenue_semantic_v8112.csv \
            > /tmp/v8118_fix_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8118_fix_api.before

          echo "V8118_FIX_LINEAGE=PASS"

      - name: Recover original auditor and apply formatting-only fix
        shell: bash
        run: |
          set -euo pipefail

          git show \
            "${ORIGINAL_V8118_COMMIT}:${ORIGINAL_V8118_PATH}" \
            > /tmp/v8118_original_workflow.yml

          python - <<'PY'
          from pathlib import Path

          src = Path("/tmp/v8118_original_workflow.yml").read_text(
              encoding="utf-8"
          )

          marker = (
              "          cat > "
              "investment_score_production_refresh_post_apply_v8118.py "
              "<<'PY'\n"
          )
          end_marker = "\n          PY\n"

          if src.count(marker) != 1:
              raise SystemExit(
                  f"V8118_FIX_START_MARKER_COUNT:{src.count(marker)}"
              )

          start = src.index(marker) + len(marker)
          end = src.index(end_marker, start)
          block = src[start:end]

          lines = block.splitlines()
          if len(lines) < 500:
              raise SystemExit(
                  f"V8118_FIX_EXTRACTED_SCRIPT_TOO_SHORT:{len(lines)}"
              )

          deindented = []
          for line in lines:
              if line.startswith("          "):
                  deindented.append(line[10:])
              elif not line:
                  deindented.append("")
              else:
                  raise SystemExit(
                      "V8118_FIX_UNEXPECTED_INDENT:" + repr(line[:40])
                  )

          script = "\n".join(deindented)

          old = "w = csv.DictWriter(f, fieldnames=fields)"
          new = (
              'w = csv.DictWriter('
              'f, fieldnames=fields, lineterminator="\\n"'
              ')'
          )
          if script.count(old) != 1:
              raise SystemExit(
                  f"V8118_FIX_DICTWRITER_MATCH_COUNT:{script.count(old)}"
              )
          script = script.replace(old, new, 1)

          # Formatting-only fix for the generated Python artifact:
          # exactly one LF at EOF, no blank line at EOF.
          script = script.rstrip() + "\n"

          target = Path(
              "investment_score_production_refresh_post_apply_v8118.py"
          )
          target.write_text(script, encoding="utf-8", newline="\n")

          if not target.read_bytes().endswith(b"\n"):
              raise SystemExit("V8118_FIX_SCRIPT_NO_FINAL_LF")
          if target.read_bytes().endswith(b"\n\n"):
              raise SystemExit("V8118_FIX_SCRIPT_BLANK_LINE_AT_EOF")
          if b'lineterminator="\\n"' not in target.read_bytes():
              raise SystemExit("V8118_FIX_LINETERMINATOR_PATCH_MISSING")

          print("V8118_FORMATTING_FIX_APPLIED=PASS")
          PY

          python -m py_compile \
            investment_score_production_refresh_post_apply_v8118.py

      - name: Run validated production refresh and regression
        shell: bash
        run: |
          set -euo pipefail

          python investment_score_production_refresh_post_apply_v8118.py \
            | tee /tmp/v8118_fix_stdout.txt

          grep -q '^V8118_PRODUCTION_REFRESH_POST_APPLY=PASS$' \
            /tmp/v8118_fix_stdout.txt
          grep -q '^STATUS_OK=true$' \
            latest/investment_score_production_refresh_v8118_run_log_latest.txt
          grep -q '^BLOCKER_REDUCED_BY=12$' \
            latest/investment_score_production_refresh_v8118_run_log_latest.txt
          grep -q '^NON_TARGET_SOURCE_SEMANTIC_DRIFT_COUNT=0$' \
            latest/investment_score_production_refresh_v8118_run_log_latest.txt
          grep -q '^NON_TARGET_SCORE_ROW_CHANGED_COUNT=0$' \
            latest/investment_score_production_refresh_v8118_run_log_latest.txt
          grep -q '^READY_REGRESSION_COUNT=0$' \
            latest/investment_score_production_refresh_v8118_run_log_latest.txt

      - name: Normalize generated audit artifacts only
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          script = Path(
              "investment_score_production_refresh_post_apply_v8118.py"
          )
          script_text = script.read_text(encoding="utf-8")
          script.write_text(
              script_text.rstrip() + "\n",
              encoding="utf-8",
              newline="\n",
          )

          audit_csv = Path(
              "latest/investment_score_production_refresh_v8118.csv"
          )
          data = audit_csv.read_bytes()
          data = data.replace(b"\r\n", b"\n").replace(b"\r", b"\n")
          audit_csv.write_bytes(data)

          if b"\r" in audit_csv.read_bytes():
              raise SystemExit("V8118_FIX_AUDIT_CSV_CR_REMAINS")
          if script.read_bytes().endswith(b"\n\n"):
              raise SystemExit("V8118_FIX_SCRIPT_BLANK_EOF_REMAINS")

          print("V8118_GENERATED_FORMAT_NORMALIZATION=PASS")
          PY

      - name: Validate V8.11.8 outputs and applied source state
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          s = json.loads(
              Path(
                  "latest/investment_score_production_refresh_v8118_summary_latest.json"
              ).read_text(encoding="utf-8")
          )

          assert (
              s["version"]
              == "2026-09-16-v8.11.8-production-source-refresh-post-apply-regression"
          )
          assert (
              s["status"]
              == "PRODUCTION_SOURCE_REFRESH_APPLIED_POST_REGRESSION_PASS"
          )
          assert (
              s["v8117_result_commit"]
              == "c1f45f39bf27cfebb92b843fba3fef57a321efbc"
          )
          assert (
              s["source_contract_version"]
              == "2026-09-16-v8.11.7-five-financial-cis-interest-revenue-contract"
          )

          assert s["baseline_source_rows"] == s["refreshed_source_rows"]
          assert s["baseline_source_rows"] > 0
          assert s["raw_ready_delta"] == 4
          assert s["ready_delta"] == 3
          assert set(s["newly_ready_tickers"]) == {
              "000810","005830","105560"
          }
          assert s["lost_ready_tickers"] == []
          assert s["blocker_occurrences_reduced_by"] == 12
          assert s["non_target_source_semantic_drift_count"] == 0
          assert s["non_target_score_row_changed_count"] == 0

          assert set(s["active_source_target_tickers"]) == {
              "000810","005830","029780","105560"
          }
          assert s["inactive_target_tickers"] == ["138930"]

          card = s["target_score_results"]["029780"]
          assert card["missing_after"] == [
              "수급·공시부담:SUPPLY_LIMITED_NO_POSITIVE_EVIDENCE"
          ]

          h = s["hard_guards"]
          assert h["production_source_code_modified_in_v8118"] is False
          assert h["production_source_cache_modified"] is True
          assert h["production_source_run_log_modified"] is True
          assert h["production_financial_cache_modified"] is False
          assert h["production_api_modified"] is False
          assert h["scoring_policy_modified"] is False
          assert h["non_target_source_semantics_unchanged"] is True
          assert h["non_target_score_rows_unchanged"] is True
          assert h["ready_regression_count"] == 0
          assert h["source_value_imputed"] is False
          assert h["inactive_target_force_inserted"] is False

          with Path(
              "latest/investment_score_source_cache_latest.csv"
          ).open(encoding="utf-8-sig", newline="") as f:
              rows = {r["ticker"]: r for r in csv.DictReader(f)}

          for code in ("000810","005830","029780","105560"):
              assert rows[code]["source_cache_status"] == "READY_RAW_SOURCE"
              assert (
                  rows[code]["source_contract_version"]
                  == "2026-09-16-v8.11.7-five-financial-cis-interest-revenue-contract"
              )
          assert "138930" not in rows

          audit_csv = Path(
              "latest/investment_score_production_refresh_v8118.csv"
          ).read_bytes()
          assert b"\r" not in audit_csv

          script = Path(
              "investment_score_production_refresh_post_apply_v8118.py"
          ).read_bytes()
          assert script.endswith(b"\n")
          assert not script.endswith(b"\n\n")

          print("V8118_FIX_OUTPUT_VALIDATION=PASS")
          PY

      - name: Verify protected non-source production inputs unchanged
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_source_enricher_v854.py \
            investment_score_dry_run_v882.py \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_source_contract_apply_v8117_summary_latest.json \
            latest/investment_score_financial_revenue_semantic_v8112.csv \
            > /tmp/v8118_fix_protected.after

          diff -u \
            /tmp/v8118_fix_protected.before \
            /tmp/v8118_fix_protected.after

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8118_fix_api.after

          diff -u \
            /tmp/v8118_fix_api.before \
            /tmp/v8118_fix_api.after

          echo "V8118_FIX_PROTECTED_NON_SOURCE_INPUTS_UNCHANGED=PASS"

      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_production_refresh_post_apply_v8118.py",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/investment_score_production_refresh_v8118.csv",
              "latest/investment_score_production_refresh_v8118_summary_latest.json",
              "latest/investment_score_production_refresh_v8118_run_log_latest.txt",
              "docs/investment_score_production_refresh_v8118.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  [
                      "git",
                      "status",
                      "--porcelain",
                      "--untracked-files=all",
                  ],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8118_FIX_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )

          required = {
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/investment_score_production_refresh_v8118.csv",
              "latest/investment_score_production_refresh_v8118_summary_latest.json",
          }
          if not required <= changed:
              raise SystemExit(
                  "V8118_FIX_EXPECTED_FILES_NOT_CHANGED:"
                  + ",".join(sorted(required - changed))
              )

          print("V8118_FIX_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse final concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "investment_score_source_enricher_v854.py",
              "investment_score_dry_run_v882.py",
              "config/investment_score_policy_v880.json",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/investment_score_source_contract_apply_v8117_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  ["git","diff","--name-only","HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )

          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8118_FIX_FINAL_CONCURRENT_PROTECTED_DRIFT:"
                  + ",".join(dangerous)
              )

          print("V8118_FIX_FINAL_DRIFT_GUARD=PASS")
          PY

      - name: Commit and push validated production source refresh
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            investment_score_production_refresh_post_apply_v8118.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/investment_score_production_refresh_v8118.csv \
            latest/investment_score_production_refresh_v8118_summary_latest.json \
            latest/investment_score_production_refresh_v8118_run_log_latest.txt \
            docs/investment_score_production_refresh_v8118.md

          git diff --cached --check

          # Explicitly prove the two prior formatting failures are gone.
          python - <<'PY'
          import subprocess

          check = subprocess.run(
              ["git", "diff", "--cached", "--check"],
              text=True,
              stdout=subprocess.PIPE,
              stderr=subprocess.STDOUT,
          )
          if check.returncode != 0:
              raise SystemExit(
                  "V8118_FIX_DIFF_CHECK_FAILED\n" + check.stdout
              )
          print("V8118_FIX_GIT_DIFF_CHECK=PASS")
          PY

          git commit -m \
            "Apply validated production source refresh v8.11.8 formatting fix"

          git pull --rebase origin main
          git push origin HEAD:main
