              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_production_refresh_v8118_summary_latest.json",
          }
          upstream = set(
              subprocess.check_output(
                  ["git","diff","--name-only","HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8119_CONCURRENT_PROTECTED_DRIFT:"
