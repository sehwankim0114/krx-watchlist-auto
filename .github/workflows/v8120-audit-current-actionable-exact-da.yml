name: Audit current actionable exact D&A official recovery v8.12.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8120-audit-current-actionable-exact-da.yml"

permissions:
  contents: write

concurrency:
  group: v8120-current-actionable-exact-da
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V8.11.9 lineage and capture protected hashes
        shell: bash
        run: |
          set -euo pipefail

          test -n "${DART_API_KEY:-}" || {
            echo "::error::DART_API_KEY secret is missing"
            exit 1
          }

          git merge-base --is-ancestor \
            f470876fe7365e9590bcc5f61b88a2131d3322b5 HEAD

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_source_enricher_v854.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_current_blockers_v8119.csv \
            latest/investment_score_current_blockers_v8119_summary_latest.json \
            latest/investment_score_da_current_single_recoverability_v8103_summary_latest.json \
            > /tmp/v8120_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8120_api.before

          echo "V8120_LINEAGE=PASS"

      - name: Create and run V8.12.0 auditor
        shell: bash
        run: |
          cat > investment_score_exact_da_actionable_v8120.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import json
          import os
          import time
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_source_enricher_v854 as src

          VERSION = "2026-09-17-v8.12.0-current-actionable-exact-da-official-recovery-audit"
          V8119_VERSION = "2026-09-17-v8.11.9-post-commit-source-contract-and-current-blocker-reaudit"
          V8119_RESULT_COMMIT = "f470876fe7365e9590bcc5f61b88a2131d3322b5"
          V8103_VERSION = "2026-09-15-v8.10.3-current-single-da-recoverability-audit"
          POLICY_VERSION = "2026-09-13-v8.8.0-explicit-100-point-scoring-contract"

          ROOT = Path(".")
          KST = ZoneInfo("Asia/Seoul")

          BLOCK_CSV = ROOT / "latest/investment_score_current_blockers_v8119.csv"
          BLOCK_JSON = ROOT / "latest/investment_score_current_blockers_v8119_summary_latest.json"
          V8103_JSON = ROOT / "latest/investment_score_da_current_single_recoverability_v8103_summary_latest.json"
          FIN = ROOT / "latest/financial_valuation_cache_latest.csv"

          OUT_CSV = ROOT / "latest/investment_score_exact_da_actionable_v8120.csv"
          OUT_JSON = ROOT / "latest/investment_score_exact_da_actionable_v8120_summary_latest.json"
          OUT_LOG = ROOT / "latest/investment_score_exact_da_actionable_v8120_run_log_latest.txt"
          OUT_DOC = ROOT / "docs/investment_score_exact_da_actionable_v8120.md"

          APPROVED = {
              "ifrs-full_AdjustmentsForDepreciationExpense",
              "ifrs-full_AdjustmentsForAmortisationExpense",
          }

          EXPECTED_ACTIONABLE = {
              "002450",
              "003230",
              "004170",
              "004910",
              "005930",
              "009420",
              "010130",
              "018260",
              "028050",
              "034020",
              "047050",
              "058860",
              "069620",
              "267270",
              "373220",
              "456040",
              "475560",
          }

          EXPECTED_CURRENT_EXHAUSTED_SINGLE = {"012450", "022100"}


          def ticker(value):
              s = "".join(ch for ch in str(value or "") if ch.isdigit())
              return s.zfill(6) if s else ""


          def read_json(path: Path):
              return json.loads(path.read_text(encoding="utf-8-sig"))


          def read_csv(path: Path):
              with path.open(encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))


          def parse_list(value):
              try:
                  data = json.loads(str(value or ""))
              except Exception:
                  return []
              return data if isinstance(data, list) else []


          def number(value):
              try:
                  if value in (None, "", "null", "None"):
                      return None
                  return float(value)
              except Exception:
                  return None


          def exact_stats(candidates):
              grouped = defaultdict(list)
              for item in candidates:
                  aid = str(item.get("account_id") or "").strip()
                  if aid in APPROVED:
                      grouped[aid].append(item)

              out = {}
              for aid in sorted(APPROVED):
                  rows = grouped.get(aid, [])
                  nums = [
                      number(r.get("amount"))
                      for r in rows
                      if number(r.get("amount")) is not None
                  ]
                  out[aid] = {
                      "occurrence_count": len(rows),
                      "unique_numeric_values": sorted(set(nums)),
                      "account_names": sorted({
                          str(r.get("account_nm") or "").strip()
                          for r in rows
                          if str(r.get("account_nm") or "").strip()
                      }),
                  }
              return out


          def classify(stats):
              present = {
                  aid for aid, x in stats.items()
                  if x["occurrence_count"] > 0
              }
              unique = {
                  aid for aid, x in stats.items()
                  if len(x["unique_numeric_values"]) == 1
              }
              conflict = {
                  aid for aid, x in stats.items()
                  if len(x["unique_numeric_values"]) > 1
              }

              if conflict:
                  return "APPROVED_EXACT_VALUE_CONFLICT"
              if present == APPROVED and unique == APPROVED:
                  return "BOTH_APPROVED_EXACT_UNIQUE_NUMERIC"
              if present and unique == present:
                  return "PARTIAL_APPROVED_EXACT_UNIQUE_NUMERIC"
              if present:
                  return "APPROVED_EXACT_PRESENT_NONUNIQUE_OR_NONNUMERIC"
              return "NO_APPROVED_EXACT"


          def recovery_lane(classification, deep_status):
              if deep_status != "OK":
                  return "OFFICIAL_QUERY_INCOMPLETE"
              if classification == "BOTH_APPROVED_EXACT_UNIQUE_NUMERIC":
                  return "RECOVERABLE_BOTH_EXACT_SHADOW_CANDIDATE"
              if classification == "PARTIAL_APPROVED_EXACT_UNIQUE_NUMERIC":
                  return "PARTIAL_ONLY_DO_NOT_PROMOTE"
              if classification == "APPROVED_EXACT_VALUE_CONFLICT":
                  return "CONFLICT_FAIL_CLOSED"
              if classification == "APPROVED_EXACT_PRESENT_NONUNIQUE_OR_NONNUMERIC":
                  return "NONUNIQUE_OR_NONNUMERIC_FAIL_CLOSED"
              return "NO_APPROVED_EXACT_CURRENT_OFFICIAL_PATH"


          def main():
              api_key = os.environ.get("DART_API_KEY", "").strip()
              if not api_key:
                  raise RuntimeError("V8120_DART_API_KEY_MISSING")

              for path in (BLOCK_CSV, BLOCK_JSON, V8103_JSON, FIN):
                  if not path.is_file():
                      raise RuntimeError("V8120_MISSING_INPUT:" + str(path))

              s8119 = read_json(BLOCK_JSON)
              if s8119.get("version") != V8119_VERSION:
                  raise RuntimeError("V8120_V8119_VERSION_MISMATCH")
              if s8119.get("status") != "AUDIT_ONLY":
                  raise RuntimeError("V8120_V8119_STATUS_MISMATCH")
              if s8119.get("policy_version") != POLICY_VERSION:
                  raise RuntimeError("V8120_POLICY_VERSION_MISMATCH")
              if s8119.get("next_actionable_source_group") != "EXACT_DA_SOURCE":
                  raise RuntimeError("V8120_NEXT_GROUP_NOT_EXACT_DA")
              if s8119.get("next_actionable_selection_reason") != "HIGHEST_ACTIONABLE_SINGLE_BLOCKER_COUNT":
                  raise RuntimeError("V8120_SELECTION_REASON_CHANGED")

              rows8119 = read_csv(BLOCK_CSV)
              actionable = {
                  ticker(r.get("ticker"))
                  for r in rows8119
                  if r.get("source_group") == "EXACT_DA_SOURCE"
                  and str(r.get("single_blocker_ticker") or "").upper() == "TRUE"
                  and r.get("recovery_status") == "ACTIONABLE_SINGLE_BLOCKER_REAUDIT"
              }
              if actionable != EXPECTED_ACTIONABLE:
                  raise RuntimeError(
                      "V8120_ACTIONABLE_SET_MISMATCH:"
                      + ",".join(sorted(actionable))
                  )

              exhausted_current = {
                  ticker(r.get("ticker"))
                  for r in rows8119
                  if r.get("source_group") == "EXACT_DA_SOURCE"
                  and str(r.get("single_blocker_ticker") or "").upper() == "TRUE"
                  and r.get("recovery_status") == "EXHAUSTED_V8103_APPROVED_OFFICIAL_PATHS"
              }
              if exhausted_current != EXPECTED_CURRENT_EXHAUSTED_SINGLE:
                  raise RuntimeError(
                      "V8120_CURRENT_EXHAUSTED_SET_MISMATCH:"
                      + ",".join(sorted(exhausted_current))
                  )

              s8103 = read_json(V8103_JSON)
              if s8103.get("version") != V8103_VERSION:
                  raise RuntimeError("V8120_V8103_VERSION_MISMATCH")
              if s8103.get("status") != "AUDIT_ONLY":
                  raise RuntimeError("V8120_V8103_STATUS_MISMATCH")
              old_exhausted = set(s8103.get("currently_exhausted_tickers") or [])
              if int(s8103.get("currently_exhausted_count") or 0) != 10:
                  raise RuntimeError("V8120_V8103_EXHAUSTED_COUNT_CHANGED")
              if not EXPECTED_CURRENT_EXHAUSTED_SINGLE <= old_exhausted:
                  raise RuntimeError("V8120_CURRENT_EXHAUSTED_NOT_PROTECTED")
              if EXPECTED_ACTIONABLE & old_exhausted:
                  raise RuntimeError("V8120_ACTIONABLE_OVERLAPS_PRIOR_EXHAUSTED")

              financial_df = src.read_csv(FIN)
              all_targets = src.load_targets(financial_df)
              dominant_year, dominant_code = src.dominant_period(all_targets)
              annual_year = dominant_year - 1
              target_map = {t["ticker"]: t for t in all_targets}

              client = src.OpenDartClient(api_key, timeout=30)

              out_rows = []
              class_counts = Counter()
              lane_counts = Counter()
              recoverable = []
              partial = []
              no_exact = []
              incomplete = []
              conflict = []
              missing_target = []

              name_map = {
                  ticker(r.get("ticker")): str(r.get("name") or "")
                  for r in rows8119
                  if ticker(r.get("ticker"))
              }

              for code in sorted(EXPECTED_ACTIONABLE):
                  target = target_map.get(code)
                  if not target:
                      classification = "CURRENT_TARGET_NOT_AVAILABLE"
                      lane = "CURRENT_TARGET_MAPPING_MISSING"
                      row = {
                          "ticker": code,
                          "name": name_map.get(code, ""),
                          "corp_code": "",
                          "preferred_fs_div": "",
                          "dominant_financial_period": f"{dominant_year}_{dominant_code}",
                          "annual_source_year": annual_year,
                          "fresh_deep_status": "",
                          "fresh_deep_fs_div": "",
                          "fresh_deep_message": "",
                          "fresh_exact_classification": classification,
                          "recovery_lane": lane,
                          "approved_depreciation_occurrences": 0,
                          "approved_depreciation_values_json": "[]",
                          "approved_amortisation_occurrences": 0,
                          "approved_amortisation_values_json": "[]",
                          "fresh_exact_stats_json": "{}",
                          "fresh_da_candidates_json": "[]",
                      }
                      out_rows.append(row)
                      class_counts[classification] += 1
                      lane_counts[lane] += 1
                      missing_target.append(code)
                      continue

                  fresh = src.fetch_deep_one(client, target, annual_year)
                  candidates = parse_list(fresh.get("da_json"))
                  stats = exact_stats(candidates)
                  classification = classify(stats)
                  lane = recovery_lane(classification, str(fresh.get("status") or ""))

                  dep = stats["ifrs-full_AdjustmentsForDepreciationExpense"]
                  amo = stats["ifrs-full_AdjustmentsForAmortisationExpense"]

                  row = {
                      "ticker": code,
                      "name": name_map.get(code) or target.get("name") or "",
                      "corp_code": target.get("corp_code") or "",
                      "preferred_fs_div": target.get("preferred_fs_div") or "",
                      "dominant_financial_period": f"{dominant_year}_{dominant_code}",
                      "annual_source_year": annual_year,
                      "fresh_deep_status": fresh.get("status") or "",
                      "fresh_deep_fs_div": fresh.get("fs_div") or "",
                      "fresh_deep_message": fresh.get("message") or "",
                      "fresh_exact_classification": classification,
                      "recovery_lane": lane,
                      "approved_depreciation_occurrences": dep["occurrence_count"],
                      "approved_depreciation_values_json": json.dumps(
                          dep["unique_numeric_values"],
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                      "approved_amortisation_occurrences": amo["occurrence_count"],
                      "approved_amortisation_values_json": json.dumps(
                          amo["unique_numeric_values"],
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                      "fresh_exact_stats_json": json.dumps(
                          stats,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                      "fresh_da_candidates_json": json.dumps(
                          candidates,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                  }
                  out_rows.append(row)
                  class_counts[classification] += 1
                  lane_counts[lane] += 1

                  if lane == "RECOVERABLE_BOTH_EXACT_SHADOW_CANDIDATE":
                      recoverable.append(code)
                  elif lane == "PARTIAL_ONLY_DO_NOT_PROMOTE":
                      partial.append(code)
                  elif lane == "NO_APPROVED_EXACT_CURRENT_OFFICIAL_PATH":
                      no_exact.append(code)
                  elif lane == "OFFICIAL_QUERY_INCOMPLETE":
                      incomplete.append(code)
                  elif lane in {
                      "CONFLICT_FAIL_CLOSED",
                      "NONUNIQUE_OR_NONNUMERIC_FAIL_CLOSED",
                  }:
                      conflict.append(code)

                  time.sleep(0.20)

              if len(out_rows) != 17:
                  raise RuntimeError(f"V8120_OUTPUT_COUNT_NOT_17:{len(out_rows)}")

              OUT_CSV.parent.mkdir(parents=True, exist_ok=True)
              fields = list(out_rows[0].keys())
              with OUT_CSV.open("w", encoding="utf-8-sig", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
                  w.writeheader()
                  w.writerows(out_rows)

              summary = {
                  "version": VERSION,
                  "generated_at_kst": datetime.now(KST).isoformat(timespec="seconds"),
                  "status": "AUDIT_ONLY",
                  "policy_version": POLICY_VERSION,
                  "v8119_version": V8119_VERSION,
                  "v8119_result_commit": V8119_RESULT_COMMIT,
                  "v8103_version": V8103_VERSION,
                  "approved_exact_account_ids": sorted(APPROVED),
                  "target_count": 17,
                  "target_tickers": sorted(EXPECTED_ACTIONABLE),
                  "prior_exhausted_not_requeried_count": len(old_exhausted),
                  "prior_exhausted_not_requeried_tickers": sorted(old_exhausted),
                  "current_exhausted_single_not_requeried_tickers": sorted(
                      EXPECTED_CURRENT_EXHAUSTED_SINGLE
                  ),
                  "dominant_financial_period": f"{dominant_year}_{dominant_code}",
                  "annual_source_year": annual_year,
                  "current_target_available_count": 17 - len(missing_target),
                  "current_target_missing_count": len(missing_target),
                  "current_target_missing_tickers": sorted(missing_target),
                  "classification_counts": dict(class_counts),
                  "recovery_lane_counts": dict(lane_counts),
                  "both_approved_exact_recoverable_count": len(recoverable),
                  "both_approved_exact_recoverable_tickers": sorted(recoverable),
                  "partial_only_count": len(partial),
                  "partial_only_tickers": sorted(partial),
                  "no_approved_exact_count": len(no_exact),
                  "no_approved_exact_tickers": sorted(no_exact),
                  "official_query_incomplete_count": len(incomplete),
                  "official_query_incomplete_tickers": sorted(incomplete),
                  "conflict_or_nonunique_count": len(conflict),
                  "conflict_or_nonunique_tickers": sorted(conflict),
                  "opendart_attempted_requests": client.attempted,
                  "opendart_successful_requests": client.successful,
                  "opendart_transport_failure_count": len(client.transport_failures),
                  "opendart_dart_status_failure_count": len(client.dart_status_failures),
                  "hard_guards": {
                      "production_source_cache_modified": False,
                      "production_source_run_log_modified": False,
                      "production_financial_cache_modified": False,
                      "production_api_modified": False,
                      "scoring_policy_modified": False,
                      "source_value_imputed": False,
                      "new_da_account_id_approved": False,
                      "prior_exhausted_lane_requeried": False,
                      "source_promoted": False,
                  },
                  "next_step": (
                      "FREEZE_RECOVERABLE_EXACT_DA_AND_SHADOW_SCORE"
                      if recoverable
                      else "MOVE_TO_NEXT_ACTIONABLE_LANE_PRICE_ELASTICITY_20D"
                  ),
              }

              OUT_JSON.write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

              OUT_LOG.write_text(
                  "\n".join([
                      f"VERSION={VERSION}",
                      "STATUS=AUDIT_ONLY",
                      f"TARGET_COUNT={len(EXPECTED_ACTIONABLE)}",
                      f"TARGET_AVAILABLE={17-len(missing_target)}",
                      f"TARGET_MISSING={len(missing_target)}",
                      f"BOTH_APPROVED_EXACT_RECOVERABLE={len(recoverable)}",
                      f"PARTIAL_ONLY={len(partial)}",
                      f"NO_APPROVED_EXACT={len(no_exact)}",
                      f"OFFICIAL_QUERY_INCOMPLETE={len(incomplete)}",
                      f"CONFLICT_OR_NONUNIQUE={len(conflict)}",
                      f"OPENDART_ATTEMPTED={client.attempted}",
                      f"OPENDART_SUCCESSFUL={client.successful}",
                      f"OPENDART_TRANSPORT_FAILURES={len(client.transport_failures)}",
                      f"OPENDART_STATUS_FAILURES={len(client.dart_status_failures)}",
                      "PRIOR_EXHAUSTED_LANE_REQUERIED=false",
                      "SOURCE_PROMOTED=false",
                      "SCORING_POLICY_MODIFIED=false",
                      "STATUS_OK=true",
                      f"NEXT_STEP={summary['next_step']}",
                  ]) + "\n",
                  encoding="utf-8",
              )

              OUT_DOC.parent.mkdir(parents=True, exist_ok=True)
              OUT_DOC.write_text(
                  "\n".join([
                      "# V8.12.0 current actionable exact D&A official recovery audit",
                      "",
                      f"- Targets: {len(EXPECTED_ACTIONABLE)} current actionable single blockers.",
                      f"- Prior V8.10.3 exhausted targets not re-queried: {len(old_exhausted)}.",
                      f"- Both approved exact recoverable: {len(recoverable)}.",
                      f"- Partial only: {len(partial)}.",
                      f"- No approved exact: {len(no_exact)}.",
                      f"- Official query incomplete: {len(incomplete)}.",
                      f"- Conflict/nonunique: {len(conflict)}.",
                      "",
                      "## Contract",
                      "",
                      "- Only the two already-approved D&A account IDs are accepted.",
                      "- No missing D&A is treated as zero.",
                      "- Partial exact evidence is not promoted.",
                      "- Conflict/nonunique evidence fails closed.",
                      "- This step is AUDIT_ONLY and does not mutate production data.",
                      "",
                      f"Next: `{summary['next_step']}`",
                      "",
                  ]),
                  encoding="utf-8",
              )

              print("V8120_CURRENT_ACTIONABLE_EXACT_DA_AUDIT=PASS")


          if __name__ == "__main__":
              main()

          PY

          python - <<'PY'
          from pathlib import Path
          p = Path("investment_score_exact_da_actionable_v8120.py")
          text = p.read_text(encoding="utf-8")
          p.write_text(text.rstrip() + "\n", encoding="utf-8", newline="\n")
          assert not p.read_bytes().endswith(b"\n\n")
          print("V8120_AUDITOR_EOF_NORMALIZED=PASS")
          PY

          python -m py_compile investment_score_exact_da_actionable_v8120.py

          python investment_score_exact_da_actionable_v8120.py \
            | tee /tmp/v8120_stdout.txt

          grep -q '^V8120_CURRENT_ACTIONABLE_EXACT_DA_AUDIT=PASS$' \
            /tmp/v8120_stdout.txt
          grep -q '^STATUS_OK=true$' \
            latest/investment_score_exact_da_actionable_v8120_run_log_latest.txt
          grep -q '^PRIOR_EXHAUSTED_LANE_REQUERIED=false$' \
            latest/investment_score_exact_da_actionable_v8120_run_log_latest.txt
          grep -q '^SOURCE_PROMOTED=false$' \
            latest/investment_score_exact_da_actionable_v8120_run_log_latest.txt

      - name: Validate V8.12.0 outputs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          s = json.loads(
              Path(
                  "latest/investment_score_exact_da_actionable_v8120_summary_latest.json"
              ).read_text(encoding="utf-8")
          )

          assert (
              s["version"]
              == "2026-09-17-v8.12.0-current-actionable-exact-da-official-recovery-audit"
          )
          assert s["status"] == "AUDIT_ONLY"
          assert s["v8119_result_commit"] == "f470876fe7365e9590bcc5f61b88a2131d3322b5"
          assert s["target_count"] == 17
          assert len(s["target_tickers"]) == 17
          assert s["prior_exhausted_not_requeried_count"] == 10
          assert set(s["current_exhausted_single_not_requeried_tickers"]) == {
              "012450", "022100"
          }
          assert set(s["approved_exact_account_ids"]) == {
              "ifrs-full_AdjustmentsForDepreciationExpense",
              "ifrs-full_AdjustmentsForAmortisationExpense",
          }

          total = (
              s["both_approved_exact_recoverable_count"]
              + s["partial_only_count"]
              + s["no_approved_exact_count"]
              + s["official_query_incomplete_count"]
              + s["conflict_or_nonunique_count"]
              + s["current_target_missing_count"]
          )
          assert total == 17

          h = s["hard_guards"]
          assert all(v is False for v in h.values())

          assert s["next_step"] in {
              "FREEZE_RECOVERABLE_EXACT_DA_AND_SHADOW_SCORE",
              "MOVE_TO_NEXT_ACTIONABLE_LANE_PRICE_ELASTICITY_20D",
          }

          with Path(
              "latest/investment_score_exact_da_actionable_v8120.csv"
          ).open(encoding="utf-8-sig", newline="") as f:
              rows = list(csv.DictReader(f))

          assert len(rows) == 17
          assert len({r["ticker"] for r in rows}) == 17

          print("V8120_OUTPUT_VALIDATION=PASS")
          PY

      - name: Verify protected production state unchanged
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_source_enricher_v854.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_current_blockers_v8119.csv \
            latest/investment_score_current_blockers_v8119_summary_latest.json \
            latest/investment_score_da_current_single_recoverability_v8103_summary_latest.json \
            > /tmp/v8120_protected.after

          diff -u /tmp/v8120_protected.before /tmp/v8120_protected.after

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8120_api.after

          diff -u /tmp/v8120_api.before /tmp/v8120_api.after

          echo "V8120_PRODUCTION_STATE_UNCHANGED=PASS"

      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_exact_da_actionable_v8120.py",
              "latest/investment_score_exact_da_actionable_v8120.csv",
              "latest/investment_score_exact_da_actionable_v8120_summary_latest.json",
              "latest/investment_score_exact_da_actionable_v8120_run_log_latest.txt",
              "docs/investment_score_exact_da_actionable_v8120.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git","status","--porcelain","--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8120_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )

          print("V8120_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_source_enricher_v854.py",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
