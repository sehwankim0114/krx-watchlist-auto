              "latest/investment_score_current_blockers_v8119.csv",
              "latest/investment_score_current_blockers_v8119_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  ["git","diff","--name-only","HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8120_CONCURRENT_PROTECTED_DRIFT:"
                  + ",".join(dangerous)
              )

          print("V8120_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

