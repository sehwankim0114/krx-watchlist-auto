            > /tmp/v8123_protected.after

          diff -u /tmp/v8123_protected.before /tmp/v8123_protected.after

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum \
