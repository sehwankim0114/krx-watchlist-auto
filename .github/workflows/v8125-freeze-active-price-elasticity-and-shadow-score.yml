name: Freeze active price elasticity and shadow score v8.12.5

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8125-freeze-active-price-elasticity-and-shadow-score.yml"

permissions:
  contents: write

concurrency:
  group: v8125-active-price-elasticity-shadow
  cancel-in-progress: false

jobs:
  shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V8.12.4 lineage and capture protected hashes
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            7fa2a6041179e6f9a2b91d7370521954ad04e9a0 HEAD

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_source_cache_latest.csv \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_price_elasticity_active_v8124.csv \
            latest/investment_score_price_elasticity_active_v8124_summary_latest.json \
            > /tmp/v8125_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8125_api.before

          echo "V8125_LINEAGE=PASS"

      - name: Create and run V8.12.5 shadow auditor
        shell: bash
        run: |
          cat > investment_score_price_elasticity_shadow_v8125.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_dry_run_v882 as scorer

          VERSION = "2026-09-21-v8.12.5-freeze-active-price-elasticity-and-shadow-score"
          V8124_VERSION = "2026-09-21-v8.12.4-current-active-price-elasticity-20d-official-audit"
          V8124_RESULT_COMMIT = "7fa2a6041179e6f9a2b91d7370521954ad04e9a0"
          POLICY_VERSION = "2026-09-13-v8.8.0-explicit-100-point-scoring-contract"

          ROOT = Path(".")
          KST = ZoneInfo("Asia/Seoul")

          AUDIT_CSV = ROOT / "latest/investment_score_price_elasticity_active_v8124.csv"
          AUDIT_JSON = ROOT / "latest/investment_score_price_elasticity_active_v8124_summary_latest.json"
          PROD_CACHE = ROOT / "latest/investment_score_price_elasticity_20d_latest.csv"

          SOURCE_OUT = ROOT / "latest/investment_score_price_elasticity_source_v8125.csv"
          COMPARE_OUT = ROOT / "latest/investment_score_price_elasticity_shadow_v8125.csv"
          SUMMARY_OUT = ROOT / "latest/investment_score_price_elasticity_shadow_v8125_summary_latest.json"
          LOG_OUT = ROOT / "latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt"
          DOC_OUT = ROOT / "docs/investment_score_price_elasticity_shadow_v8125.md"

          TMP_CACHE = Path("/tmp/v8125_shadow_elasticity.csv")
          BASE_CSV = Path("/tmp/v8125_baseline_score.csv")
          BASE_JSON = Path("/tmp/v8125_baseline_score.json")
          BASE_LOG = Path("/tmp/v8125_baseline_score.log")
          BASE_DOC = Path("/tmp/v8125_baseline_score.md")
          SHADOW_CSV = Path("/tmp/v8125_shadow_score.csv")
          SHADOW_JSON = Path("/tmp/v8125_shadow_score.json")
          SHADOW_LOG = Path("/tmp/v8125_shadow_score.log")
          SHADOW_DOC = Path("/tmp/v8125_shadow_score.md")

          EXPECTED = {
              "000320": "노루홀딩스",
              "001800": "오리온홀딩스",
              "003470": "유안타증권",
              "003540": "대신증권",
              "005440": "현대지에프홀딩스",
              "006840": "AK홀딩스",
              "026890": "스틱인베스트먼트",
              "034830": "한국토지신탁",
              "039490": "키움증권",
              "107590": "미원홀딩스",
              "244920": "에이플러스에셋",
              "323410": "카카오뱅크",
          }

          MISSING_REASON = "하루평균 절대등락률:MISSING_ELASTICITY"


          def ticker(value):
              s = "".join(ch for ch in str(value or "") if ch.isdigit())
              return s.zfill(6) if s else ""


          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8-sig"))


          def read_rows(path):
              with Path(path).open(encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))


          def write_rows(path, rows, fields=None):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              if fields is None:
                  fields = list(rows[0].keys()) if rows else []
              with path.open("w", encoding="utf-8-sig", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=fields, lineterminator="\n")
                  w.writeheader()
                  w.writerows(rows)


          def split_missing(text):
              return [x for x in str(text or "").split(";") if x]


          def run_scorer(elasticity_path, out_csv, out_json, out_log, out_doc):
              old = {
                  "VERSION": scorer.VERSION,
                  "ELASTICITY": scorer.ELASTICITY,
                  "OUT_CSV": scorer.OUT_CSV,
                  "OUT_JSON": scorer.OUT_JSON,
                  "OUT_LOG": scorer.OUT_LOG,
                  "OUT_DOC": scorer.OUT_DOC,
              }
              try:
                  scorer.VERSION = VERSION
                  scorer.ELASTICITY = Path(elasticity_path)
                  scorer.OUT_CSV = Path(out_csv)
                  scorer.OUT_JSON = Path(out_json)
                  scorer.OUT_LOG = Path(out_log)
                  scorer.OUT_DOC = Path(out_doc)
                  rc = scorer.main()
              finally:
                  for k, v in old.items():
                      setattr(scorer, k, v)
              if rc not in (None, 0):
                  raise RuntimeError(f"V8125_SCORER_FAILED:{rc}")


          def stable(row):
              return json.dumps(row, ensure_ascii=False, sort_keys=True, separators=(",", ":"))


          def main():
              for p in (AUDIT_CSV, AUDIT_JSON, PROD_CACHE):
                  if not p.is_file():
                      raise RuntimeError("V8125_MISSING_INPUT:" + str(p))

              subprocess.run(
                  ["git", "merge-base", "--is-ancestor", V8124_RESULT_COMMIT, "HEAD"],
                  check=True,
              )

              s8124 = read_json(AUDIT_JSON)
              if s8124.get("version") != V8124_VERSION:
                  raise RuntimeError("V8125_V8124_VERSION_MISMATCH")
              if s8124.get("status") != "AUDIT_ONLY":
                  raise RuntimeError("V8125_V8124_STATUS_MISMATCH")
              if s8124.get("policy_version") != POLICY_VERSION:
                  raise RuntimeError("V8125_POLICY_VERSION_MISMATCH")
              if int(s8124.get("target_count") or 0) != 12:
                  raise RuntimeError("V8125_TARGET_COUNT_MISMATCH")
              if int(s8124.get("recoverable_count") or 0) != 12:
                  raise RuntimeError("V8125_NOT_ALL_RECOVERABLE")
              if int(s8124.get("insufficient_count") or 0) != 0:
                  raise RuntimeError("V8125_INSUFFICIENT_NOT_ZERO")
              if set(s8124.get("recoverable_tickers") or []) != set(EXPECTED):
                  raise RuntimeError("V8125_RECOVERABLE_SET_MISMATCH")
              metric = s8124.get("metric_contract") or {}
              if int(metric.get("return_count") or 0) != 20:
                  raise RuntimeError("V8125_WINDOW_NOT_20")
              if metric.get("atr_substitution_allowed") is not False:
                  raise RuntimeError("V8125_ATR_SUBSTITUTION_NOT_FORBIDDEN")

              audit = {ticker(r.get("ticker")): r for r in read_rows(AUDIT_CSV)}
              if set(audit) != set(EXPECTED):
                  raise RuntimeError("V8125_AUDIT_SET_MISMATCH")

              source_rows = []
              for code in sorted(EXPECTED):
                  r = audit[code]
                  if r.get("classification") != "OFFICIAL_KRX_PRICE_ELASTICITY_RECOVERABLE":
                      raise RuntimeError("V8125_NOT_RECOVERABLE:" + code)
                  returns = json.loads(r.get("last20_returns_json") or "[]")
                  return_dates = json.loads(r.get("last20_return_dates_json") or "[]")
                  close_dates = json.loads(r.get("used_close_dates_json") or "[]")
                  if len(returns) != 20 or len(return_dates) != 20 or len(close_dates) != 21:
                      raise RuntimeError("V8125_WINDOW_EVIDENCE_BAD:" + code)

                  source_rows.append({
                      "ticker": code,
                      "name": EXPECTED[code],
                      "basis_date": r["basis_date"],
                      "basis_source": r["basis_source"],
                      "window_start_date": close_dates[0],
                      "window_end_date": close_dates[-1],
                      "close_observation_count": 21,
                      "daily_return_observation_count": 20,
                      "avg_daily_move_pct": f"{float(r['avg_daily_move_pct']):.2f}",
                      "classification": r["classification"],
                      "source": r["source"],
                      "last20_return_dates_json": json.dumps(
                          return_dates, ensure_ascii=False, separators=(",", ":")
                      ),
                      "last20_returns_json": json.dumps(
                          returns, ensure_ascii=False, separators=(",", ":")
                      ),
                  })

              write_rows(SOURCE_OUT, source_rows)

              prod_rows = read_rows(PROD_CACHE)
              if not prod_rows:
                  raise RuntimeError("V8125_PRODUCTION_ELASTICITY_CACHE_EMPTY")
              prod_fields = list(prod_rows[0].keys())
              prod_map = {ticker(r.get("ticker")): r for r in prod_rows if ticker(r.get("ticker"))}

              already_ready = sorted(
                  code for code in EXPECTED
                  if code in prod_map
                  and prod_map[code].get("source_status") == "READY"
                  and str(prod_map[code].get("avg_daily_move_pct") or "").strip()
              )
              if already_ready:
                  raise RuntimeError(
                      "V8125_TARGET_ALREADY_READY_IN_PROD_CACHE:" + ",".join(already_ready)
                  )

              shadow_map = dict(prod_map)
              for r in source_rows:
                  row = {f: "" for f in prod_fields}
                  row.update({
                      "ticker": r["ticker"],
                      "name": r["name"],
                      "basis_date": r["basis_date"],
                      "window_start_date": r["window_start_date"],
                      "window_end_date": r["window_end_date"],
                      "close_observation_count": "21",
                      "daily_return_observation_count": "20",
                      "avg_daily_move_abs": "",
                      "avg_daily_move_pct": r["avg_daily_move_pct"],
                      "source_status": "READY",
                  })
                  shadow_map[r["ticker"]] = row

              write_rows(TMP_CACHE, [shadow_map[k] for k in sorted(shadow_map)], prod_fields)

              run_scorer(PROD_CACHE, BASE_CSV, BASE_JSON, BASE_LOG, BASE_DOC)
              run_scorer(TMP_CACHE, SHADOW_CSV, SHADOW_JSON, SHADOW_LOG, SHADOW_DOC)

              base = {ticker(r.get("ticker")): r for r in read_rows(BASE_CSV)}
              shadow = {ticker(r.get("ticker")): r for r in read_rows(SHADOW_CSV)}

              if set(base) != set(shadow):
                  raise RuntimeError("V8125_SCORER_UNIVERSE_CHANGED")
              if not set(EXPECTED) <= set(base):
                  missing = sorted(set(EXPECTED) - set(base))
                  raise RuntimeError("V8125_TARGET_INACTIVE_NOW:" + ",".join(missing))

              non_target_changed = [
                  code for code in sorted(set(base) - set(EXPECTED))
                  if stable(base[code]) != stable(shadow[code])
              ]
              if non_target_changed:
                  raise RuntimeError(
                      "V8125_NON_TARGET_SCORE_DRIFT:" + ",".join(non_target_changed[:20])
                  )

              compare = []
              newly_ready = []
              for code in sorted(EXPECTED):
                  b = base[code]
                  s = shadow[code]
                  bm = split_missing(b.get("missing_components"))
                  sm = split_missing(s.get("missing_components"))

                  if b.get("score_status") != "LIMITED":
                      raise RuntimeError("V8125_BASELINE_NOT_LIMITED:" + code)
                  if bm != [MISSING_REASON]:
                      raise RuntimeError(
                          "V8125_BASELINE_NOT_SINGLE_ELASTICITY:" + code + ":" + "|".join(bm)
                      )
                  if MISSING_REASON in sm:
                      raise RuntimeError("V8125_ELASTICITY_NOT_REMOVED:" + code)
                  if s.get("score_status") != "READY":
                      raise RuntimeError("V8125_SHADOW_NOT_READY:" + code)

                  newly_ready.append(code)
                  compare.append({
                      "ticker": code,
                      "name": EXPECTED[code],
                      "avg_daily_move_pct": audit[code]["avg_daily_move_pct"],
                      "baseline_status": b.get("score_status") or "",
                      "shadow_status": s.get("score_status") or "",
                      "baseline_missing_components": ";".join(bm),
                      "shadow_missing_components": ";".join(sm),
                      "baseline_score_total": b.get("score_total") or "",
                      "shadow_score_total": s.get("score_total") or "",
                  })

              write_rows(COMPARE_OUT, compare)

              bsum = read_json(BASE_JSON)
              ssum = read_json(SHADOW_JSON)
              b_ready = int(bsum.get("ready_count") or 0)
              s_ready = int(ssum.get("ready_count") or 0)

              b_blockers = sum(int(r.get("missing_component_count") or 0) for r in base.values())
              s_blockers = sum(int(r.get("missing_component_count") or 0) for r in shadow.values())

              if s_ready - b_ready != 12:
                  raise RuntimeError(f"V8125_READY_DELTA_NOT_12:{s_ready-b_ready}")
              if b_blockers - s_blockers != 12:
                  raise RuntimeError(f"V8125_BLOCKER_DELTA_NOT_12:{b_blockers-s_blockers}")

              summary = {
                  "version": VERSION,
                  "generated_at_kst": datetime.now(KST).isoformat(timespec="seconds"),
                  "status": "SOURCE_ONLY_FROZEN_SHADOW_PASS",
                  "policy_version": POLICY_VERSION,
                  "v8124_version": V8124_VERSION,
                  "v8124_result_commit": V8124_RESULT_COMMIT,
                  "source_frozen_count": 12,
                  "source_frozen_tickers": sorted(EXPECTED),
                  "basis_date": s8124.get("basis_date"),
                  "basis_source": s8124.get("basis_source"),
                  "current_scorer_universe_count": len(base),
                  "active_target_count": 12,
                  "active_target_tickers": sorted(EXPECTED),
                  "baseline_ready_count": b_ready,
                  "shadow_ready_count": s_ready,
                  "ready_delta": 12,
                  "newly_ready_count": 12,
                  "newly_ready_tickers": sorted(newly_ready),
                  "baseline_blocker_occurrences": b_blockers,
                  "shadow_blocker_occurrences": s_blockers,
                  "blocker_occurrences_reduced_by": 12,
                  "elasticity_reason_removed_count": 12,
                  "elasticity_reason_removed_tickers": sorted(EXPECTED),
                  "non_target_score_row_changed_count": 0,
                  "hard_guards": {
                      "production_price_elasticity_cache_modified": False,
                      "production_source_cache_modified": False,
                      "production_financial_cache_modified": False,
                      "production_api_modified": False,
                      "scoring_policy_modified": False,
                      "atr_used_as_elasticity_substitute": False,
                      "nonofficial_price_source_used": False,
                      "production_score_written": False,
                  },
                  "next_step": "STAGE_NARROW_PRODUCTION_PRICE_ELASTICITY_CACHE_PATCH_V8126",
              }

              SUMMARY_OUT.write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )

              LOG_OUT.write_text(
                  "\n".join([
                      f"VERSION={VERSION}",
                      "STATUS=SOURCE_ONLY_FROZEN_SHADOW_PASS",
                      "SOURCE_FROZEN_COUNT=12",
                      f"CURRENT_SCORER_UNIVERSE={len(base)}",
                      f"BASELINE_READY={b_ready}",
                      f"SHADOW_READY={s_ready}",
                      "READY_DELTA=12",
                      "BLOCKER_REDUCED_BY=12",
                      "NON_TARGET_SCORE_ROW_CHANGED_COUNT=0",
                      "PRODUCTION_PRICE_ELASTICITY_CACHE_MODIFIED=false",
                      "PRODUCTION_SCORE_WRITTEN=false",
                      "ATR_SUBSTITUTION_USED=false",
                      "NONOFFICIAL_PRICE_SOURCE_USED=false",
                      "STATUS_OK=true",
                      "NEXT_STEP=STAGE_NARROW_PRODUCTION_PRICE_ELASTICITY_CACHE_PATCH_V8126",
                  ]) + "\n",
                  encoding="utf-8",
              )

              DOC_OUT.parent.mkdir(parents=True, exist_ok=True)
              DOC_OUT.write_text(
                  "\n".join([
                      "# V8.12.5 active price-elasticity source freeze and shadow score",
                      "",
                      "- Source frozen: 12 current active single-blocker tickers.",
                      "- All 12 baseline rows must be LIMITED only by MISSING_ELASTICITY.",
                      "- All 12 shadow rows must become READY.",
                      "- Non-target score drift must be zero.",
                      "- Production elasticity cache is not changed.",
                      "",
                      f"- Baseline READY: {b_ready}",
                      f"- Shadow READY: {s_ready}",
                      "- READY delta: 12",
                      "- Blocker reduction: 12",
                      "",
                      "Next: `STAGE_NARROW_PRODUCTION_PRICE_ELASTICITY_CACHE_PATCH_V8126`",
                      "",
                  ]),
                  encoding="utf-8",
              )

              print("V8125_ACTIVE_PRICE_ELASTICITY_FREEZE_SHADOW=PASS")


          if __name__ == "__main__":
              main()

          PY

          python - <<'PY'
          from pathlib import Path
          p = Path("investment_score_price_elasticity_shadow_v8125.py")
          t = p.read_text(encoding="utf-8")
          p.write_text(t.rstrip() + "\n", encoding="utf-8", newline="\n")
          assert not p.read_bytes().endswith(b"\n\n")
          print("V8125_AUDITOR_EOF_NORMALIZED=PASS")
          PY

          python -m py_compile investment_score_price_elasticity_shadow_v8125.py

          python investment_score_price_elasticity_shadow_v8125.py \
            | tee /tmp/v8125_stdout.txt

          grep -q '^V8125_ACTIVE_PRICE_ELASTICITY_FREEZE_SHADOW=PASS$' \
            /tmp/v8125_stdout.txt
          grep -q '^STATUS_OK=true$' \
            latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt
          grep -q '^READY_DELTA=12$' \
            latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt
          grep -q '^BLOCKER_REDUCED_BY=12$' \
            latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt
          grep -q '^NON_TARGET_SCORE_ROW_CHANGED_COUNT=0$' \
            latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt
          grep -q '^PRODUCTION_PRICE_ELASTICITY_CACHE_MODIFIED=false$' \
            latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt

      - name: Validate V8.12.5 outputs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          s = json.loads(
              Path(
                  "latest/investment_score_price_elasticity_shadow_v8125_summary_latest.json"
              ).read_text(encoding="utf-8")
          )

          assert s["version"] == "2026-09-21-v8.12.5-freeze-active-price-elasticity-and-shadow-score"
          assert s["status"] == "SOURCE_ONLY_FROZEN_SHADOW_PASS"
          assert s["v8124_result_commit"] == "7fa2a6041179e6f9a2b91d7370521954ad04e9a0"
          assert s["source_frozen_count"] == 12
          assert s["active_target_count"] == 12
          assert s["ready_delta"] == 12
          assert s["newly_ready_count"] == 12
          assert s["blocker_occurrences_reduced_by"] == 12
          assert s["elasticity_reason_removed_count"] == 12
          assert s["non_target_score_row_changed_count"] == 0
          assert s["next_step"] == "STAGE_NARROW_PRODUCTION_PRICE_ELASTICITY_CACHE_PATCH_V8126"

          h = s["hard_guards"]
          assert all(v is False for v in h.values())

          with Path(
              "latest/investment_score_price_elasticity_source_v8125.csv"
          ).open(encoding="utf-8-sig", newline="") as f:
              src = list(csv.DictReader(f))
          assert len(src) == 12

          with Path(
              "latest/investment_score_price_elasticity_shadow_v8125.csv"
          ).open(encoding="utf-8-sig", newline="") as f:
              cmp = list(csv.DictReader(f))
          assert len(cmp) == 12
          assert all(r["baseline_status"] == "LIMITED" for r in cmp)
          assert all(r["shadow_status"] == "READY" for r in cmp)

          print("V8125_OUTPUT_VALIDATION=PASS")
          PY

      - name: Verify production state unchanged
        shell: bash
        run: |
          set -euo pipefail

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_source_cache_latest.csv \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_price_elasticity_active_v8124.csv \
            latest/investment_score_price_elasticity_active_v8124_summary_latest.json \
            > /tmp/v8125_protected.after

          diff -u /tmp/v8125_protected.before /tmp/v8125_protected.after

          find api/two_table_v1 -maxdepth 1 -type f -name '*.json' -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8125_api.after
          diff -u /tmp/v8125_api.before /tmp/v8125_api.after

          echo "V8125_PRODUCTION_STATE_UNCHANGED=PASS"

      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          allowed = {
              "investment_score_price_elasticity_shadow_v8125.py",
              "latest/investment_score_price_elasticity_source_v8125.csv",
              "latest/investment_score_price_elasticity_shadow_v8125.csv",
              "latest/investment_score_price_elasticity_shadow_v8125_summary_latest.json",
              "latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt",
              "docs/investment_score_price_elasticity_shadow_v8125.md",
          }
          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git","status","--porcelain","--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8125_UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected)
              )
          print("V8125_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          python - <<'PY'
          import subprocess
          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_source_cache_latest.csv",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_price_elasticity_active_v8124.csv",
              "latest/investment_score_price_elasticity_active_v8124_summary_latest.json",
          }
          upstream = set(
              subprocess.check_output(
                  ["git","diff","--name-only","HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8125_CONCURRENT_PROTECTED_DRIFT:" + ",".join(dangerous)
              )
          print("V8125_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

      - name: Commit and push source-only shadow outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            investment_score_price_elasticity_shadow_v8125.py \
            latest/investment_score_price_elasticity_source_v8125.csv \
            latest/investment_score_price_elasticity_shadow_v8125.csv \
            latest/investment_score_price_elasticity_shadow_v8125_summary_latest.json \
            latest/investment_score_price_elasticity_shadow_v8125_run_log_latest.txt \
            docs/investment_score_price_elasticity_shadow_v8125.md

          git diff --cached --check
          echo "V8125_GIT_DIFF_CHECK=PASS"

          git commit -m "Freeze active price elasticity and shadow score v8.12.5"
          git pull --rebase origin main
          git push origin HEAD:main
