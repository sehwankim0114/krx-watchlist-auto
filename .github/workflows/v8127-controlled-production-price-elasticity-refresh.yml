              "latest/investment_score_price_elasticity_candidate_v8126.csv",
              "latest/investment_score_price_elasticity_candidate_v8126_summary_latest.json",
              "latest/investment_score_price_elasticity_candidate_v8126_regression_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8127_CONCURRENT_PROTECTED_DRIFT:" + ",".join(dangerous)
              )

          print("V8127_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

