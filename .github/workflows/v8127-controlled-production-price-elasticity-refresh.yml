      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_price_elasticity_production_refresh_v8127.py",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.json",
              "latest/investment_score_price_elasticity_20d_run_log_latest.txt",
              "latest/investment_score_price_elasticity_production_refresh_v8127_summary_latest.json",
              "latest/investment_score_price_elasticity_production_refresh_v8127_run_log_latest.txt",
              "docs/investment_score_price_elasticity_production_refresh_v8127.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8127_UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected)
              )

          required = {
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.json",
              "latest/investment_score_price_elasticity_20d_run_log_latest.txt",
              "latest/investment_score_price_elasticity_production_refresh_v8127_summary_latest.json",
              "latest/investment_score_price_elasticity_production_refresh_v8127_run_log_latest.txt",
          }
          if not required <= changed:
              raise SystemExit(
                  "V8127_EXPECTED_FILES_NOT_CHANGED:"
                  + ",".join(sorted(required - changed))
              )

          print("V8127_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse concurrent production-sensitive drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_source_cache_latest.csv",
              "latest/financial_valuation_cache_latest.csv",
