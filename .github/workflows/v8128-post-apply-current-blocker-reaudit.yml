              "docs/investment_score_current_blockers_v8128.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain", "--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8128_UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected)
              )

          required = {
              "investment_score_current_blocker_reaudit_v8128.py",
              "latest/investment_score_current_blockers_v8128.csv",
              "latest/investment_score_current_blockers_v8128_summary_latest.json",
              "latest/investment_score_current_blockers_v8128_run_log_latest.txt",
              "docs/investment_score_current_blockers_v8128.md",
          }
          if not required <= changed:
              raise SystemExit(
                  "V8128_EXPECTED_FILES_NOT_CHANGED:"
                  + ",".join(sorted(required - changed))
              )

          print("V8128_CHANGED_FILES_RESTRICTED=PASS")
          PY

