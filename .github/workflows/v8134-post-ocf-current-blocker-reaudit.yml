          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git","status","--porcelain","--untracked-files=all"],
                  text=True,
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8134_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )
          print("V8134_CHANGED_FILES_RESTRICTED=PASS")
          PY

