      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_supply_actionable_v8136.py",
              "latest/investment_score_supply_actionable_v8136.csv",
              "latest/investment_score_supply_actionable_v8136_summary_latest.json",
              "latest/investment_score_supply_actionable_v8136_run_log_latest.txt",
              "docs/investment_score_supply_actionable_v8136.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  [
                      "git",
                      "status",
                      "--porcelain",
                      "--untracked-files=all",
                  ],
                  text=True,
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8136_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )
          print("V8136_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "supply_burden_enricher.py",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.json",
              "latest/investment_score_ocf_source_latest.csv",
              "latest/investment_score_ocf_source_latest.json",
              "latest/investment_score_current_blockers_v8134.csv",
              "latest/investment_score_current_blockers_v8134_summary_latest.json",
              "latest/investment_score_exact_da_actionable_v8135_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "HEAD..origin/main",
                  ],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p
              for p in upstream
              if p in protected
              or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8136_CONCURRENT_PROTECTED_DRIFT:"
                  + ",".join(dangerous)
              )

          print("V8136_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

