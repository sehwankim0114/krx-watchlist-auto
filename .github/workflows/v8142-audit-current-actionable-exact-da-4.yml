      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_exact_da_actionable_v8142.py",
              "latest/investment_score_exact_da_actionable_v8142.csv",
              "latest/investment_score_exact_da_actionable_v8142_summary_latest.json",
              "latest/investment_score_exact_da_actionable_v8142_run_log_latest.txt",
              "docs/investment_score_exact_da_actionable_v8142.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  [
                      "git",
                      "status",
                      "--porcelain",
                      "--untracked-files=all",
                  ],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(
              changed - allowed
          )

          if unexpected:
              raise SystemExit(
                  "V8142_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )

          print(
              "V8142_CHANGED_FILES_RESTRICTED=PASS"
          )
          PY

      - name: Refuse concurrent protected drift
        shell: bash
