              "latest/investment_score_current_blockers_v8141_summary_latest.json",
              "latest/investment_score_exact_da_actionable_v8135_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "HEAD..origin/main",
                  ],
                  text=True,
              ).splitlines()
          )

          dangerous = sorted(
              p
              for p in upstream
              if p in protected
              or p.startswith(
                  "api/two_table_v1/"
              )
          )

          if dangerous:
              raise SystemExit(
                  "V8142_CONCURRENT_PROTECTED_DRIFT:"
                  + ",".join(dangerous)
              )

          print(
              "V8142_NO_CONCURRENT_PROTECTED_DRIFT=PASS"
          )
          PY

