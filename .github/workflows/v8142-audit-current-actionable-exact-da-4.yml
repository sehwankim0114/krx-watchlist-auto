name: Audit current actionable exact D&A single blockers v8.14.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8142-audit-current-actionable-exact-da-4.yml"

permissions:
  contents: write

concurrency:
  group: v8142-current-actionable-exact-da-4
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify lineage and capture protected state
        shell: bash
        run: |
          set -euo pipefail

          test -n "${DART_API_KEY:-}" || {
            echo "::error::DART_API_KEY secret is missing"
            exit 1
          }

          git merge-base --is-ancestor \
            82d200db86beeb6260f6601a4ede37ad19bb3358 HEAD

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_source_enricher_v854.py \
            investment_score_dry_run_v882.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            latest/investment_score_supply_source_latest.json \
            latest/investment_score_current_blockers_v8141.csv \
            latest/investment_score_current_blockers_v8141_summary_latest.json \
            latest/investment_score_exact_da_actionable_v8135_summary_latest.json \
            > /tmp/v8142_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8142_api.before

          echo "V8142_LINEAGE=PASS"

      - name: Create and run V8.14.2 exact D&A auditor
        shell: bash
        run: |
          set -euo pipefail

          cat > investment_score_exact_da_actionable_v8142.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import json
          import os
          import subprocess
          import time
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_source_enricher_v854 as src

          VERSION = "2026-09-22-v8.14.2-current-actionable-exact-da-single-blocker-audit"
          POLICY_VERSION = "2026-09-13-v8.8.0-explicit-100-point-scoring-contract"
          V8141_VERSION = "2026-09-22-v8.14.1-post-supply-current-blocker-reaudit"
          V8141_RESULT_COMMIT = "82d200db86beeb6260f6601a4ede37ad19bb3358"
          V8135_VERSION = "2026-09-21-v8.13.5-current-actionable-exact-da-single-blocker-audit"

          ROOT = Path(".")
          KST = ZoneInfo("Asia/Seoul")

          BLOCK_CSV = ROOT / "latest/investment_score_current_blockers_v8141.csv"
          BLOCK_JSON = ROOT / "latest/investment_score_current_blockers_v8141_summary_latest.json"
          V8135_JSON = ROOT / "latest/investment_score_exact_da_actionable_v8135_summary_latest.json"
          FIN = ROOT / "latest/financial_valuation_cache_latest.csv"

          OUT_CSV = ROOT / "latest/investment_score_exact_da_actionable_v8142.csv"
          OUT_JSON = ROOT / "latest/investment_score_exact_da_actionable_v8142_summary_latest.json"
          OUT_LOG = ROOT / "latest/investment_score_exact_da_actionable_v8142_run_log_latest.txt"
          OUT_DOC = ROOT / "docs/investment_score_exact_da_actionable_v8142.md"

          APPROVED = {
              "ifrs-full_AdjustmentsForDepreciationExpense",
              "ifrs-full_AdjustmentsForAmortisationExpense",
          }

          EXPECTED_ACTIONABLE = {
              "001440": "대한전선",
              "066570": "LG전자",
              "071840": "롯데하이마트",
              "086280": "현대글로비스",
          }

          EXPECTED_CORP = {
              "001440": "00113207",
              "066570": "00401731",
              "071840": "00158307",
              "086280": "00360595",
          }

          def ticker(value):
              s = "".join(
                  ch
                  for ch in str(value or "")
                  if ch.isdigit()
              )
              return s.zfill(6) if s else ""

          def read_json(path):
              return json.loads(
                  Path(path).read_text(
                      encoding="utf-8-sig"
                  )
              )

          def read_csv(path):
              with Path(path).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  return list(csv.DictReader(f))

          def parse_list(value):
              try:
                  data = json.loads(
                      str(value or "")
                  )
              except Exception:
                  return []
              return data if isinstance(data, list) else []

          def number(value):
              try:
                  if value in (
                      None,
                      "",
                      "null",
                      "None",
                  ):
                      return None
                  return float(value)
              except Exception:
                  return None

          def exact_stats(candidates):
              grouped = defaultdict(list)

              for item in candidates:
                  aid = str(
                      item.get("account_id") or ""
                  ).strip()
                  if aid in APPROVED:
                      grouped[aid].append(item)

              out = {}
              for aid in sorted(APPROVED):
                  rows = grouped.get(aid, [])
                  nums = [
                      number(r.get("amount"))
                      for r in rows
                      if number(r.get("amount"))
                      is not None
                  ]
                  out[aid] = {
                      "occurrence_count": len(rows),
                      "unique_numeric_values": sorted(
                          set(nums)
                      ),
                      "account_names": sorted({
                          str(
                              r.get("account_nm")
                              or ""
                          ).strip()
                          for r in rows
                          if str(
                              r.get("account_nm")
                              or ""
                          ).strip()
                      }),
                  }

              return out

          def classify(stats):
              present = {
                  aid
                  for aid, x in stats.items()
                  if x["occurrence_count"] > 0
              }
              unique = {
                  aid
                  for aid, x in stats.items()
                  if len(
                      x["unique_numeric_values"]
                  ) == 1
              }
              conflict = {
                  aid
                  for aid, x in stats.items()
                  if len(
                      x["unique_numeric_values"]
                  ) > 1
              }

              if conflict:
                  return (
                      "APPROVED_EXACT_VALUE_CONFLICT"
                  )

              if (
                  present == APPROVED
                  and unique == APPROVED
              ):
                  return (
                      "BOTH_APPROVED_EXACT_UNIQUE_NUMERIC"
                  )

              if (
                  present
                  and unique == present
              ):
                  return (
                      "PARTIAL_APPROVED_EXACT_UNIQUE_NUMERIC"
                  )

              if present:
                  return (
                      "APPROVED_EXACT_PRESENT_NONUNIQUE_OR_NONNUMERIC"
                  )

              return "NO_APPROVED_EXACT"

          def recovery_lane(
              classification,
              deep_status,
          ):
              if deep_status != "OK":
                  return "OFFICIAL_QUERY_INCOMPLETE"

              if classification == (
                  "BOTH_APPROVED_EXACT_UNIQUE_NUMERIC"
              ):
                  return (
                      "RECOVERABLE_BOTH_EXACT_SHADOW_CANDIDATE"
                  )

              if classification == (
                  "PARTIAL_APPROVED_EXACT_UNIQUE_NUMERIC"
              ):
                  return "PARTIAL_ONLY_DO_NOT_PROMOTE"

              if classification == (
                  "APPROVED_EXACT_VALUE_CONFLICT"
              ):
                  return "CONFLICT_FAIL_CLOSED"

              if classification == (
                  "APPROVED_EXACT_PRESENT_NONUNIQUE_OR_NONNUMERIC"
              ):
                  return (
                      "NONUNIQUE_OR_NONNUMERIC_FAIL_CLOSED"
                  )

              return (
                  "NO_APPROVED_EXACT_CURRENT_OFFICIAL_PATH"
              )

          def main():
              api_key = os.environ.get(
                  "DART_API_KEY",
                  "",
              ).strip()

              if not api_key:
                  raise RuntimeError(
                      "V8142_DART_API_KEY_MISSING"
                  )

              for path in (
                  BLOCK_CSV,
                  BLOCK_JSON,
                  V8135_JSON,
                  FIN,
              ):
                  if not path.is_file():
                      raise RuntimeError(
                          "V8142_MISSING_INPUT:"
                          + str(path)
                      )

              subprocess.run(
                  [
                      "git",
                      "merge-base",
                      "--is-ancestor",
                      V8141_RESULT_COMMIT,
                      "HEAD",
                  ],
                  check=True,
              )

              s8141 = read_json(BLOCK_JSON)

              if s8141.get("version") != V8141_VERSION:
                  raise RuntimeError(
                      "V8142_V8141_VERSION_MISMATCH"
                  )

              if s8141.get("status") != (
                  "AUDIT_ONLY_POST_SUPPLY_PRODUCTION_APPLY"
              ):
                  raise RuntimeError(
                      "V8142_V8141_STATUS_MISMATCH"
                  )

              if s8141.get(
                  "policy_version"
              ) != POLICY_VERSION:
                  raise RuntimeError(
                      "V8142_POLICY_VERSION_MISMATCH"
                  )

              if s8141.get(
                  "next_actionable_source_group"
              ) != "EXACT_DA_SOURCE":
                  raise RuntimeError(
                      "V8142_NEXT_GROUP_NOT_EXACT_DA"
                  )

              if int(
                  s8141.get(
                      "next_actionable_single_blocker_count"
                  ) or 0
              ) != 4:
                  raise RuntimeError(
                      "V8142_ACTIONABLE_COUNT_NOT_4"
                  )

              if set(
                  s8141.get(
                      "next_actionable_tickers"
                  ) or []
              ) != set(EXPECTED_ACTIONABLE):
                  raise RuntimeError(
                      "V8142_ACTIONABLE_SET_MISMATCH"
                  )

              if s8141.get("next_step") != (
                  "AUDIT_CURRENT_ACTIONABLE_EXACT_DA_SINGLE_BLOCKERS_V8142"
              ):
                  raise RuntimeError(
                      "V8142_PREDECESSOR_NEXT_STEP_MISMATCH"
                  )

              exhausted = set(
                  (
                      s8141.get(
                          "known_exhausted_evidence"
                      ) or {}
                  ).get(
                      "exact_da_exhausted_union_tickers"
                  ) or []
              )

              if len(exhausted) != 60:
                  raise RuntimeError(
                      "V8142_PRIOR_EXHAUSTED_UNION_NOT_60:"
                      + str(len(exhausted))
                  )

              overlap = (
                  set(EXPECTED_ACTIONABLE)
                  & exhausted
              )

              if overlap:
                  raise RuntimeError(
                      "V8142_ACTIONABLE_OVERLAPS_EXHAUSTED:"
                      + ",".join(sorted(overlap))
                  )

              s8135 = read_json(V8135_JSON)

              if s8135.get(
                  "version"
              ) != V8135_VERSION:
                  raise RuntimeError(
                      "V8142_V8135_VERSION_MISMATCH"
                  )

              if int(
                  s8135.get(
                      "post_audit_exhausted_union_count"
                  ) or 0
              ) != 60:
                  raise RuntimeError(
                      "V8142_V8135_EXHAUSTED_NOT_60"
                  )

              if set(
                  s8135.get(
                      "post_audit_exhausted_union_tickers"
                  ) or []
              ) != exhausted:
                  raise RuntimeError(
                      "V8142_EXHAUSTED_LINEAGE_SET_MISMATCH"
                  )

              block_rows = read_csv(BLOCK_CSV)

              actionable_rows = {
                  ticker(r.get("ticker")): r
                  for r in block_rows
                  if r.get(
                      "source_group"
                  ) == "EXACT_DA_SOURCE"
                  and str(
                      r.get(
                          "single_blocker_ticker"
                      ) or ""
                  ).upper() == "TRUE"
                  and r.get(
                      "recovery_status"
                  ) == (
                      "ACTIONABLE_SINGLE_BLOCKER_REAUDIT"
                  )
              }

              if set(
                  actionable_rows
              ) != set(EXPECTED_ACTIONABLE):
                  raise RuntimeError(
                      "V8142_BLOCK_CSV_ACTIONABLE_SET_MISMATCH:"
                      + ",".join(
                          sorted(actionable_rows)
                      )
                  )

              for (
                  code,
                  expected_name,
              ) in EXPECTED_ACTIONABLE.items():
                  row = actionable_rows[code]

                  if row.get("name") != expected_name:
                      raise RuntimeError(
                          "V8142_TARGET_NAME_MISMATCH:"
                          + code
                          + ":"
                          + str(row.get("name"))
                      )

                  if row.get(
                      "blocker_reason"
                  ) not in {
                      "EV/EBITDA:EV_EBITDA_INPUT:OK:NO_EXACT_CANDIDATE",
                      "EV/EBITDA:EV_EBITDA_INPUT:EMPTY_AS_ZERO:NO_EXACT_CANDIDATE",
                  }:
                      raise RuntimeError(
                          "V8142_UNEXPECTED_EXACT_DA_BLOCKER_REASON:"
                          + code
                          + ":"
                          + str(
                              row.get(
                                  "blocker_reason"
                              )
                          )
                      )

              fin_rows = read_csv(FIN)
              fin_map = {
                  ticker(r.get("ticker")): r
                  for r in fin_rows
                  if ticker(r.get("ticker"))
              }

              for code in EXPECTED_ACTIONABLE:
                  row = fin_map.get(code)
                  if not row:
                      raise RuntimeError(
                          "V8142_FIN_TARGET_MISSING:"
                          + code
                      )

                  if row.get(
                      "corp_identity_status"
                  ) not in {
                      "MATCH",
                      "MATCH_NORMALIZED",
                  }:
                      raise RuntimeError(
                          "V8142_FIN_IDENTITY_NOT_MATCH:"
                          + code
                      )

                  if str(
                      row.get("corp_code") or ""
                  ) != EXPECTED_CORP[code]:
                      raise RuntimeError(
                          "V8142_CORP_CODE_CHANGED:"
                          + code
                      )

              financial_df = src.read_csv(FIN)
              all_targets = src.load_targets(
                  financial_df
              )

              dominant_year, dominant_code = (
                  src.dominant_period(
                      all_targets
                  )
              )
              annual_year = dominant_year - 1
              target_map = {
                  t["ticker"]: t
                  for t in all_targets
              }

              if (
                  dominant_year != 2026
                  or str(dominant_code)
                  != "11012"
              ):
                  raise RuntimeError(
                      "V8142_DOMINANT_PERIOD_CHANGED:"
                      f"{dominant_year}_{dominant_code}"
                  )

              if annual_year != 2025:
                  raise RuntimeError(
                      "V8142_ANNUAL_SOURCE_YEAR_NOT_2025"
                  )

              missing_target = sorted(
                  code
                  for code in EXPECTED_ACTIONABLE
                  if code not in target_map
              )

              if missing_target:
                  raise RuntimeError(
                      "V8142_CURRENT_TARGET_MAPPING_MISSING:"
                      + ",".join(missing_target)
                  )

              for code in EXPECTED_ACTIONABLE:
                  target = target_map[code]
                  if str(
                      target.get(
                          "corp_code"
                      ) or ""
                  ) != EXPECTED_CORP[code]:
                      raise RuntimeError(
                          "V8142_TARGET_MAP_CORP_CODE_CHANGED:"
                          + code
                      )

              client = src.OpenDartClient(
                  api_key,
                  timeout=30,
              )

              out_rows = []
              class_counts = Counter()
              lane_counts = Counter()

              recoverable = []
              partial = []
              no_exact = []
              incomplete = []
              conflict = []

              for code in sorted(
                  EXPECTED_ACTIONABLE
              ):
                  target = target_map[code]

                  fresh = src.fetch_deep_one(
                      client,
                      target,
                      annual_year,
                  )

                  candidates = parse_list(
                      fresh.get("da_json")
                  )
                  stats = exact_stats(candidates)
                  classification = classify(stats)
                  lane = recovery_lane(
                      classification,
                      str(
                          fresh.get("status")
                          or ""
                      ),
                  )

                  dep = stats[
                      "ifrs-full_AdjustmentsForDepreciationExpense"
                  ]
                  amo = stats[
                      "ifrs-full_AdjustmentsForAmortisationExpense"
                  ]

                  out_rows.append({
                      "ticker": code,
                      "name": (
                          EXPECTED_ACTIONABLE[
                              code
                          ]
                      ),
                      "corp_code": (
                          target.get(
                              "corp_code"
                          ) or ""
                      ),
                      "preferred_fs_div": (
                          target.get(
                              "preferred_fs_div"
                          ) or ""
                      ),
                      "dominant_financial_period": (
                          f"{dominant_year}_{dominant_code}"
                      ),
                      "annual_source_year": (
                          annual_year
                      ),
                      "fresh_deep_status": (
                          fresh.get(
                              "status"
                          ) or ""
                      ),
                      "fresh_deep_fs_div": (
                          fresh.get(
                              "fs_div"
                          ) or ""
                      ),
                      "fresh_deep_message": (
                          fresh.get(
                              "message"
                          ) or ""
                      ),
                      "fresh_exact_classification": (
                          classification
                      ),
                      "recovery_lane": lane,
                      "approved_depreciation_occurrences": (
                          dep[
                              "occurrence_count"
                          ]
                      ),
                      "approved_depreciation_values_json": json.dumps(
                          dep[
                              "unique_numeric_values"
                          ],
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                      "approved_amortisation_occurrences": (
                          amo[
                              "occurrence_count"
                          ]
                      ),
                      "approved_amortisation_values_json": json.dumps(
                          amo[
                              "unique_numeric_values"
                          ],
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                      "fresh_exact_stats_json": json.dumps(
                          stats,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                      "fresh_da_candidates_json": json.dumps(
                          candidates,
                          ensure_ascii=False,
                          separators=(",", ":"),
                      ),
                  })

                  class_counts[
                      classification
                  ] += 1
                  lane_counts[lane] += 1

                  if lane == (
                      "RECOVERABLE_BOTH_EXACT_SHADOW_CANDIDATE"
                  ):
                      recoverable.append(code)

                  elif lane == (
                      "PARTIAL_ONLY_DO_NOT_PROMOTE"
                  ):
                      partial.append(code)

                  elif lane == (
                      "NO_APPROVED_EXACT_CURRENT_OFFICIAL_PATH"
                  ):
                      no_exact.append(code)

                  elif lane == (
                      "OFFICIAL_QUERY_INCOMPLETE"
                  ):
                      incomplete.append(code)

                  elif lane in {
                      "CONFLICT_FAIL_CLOSED",
                      "NONUNIQUE_OR_NONNUMERIC_FAIL_CLOSED",
                  }:
                      conflict.append(code)

                  time.sleep(0.20)

              if len(out_rows) != 4:
                  raise RuntimeError(
                      "V8142_OUTPUT_COUNT_NOT_4:"
                      + str(len(out_rows))
                  )

              if incomplete:
                  raise RuntimeError(
                      "V8142_OFFICIAL_QUERY_INCOMPLETE:"
                      + ",".join(
                          sorted(incomplete)
                      )
                  )

              if (
                  int(client.attempted) != 4
                  or int(client.successful) != 4
              ):
                  raise RuntimeError(
                      "V8142_OPENDART_REQUEST_COUNT_BAD:"
                      f"{client.attempted}:"
                      f"{client.successful}"
                  )

              if (
                  client.transport_failures
                  or client.dart_status_failures
              ):
                  raise RuntimeError(
                      "V8142_OPENDART_FAILURE_PRESENT"
                  )

              OUT_CSV.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              fields = list(
                  out_rows[0].keys()
              )

              with OUT_CSV.open(
                  "w",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  w = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      lineterminator="\n",
                  )
                  w.writeheader()
                  w.writerows(out_rows)

              if partial or conflict:
                  next_step = (
                      "REVIEW_EXACT_DA_AMBIGUITY_BEFORE_CONTINUING"
                  )
              elif recoverable:
                  next_step = (
                      "FREEZE_RECOVERABLE_EXACT_DA_AND_SHADOW_SCORE_V8143"
                  )
              else:
                  next_step = (
                      "AUDIT_CURRENT_ACTIONABLE_SCORE_CACHE_SINGLE_BLOCKER_V8143"
                  )

              post_exhausted = (
                  exhausted
                  | set(no_exact)
              )

              summary = {
                  "version": VERSION,
                  "generated_at_kst": datetime.now(
                      KST
                  ).isoformat(
                      timespec="seconds"
                  ),
                  "status": (
                      "AUDIT_ONLY_CURRENT_ACTIONABLE_EXACT_DA"
                  ),
                  "policy_version": (
                      POLICY_VERSION
                  ),
                  "v8141_version": (
                      V8141_VERSION
                  ),
                  "v8141_result_commit": (
                      V8141_RESULT_COMMIT
                  ),
                  "v8135_version": (
                      V8135_VERSION
                  ),
                  "approved_exact_account_ids": sorted(
                      APPROVED
                  ),
                  "target_count": 4,
                  "target_tickers": sorted(
                      EXPECTED_ACTIONABLE
                  ),
                  "target_names": [
                      EXPECTED_ACTIONABLE[x]
                      for x in sorted(
                          EXPECTED_ACTIONABLE
                      )
                  ],
                  "prior_exhausted_not_requeried_count": len(
                      exhausted
                  ),
                  "prior_exhausted_not_requeried_tickers": sorted(
                      exhausted
                  ),
                  "dominant_financial_period": (
                      f"{dominant_year}_{dominant_code}"
                  ),
                  "annual_source_year": (
                      annual_year
                  ),
                  "current_target_available_count": 4,
                  "current_target_missing_count": 0,
                  "current_target_missing_tickers": [],
                  "classification_counts": dict(
                      class_counts
                  ),
                  "recovery_lane_counts": dict(
                      lane_counts
                  ),
                  "both_approved_exact_recoverable_count": len(
                      recoverable
                  ),
                  "both_approved_exact_recoverable_tickers": sorted(
                      recoverable
                  ),
                  "partial_only_count": len(
                      partial
                  ),
                  "partial_only_tickers": sorted(
                      partial
                  ),
                  "no_approved_exact_count": len(
                      no_exact
                  ),
                  "no_approved_exact_tickers": sorted(
                      no_exact
                  ),
                  "newly_exhausted_no_approved_exact_count": len(
                      no_exact
                  ),
                  "newly_exhausted_no_approved_exact_tickers": sorted(
                      no_exact
                  ),
                  "post_audit_exhausted_union_count": len(
                      post_exhausted
                  ),
                  "post_audit_exhausted_union_tickers": sorted(
                      post_exhausted
                  ),
                  "official_query_incomplete_count": 0,
                  "official_query_incomplete_tickers": [],
                  "conflict_or_nonunique_count": len(
                      conflict
                  ),
                  "conflict_or_nonunique_tickers": sorted(
                      conflict
                  ),
                  "opendart_attempted_requests": int(
                      client.attempted
                  ),
                  "opendart_successful_requests": int(
                      client.successful
                  ),
                  "opendart_transport_failure_count": 0,
                  "opendart_dart_status_failure_count": 0,
                  "secondary_actionable_score_cache_tickers": [
                      "365550"
                  ],
                  "hard_guards": {
                      "production_source_cache_modified": False,
                      "production_source_run_log_modified": False,
                      "production_financial_cache_modified": False,
                      "production_price_elasticity_cache_modified": False,
                      "production_ocf_cache_modified": False,
                      "production_supply_source_modified": False,
                      "production_api_modified": False,
