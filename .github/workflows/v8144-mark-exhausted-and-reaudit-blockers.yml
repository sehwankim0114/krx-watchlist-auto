      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_current_blocker_reaudit_v8144.py",
              "latest/investment_score_current_blockers_v8144.csv",
              "latest/investment_score_current_blockers_v8144_summary_latest.json",
              "latest/investment_score_current_blockers_v8144_run_log_latest.txt",
              "docs/investment_score_current_blockers_v8144.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  [
                      "git",
                      "status",
                      "--porcelain",
                      "--untracked-files=all",
                  ],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(
              changed - allowed
          )
          if unexpected:
              raise SystemExit(
                  "V8144_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )

          print(
              "V8144_CHANGED_FILES_RESTRICTED=PASS"
          )
          PY

      - name: Refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_ocf_source_latest.csv",
              "latest/investment_score_supply_source_latest.csv",
              "latest/investment_score_current_blockers_v8141.csv",
              "latest/investment_score_current_blockers_v8141_summary_latest.json",
              "latest/investment_score_exact_da_actionable_v8142_summary_latest.json",
              "latest/investment_score_score_cache_actionable_v8143_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "HEAD..origin/main",
                  ],
                  text=True,
              ).splitlines()
          )

          dangerous = sorted(
              p
              for p in upstream
              if p in protected
              or p.startswith(
                  "api/two_table_v1/"
              )
          )

          if dangerous:
              raise SystemExit(
                  "V8144_CONCURRENT_PROTECTED_DRIFT:"
                  + ",".join(dangerous)
              )

          print(
              "V8144_NO_CONCURRENT_PROTECTED_DRIFT=PASS"
          )
          PY

