name: Mark exhausted score-cache Q2 path and reaudit blockers v8.14.4

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8144-mark-exhausted-and-reaudit-blockers.yml"

permissions:
  contents: write

concurrency:
  group: v8144-mark-exhausted-and-reaudit-blockers
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify lineage and capture protected state
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            76b8ae6c544bf13678794def600e2111d2f2ddd1 HEAD

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            latest/investment_score_current_blockers_v8141.csv \
            latest/investment_score_current_blockers_v8141_summary_latest.json \
            latest/investment_score_exact_da_actionable_v8142_summary_latest.json \
            latest/investment_score_score_cache_actionable_v8143_summary_latest.json \
            > /tmp/v8144_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8144_api.before

          echo "V8144_LINEAGE=PASS"

      - name: Create and run V8.14.4 exhaustion-aware blocker reaudit
        shell: bash
        run: |
          set -euo pipefail

          cat > investment_score_current_blocker_reaudit_v8144.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import json
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_dry_run_v882 as scorer

          VERSION = "2026-09-22-v8.14.4-exhaustion-aware-current-blocker-reaudit"
          POLICY_VERSION = "2026-09-13-v8.8.0-explicit-100-point-scoring-contract"
          V8142_VERSION = "2026-09-22-v8.14.2-current-actionable-exact-da-single-blocker-audit"
          V8143_VERSION = "2026-09-22-v8.14.3-esr-kendall-q2-score-cache-audit"
          V8143_RESULT_COMMIT = "76b8ae6c544bf13678794def600e2111d2f2ddd1"

          ROOT = Path(".")
          KST = ZoneInfo("Asia/Seoul")

          DA_JSON = ROOT / "latest/investment_score_exact_da_actionable_v8142_summary_latest.json"
          SCORE_CACHE_JSON = ROOT / "latest/investment_score_score_cache_actionable_v8143_summary_latest.json"
          V8104_JSON = ROOT / "latest/investment_score_next_single_source_v8104_summary_latest.json"

          TMP_CSV = Path("/tmp/v8144_score.csv")
          TMP_JSON = Path("/tmp/v8144_score_summary.json")
          TMP_LOG = Path("/tmp/v8144_score.log")
          TMP_DOC = Path("/tmp/v8144_score.md")

          OUT_CSV = ROOT / "latest/investment_score_current_blockers_v8144.csv"
          OUT_JSON = ROOT / "latest/investment_score_current_blockers_v8144_summary_latest.json"
          OUT_LOG = ROOT / "latest/investment_score_current_blockers_v8144_run_log_latest.txt"
          OUT_DOC = ROOT / "docs/investment_score_current_blockers_v8144.md"

          EXPECTED_UNIVERSE = 149
          EXPECTED_READY = 27
          EXPECTED_LIMITED = 122
          EXPECTED_BLOCKERS = 724

          ESR_TICKER = "365550"
          ESR_REASON = "최근 분기 실적 가속·둔화:MISSING_ACCEL_INPUT"

          def ticker(value):
              s = "".join(
                  ch for ch in str(value or "")
                  if ch.isdigit()
              )
              return s.zfill(6) if s else ""

          def read_json(path):
              return json.loads(
                  Path(path).read_text(
                      encoding="utf-8-sig"
                  )
              )

          def read_rows(path):
              with Path(path).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  return list(csv.DictReader(f))

          def split_reasons(text):
              return [
                  x
                  for x in str(text or "").split(";")
                  if x
              ]

          def classify(reason):
              if reason == (
                  "수급·공시부담:SUPPLY_LIMITED_NO_POSITIVE_EVIDENCE"
              ):
                  return (
                      "SOURCE_EVIDENCE_GAP",
                      "PRODUCTION_ANALYSIS_SUPPLY",
                      "공시·수급 없음 판정을 확정할 만큼 source completeness가 부족함",
                  )

              if reason == (
                  "최근 분기 실적 가속·둔화:ANNUAL_OP_DENOM_NONPOSITIVE"
              ):
                  return (
                      "POLICY_SEMANTIC_BLOCKER",
                      "V880_SCORING_CONTRACT",
                      "전년도 연간 영업이익 분모가 비양수이며 승인 계약상 의미 blocker",
                  )

              if reason.startswith(("PER:", "PBR:")):
                  return (
                      "SOURCE_DATA_GAP",
                      "FINANCIAL_VALUATION_CACHE",
                      "밸류에이션 또는 관련 이익·ROE 입력 보강 필요",
                  )

              if reason.startswith("EV/EBITDA:"):
                  tail = reason.split(
                      "EV/EBITDA:",
                      1,
                  )[1]
                  parts = tail.split(":")
                  debt_status = (
                      parts[-2]
                      if len(parts) >= 2
                      else ""
                  )
                  da_status = (
                      parts[-1]
                      if parts
                      else ""
                  )

                  if da_status == "NO_EXACT_CANDIDATE":
                      return (
                          "SOURCE_DATA_GAP",
                          "EXACT_DA_SOURCE",
                          "승인 exact D&A 원천 부족; "
                          f"debt_status={debt_status}, "
                          f"da_status={da_status}",
                      )

                  if debt_status == "NO_EXACT_CANDIDATE":
                      return (
                          "SOURCE_DATA_GAP",
                          "EXACT_CORE_DEBT_SOURCE",
                          "승인 exact core-debt 원천 부족; "
                          f"debt_status={debt_status}, "
                          f"da_status={da_status}",
                      )

                  if (
                      debt_status in {
                          "OK",
                          "EMPTY_AS_ZERO",
                      }
                      and da_status in {
                          "OK",
                          "EMPTY_AS_ZERO",
                      }
                  ):
                      return (
                          "SOURCE_DATA_GAP",
                          "EV_EBITDA_OTHER_INPUT",
                          "D&A/debt exact 상태 통과 후 다른 EV/EBITDA 입력 점검 필요",
                      )

                  return (
                      "SOURCE_DATA_GAP",
                      "EV_EBITDA_INPUT",
                      "EV/EBITDA 입력 상태 재감사 필요: "
                      + tail,
                  )

              if reason.startswith(
                  "PSR 또는 대체 가치지표:"
              ):
                  return (
                      "SOURCE_DATA_GAP",
                      "FINANCIAL_AND_RAW_SOURCE",
                      "시가총액 또는 연간 매출 입력 보강 필요",
                  )

              if reason.startswith((
                  "매출 성장과 안정성:",
                  "최근 3년 매출 성장률:",
                  "최근 3년 영업이익 성장률:",
                  "최근 분기 실적 가속·둔화:MISSING_ACCEL_INPUT",
              )):
                  return (
                      "SOURCE_DATA_GAP",
                      "INVESTMENT_SCORE_SOURCE_CACHE",
                      "연간/분기 재무 raw source 보강 필요",
                  )

              if reason.startswith((
                  "영업이익 성장과 흑자 여부:",
                  "순이익 흐름:",
                  "영업이익률:",
                  "ROE:",
                  "부채비율:",
                  "흑자 지속성과 이익 안정성:",
              )):
                  return (
                      "SOURCE_DATA_GAP",
                      "FINANCIAL_VALUATION_CACHE",
                      "재무·수익성 cache 입력 보강 필요",
                  )

              if reason.startswith(
                  "영업현금흐름:"
              ):
                  return (
                      "SOURCE_DATA_GAP",
                      "OCF_AND_REVENUE_SOURCE",
                      "영업현금흐름 또는 연간 매출 입력 보강 필요",
                  )

              if reason.startswith((
                  "1개월 가격흐름:",
                  "3개월 가격흐름:",
                  "기간 저가·고가 대비 현재위치:",
                  "과열·급락 위험:",
                  "20일 평균 거래대금과 거래량:",
              )):
                  return (
                      "SOURCE_DATA_GAP",
                      "PRODUCTION_PRICE_METRICS",
                      "가격·스윙·ATR·거래활동 metric 보강 필요",
                  )

              if reason.startswith(
                  "하루평균 절대등락률:"
              ):
                  return (
                      "SOURCE_DATA_GAP",
                      "PRICE_ELASTICITY_20D",
                      "20거래일 가격탄력 source 보강 필요",
                  )

              if reason.startswith(
                  "순현금·기업가치 상태:"
              ):
                  return (
                      "SOURCE_DATA_GAP",
                      "NETCASH_INPUT",
                      "시가총액·현금·승인 core debt 원천 보강 필요",
                  )

              return (
                  "UNCLASSIFIED_REVIEW",
                  "UNKNOWN",
                  "자동 분류되지 않은 blocker이므로 사람 검토 필요",
              )

          def recovery_status(
              code,
              reason,
              source_group,
              single,
              da_exhausted,
              v8104_exhausted,
          ):
              if source_group == (
                  "V880_SCORING_CONTRACT"
              ):
                  return (
                      "POLICY_SEMANTIC_DEFER"
                  )

              if (
                  source_group == "EXACT_DA_SOURCE"
                  and code in da_exhausted
              ):
                  return (
                      "EXHAUSTED_APPROVED_OFFICIAL_DA_PATHS"
                  )

              if (
                  code == ESR_TICKER
                  and source_group
                  == "INVESTMENT_SCORE_SOURCE_CACHE"
                  and reason == ESR_REASON
              ):
                  return (
                      "EXHAUSTED_OFFICIAL_Q2_ACCEL_PATH"
                  )

              if code in v8104_exhausted:
                  if (
                      code == "001020"
                      and source_group
                      == "PRODUCTION_PRICE_METRICS"
                  ):
                      return (
                          "EXHAUSTED_V8104_OFFICIAL_KRX_OHLC_INCOMPLETE"
                      )
                  if (
                      code == "357250"
                      and source_group
                      == "INVESTMENT_SCORE_SOURCE_CACHE"
                  ):
                      return (
                          "EXHAUSTED_V8104_OFFICIAL_FULL_ACCOUNT_INCOMPLETE"
                      )

              if single:
                  return (
                      "ACTIONABLE_SINGLE_BLOCKER_REAUDIT"
                  )

              return (
                  "MULTI_BLOCKER_SOURCE_LANE"
              )

          def run_scorer():
              old = {
                  "VERSION": scorer.VERSION,
                  "OUT_CSV": scorer.OUT_CSV,
                  "OUT_JSON": scorer.OUT_JSON,
                  "OUT_LOG": scorer.OUT_LOG,
                  "OUT_DOC": scorer.OUT_DOC,
              }
              try:
                  scorer.VERSION = VERSION
                  scorer.OUT_CSV = TMP_CSV
                  scorer.OUT_JSON = TMP_JSON
                  scorer.OUT_LOG = TMP_LOG
                  scorer.OUT_DOC = TMP_DOC
                  rc = scorer.main()
              finally:
                  for key, value in old.items():
                      setattr(
                          scorer,
                          key,
                          value,
                      )

              if rc not in (None, 0):
                  raise RuntimeError(
                      "V8144_SCORER_FAILED:"
                      + str(rc)
                  )

          def main():
              for p in (
                  DA_JSON,
                  SCORE_CACHE_JSON,
                  V8104_JSON,
              ):
                  if not p.is_file():
                      raise RuntimeError(
                          "V8144_MISSING_INPUT:"
                          + str(p)
                      )

              s8142 = read_json(DA_JSON)
              s8143 = read_json(
                  SCORE_CACHE_JSON
              )
              s8104 = read_json(V8104_JSON)

              if s8142.get(
                  "version"
              ) != V8142_VERSION:
                  raise RuntimeError(
                      "V8144_V8142_VERSION_MISMATCH"
                  )

              da_exhausted = set(
                  s8142.get(
                      "post_audit_exhausted_union_tickers"
                  ) or []
              )
              if len(da_exhausted) != 64:
                  raise RuntimeError(
                      "V8144_DA_EXHAUSTED_UNION_NOT_64"
                  )

              if int(
                  s8142.get(
                      "post_audit_exhausted_union_count"
                  ) or 0
              ) != 64:
                  raise RuntimeError(
                      "V8144_DA_EXHAUSTED_COUNT_NOT_64"
                  )

              if s8143.get(
                  "version"
              ) != V8143_VERSION:
                  raise RuntimeError(
                      "V8144_V8143_VERSION_MISMATCH"
                  )

              if s8143.get(
                  "classification"
              ) != (
                  "NO_COMPLETE_OFFICIAL_Q2_ACCEL_INPUT_PATH"
              ):
                  raise RuntimeError(
                      "V8144_ESR_Q2_NOT_EXHAUSTED"
                  )

              if s8143.get(
                  "next_step"
              ) != (
                  "MARK_SCORE_CACHE_Q2_PATH_EXHAUSTED_AND_REAUDIT_V8144"
              ):
                  raise RuntimeError(
                      "V8144_PREDECESSOR_NEXT_STEP_MISMATCH"
                  )

              if (
                  s8143.get(
                      "multi_account_audit",
                      {},
                  ).get(
                      "required_accel_inputs_recoverable"
                  )
                  is not False
              ):
                  raise RuntimeError(
                      "V8144_MULTI_PATH_UNEXPECTEDLY_RECOVERABLE"
                  )

              if (
                  s8143.get(
                      "full_account_audit",
                      {},
                  ).get(
                      "required_accel_inputs_recoverable"
                  )
                  is not False
              ):
                  raise RuntimeError(
                      "V8144_FULL_PATH_UNEXPECTEDLY_RECOVERABLE"
                  )

              if s8104.get(
                  "version"
              ) != (
                  "2026-09-15-v8.10.4-next-single-source-recoverability-audit"
              ):
                  raise RuntimeError(
                      "V8144_V8104_VERSION_MISMATCH"
                  )

              v8104_exhausted = set(
                  s8104.get(
                      "not_recoverable_now_tickers"
                  ) or []
              )
              if v8104_exhausted != {
                  "001020",
                  "357250",
              }:
                  raise RuntimeError(
                      "V8144_V8104_EXHAUSTED_SET_CHANGED"
                  )

              run_scorer()

              rows = read_rows(TMP_CSV)
              score_summary = read_json(
                  TMP_JSON
              )

              if len(rows) != EXPECTED_UNIVERSE:
                  raise RuntimeError(
                      "V8144_SCORER_UNIVERSE_NOT_149"
                  )

              ready = [
                  r
                  for r in rows
                  if r.get("score_status")
                  == "READY"
              ]
              limited = [
                  r
                  for r in rows
                  if r.get("score_status")
                  == "LIMITED"
              ]

              if (
                  len(ready),
                  len(limited),
              ) != (
                  EXPECTED_READY,
                  EXPECTED_LIMITED,
              ):
                  raise RuntimeError(
                      "V8144_READY_LIMITED_MISMATCH:"
                      f"{len(ready)}:"
                      f"{len(limited)}"
                  )

              if int(
                  score_summary.get(
                      "ready_count"
                  ) or 0
              ) != EXPECTED_READY:
                  raise RuntimeError(
                      "V8144_SCORE_SUMMARY_READY_NOT_27"
                  )

              if int(
                  score_summary.get(
                      "limited_count"
                  ) or 0
              ) != EXPECTED_LIMITED:
                  raise RuntimeError(
                      "V8144_SCORE_SUMMARY_LIMITED_NOT_122"
                  )

              out_rows = []
              category_counter = Counter()
              source_counter = Counter()
              source_tickers = defaultdict(set)
              single_counter = Counter()
              actionable_single_counter = Counter()
              actionable_single_tickers = defaultdict(set)
              multi_counter = Counter()
              multi_tickers = defaultdict(set)
              recovery_counter = Counter()

              for row in limited:
                  reasons = split_reasons(
                      row.get(
                          "missing_components"
                      )
                  )
                  code = ticker(
                      row.get("ticker")
                  )

                  if not reasons:
                      raise RuntimeError(
                          "V8144_LIMITED_WITHOUT_REASON:"
                          + code
                      )

                  single = len(reasons) == 1

                  for reason in reasons:
                      (
                          category,
                          group,
                          note,
                      ) = classify(reason)

                      if group == "UNKNOWN":
                          raise RuntimeError(
                              "V8144_UNCLASSIFIED_REASON:"
                              + code
                              + ":"
                              + reason
                          )

                      status = recovery_status(
                          code,
                          reason,
                          group,
                          single,
                          da_exhausted,
                          v8104_exhausted,
                      )

                      category_counter[
                          category
                      ] += 1
                      source_counter[
                          group
                      ] += 1
                      source_tickers[
                          group
                      ].add(code)
                      recovery_counter[
                          status
                      ] += 1

                      if single:
                          single_counter[
                              group
                          ] += 1

                          if status == (
                              "ACTIONABLE_SINGLE_BLOCKER_REAUDIT"
                          ):
                              actionable_single_counter[
                                  group
                              ] += 1
                              actionable_single_tickers[
                                  group
                              ].add(code)

                      else:
                          multi_counter[
                              group
                          ] += 1
                          multi_tickers[
                              group
                          ].add(code)

                      out_rows.append({
                          "ticker": code,
                          "name": row.get(
                              "name"
                          ) or "",
                          "market": row.get(
                              "market"
                          ) or "",
                          "missing_component_count": len(
                              reasons
                          ),
                          "blocker_reason": reason,
                          "blocker_category": category,
                          "source_group": group,
                          "single_blocker_ticker": (
                              "TRUE"
                              if single
                              else "FALSE"
                          ),
                          "recovery_status": status,
                          "audit_note": note,
                      })

              if len(
                  out_rows
              ) != EXPECTED_BLOCKERS:
                  raise RuntimeError(
                      "V8144_BLOCKER_COUNT_NOT_724:"
                      + str(
                          len(out_rows)
                      )
                  )

              if sum(
                  actionable_single_counter.values()
              ) != 0:
                  raise RuntimeError(
                      "V8144_ACTIONABLE_SINGLE_BLOCKERS_REMAIN:"
                      + str(
                          dict(
                              actionable_single_counter
                          )
                      )
                  )

              if recovery_counter[
                  "EXHAUSTED_APPROVED_OFFICIAL_DA_PATHS"
              ] != 48:
                  raise RuntimeError(
                      "V8144_EXHAUSTED_SINGLE_DA_NOT_48:"
                      + str(
                          recovery_counter[
                              "EXHAUSTED_APPROVED_OFFICIAL_DA_PATHS"
                          ]
                      )
                  )

              if recovery_counter[
                  "EXHAUSTED_OFFICIAL_Q2_ACCEL_PATH"
              ] != 1:
                  raise RuntimeError(
                      "V8144_ESR_EXHAUSTED_COUNT_NOT_1"
                  )

              # All single-blocker lanes are now exhausted or semantic.
              # Move to the multi-blocker source group with the largest
              # current blocker occurrence count.
              multi_priority = []
              for group, count in source_counter.items():
                  m_count = int(
                      multi_counter.get(
                          group,
                          0,
                      )
                  )
                  if m_count <= 0:
                      continue
                  if group == (
                      "V880_SCORING_CONTRACT"
                  ):
                      continue
                  multi_priority.append({
                      "source_group": group,
                      "blocker_occurrences": count,
                      "multi_blocker_occurrences": m_count,
                      "multi_blocker_ticker_count": len(
                          multi_tickers[group]
                      ),
                      "all_ticker_count": len(
                          source_tickers[group]
                      ),
                  })

              multi_priority.sort(
                  key=lambda x: (
                      -x[
                          "multi_blocker_occurrences"
                      ],
                      -x[
                          "multi_blocker_ticker_count"
                      ],
                      x["source_group"],
                  )
              )

              if not multi_priority:
                  raise RuntimeError(
                      "V8144_NO_MULTI_BLOCKER_GROUP"
                  )

              next_multi = multi_priority[0]

              if next_multi[
                  "source_group"
              ] != "FINANCIAL_VALUATION_CACHE":
                  raise RuntimeError(
                      "V8144_NEXT_MULTI_GROUP_CHANGED:"
                      + next_multi[
                          "source_group"
                      ]
                  )

              if next_multi[
                  "multi_blocker_occurrences"
              ] != 293:
                  raise RuntimeError(
                      "V8144_NEXT_MULTI_COUNT_CHANGED:"
                      + str(
                          next_multi[
                              "multi_blocker_occurrences"
                          ]
                      )
                  )

              if next_multi[
                  "multi_blocker_ticker_count"
              ] != 38:
                  raise RuntimeError(
                      "V8144_NEXT_MULTI_TICKER_COUNT_CHANGED:"
                      + str(
                          next_multi[
                              "multi_blocker_ticker_count"
                          ]
                      )
                  )

              out_rows.sort(
                  key=lambda r: (
                      int(
                          r[
                              "missing_component_count"
                          ]
                      ),
                      r["ticker"],
                      r["blocker_reason"],
                  )
              )

              OUT_CSV.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )

              fields = list(
                  out_rows[0].keys()
              )

              with OUT_CSV.open(
                  "w",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  w = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      lineterminator="\n",
                  )
                  w.writeheader()
                  w.writerows(out_rows)

              source_priority = []
              for (
                  group,
                  count,
              ) in source_counter.most_common():
                  source_priority.append({
                      "source_group": group,
                      "blocker_occurrences": count,
                      "ticker_count": len(
                          source_tickers[
                              group
                          ]
                      ),
                      "single_blocker_tickers": (
                          single_counter.get(
                              group,
                              0,
                          )
                      ),
                      "actionable_single_blocker_tickers": (
