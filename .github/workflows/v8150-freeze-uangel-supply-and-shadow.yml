name: Freeze UANGEL supply and shadow score v8.15.0

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8150-freeze-uangel-supply-and-shadow.yml"

permissions:
  contents: write

concurrency:
  group: v8150-freeze-uangel-supply-shadow
  cancel-in-progress: false

jobs:
  freeze-shadow:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V8.14.9 lineage and capture protected state
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            033f52882613d1baff58298bbfb1d4c4d9a6ddff HEAD

          sha256sum \
            config/investment_score_policy_v880.json \
            supply_burden_enricher.py \
            investment_score_dry_run_v882.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            latest/investment_score_supply_source_latest.json \
            latest/investment_score_supply_actionable_v8149.csv \
            latest/investment_score_supply_actionable_v8149_summary_latest.json \
            > /tmp/v8150_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8150_api.before

          echo "V8150_LINEAGE=PASS"

      - name: Create and run V8.15.0 supply freeze and shadow scorer
        shell: bash
        run: |
          set -euo pipefail

          cat > investment_score_supply_shadow_v8150.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import copy
          import csv
          import json
          import subprocess
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_dry_run_v882 as scorer

          VERSION = "2026-09-22-v8.15.0-freeze-uangel-supply-and-shadow-score"
          POLICY_VERSION = "2026-09-13-v8.8.0-explicit-100-point-scoring-contract"
          SUPPLY_POLICY_VERSION = "2026-07-01-v6.0-supply-status-separated"
          V8149_VERSION = "2026-09-22-v8.14.9-uangel-current-actionable-supply-audit"
          V8149_RESULT_COMMIT = "033f52882613d1baff58298bbfb1d4c4d9a6ddff"

          ROOT = Path(".")
          KST = ZoneInfo("Asia/Seoul")

          AUDIT_CSV = ROOT / "latest/investment_score_supply_actionable_v8149.csv"
          AUDIT_JSON = ROOT / "latest/investment_score_supply_actionable_v8149_summary_latest.json"
          PROD_SUPPLY = ROOT / "latest/investment_score_supply_source_latest.csv"

          SOURCE_OUT = ROOT / "latest/investment_score_supply_source_v8150.csv"
          COMPARE_OUT = ROOT / "latest/investment_score_supply_shadow_v8150.csv"
          SUMMARY_OUT = ROOT / "latest/investment_score_supply_shadow_v8150_summary_latest.json"
          LOG_OUT = ROOT / "latest/investment_score_supply_shadow_v8150_run_log_latest.txt"
          DOC_OUT = ROOT / "docs/investment_score_supply_shadow_v8150.md"

          BASE_CSV = Path("/tmp/v8150_baseline_score.csv")
          BASE_JSON = Path("/tmp/v8150_baseline_score.json")
          BASE_LOG = Path("/tmp/v8150_baseline_score.log")
          BASE_DOC = Path("/tmp/v8150_baseline_score.md")
          SHADOW_CSV = Path("/tmp/v8150_shadow_score.csv")
          SHADOW_JSON = Path("/tmp/v8150_shadow_score.json")
          SHADOW_LOG = Path("/tmp/v8150_shadow_score.log")
          SHADOW_DOC = Path("/tmp/v8150_shadow_score.md")

          TARGET = "072130"
          TARGET_NAME = "유엔젤"
          TARGET_CORP_CODE = "00416654"
          SUPPLY_REASON = "수급·공시부담:SUPPLY_LIMITED_NO_POSITIVE_EVIDENCE"

          def ticker(value):
              s = "".join(
                  ch for ch in str(value or "")
                  if ch.isdigit()
              )
              return s.zfill(6) if s else ""

          def read_json(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8-sig")
              )

          def read_rows(path):
              with Path(path).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  return list(csv.DictReader(f))

          def write_rows(path, rows, fields=None):
              path = Path(path)
              path.parent.mkdir(parents=True, exist_ok=True)
              if fields is None:
                  fields = list(rows[0].keys()) if rows else []
              with path.open(
                  "w",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  w = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      lineterminator="\n",
                  )
                  w.writeheader()
                  w.writerows(rows)

          def split_missing(text):
              return [
                  x
                  for x in str(text or "").split(";")
                  if x
              ]

          def stable(row):
              return json.dumps(
                  row,
                  ensure_ascii=False,
                  sort_keys=True,
                  separators=(",", ":"),
              )

          def run_scorer(
              prod_rows,
              out_csv,
              out_json,
              out_log,
              out_doc,
          ):
              original = scorer.production_rows
              old = {
                  "VERSION": scorer.VERSION,
                  "OUT_CSV": scorer.OUT_CSV,
                  "OUT_JSON": scorer.OUT_JSON,
                  "OUT_LOG": scorer.OUT_LOG,
                  "OUT_DOC": scorer.OUT_DOC,
              }
              try:
                  scorer.VERSION = VERSION
                  scorer.OUT_CSV = Path(out_csv)
                  scorer.OUT_JSON = Path(out_json)
                  scorer.OUT_LOG = Path(out_log)
                  scorer.OUT_DOC = Path(out_doc)
                  scorer.production_rows = lambda: copy.deepcopy(
                      prod_rows
                  )
                  rc = scorer.main()
              finally:
                  scorer.production_rows = original
                  for key, value in old.items():
                      setattr(scorer, key, value)

              if rc not in (None, 0):
                  raise RuntimeError(
                      "V8150_SCORER_FAILED:" + str(rc)
                  )

          def main():
              for p in (
                  AUDIT_CSV,
                  AUDIT_JSON,
                  PROD_SUPPLY,
              ):
                  if not p.is_file():
                      raise RuntimeError(
                          "V8150_MISSING_INPUT:" + str(p)
                      )

              subprocess.run(
                  [
                      "git",
                      "merge-base",
                      "--is-ancestor",
                      V8149_RESULT_COMMIT,
                      "HEAD",
                  ],
                  check=True,
              )

              audit = read_json(AUDIT_JSON)

              if audit.get("version") != V8149_VERSION:
                  raise RuntimeError(
                      "V8150_V8149_VERSION_MISMATCH"
                  )
              if audit.get("status") != (
                  "AUDIT_ONLY_CURRENT_ACTIONABLE_SUPPLY"
              ):
                  raise RuntimeError(
                      "V8150_V8149_STATUS_MISMATCH"
                  )
              if audit.get("policy_version") != POLICY_VERSION:
                  raise RuntimeError(
                      "V8150_POLICY_VERSION_MISMATCH"
                  )
              if audit.get("supply_policy_version") != (
                  SUPPLY_POLICY_VERSION
              ):
                  raise RuntimeError(
                      "V8150_SUPPLY_POLICY_VERSION_MISMATCH"
                  )
              if audit.get("target_tickers") != [TARGET]:
                  raise RuntimeError(
                      "V8150_TARGET_CHANGED"
                  )
              if int(
                  audit.get("complete_180d_count") or 0
              ) != 1:
                  raise RuntimeError(
                      "V8150_QUERY_NOT_COMPLETE"
                  )
              if int(
                  audit.get("incomplete_180d_count") or 0
              ) != 0:
                  raise RuntimeError(
                      "V8150_INCOMPLETE_NOT_ZERO"
                  )
              if int(
                  audit.get("source_overlay_candidate_count") or 0
              ) != 1:
                  raise RuntimeError(
                      "V8150_OVERLAY_CANDIDATE_NOT_1"
                  )
              if int(
                  audit.get("complete_180d_positive_burden_count")
                  or 0
              ) != 1:
                  raise RuntimeError(
                      "V8150_POSITIVE_BURDEN_NOT_1"
                  )
              if audit.get("proposed_supply_status") != "OK":
                  raise RuntimeError(
                      "V8150_PROPOSED_STATUS_NOT_OK"
                  )
              if audit.get("proposed_supply_level") != "경계":
                  raise RuntimeError(
                      "V8150_PROPOSED_LEVEL_NOT_WARNING"
                  )
              if set(
                  audit.get("risk_keywords") or []
              ) != {
                  "대량보유",
                  "주요주주변동",
              }:
                  raise RuntimeError(
                      "V8150_RISK_KEYWORDS_CHANGED"
                  )
              if audit.get("next_step") != (
                  "FREEZE_UANGEL_SUPPLY_AND_SHADOW_SCORE_V8150"
              ):
                  raise RuntimeError(
                      "V8150_PREDECESSOR_NEXT_STEP_MISMATCH"
                  )
              if any(
                  bool(v)
                  for v in (
                      audit.get("hard_guards") or {}
                  ).values()
              ):
                  raise RuntimeError(
                      "V8150_V8149_HARD_GUARD_NOT_FALSE"
                  )

              rows = read_rows(AUDIT_CSV)
              if len(rows) != 1:
                  raise RuntimeError(
                      "V8150_AUDIT_ROW_COUNT_NOT_1"
                  )
              r = rows[0]

              if ticker(r.get("ticker")) != TARGET:
                  raise RuntimeError(
                      "V8150_AUDIT_TICKER_MISMATCH"
                  )
              if r.get("name") != TARGET_NAME:
                  raise RuntimeError(
                      "V8150_AUDIT_NAME_MISMATCH"
                  )
              if r.get("corp_code") != TARGET_CORP_CODE:
                  raise RuntimeError(
                      "V8150_CORP_CODE_MISMATCH"
                  )
              if r.get("classification") != (
                  "COMPLETE_180D_POSITIVE_BURDEN"
              ):
                  raise RuntimeError(
                      "V8150_CLASSIFICATION_MISMATCH"
                  )
              if r.get("source_overlay_candidate") != "TRUE":
                  raise RuntimeError(
                      "V8150_NOT_OVERLAY_CANDIDATE"
                  )
              if r.get("proposed_supply_status") != "OK":
                  raise RuntimeError(
                      "V8150_ROW_STATUS_NOT_OK"
                  )
              if r.get("proposed_supply_level") != "경계":
                  raise RuntimeError(
                      "V8150_ROW_LEVEL_NOT_WARNING"
                  )
              if int(r.get("risk_report_count") or 0) != 3:
                  raise RuntimeError(
                      "V8150_RISK_REPORT_COUNT_CHANGED"
                  )

              prod_codes = {
                  ticker(x.get("ticker"))
                  for x in read_rows(PROD_SUPPLY)
                  if ticker(x.get("ticker"))
              }
              if TARGET in prod_codes:
                  raise RuntimeError(
                      "V8150_TARGET_ALREADY_IN_PRODUCTION_SUPPLY_SOURCE"
                  )

              source_fields = [
                  "ticker",
                  "name",
                  "source_origin",
                  "source_status",
                  "source_version",
                  "source_classification",
                  "corp_code",
                  "corp_name_dart",
                  "audit_start_date",
                  "audit_end_date",
                  "requested_lookback_days",
                  "chunk_count",
                  "dart_list_api_calls",
                  "dart_report_count",
                  "risk_report_count",
                  "supply_status",
                  "supply_level",
                  "risk_keywords",
                  "latest_risk_report_date",
                  "latest_risk_report_name",
                  "latest_risk_rcept_no",
                  "relief_report_match_count",
                  "evidence_reports_json",
                  "chunk_summaries_json",
                  "evidence_ref",
              ]

              source_row = {
                  "ticker": TARGET,
                  "name": TARGET_NAME,
                  "source_origin": "V8149_CURRENT_ACTIONABLE_SUPPLY",
                  "source_status": "SOURCE_ONLY_READY",
                  "source_version": VERSION,
                  "source_classification": (
                      "COMPLETE_180D_POSITIVE_BURDEN"
                  ),
                  "corp_code": TARGET_CORP_CODE,
                  "corp_name_dart": r.get("corp_name_dart") or "",
                  "audit_start_date": r.get("audit_start_date") or "",
                  "audit_end_date": r.get("audit_end_date") or "",
                  "requested_lookback_days": (
                      r.get("requested_lookback_days") or ""
                  ),
                  "chunk_count": r.get("chunk_count") or "",
                  "dart_list_api_calls": (
                      r.get("dart_list_api_calls") or ""
                  ),
                  "dart_report_count": (
                      r.get("dart_report_count") or ""
                  ),
                  "risk_report_count": (
                      r.get("risk_report_count") or ""
                  ),
                  "supply_status": "OK",
                  "supply_level": "경계",
                  "risk_keywords": r.get("risk_keywords") or "",
                  "latest_risk_report_date": (
                      r.get("latest_risk_report_date") or ""
                  ),
                  "latest_risk_report_name": (
                      r.get("latest_risk_report_name") or ""
                  ),
                  "latest_risk_rcept_no": (
                      r.get("latest_risk_rcept_no") or ""
                  ),
                  "relief_report_match_count": (
                      r.get("relief_report_match_count") or ""
                  ),
                  "evidence_reports_json": (
                      r.get("evidence_reports_json") or "[]"
                  ),
                  "chunk_summaries_json": (
                      r.get("chunk_summaries_json") or "[]"
                  ),
                  "evidence_ref": (
                      "V8149:DART_LIST_180D_EXACT_STOCK:072130"
                  ),
              }

              write_rows(
                  SOURCE_OUT,
                  [source_row],
                  source_fields,
              )

              baseline_prod = scorer.production_rows()

              if TARGET not in baseline_prod:
                  raise RuntimeError(
                      "V8150_TARGET_NOT_IN_CURRENT_PRODUCTION"
                  )

              base_analysis = (
                  baseline_prod[TARGET].get("analysis")
                  or {}
              )
              if base_analysis.get("supply_status") != "LIMITED":
                  raise RuntimeError(
                      "V8150_BASE_SUPPLY_STATUS_NOT_LIMITED:"
                      + str(
                          base_analysis.get("supply_status")
                      )
                  )
              if base_analysis.get("supply_level") != "없음":
                  raise RuntimeError(
                      "V8150_BASE_SUPPLY_LEVEL_NOT_NONE:"
                      + str(
                          base_analysis.get("supply_level")
                      )
                  )

              shadow_prod = copy.deepcopy(
                  baseline_prod
              )
              analysis = copy.deepcopy(
                  shadow_prod[TARGET].get("analysis")
                  or {}
              )
              analysis["supply_status"] = "OK"
              analysis["supply_level"] = "경계"
              analysis["supply_keywords"] = (
                  source_row["risk_keywords"]
              )
              shadow_prod[TARGET]["analysis"] = analysis

              run_scorer(
                  baseline_prod,
                  BASE_CSV,
                  BASE_JSON,
                  BASE_LOG,
                  BASE_DOC,
              )
              run_scorer(
                  shadow_prod,
                  SHADOW_CSV,
                  SHADOW_JSON,
                  SHADOW_LOG,
                  SHADOW_DOC,
              )

              base_rows = {
                  ticker(x.get("ticker")): x
                  for x in read_rows(BASE_CSV)
              }
              shadow_rows = {
                  ticker(x.get("ticker")): x
                  for x in read_rows(SHADOW_CSV)
              }

              if set(base_rows) != set(shadow_rows):
                  raise RuntimeError(
                      "V8150_SCORER_UNIVERSE_CHANGED"
                  )
              if TARGET not in base_rows:
                  raise RuntimeError(
                      "V8150_TARGET_NOT_IN_SCORER"
                  )

              b = base_rows[TARGET]
              s = shadow_rows[TARGET]
              bm = split_missing(
                  b.get("missing_components")
              )
              sm = split_missing(
                  s.get("missing_components")
              )

              if b.get("score_status") != "LIMITED":
                  raise RuntimeError(
                      "V8150_BASE_TARGET_NOT_LIMITED"
                  )
              if bm != [SUPPLY_REASON]:
                  raise RuntimeError(
                      "V8150_BASE_TARGET_NOT_SINGLE_SUPPLY:"
                      + "|".join(bm)
                  )
              if SUPPLY_REASON in sm:
                  raise RuntimeError(
                      "V8150_SUPPLY_REASON_NOT_REMOVED"
                  )
              if s.get("score_status") != "READY":
                  raise RuntimeError(
                      "V8150_TARGET_NOT_NEWLY_READY"
                  )

              points = json.loads(
                  s.get("component_points_json")
                  or "{}"
              ).get("수급·공시부담")
              if points != 4:
                  raise RuntimeError(
                      "V8150_SHADOW_SUPPLY_POINTS_NOT_4:"
                      + str(points)
                  )

              non_target_changed = [
                  code
                  for code in sorted(
                      set(base_rows) - {TARGET}
                  )
                  if stable(base_rows[code])
                  != stable(shadow_rows[code])
              ]
              if non_target_changed:
                  raise RuntimeError(
                      "V8150_NON_TARGET_SCORE_DRIFT:"
                      + ",".join(
                          non_target_changed[:20]
                      )
                  )

              existing_ready_changed = [
                  code
                  for code in sorted(base_rows)
                  if (
                      code != TARGET
                      and base_rows[code].get(
                          "score_status"
                      ) == "READY"
                      and stable(base_rows[code])
                      != stable(shadow_rows[code])
                  )
              ]
              if existing_ready_changed:
                  raise RuntimeError(
                      "V8150_EXISTING_READY_DRIFT:"
                      + ",".join(
                          existing_ready_changed[:20]
                      )
                  )

              bsum = read_json(BASE_JSON)
              ssum = read_json(SHADOW_JSON)

              b_ready = int(
                  bsum.get("ready_count") or 0
              )
              b_limited = int(
                  bsum.get("limited_count") or 0
              )
              s_ready = int(
                  ssum.get("ready_count") or 0
              )
              s_limited = int(
                  ssum.get("limited_count") or 0
              )

              b_blockers = sum(
                  int(
                      x.get(
                          "missing_component_count"
                      ) or 0
                  )
                  for x in base_rows.values()
              )
              s_blockers = sum(
                  int(
                      x.get(
                          "missing_component_count"
                      ) or 0
                  )
                  for x in shadow_rows.values()
              )

              if s_ready - b_ready != 1:
                  raise RuntimeError(
                      "V8150_READY_DELTA_NOT_1:"
                      + str(s_ready - b_ready)
                  )
              if s_limited - b_limited != -1:
                  raise RuntimeError(
                      "V8150_LIMITED_DELTA_NOT_MINUS_1:"
                      + str(s_limited - b_limited)
                  )
              if b_blockers - s_blockers != 1:
                  raise RuntimeError(
                      "V8150_BLOCKER_REDUCTION_NOT_1:"
                      + str(
                          b_blockers - s_blockers
                      )
                  )

              compare = [{
                  "ticker": TARGET,
                  "name": TARGET_NAME,
                  "source_classification": (
                      source_row[
                          "source_classification"
                      ]
                  ),
                  "supply_level": "경계",
                  "risk_keywords": (
                      source_row[
                          "risk_keywords"
                      ]
                  ),
                  "baseline_status": (
                      b.get("score_status") or ""
                  ),
                  "shadow_status": (
                      s.get("score_status") or ""
                  ),
                  "baseline_missing_components": (
                      ";".join(bm)
                  ),
                  "shadow_missing_components": (
                      ";".join(sm)
                  ),
                  "baseline_score_total": (
                      b.get("score_total") or ""
                  ),
                  "shadow_score_total": (
                      s.get("score_total") or ""
                  ),
                  "shadow_supply_points": points,
              }]

              write_rows(
                  COMPARE_OUT,
                  compare,
              )

              summary = {
                  "version": VERSION,
                  "generated_at_kst": datetime.now(
                      KST
                  ).isoformat(
                      timespec="seconds"
                  ),
                  "status": (
                      "SOURCE_ONLY_FROZEN_SHADOW_PASS"
                  ),
                  "policy_version": POLICY_VERSION,
                  "supply_policy_version": (
                      SUPPLY_POLICY_VERSION
                  ),
                  "v8149_version": (
                      V8149_VERSION
                  ),
                  "v8149_result_commit": (
                      V8149_RESULT_COMMIT
                  ),
                  "source_frozen_count": 1,
                  "source_frozen_tickers": [
                      TARGET
                  ],
                  "source_positive_burden_count": 1,
                  "source_positive_burden_tickers": [
                      TARGET
                  ],
                  "source_no_positive_burden_count": 0,
                  "current_scorer_universe_count": len(
                      base_rows
                  ),
                  "baseline_ready_count": (
                      b_ready
                  ),
                  "baseline_limited_count": (
                      b_limited
                  ),
                  "shadow_ready_count": (
                      s_ready
                  ),
                  "shadow_limited_count": (
                      s_limited
                  ),
                  "ready_delta": 1,
                  "limited_delta": -1,
                  "newly_ready_count": 1,
                  "newly_ready_tickers": [
                      TARGET
                  ],
                  "baseline_blocker_occurrences": (
                      b_blockers
                  ),
                  "shadow_blocker_occurrences": (
                      s_blockers
                  ),
                  "blocker_occurrences_reduced_by": 1,
                  "supply_reason_removed_count": 1,
                  "shadow_supply_points": 4,
                  "non_target_score_row_changed_count": 0,
                  "existing_ready_score_row_changed_count": 0,
                  "hard_guards": {
                      "production_api_modified": False,
                      "production_supply_status_overridden": False,
                      "production_supply_source_modified": False,
                      "production_source_cache_modified": False,
                      "production_financial_cache_modified": False,
                      "production_ocf_cache_modified": False,
                      "production_price_elasticity_cache_modified": False,
                      "production_investment_score_written": False,
                      "scoring_policy_modified": False,
                      "supply_policy_modified": False,
                      "issuer_mapping_guessed": False,
                      "incomplete_query_promoted": False,
                  },
                  "next_step": (
                      "STAGE_NARROW_PRODUCTION_UANGEL_SUPPLY_PATCH_V8151"
                  ),
              }

              SUMMARY_OUT.write_text(
                  json.dumps(
                      summary,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

              LOG_OUT.write_text(
                  "\n".join([
                      f"VERSION={VERSION}",
                      "STATUS=SOURCE_ONLY_FROZEN_SHADOW_PASS",
                      "SOURCE_FROZEN_COUNT=1",
                      "SOURCE_POSITIVE_BURDEN_COUNT=1",
                      (
                          "CURRENT_SCORER_UNIVERSE="
                          + str(len(base_rows))
                      ),
                      f"BASELINE_READY={b_ready}",
                      f"BASELINE_LIMITED={b_limited}",
                      f"SHADOW_READY={s_ready}",
                      f"SHADOW_LIMITED={s_limited}",
                      "READY_DELTA=1",
                      "LIMITED_DELTA=-1",
                      f"BASELINE_BLOCKERS={b_blockers}",
                      f"SHADOW_BLOCKERS={s_blockers}",
                      "BLOCKER_REDUCED_BY=1",
                      "SUPPLY_REASON_REMOVED=1",
                      "SHADOW_SUPPLY_POINTS=4",
                      "NON_TARGET_SCORE_ROW_CHANGED=0",
                      "EXISTING_READY_SCORE_ROW_CHANGED=0",
                      "PRODUCTION_API_MODIFIED=false",
                      "PRODUCTION_SUPPLY_SOURCE_MODIFIED=false",
                      "PRODUCTION_SCORE_WRITTEN=false",
