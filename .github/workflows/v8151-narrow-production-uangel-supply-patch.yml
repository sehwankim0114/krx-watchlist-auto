      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_supply_production_patch_v8151.py",
              "latest/investment_score_supply_source_latest.csv",
              "latest/investment_score_supply_source_latest.json",
              "latest/investment_score_supply_source_run_log_latest.txt",
              "latest/investment_score_supply_production_patch_v8151_summary_latest.json",
              "latest/investment_score_supply_production_patch_v8151_run_log_latest.txt",
              "docs/investment_score_supply_production_patch_v8151.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  [
                      "git",
                      "status",
                      "--porcelain",
                      "--untracked-files=all",
                  ],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(
              changed - allowed
          )
          if unexpected:
              raise SystemExit(
                  "V8151_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )

          print(
              "V8151_CHANGED_FILES_RESTRICTED=PASS"
          )
          PY

      - name: Refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "supply_burden_enricher.py",
              "investment_score_dry_run_v882.py",
              "investment_score_supply_overlay_v8139b.py",
              "build_stock_table_preview_v850.py",
              "build_two_table_shadow_v851.py",
              "two_table_release_v870.py",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_ocf_source_latest.csv",
              "latest/investment_score_supply_source_v8150.csv",
              "latest/investment_score_supply_shadow_v8150_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  [
                      "git",
                      "diff",
                      "--name-only",
                      "HEAD..origin/main",
                  ],
                  text=True,
              ).splitlines()
          )

          dangerous = sorted(
              p
              for p in upstream
              if p in protected
              or p.startswith("api/two_table_v1/")
              or p in {
                  "latest/investment_score_supply_source_latest.csv",
                  "latest/investment_score_supply_source_latest.json",
                  "latest/investment_score_supply_source_run_log_latest.txt",
              }
          )

          if dangerous:
              raise SystemExit(
                  "V8151_CONCURRENT_PROTECTED_DRIFT:"
                  + ",".join(dangerous)
              )

          print(
              "V8151_NO_CONCURRENT_PROTECTED_DRIFT=PASS"
          )
          PY

