      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed_exact = {
              "latest/investment_score_supply_source_latest.json",
              "latest/investment_score_supply_source_run_log_latest.txt",
              "latest/investment_score_supply_api_rebuild_v8152_summary_latest.json",
              "latest/investment_score_supply_api_rebuild_v8152_run_log_latest.txt",
              "docs/investment_score_supply_api_rebuild_v8152.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  [
                      "git",
                      "status",
                      "--porcelain",
                      "--untracked-files=all",
                  ],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(
              p
              for p in changed
              if (
                  p not in allowed_exact
                  and not p.startswith(
                      "api/two_table_v1/"
                  )
              )
          )

          if unexpected:
              raise SystemExit(
                  "V8152_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )

          assert any(
              p.startswith(
                  "api/two_table_v1/"
              )
              for p in changed
          ), (
              "V8152_TWO_TABLE_NOT_CHANGED"
          )

          print(
              "V8152_CHANGED_FILES_RESTRICTED=PASS"
          )
          PY

      - name: Refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "investment_score_supply_overlay_v8139b.py",
              "build_stock_table_preview_v850.py",
