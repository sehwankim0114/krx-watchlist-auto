name: Rebuild two-table with UANGEL supply source v8.15.2

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8152-rebuild-two-table-with-uangel-supply.yml"

permissions:
  contents: write

concurrency:
  group: build-api-json-main
  cancel-in-progress: false

jobs:
  rebuild:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install "pykrx==1.2.8"

      - name: Verify V8.15.1 lineage and capture protected state
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            c2e1e2e5c19f17f5d75f644d8cdd4a42a262abf7 HEAD

          test -n "${KRX_ID:-}" || {
            echo "::error::KRX_ID secret is missing"
            exit 1
          }
          test -n "${KRX_PW:-}" || {
            echo "::error::KRX_PW secret is missing"
            exit 1
          }

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          meta = json.loads(
              Path(
                  "latest/investment_score_supply_source_latest.json"
              ).read_text(encoding="utf-8")
          )
          patch = json.loads(
              Path(
                  "latest/investment_score_supply_production_patch_v8151_summary_latest.json"
              ).read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path(
                  "api/two_table_v1/manifest.json"
              ).read_text(encoding="utf-8")
          )
          status = json.loads(
              Path("api/status.json").read_text(
                  encoding="utf-8"
              )
          )

          assert meta["version"] == (
              "2026-09-22-v8.15.1-narrow-production-uangel-supply-source-patch"
          )
          assert meta["status"] == (
              "PRODUCTION_SOURCE_READY_NOT_YET_API_REBUILT"
          )
          assert meta["source_count"] == 9
          assert set(meta["source_tickers"]) == {
              "001440",
              "007540",
              "029780",
              "066570",
              "071840",
              "072130",
              "084690",
              "086280",
              "114090",
          }
          assert meta["supply_levels"]["072130"] == "경계"
          assert meta["integration"][
              "production_api_rebuilt"
          ] is False
          assert meta["next_step"] == (
              "REBUILD_TWO_TABLE_WITH_UANGEL_SUPPLY_SOURCE_V8152"
          )

          assert patch["version"] == meta["version"]
          assert patch["status"] == (
              "PRODUCTION_SOURCE_PATCHED_API_REBUILD_PENDING"
          )
          assert patch["source_count_after"] == 9
          assert patch["narrow_patch_tickers"] == [
              "072130"
          ]
          assert patch["ready_delta"] == 1
          assert patch["limited_delta"] == -1
          assert patch[
              "blocker_occurrences_reduced_by"
          ] == 1
          assert patch[
              "non_target_score_row_changed_count"
          ] == 0
          assert patch["next_step"] == (
              "REBUILD_TWO_TABLE_WITH_UANGEL_SUPPLY_SOURCE_V8152"
          )

          assert status["api_sync_ok"] is True
          assert status["critical_errors"] == []
          assert status["safe_to_analyze_as_latest"] is True

          assert manifest["release_stage"] == "PRODUCTION"
          assert manifest[
              "production_activation_allowed"
          ] is True
          assert manifest[
              "safe_to_analyze_as_latest"
          ] is True
          assert manifest["basis_date"] == status[
              "confirmed_basis_date"
          ]
          assert manifest["source_build_id"] == status[
              "build_id"
          ]

          supply_bytes = Path(
              "latest/investment_score_supply_source_latest.csv"
          ).read_bytes()
          current_supply_sha = hashlib.sha256(
              supply_bytes
          ).hexdigest()
          prior_manifest_supply_sha = (
              manifest.get("source_sha256") or {}
          ).get(
              "latest/investment_score_supply_source_latest.csv"
          )

          assert current_supply_sha
          assert prior_manifest_supply_sha
          assert current_supply_sha != prior_manifest_supply_sha

          pre = {
              "basis_date": manifest["basis_date"],
              "source_build_id": manifest["source_build_id"],
              "source_commit": manifest["source_commit"],
              "source_rules_version": manifest[
                  "source_rules_version"
              ],
              "source_rules_sha256": manifest[
                  "source_rules_sha256"
              ],
              "tables": {
                  k: {
                      "row_count": v["row_count"],
                      "pages": list(v["pages"]),
                  }
                  for k, v in manifest["tables"].items()
              },
              "current_supply_sha256": current_supply_sha,
              "prior_manifest_supply_sha256": (
                  prior_manifest_supply_sha
              ),
          }

          Path(
              "/tmp/v8152_pre_manifest_identity.json"
          ).write_text(
              json.dumps(
                  pre,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print("V8152_PREDECESSOR_META=PASS")
          print(
              "V8152_EXPECTED_SOURCE_API_HASH_MISMATCH=PASS"
          )
          PY

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            investment_score_supply_overlay_v8139b.py \
            build_stock_table_preview_v850.py \
            build_two_table_shadow_v851.py \
            sector_rs_source_v870.py \
            two_table_release_v870.py \
            supply_burden_enricher.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            latest/investment_score_supply_production_patch_v8151_summary_latest.json \
            > /tmp/v8152_protected.before

          find api -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8152_api_root.before

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8152_two_table.before

          echo "V8152_LINEAGE=PASS"

      - name: Capture dynamic production scorer baseline
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          import investment_score_dry_run_v882 as scorer

          TARGET = "072130"
          REASON = (
              "수급·공시부담:"
              "SUPPLY_LIMITED_NO_POSITIVE_EVIDENCE"
          )

          out_csv = Path(
              "/tmp/v8152_baseline_score.csv"
          )
          out_json = Path(
              "/tmp/v8152_baseline_score.json"
          )
          out_log = Path(
              "/tmp/v8152_baseline_score.log"
          )
          out_doc = Path(
              "/tmp/v8152_baseline_score.md"
          )

          old = {
              "VERSION": scorer.VERSION,
              "OUT_CSV": scorer.OUT_CSV,
              "OUT_JSON": scorer.OUT_JSON,
              "OUT_LOG": scorer.OUT_LOG,
              "OUT_DOC": scorer.OUT_DOC,
          }
          try:
              scorer.VERSION = (
                  "2026-09-22-v8.15.2-pre-rebuild-baseline"
              )
              scorer.OUT_CSV = out_csv
              scorer.OUT_JSON = out_json
              scorer.OUT_LOG = out_log
              scorer.OUT_DOC = out_doc
              rc = scorer.main()
          finally:
              for key, value in old.items():
                  setattr(scorer, key, value)

          assert rc in (None, 0)

          summary = json.loads(
              out_json.read_text(encoding="utf-8")
          )

          with out_csv.open(
              encoding="utf-8-sig",
              newline="",
          ) as f:
              rows = {
                  r["ticker"]: r
                  for r in csv.DictReader(f)
              }

          assert rows
          assert TARGET in rows

          target = rows[TARGET]
          missing = [
              x
              for x in (
                  target.get("missing_components")
                  or ""
              ).split(";")
              if x
          ]

          assert target["score_status"] == "LIMITED"
          assert missing == [REASON]

          ready = int(summary["ready_count"])
          limited = int(summary["limited_count"])
          blockers = sum(
              int(
                  r.get(
                      "missing_component_count"
                  ) or 0
              )
              for r in rows.values()
          )

          assert ready + limited == len(rows)

          baseline = {
              "universe_count": len(rows),
              "ready_count": ready,
              "limited_count": limited,
              "blocker_occurrences": blockers,
              "target_status": (
                  target["score_status"]
              ),
              "target_missing_components": missing,
          }

          Path(
              "/tmp/v8152_baseline_state.json"
          ).write_text(
              json.dumps(
                  baseline,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print("V8152_BASELINE_SCORER=PASS")
          print(
              f"V8152_BASELINE_UNIVERSE={len(rows)}"
          )
          print(
              f"V8152_BASELINE_READY={ready}"
          )
          print(
              f"V8152_BASELINE_LIMITED={limited}"
          )
          print(
              f"V8152_BASELINE_BLOCKERS={blockers}"
          )
          PY

      - name: Rebuild production two-table through official release path
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            stock_table_metrics_v850.py \
            build_stock_table_preview_v850.py \
            build_two_table_shadow_v851.py \
            sector_rs_source_v870.py \
            two_table_release_v870.py

          python two_table_release_v870.py --repo . \
            | tee /tmp/v8152_release_stdout.txt

          grep -q '^V870_TWO_TABLE_RELEASE_CONTRACT=PASS$' \
            /tmp/v8152_release_stdout.txt
          grep -q '^PRODUCTION_ACTIVATION_ALLOWED=true$' \
            /tmp/v8152_release_stdout.txt

          python two_table_release_v870.py \
            --repo . \
            --check-only \
            | tee /tmp/v8152_check_stdout.txt

          grep -q '^V870_TWO_TABLE_RELEASE_CONTRACT=PASS$' \
            /tmp/v8152_check_stdout.txt

          echo "V8152_TWO_TABLE_RELEASE=PASS"

      - name: Validate source identity and UANGEL production API fields
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          pre = json.loads(
              Path(
                  "/tmp/v8152_pre_manifest_identity.json"
              ).read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path(
                  "api/two_table_v1/manifest.json"
              ).read_text(encoding="utf-8")
          )

          assert manifest["version"] == (
              "2026-09-12-v8.7.0-sector-rs-production-release"
          )
          assert manifest["release_stage"] == "PRODUCTION"
          assert manifest[
              "production_activation_allowed"
          ] is True
          assert manifest[
              "safe_to_analyze_as_latest"
          ] is True

          assert manifest["basis_date"] == pre[
              "basis_date"
          ]
          assert manifest["source_build_id"] == pre[
              "source_build_id"
          ]
          assert manifest["source_commit"] == pre[
              "source_commit"
          ]
          assert manifest["source_rules_version"] == pre[
              "source_rules_version"
          ]
          assert manifest["source_rules_sha256"] == pre[
              "source_rules_sha256"
          ]

          after_tables = {
              k: {
                  "row_count": v["row_count"],
                  "pages": list(v["pages"]),
              }
              for k, v in manifest["tables"].items()
          }
          assert after_tables == pre["tables"]

          supply_sha = hashlib.sha256(
              Path(
                  "latest/investment_score_supply_source_latest.csv"
              ).read_bytes()
          ).hexdigest()

          assert supply_sha == pre[
              "current_supply_sha256"
          ]
          assert (
              manifest["source_sha256"][
                  "latest/investment_score_supply_source_latest.csv"
              ]
              == supply_sha
          )
          assert supply_sha != pre[
              "prior_manifest_supply_sha256"
          ]

          rows = {}
          appearances = {}
          for table in (
              "kospi",
              "decliners",
              "decliners24",
          ):
              payload = json.loads(
                  Path(
                      f"api/two_table_v1/{table}.json"
                  ).read_text(encoding="utf-8")
              )
              for row in payload.get("rows") or []:
                  code = row["ticker"]
                  rows[code] = row
                  appearances.setdefault(
                      code,
                      [],
                  ).append(table)

          assert "072130" in rows
          analysis = rows["072130"].get(
              "analysis"
          ) or {}
          assert analysis.get(
              "supply_status"
          ) == "OK"
          assert analysis.get(
              "supply_level"
          ) == "경계"

          keywords = {
              x
              for x in str(
                  analysis.get(
                      "supply_keywords"
                  ) or ""
              ).split(",")
              if x
          }
          assert keywords == {
              "대량보유",
              "주요주주변동",
          }

          print(
              "V8152_SOURCE_IDENTITY_PRESERVED=PASS"
          )
          print(
              "V8152_UANGEL_PRODUCTION_SUPPLY=PASS"
          )
          print(
              "V8152_UANGEL_TABLES="
              + ",".join(
                  appearances["072130"]
              )
          )
          PY

      - name: Run post-rebuild scorer regression
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          import investment_score_dry_run_v882 as scorer

          TARGET = "072130"

          base_csv = Path(
              "/tmp/v8152_baseline_score.csv"
          )
          base_state = json.loads(
              Path(
                  "/tmp/v8152_baseline_state.json"
              ).read_text(encoding="utf-8")
          )

          post_csv = Path(
              "/tmp/v8152_post_score.csv"
          )
          post_json = Path(
              "/tmp/v8152_post_score.json"
          )
          post_log = Path(
              "/tmp/v8152_post_score.log"
          )
          post_doc = Path(
              "/tmp/v8152_post_score.md"
          )

          old = {
              "VERSION": scorer.VERSION,
              "OUT_CSV": scorer.OUT_CSV,
              "OUT_JSON": scorer.OUT_JSON,
              "OUT_LOG": scorer.OUT_LOG,
              "OUT_DOC": scorer.OUT_DOC,
          }
          try:
              scorer.VERSION = (
                  "2026-09-22-v8.15.2-post-rebuild"
              )
              scorer.OUT_CSV = post_csv
              scorer.OUT_JSON = post_json
              scorer.OUT_LOG = post_log
              scorer.OUT_DOC = post_doc
              rc = scorer.main()
          finally:
              for key, value in old.items():
                  setattr(scorer, key, value)

          assert rc in (None, 0)

          def load(path):
              with Path(path).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  return {
                      r["ticker"]: r
                      for r in csv.DictReader(f)
                  }

          base = load(base_csv)
          post = load(post_csv)
          post_summary = json.loads(
              post_json.read_text(
                  encoding="utf-8"
              )
          )

          assert set(base) == set(post)
          assert len(post) == base_state[
              "universe_count"
          ]

          post_ready = int(
              post_summary["ready_count"]
          )
          post_limited = int(
              post_summary["limited_count"]
          )
          post_blockers = sum(
              int(
                  r.get(
                      "missing_component_count"
                  ) or 0
              )
              for r in post.values()
          )

          assert (
              post_ready
              - base_state["ready_count"]
          ) == 1
          assert (
              post_limited
              - base_state["limited_count"]
          ) == -1
          assert (
              base_state[
                  "blocker_occurrences"
              ]
              - post_blockers
          ) == 1

          assert base[TARGET][
              "score_status"
          ] == "LIMITED"
          assert post[TARGET][
              "score_status"
          ] == "READY"

          assert (
              "수급·공시부담:"
              "SUPPLY_LIMITED_NO_POSITIVE_EVIDENCE"
              not in (
                  post[TARGET].get(
                      "missing_components"
                  )
                  or ""
              )
          )

          changed = {
              code
              for code in base
              if base[code] != post[code]
          }
          assert changed == {TARGET}

          prior_ready_changed = {
              code
              for code in base
              if (
                  code != TARGET
                  and base[code].get(
                      "score_status"
                  ) == "READY"
                  and base[code] != post[code]
              )
          }
          assert not prior_ready_changed

          result = {
              "universe_count": len(post),
              "baseline_ready_count": (
                  base_state[
                      "ready_count"
                  ]
              ),
              "post_ready_count": (
                  post_ready
              ),
              "baseline_limited_count": (
                  base_state[
                      "limited_count"
                  ]
              ),
              "post_limited_count": (
                  post_limited
              ),
              "baseline_blocker_occurrences": (
                  base_state[
                      "blocker_occurrences"
                  ]
              ),
              "post_blocker_occurrences": (
                  post_blockers
              ),
              "changed_score_tickers": sorted(
                  changed
              ),
              "newly_ready_tickers": [
                  TARGET
              ],
              "prior_ready_changed_count": 0,
          }
          Path(
              "/tmp/v8152_post_state.json"
          ).write_text(
              json.dumps(
                  result,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          print("V8152_POST_SCORER=PASS")
          print(
              f"V8152_POST_READY={post_ready}"
          )
          print(
              f"V8152_POST_LIMITED={post_limited}"
          )
          print(
              f"V8152_POST_BLOCKERS={post_blockers}"
          )
          print(
              "V8152_CHANGED_SCORE_TICKERS=072130"
          )
          print(
              "V8152_PRIOR_READY_CHANGED=0"
          )
          PY

      - name: Finalize supply metadata and write V8.15.2 record
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          KST = ZoneInfo("Asia/Seoul")
          VERSION = (
              "2026-09-22-v8.15.2-production-two-table-uangel-supply-rebuild"
          )

          post = json.loads(
              Path(
                  "/tmp/v8152_post_state.json"
              ).read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path(
                  "api/two_table_v1/manifest.json"
              ).read_text(encoding="utf-8")
          )

          meta_path = Path(
              "latest/investment_score_supply_source_latest.json"
          )
          meta = json.loads(
              meta_path.read_text(encoding="utf-8")
          )

          assert meta["version"] == (
              "2026-09-22-v8.15.1-narrow-production-uangel-supply-source-patch"
          )
          assert meta["source_count"] == 9

          meta["status"] = (
              "PRODUCTION_SOURCE_APPLIED_API_REBUILT"
          )
          meta["integration"][
              "production_api_rebuilt"
          ] = True
          meta["integration"][
              "production_api_rebuild_mode"
          ] = "CONTROLLED_V8152"
          meta["integration"][
              "production_api_rebuild_version"
          ] = VERSION
          meta["integration"][
              "production_api_basis_date"
          ] = manifest["basis_date"]
          meta["integration"][
              "production_api_source_build_id"
          ] = manifest["source_build_id"]
          meta["post_apply_validation"] = {
              "universe_count": post[
                  "universe_count"
              ],
              "ready_count": post[
                  "post_ready_count"
              ],
              "limited_count": post[
                  "post_limited_count"
              ],
              "blocker_occurrences": post[
                  "post_blocker_occurrences"
              ],
              "changed_score_row_count": 1,
              "changed_score_tickers": [
                  "072130"
              ],
              "newly_ready_count": 1,
              "newly_ready_tickers": [
                  "072130"
              ],
              "prior_ready_score_row_changed_count": 0,
          }
          meta["next_step"] = (
              "POST_SUPPLY_APPLY_DYNAMIC_BLOCKER_REAUDIT_V8153"
          )

          meta_path.write_text(
              json.dumps(
                  meta,
                  ensure_ascii=False,
                  indent=2,
              ) + "\n",
              encoding="utf-8",
          )

          Path(
              "latest/investment_score_supply_source_run_log_latest.txt"
          ).write_text(
              "\n".join([
                  "VERSION=2026-09-22-v8.15.1-narrow-production-uangel-supply-source-patch",
                  "STATUS=PRODUCTION_SOURCE_APPLIED_API_REBUILT",
                  "SOURCE_COUNT=9",
                  "NARROW_PATCH_TICKER=072130",
                  "NARROW_PATCH_SUPPLY_STATUS=OK",
                  "NARROW_PATCH_SUPPLY_LEVEL=경계",
                  "PRODUCTION_API_REBUILT=true",
                  f"PRODUCTION_API_REBUILD_VERSION={VERSION}",
                  (
                      "PRODUCTION_API_BASIS_DATE="
                      + manifest["basis_date"]
                  ),
                  (
                      "PRODUCTION_API_SOURCE_BUILD_ID="
                      + manifest[
                          "source_build_id"
                      ]
                  ),
                  (
                      "POST_READY="
                      + str(
                          post[
                              "post_ready_count"
                          ]
                      )
                  ),
                  (
                      "POST_LIMITED="
                      + str(
                          post[
                              "post_limited_count"
                          ]
                      )
                  ),
                  (
                      "POST_BLOCKERS="
                      + str(
                          post[
                              "post_blocker_occurrences"
                          ]
                      )
                  ),
                  "CHANGED_SCORE_ROWS=1",
                  "CHANGED_SCORE_TICKERS=072130",
                  "NEWLY_READY=1",
                  "NEWLY_READY_TICKERS=072130",
                  "PRIOR_READY_CHANGED=0",
                  "SCORING_POLICY_MODIFIED=false",
                  "SUPPLY_POLICY_MODIFIED=false",
                  "STATUS_OK=true",
                  "NEXT_STEP=POST_SUPPLY_APPLY_DYNAMIC_BLOCKER_REAUDIT_V8153",
              ]) + "\n",
              encoding="utf-8",
          )

          now = datetime.now(
              KST
          ).isoformat(
              timespec="seconds"
          )

          summary = {
              "version": VERSION,
              "generated_at_kst": now,
              "status": (
                  "PRODUCTION_TWO_TABLE_UANGEL_SUPPLY_REBUILD_APPLIED"
              ),
              "v8151_result_commit": (
                  "c2e1e2e5c19f17f5d75f644d8cdd4a42a262abf7"
              ),
