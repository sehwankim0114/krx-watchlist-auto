name: Post-supply dynamic blocker reaudit v8.15.3

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/v8153-post-supply-dynamic-blocker-reaudit.yml"

permissions:
  contents: write

concurrency:
  group: v8153-post-supply-dynamic-blocker-reaudit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V8.15.2B lineage and capture protected state
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            4e06784e3090ae57a7568d967fb925197437418f HEAD

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            investment_score_current_blocker_reaudit_v8148.py \
            latest/investment_score_source_cache_latest.csv \
            latest/investment_score_source_run_log_latest.txt \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.json \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            latest/investment_score_supply_source_latest.json \
            latest/investment_score_exact_da_actionable_v8142_summary_latest.json \
            latest/investment_score_score_cache_actionable_v8143_summary_latest.json \
            latest/investment_score_next_single_source_v8104_summary_latest.json \
            latest/investment_score_supply_api_adoption_v8152b_summary_latest.json \
            > /tmp/v8153_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum \
            > /tmp/v8153_api.before

          echo "V8153_LINEAGE=PASS"

      - name: Create and run V8.15.3 dynamic blocker auditor
        shell: bash
        run: |
          set -euo pipefail

          cat > investment_score_current_blocker_reaudit_v8153.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          import csv
          import json
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_dry_run_v882 as scorer
          from investment_score_current_blocker_reaudit_v8148 import (
              classify,
              recovery_status,
          )

          VERSION = "2026-09-22-v8.15.3-post-supply-dynamic-blocker-reaudit"
          POLICY_VERSION = "2026-09-13-v8.8.0-explicit-100-point-scoring-contract"
          V8152B_VERSION = "2026-09-22-v8.15.2B-adopt-scheduled-uangel-supply-apply"
          V8152B_RESULT_COMMIT = "4e06784e3090ae57a7568d967fb925197437418f"
          V8142_VERSION = "2026-09-22-v8.14.2-current-actionable-exact-da-single-blocker-audit"
          V8143_VERSION = "2026-09-22-v8.14.3-esr-kendall-q2-score-cache-audit"
          V8104_VERSION = "2026-09-15-v8.10.4-next-single-source-recoverability-audit"

          ROOT = Path(".")
          KST = ZoneInfo("Asia/Seoul")

          ADOPTION_JSON = ROOT / "latest/investment_score_supply_api_adoption_v8152b_summary_latest.json"
          DA_JSON = ROOT / "latest/investment_score_exact_da_actionable_v8142_summary_latest.json"
          SCORE_JSON = ROOT / "latest/investment_score_score_cache_actionable_v8143_summary_latest.json"
          V8104_JSON = ROOT / "latest/investment_score_next_single_source_v8104_summary_latest.json"
          MANIFEST = ROOT / "api/two_table_v1/manifest.json"

          TMP_CSV = Path("/tmp/v8153_score.csv")
          TMP_JSON = Path("/tmp/v8153_score_summary.json")
          TMP_LOG = Path("/tmp/v8153_score.log")
          TMP_DOC = Path("/tmp/v8153_score.md")

          OUT_CSV = ROOT / "latest/investment_score_current_blockers_v8153.csv"
          OUT_JSON = ROOT / "latest/investment_score_current_blockers_v8153_summary_latest.json"
          OUT_LOG = ROOT / "latest/investment_score_current_blockers_v8153_run_log_latest.txt"
          OUT_DOC = ROOT / "docs/investment_score_current_blockers_v8153.md"

          UANGEL = "072130"
          ESR = "365550"

          def ticker(value):
              s = "".join(
                  ch for ch in str(value or "")
                  if ch.isdigit()
              )
              return s.zfill(6) if s else ""

          def read_json(path):
              return json.loads(
                  Path(path).read_text(encoding="utf-8-sig")
              )

          def read_rows(path):
              with Path(path).open(
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  return list(csv.DictReader(f))

          def split_reasons(value):
              return [
                  x
                  for x in str(value or "").split(";")
                  if x
              ]

          def run_scorer():
              old = {
                  "VERSION": scorer.VERSION,
                  "OUT_CSV": scorer.OUT_CSV,
                  "OUT_JSON": scorer.OUT_JSON,
                  "OUT_LOG": scorer.OUT_LOG,
                  "OUT_DOC": scorer.OUT_DOC,
              }
              try:
                  scorer.VERSION = VERSION
                  scorer.OUT_CSV = TMP_CSV
                  scorer.OUT_JSON = TMP_JSON
                  scorer.OUT_LOG = TMP_LOG
                  scorer.OUT_DOC = TMP_DOC
                  rc = scorer.main()
              finally:
                  for key, value in old.items():
                      setattr(scorer, key, value)

              if rc not in (None, 0):
                  raise RuntimeError(
                      "V8153_SCORER_FAILED:" + str(rc)
                  )

          def main():
              for p in (
                  ADOPTION_JSON,
                  DA_JSON,
                  SCORE_JSON,
                  V8104_JSON,
                  MANIFEST,
              ):
                  if not p.is_file():
                      raise RuntimeError(
                          "V8153_MISSING_INPUT:" + str(p)
                      )

              adoption = read_json(ADOPTION_JSON)
              s8142 = read_json(DA_JSON)
              s8143 = read_json(SCORE_JSON)
              s8104 = read_json(V8104_JSON)
              manifest = read_json(MANIFEST)

              if adoption.get("version") != V8152B_VERSION:
                  raise RuntimeError(
                      "V8153_V8152B_VERSION_MISMATCH"
                  )
              if adoption.get("status") != (
                  "SCHEDULED_PRODUCTION_UANGEL_SUPPLY_APPLY_ADOPTED"
              ):
                  raise RuntimeError(
                      "V8153_V8152B_STATUS_MISMATCH"
                  )
              if adoption.get("next_step") != (
                  "POST_SUPPLY_APPLY_DYNAMIC_BLOCKER_REAUDIT_V8153"
              ):
                  raise RuntimeError(
                      "V8153_PREDECESSOR_NEXT_STEP_MISMATCH"
                  )
              if adoption.get("policy_version") != POLICY_VERSION:
                  raise RuntimeError(
                      "V8153_POLICY_VERSION_MISMATCH"
                  )
              if adoption.get("changed_score_tickers") != [UANGEL]:
                  raise RuntimeError(
                      "V8153_V8152B_CHANGED_SET_MISMATCH"
                  )
              if (
                  int(adoption.get("ready_delta") or 0),
                  int(adoption.get("limited_delta") or 0),
                  int(
                      adoption.get(
                          "blocker_occurrences_reduced_by"
                      ) or 0
                  ),
              ) != (1, -1, 1):
                  raise RuntimeError(
                      "V8153_V8152B_EFFECT_MISMATCH"
                  )
              if any(
                  bool(v)
                  for v in (
                      adoption.get("hard_guards") or {}
                  ).values()
              ):
                  raise RuntimeError(
                      "V8153_V8152B_HARD_GUARD_NOT_FALSE"
                  )

              if s8142.get("version") != V8142_VERSION:
                  raise RuntimeError(
                      "V8153_V8142_VERSION_MISMATCH"
                  )
              da_exhausted = set(
                  s8142.get(
                      "post_audit_exhausted_union_tickers"
                  ) or []
              )
              if len(da_exhausted) != 64:
                  raise RuntimeError(
                      "V8153_DA_EXHAUSTED_NOT_64"
                  )

              if s8143.get("version") != V8143_VERSION:
                  raise RuntimeError(
                      "V8153_V8143_VERSION_MISMATCH"
                  )
              if s8143.get("classification") != (
                  "NO_COMPLETE_OFFICIAL_Q2_ACCEL_INPUT_PATH"
              ):
                  raise RuntimeError(
                      "V8153_ESR_Q2_NOT_EXHAUSTED"
                  )

              if s8104.get("version") != V8104_VERSION:
                  raise RuntimeError(
                      "V8153_V8104_VERSION_MISMATCH"
                  )
              v8104_exhausted = set(
                  s8104.get(
                      "not_recoverable_now_tickers"
                  ) or []
              )
              if v8104_exhausted != {
                  "001020",
                  "357250",
              }:
                  raise RuntimeError(
                      "V8153_V8104_EXHAUSTED_CHANGED"
                  )

              if manifest.get("release_stage") != "PRODUCTION":
                  raise RuntimeError(
                      "V8153_MANIFEST_NOT_PRODUCTION"
                  )
              if manifest.get(
                  "production_activation_allowed"
              ) is not True:
                  raise RuntimeError(
                      "V8153_PRODUCTION_NOT_ALLOWED"
                  )
              if manifest.get(
                  "safe_to_analyze_as_latest"
              ) is not True:
                  raise RuntimeError(
                      "V8153_MANIFEST_NOT_SAFE_LATEST"
                  )

              run_scorer()

              rows = read_rows(TMP_CSV)
              score_summary = read_json(TMP_JSON)

              if not rows:
                  raise RuntimeError(
                      "V8153_SCORER_EMPTY"
                  )

              ready = [
                  r for r in rows
                  if r.get("score_status") == "READY"
              ]
              limited = [
                  r for r in rows
                  if r.get("score_status") == "LIMITED"
              ]

              if len(ready) + len(limited) != len(rows):
                  raise RuntimeError(
                      "V8153_SCORE_STATUS_MISMATCH"
                  )
              if int(
                  score_summary.get("ready_count") or 0
              ) != len(ready):
                  raise RuntimeError(
                      "V8153_READY_SUMMARY_MISMATCH"
                  )
              if int(
                  score_summary.get("limited_count") or 0
              ) != len(limited):
                  raise RuntimeError(
                      "V8153_LIMITED_SUMMARY_MISMATCH"
                  )

              by_code = {
                  ticker(r.get("ticker")): r
                  for r in rows
              }
              ready_codes = {
                  ticker(r.get("ticker"))
                  for r in ready
              }

              # UANGEL is the just-promoted supply case. If it remains active,
              # it must stay READY with 4 supply points.
              if UANGEL in by_code:
                  u = by_code[UANGEL]
                  if u.get("score_status") != "READY":
                      raise RuntimeError(
                          "V8153_UANGEL_REGRESSED"
                      )
                  points = json.loads(
                      u.get("component_points_json") or "{}"
                  ).get("수급·공시부담")
                  if points != 4:
                      raise RuntimeError(
                          "V8153_UANGEL_SUPPLY_POINTS_NOT_4:"
                          + str(points)
                      )

              # Keep previously promoted elasticity tickers guarded as well.
              for code in ("006260", "267250"):
                  if (
                      code in by_code
                      and code not in ready_codes
                  ):
                      raise RuntimeError(
                          "V8153_ELASTICITY_PROMOTION_REGRESSED:"
                          + code
                      )

              out_rows = []
              category_counts = Counter()
              source_counts = Counter()
              source_tickers = defaultdict(set)
              recovery_counts = Counter()
              actionable_counts = Counter()
              actionable_tickers = defaultdict(set)
              multi_counts = Counter()
              multi_tickers = defaultdict(set)

              for row in limited:
                  reasons = split_reasons(
                      row.get("missing_components")
                  )
                  code = ticker(row.get("ticker"))

                  if not reasons:
                      raise RuntimeError(
                          "V8153_LIMITED_WITHOUT_REASON:"
                          + code
                      )

                  single = len(reasons) == 1

                  for reason in reasons:
                      category, group = classify(reason)
                      if group == "UNKNOWN":
                          raise RuntimeError(
                              "V8153_UNCLASSIFIED_REASON:"
                              + code + ":" + reason
                          )

                      status = recovery_status(
                          code,
                          reason,
                          group,
                          single,
                          da_exhausted,
                          v8104_exhausted,
                      )

                      category_counts[category] += 1
                      source_counts[group] += 1
                      source_tickers[group].add(code)
                      recovery_counts[status] += 1

                      if (
                          single
                          and status
                          == "ACTIONABLE_SINGLE_BLOCKER_REAUDIT"
                      ):
                          actionable_counts[group] += 1
                          actionable_tickers[group].add(code)

                      if not single:
                          multi_counts[group] += 1
                          multi_tickers[group].add(code)

                      out_rows.append({
                          "ticker": code,
                          "name": row.get("name") or "",
                          "market": row.get("market") or "",
                          "missing_component_count": len(reasons),
                          "blocker_reason": reason,
                          "blocker_category": category,
                          "source_group": group,
                          "single_blocker_ticker": (
                              "TRUE" if single else "FALSE"
                          ),
                          "recovery_status": status,
                      })

              single_priority = sorted(
                  [
                      {
                          "source_group": group,
                          "actionable_single_blocker_count": count,
                          "actionable_single_blocker_tickers": sorted(
                              actionable_tickers[group]
                          ),
                          "total_group_blocker_occurrences": (
                              source_counts[group]
                          ),
                      }
                      for group, count in actionable_counts.items()
                      if count > 0
                  ],
                  key=lambda x: (
                      -x["actionable_single_blocker_count"],
                      -x["total_group_blocker_occurrences"],
                      x["source_group"],
                  ),
              )

              multi_priority = sorted(
                  [
                      {
                          "source_group": group,
                          "multi_blocker_occurrences": count,
                          "multi_blocker_ticker_count": len(
                              multi_tickers[group]
                          ),
                          "multi_blocker_tickers": sorted(
                              multi_tickers[group]
                          ),
                          "total_group_blocker_occurrences": (
                              source_counts[group]
                          ),
                      }
                      for group, count in multi_counts.items()
                      if (
                          count > 0
                          and group != "V880_SCORING_CONTRACT"
                      )
                  ],
                  key=lambda x: (
                      -x["multi_blocker_occurrences"],
                      -x["multi_blocker_ticker_count"],
                      x["source_group"],
                  ),
              )

              if single_priority:
                  selection_mode = "ACTIONABLE_SINGLE_BLOCKER"
                  selected = single_priority[0]
                  selected_group = selected["source_group"]
                  selected_tickers = selected[
                      "actionable_single_blocker_tickers"
                  ]
                  next_step = (
                      "AUDIT_CURRENT_ACTIONABLE_SINGLE_BLOCKER_GROUP_V8154"
                  )
              elif multi_priority:
                  selection_mode = "MULTI_BLOCKER_GROUP"
                  selected = multi_priority[0]
                  selected_group = selected["source_group"]
                  selected_tickers = selected[
                      "multi_blocker_tickers"
                  ]
                  next_step = (
                      "AUDIT_TOP_MULTI_BLOCKER_GROUP_V8154"
                  )
              else:
                  selection_mode = "NO_SOURCE_LANE"
                  selected_group = ""
                  selected_tickers = []
                  next_step = (
                      "REVIEW_REMAINING_POLICY_ONLY_BLOCKERS"
                  )

              out_rows.sort(
                  key=lambda r: (
                      int(r["missing_component_count"]),
                      r["ticker"],
                      r["blocker_reason"],
                  )
              )

              OUT_CSV.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              fields = [
                  "ticker",
                  "name",
                  "market",
                  "missing_component_count",
                  "blocker_reason",
                  "blocker_category",
                  "source_group",
                  "single_blocker_ticker",
                  "recovery_status",
              ]
              with OUT_CSV.open(
                  "w",
                  encoding="utf-8-sig",
                  newline="",
              ) as f:
                  w = csv.DictWriter(
                      f,
                      fieldnames=fields,
                      lineterminator="\n",
                  )
                  w.writeheader()
                  w.writerows(out_rows)

              summary = {
                  "version": VERSION,
                  "generated_at_kst": datetime.now(
                      KST
                  ).isoformat(timespec="seconds"),
                  "status": (
                      "AUDIT_ONLY_POST_SUPPLY_DYNAMIC_CURRENT_BLOCKERS"
                  ),
                  "policy_version": POLICY_VERSION,
                  "v8152b_version": V8152B_VERSION,
                  "v8152b_result_commit": (
                      V8152B_RESULT_COMMIT
                  ),
                  "production_manifest": {
                      "basis_date": manifest.get("basis_date"),
                      "source_build_id": manifest.get(
                          "source_build_id"
                      ),
                      "source_commit": manifest.get(
                          "source_commit"
                      ),
                      "kospi_rows": manifest["tables"][
                          "kospi"
                      ]["row_count"],
                      "decliners_rows": manifest["tables"][
                          "decliners"
                      ]["row_count"],
                      "decliners24_rows": manifest["tables"][
                          "decliners24"
                      ]["row_count"],
                  },
                  "scorer_universe_count": len(rows),
                  "ready_count": len(ready),
                  "limited_count": len(limited),
                  "limited_blocker_occurrences": len(
                      out_rows
                  ),
                  "uangel_state": (
                      "READY"
                      if UANGEL in ready_codes
                      else (
                          "INACTIVE"
                          if UANGEL not in by_code
                          else "NOT_READY"
                      )
                  ),
                  "promoted_elasticity_ticker_state": {
                      code: (
                          "READY"
                          if code in ready_codes
                          else (
                              "INACTIVE"
                              if code not in by_code
                              else "NOT_READY"
                          )
                      )
                      for code in (
                          "006260",
                          "267250",
                      )
                  },
                  "blocker_category_counts": dict(
                      category_counts
                  ),
                  "source_group_counts": dict(
                      source_counts
                  ),
                  "source_group_tickers": {
                      group: sorted(codes)
                      for group, codes in source_tickers.items()
                  },
                  "recovery_status_counts": dict(
                      recovery_counts
                  ),
                  "known_exhausted_evidence": {
                      "exact_da_exhausted_union_count": 64,
                      "exact_da_exhausted_union_tickers": sorted(
                          da_exhausted
                      ),
                      "score_cache_q2_exhausted_tickers": [
                          ESR
                      ],
                      "v8104_exhausted_tickers": sorted(
                          v8104_exhausted
                      ),
                  },
                  "actionable_single_priority": (
                      single_priority
                  ),
                  "multi_blocker_priority": (
                      multi_priority
                  ),
                  "selection_mode": selection_mode,
                  "selected_source_group": selected_group,
                  "selected_ticker_count": len(
                      selected_tickers
                  ),
                  "selected_tickers": (
                      selected_tickers
                  ),
                  "hard_guards": {
                      "production_source_cache_modified": False,
                      "production_financial_cache_modified": False,
                      "production_price_elasticity_cache_modified": False,
                      "production_ocf_cache_modified": False,
                      "production_supply_source_modified": False,
                      "production_api_modified": False,
                      "production_score_written": False,
                      "scoring_policy_modified": False,
                      "source_value_imputed": False,
                      "exhausted_lane_auto_requeried": False,
                      "stale_universe_assumption_used": False,
                  },
                  "next_step": next_step,
              }

              OUT_JSON.write_text(
                  json.dumps(
                      summary,
                      ensure_ascii=False,
                      indent=2,
                  ) + "\n",
                  encoding="utf-8",
              )

              OUT_LOG.write_text(
                  "\n".join([
                      f"VERSION={VERSION}",
                      "STATUS=AUDIT_ONLY_POST_SUPPLY_DYNAMIC_CURRENT_BLOCKERS",
                      f"PRODUCTION_BASIS_DATE={manifest.get('basis_date')}",
                      f"SCORER_UNIVERSE={len(rows)}",
                      f"READY={len(ready)}",
                      f"LIMITED={len(limited)}",
                      f"BLOCKER_OCCURRENCES={len(out_rows)}",
                      f"UANGEL_STATE={summary['uangel_state']}",
                      "EXACT_DA_EXHAUSTED_UNION=64",
                      "SCORE_CACHE_Q2_EXHAUSTED=1",
                      (
                          "ACTIONABLE_SINGLE_BLOCKERS="
                          + str(sum(actionable_counts.values()))
                      ),
                      f"SELECTION_MODE={selection_mode}",
                      f"SELECTED_SOURCE_GROUP={selected_group}",
                      (
                          "SELECTED_TICKER_COUNT="
                          + str(len(selected_tickers))
                      ),
                      "PRODUCTION_DATA_MODIFIED=false",
                      "SCORING_POLICY_MODIFIED=false",
                      "STALE_UNIVERSE_ASSUMPTION_USED=false",
                      "STATUS_OK=true",
                      f"NEXT_STEP={next_step}",
                  ]) + "\n",
                  encoding="utf-8",
              )

              OUT_DOC.parent.mkdir(
                  parents=True,
                  exist_ok=True,
              )
              OUT_DOC.write_text(
                  "\n".join([
                      "# V8.15.3 post-supply dynamic blocker reaudit",
                      "",
                      f"- Current scorer universe: {len(rows)}",
                      f"- READY / LIMITED: {len(ready)} / {len(limited)}",
                      f"- Current blocker occurrences: {len(out_rows)}",
                      f"- UANGEL state: {summary['uangel_state']}",
                      "- Exact-D&A exhausted union: 64",
                      "- ESR Kendall Q2 path: exhausted",
                      f"- Actionable single blockers: {sum(actionable_counts.values())}",
                      f"- Selection mode: `{selection_mode}`",
                      f"- Selected source group: `{selected_group}`",
                      f"- Selected ticker count: {len(selected_tickers)}",
                      "",
                      "The current production universe is read dynamically.",
                      "No production source, API, score, or scoring policy is modified.",
                      "",
                      f"Next: `{next_step}`",
                      "",
                  ]),
                  encoding="utf-8",
              )

              print(
                  "V8153_POST_SUPPLY_DYNAMIC_REAUDIT=PASS"
              )

          if __name__ == "__main__":
              main()
          PY

          python -m py_compile \
            investment_score_current_blocker_reaudit_v8153.py

          python investment_score_current_blocker_reaudit_v8153.py \
            | tee /tmp/v8153_stdout.txt

          grep -q '^V8153_POST_SUPPLY_DYNAMIC_REAUDIT=PASS$' \
            /tmp/v8153_stdout.txt
          grep -q '^EXACT_DA_EXHAUSTED_UNION=64$' \
            latest/investment_score_current_blockers_v8153_run_log_latest.txt
          grep -q '^SCORE_CACHE_Q2_EXHAUSTED=1$' \
            latest/investment_score_current_blockers_v8153_run_log_latest.txt
          grep -q '^STALE_UNIVERSE_ASSUMPTION_USED=false$' \
            latest/investment_score_current_blockers_v8153_run_log_latest.txt
          grep -q '^STATUS_OK=true$' \
            latest/investment_score_current_blockers_v8153_run_log_latest.txt

      - name: Validate V8.15.3 outputs
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          s = json.loads(
              Path(
                  "latest/investment_score_current_blockers_v8153_summary_latest.json"
              ).read_text(encoding="utf-8")
          )

          assert s["version"] == (
              "2026-09-22-v8.15.3-post-supply-dynamic-blocker-reaudit"
          )
          assert s["status"] == (
