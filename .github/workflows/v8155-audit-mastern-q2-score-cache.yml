      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_score_cache_actionable_v8155.py",
              "latest/investment_score_score_cache_actionable_v8155.csv",
              "latest/investment_score_score_cache_actionable_v8155_summary_latest.json",
