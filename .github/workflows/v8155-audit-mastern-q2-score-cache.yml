              "docs/investment_score_score_cache_actionable_v8155.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  [
                      "git",
                      "status",
                      "--porcelain",
                      "--untracked-files=all",
                  ],
                  text=True,
              ).splitlines()
              if line
          }

          unexpected = sorted(
              changed - allowed
          )
          if unexpected:
              raise SystemExit(
                  "V8155_UNEXPECTED_CHANGED_FILES:"
                  + ",".join(unexpected)
              )

          print(
              "V8155_CHANGED_FILES_RESTRICTED=PASS"
          )
          PY

