      - name: Restrict changed files and refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_current_blocker_reaudit_v8161.py",
              "latest/investment_score_current_blockers_v8161.csv",
              "latest/investment_score_current_blockers_v8161_summary_latest.json",
              "latest/investment_score_current_blockers_v8161_run_log_latest.txt",
              "docs/investment_score_current_blockers_v8161.md",
          }

          changed = set()
          for line in subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          ).splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8161_UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected)
              )
          print("V8161_CHANGED_FILES_RESTRICTED=PASS")
          PY

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "investment_score_current_blocker_reaudit_v8148.py",
              "latest/financial_valuation_cache_latest.csv",
              "latest/financial_valuation_run_log_latest.txt",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_ocf_source_latest.csv",
              "latest/investment_score_supply_source_latest.csv",
              "latest/investment_score_supply_source_latest.json",
              "latest/investment_score_financial_cache_production_refresh_v8160_summary_latest.json",
              "latest/investment_score_current_blockers_v8156_summary_latest.json",
              "api/two_table_v1/manifest.json",
          }

          upstream = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8161_CONCURRENT_PROTECTED_DRIFT:" + ",".join(dangerous)
              )

          print("V8161_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

      - name: Commit and push V8.16.1 audit outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            investment_score_current_blocker_reaudit_v8161.py \
            latest/investment_score_current_blockers_v8161.csv \
            latest/investment_score_current_blockers_v8161_summary_latest.json \
            latest/investment_score_current_blockers_v8161_run_log_latest.txt \
            docs/investment_score_current_blockers_v8161.md

          git diff --cached --check
          echo "V8161_GIT_DIFF_CHECK=PASS"

          git commit -m "Reaudit current blockers after financial refresh v8.16.1"
          git pull --rebase origin main
          git push origin HEAD:main
