      - name: Restrict changed files and refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_source_shadow_v8163.py",
              "latest/investment_score_source_cache_candidate_v8163.csv",
              "latest/investment_score_source_shadow_v8163_summary_latest.json",
              "latest/investment_score_source_shadow_v8163_run_log_latest.txt",
              "docs/investment_score_source_shadow_v8163.md",
          }

          changed = set()
          for line in subprocess.check_output(
              ["git", "status", "--porcelain", "--untracked-files=all"],
              text=True,
          ).splitlines():
              if not line:
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit(
                  "V8163_UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected)
              )

          print("V8163_CHANGED_FILES_RESTRICTED=PASS")
          PY

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_source_enricher_v854.py",
              "investment_score_dry_run_v882.py",
              ".github/workflows/v854-refresh-investment-score-source-cache.yml",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/financial_valuation_cache_latest.csv",
              "latest/financial_valuation_run_log_latest.txt",
              "latest/investment_score_ocf_source_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_supply_source_latest.csv",
              "latest/investment_score_supply_source_latest.json",
              "latest/investment_score_source_multiblocker_v8162_summary_latest.json",
          }

          upstream = set(
              subprocess.check_output(
                  ["git", "diff", "--name-only", "HEAD..origin/main"],
                  text=True,
              ).splitlines()
          )
          dangerous = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if dangerous:
              raise SystemExit(
                  "V8163_CONCURRENT_PROTECTED_DRIFT:" + ",".join(dangerous)
              )

          print("V8163_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

      - name: Commit and push V8.16.3 shadow outputs
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            investment_score_source_shadow_v8163.py \
            latest/investment_score_source_cache_candidate_v8163.csv \
            latest/investment_score_source_shadow_v8163_summary_latest.json \
            latest/investment_score_source_shadow_v8163_run_log_latest.txt \
            docs/investment_score_source_shadow_v8163.md

          git diff --cached --check
          echo "V8163_GIT_DIFF_CHECK=PASS"

          git commit -m "Shadow current source cache refresh v8.16.3"
          git pull --rebase origin main
          git push origin HEAD:main
