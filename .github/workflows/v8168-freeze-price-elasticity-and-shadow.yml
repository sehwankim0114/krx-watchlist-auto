      - name: Restrict changed files and refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_price_elasticity_shadow_v8168.py",
              "latest/investment_score_price_elasticity_source_v8168.csv",
              "latest/investment_score_price_elasticity_candidate_v8168.csv",
              "latest/investment_score_price_elasticity_shadow_v8168.csv",
              "latest/investment_score_price_elasticity_shadow_v8168_summary_latest.json",
              "latest/investment_score_price_elasticity_shadow_v8168_run_log_latest.txt",
              "docs/investment_score_price_elasticity_shadow_v8168.md",
          }

          changed = set()
          for line in subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"],
              text=True,
          ).splitlines():
              if line:
                  changed.add(line[3:].split(" -> ")[-1])

          bad = sorted(changed - allowed)
          if bad:
              raise SystemExit(
                  "V8168_UNEXPECTED_CHANGED_FILES:" + ",".join(bad)
              )
          print("V8168_CHANGED_FILES_RESTRICTED=PASS")
          PY

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_price_elasticity_active_v8167.csv",
              "latest/investment_score_price_elasticity_active_v8167_summary_latest.json",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.json",
              "latest/investment_score_price_elasticity_20d_run_log_latest.txt",
              "latest/investment_score_current_blockers_v8166_summary_latest.json",
              "latest/investment_score_source_cache_latest.csv",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_ocf_source_latest.csv",
              "latest/investment_score_supply_source_latest.csv",
          }

          upstream = set(subprocess.check_output(
              ["git","diff","--name-only","HEAD..origin/main"], text=True
          ).splitlines())
          bad = sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if bad:
              raise SystemExit(
                  "V8168_CONCURRENT_PROTECTED_DRIFT:" + ",".join(bad)
              )
          print("V8168_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

