name: Post-elasticity-apply dynamic blocker reaudit v8.17.1

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8171-post-elasticity-apply-blocker-reaudit.yml"

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V8.17.0 lineage and capture protected state
        shell: bash
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            d1c8accf80fea6d1cf308228cd5384a5034dfaaa HEAD

          for f in \
            latest/investment_score_price_elasticity_production_v8170_summary_latest.json \
            latest/investment_score_current_blockers_v8166_summary_latest.json \
            investment_score_current_blocker_reaudit_v8148.py \
            investment_score_current_blocker_reaudit_v8161.py \
            investment_score_dry_run_v882.py \
            api/two_table_v1/manifest.json; do
            test -f "$f"
          done

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            investment_score_current_blocker_reaudit_v8148.py \
            investment_score_current_blocker_reaudit_v8161.py \
            latest/investment_score_price_elasticity_production_v8170_summary_latest.json \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.json \
            latest/investment_score_price_elasticity_20d_run_log_latest.txt \
            latest/investment_score_source_cache_latest.csv \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            latest/investment_score_current_blockers_v8166_summary_latest.json \
            api/two_table_v1/manifest.json \
            > /tmp/v8171_protected.before

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/v8171_api.before

      - name: Run V8.17.1 dynamic blocker reaudit
        shell: bash
        run: |
          set -euo pipefail

          cat > investment_score_current_blocker_reaudit_v8171.py <<'PY'
          #!/usr/bin/env python3
          import csv
          import json
          from collections import Counter, defaultdict
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_dry_run_v882 as scorer
          from investment_score_current_blocker_reaudit_v8148 import classify
          from investment_score_current_blocker_reaudit_v8161 import (
              recovery_status,
              ticker,
              split_reasons,
          )

          VERSION = "2026-09-23-v8.17.1-post-elasticity-apply-dynamic-blocker-reaudit"
          POLICY = "2026-09-13-v8.8.0-explicit-100-point-scoring-contract"
          V8170_VERSION = "2026-09-23-v8.17.0-controlled-narrow-production-price-elasticity-patch"
          V8170_COMMIT = "d1c8accf80fea6d1cf308228cd5384a5034dfaaa"

          ROOT = Path(".")
          KST = ZoneInfo("Asia/Seoul")
          V8170 = ROOT / "latest/investment_score_price_elasticity_production_v8170_summary_latest.json"
          V8166 = ROOT / "latest/investment_score_current_blockers_v8166_summary_latest.json"
          MANIFEST = ROOT / "api/two_table_v1/manifest.json"

          TMP_CSV = Path("/tmp/v8171_score.csv")
          TMP_JSON = Path("/tmp/v8171_score.json")
          TMP_LOG = Path("/tmp/v8171_score.log")
          TMP_DOC = Path("/tmp/v8171_score.md")

          OUT_CSV = ROOT / "latest/investment_score_current_blockers_v8171.csv"
          OUT_JSON = ROOT / "latest/investment_score_current_blockers_v8171_summary_latest.json"
          OUT_LOG = ROOT / "latest/investment_score_current_blockers_v8171_run_log_latest.txt"
          OUT_DOC = ROOT / "docs/investment_score_current_blockers_v8171.md"

          def read_json(path):
              return json.loads(Path(path).read_text(encoding="utf-8-sig"))

          def run_scorer():
              old = {k:getattr(scorer,k) for k in (
                  "VERSION","OUT_CSV","OUT_JSON","OUT_LOG","OUT_DOC"
              )}
              try:
                  scorer.VERSION = VERSION
                  scorer.OUT_CSV = TMP_CSV
                  scorer.OUT_JSON = TMP_JSON
                  scorer.OUT_LOG = TMP_LOG
                  scorer.OUT_DOC = TMP_DOC
                  rc = scorer.main()
              finally:
                  for k,v in old.items():
                      setattr(scorer,k,v)
              if rc not in (None,0):
                  raise RuntimeError("V8171_SCORER_FAILED")

          def main():
              s70 = read_json(V8170)
              s66 = read_json(V8166)
              mf = read_json(MANIFEST)

              assert s70["version"] == V8170_VERSION
              assert s70["status"] == "PRODUCTION_NARROW_ELASTICITY_PATCH_APPLIED_POST_REGRESSION_PASS"
              assert s70["policy_version"] == POLICY
              assert s70["next_step"] == "POST_ELASTICITY_APPLY_DYNAMIC_BLOCKER_REAUDIT_V8171"
              assert s70["production_cache"]["row_count_after"] == 152
              assert s70["production_cache"]["latest_added_tickers"] == ["004990"]
              assert s70["scorer_regression"]["ready_after"] == 22
              assert s70["scorer_regression"]["limited_after"] == 98
              assert s70["scorer_regression"]["blockers_after"] == 321
              assert s70["scorer_regression"]["lost_ready_count"] == 0
              assert s70["rollback_guard"]["enabled"] is True

              ev = s66["known_exhausted_evidence"]
              da = set(ev["exact_da_exhausted_union_tickers"])
              q2 = set(ev["score_cache_q2_exhausted_tickers"])
              v8104 = set(ev["v8104_exhausted_tickers"])
              assert len(da) == 67
              assert q2 == {"357430","365550"}
              assert v8104 == {"001020","357250"}

              assert mf["release_stage"] == "PRODUCTION"
              assert mf["safe_to_analyze_as_latest"] is True

              run_scorer()
              with TMP_CSV.open(encoding="utf-8-sig", newline="") as f:
                  rows = list(csv.DictReader(f))
              score_summary = read_json(TMP_JSON)

              ready = [r for r in rows if r.get("score_status") == "READY"]
              limited = [r for r in rows if r.get("score_status") == "LIMITED"]

              assert len(rows) == 120
              assert len(ready) == 22
              assert len(limited) == 98
              assert int(score_summary.get("ready_count") or 0) == 22
              assert int(score_summary.get("limited_count") or 0) == 98

              out = []
              cats = Counter()
              groups = Counter()
              group_tickers = defaultdict(set)
              rec = Counter()
              single_counts = Counter()
              single_tickers = defaultdict(set)
              multi_counts = Counter()
              multi_tickers = defaultdict(set)

              for row in limited:
                  code = ticker(row.get("ticker"))
                  reasons = split_reasons(row.get("missing_components"))
                  if not reasons:
                      raise RuntimeError("V8171_LIMITED_WITHOUT_REASON:" + code)
                  single = len(reasons) == 1

                  for reason in reasons:
                      cat, group = classify(reason)
                      if group == "UNKNOWN":
                          raise RuntimeError("V8171_UNCLASSIFIED:" + code + ":" + reason)

                      status = recovery_status(
                          code, group, single, da, q2, v8104
                      )
                      cats[cat] += 1
                      groups[group] += 1
                      group_tickers[group].add(code)
                      rec[status] += 1

                      if single and status == "ACTIONABLE_SINGLE_BLOCKER_REAUDIT":
                          single_counts[group] += 1
                          single_tickers[group].add(code)

                      if not single:
                          multi_counts[group] += 1
                          multi_tickers[group].add(code)

                      out.append({
                          "ticker": code,
                          "name": row.get("name",""),
                          "market": row.get("market",""),
                          "missing_component_count": len(reasons),
                          "blocker_reason": reason,
                          "blocker_category": cat,
                          "source_group": group,
                          "single_blocker_ticker": "TRUE" if single else "FALSE",
                          "recovery_status": status,
                      })

              if len(out) != 321:
                  raise RuntimeError("V8171_BLOCKER_COUNT_NOT_321:" + str(len(out)))

              # Only 004990's elasticity blocker was removed by V8.17.0.
              if groups.get("PRICE_ELASTICITY_20D", 0) != 36:
                  raise RuntimeError(
                      "V8171_PRICE_ELASTICITY_BLOCKERS_NOT_36:"
                      + str(groups.get("PRICE_ELASTICITY_20D",0))
                  )
              if groups.get("FINANCIAL_VALUATION_CACHE", 0) != 49:
                  raise RuntimeError(
                      "V8171_FINANCIAL_BLOCKERS_NOT_49:"
                      + str(groups.get("FINANCIAL_VALUATION_CACHE",0))
                  )

              singles = sorted([
                  {
                      "source_group": g,
                      "actionable_single_blocker_count": c,
                      "actionable_single_blocker_tickers": sorted(single_tickers[g]),
                      "total_group_blocker_occurrences": groups[g],
                  }
                  for g,c in single_counts.items() if c
              ], key=lambda x: (
                  -x["actionable_single_blocker_count"],
                  -x["total_group_blocker_occurrences"],
                  x["source_group"],
              ))

              multis = sorted([
                  {
                      "source_group": g,
                      "multi_blocker_occurrences": c,
                      "multi_blocker_ticker_count": len(multi_tickers[g]),
                      "multi_blocker_tickers": sorted(multi_tickers[g]),
                      "total_group_blocker_occurrences": groups[g],
                  }
                  for g,c in multi_counts.items()
                  if c and g != "V880_SCORING_CONTRACT"
              ], key=lambda x: (
                  -x["multi_blocker_occurrences"],
                  -x["multi_blocker_ticker_count"],
                  x["source_group"],
              ))

              if singles:
                  mode = "ACTIONABLE_SINGLE_BLOCKER"
                  selected_group = singles[0]["source_group"]
                  selected = singles[0]["actionable_single_blocker_tickers"]
                  next_step = "AUDIT_CURRENT_ACTIONABLE_SINGLE_BLOCKER_GROUP_V8172"
              elif multis:
                  mode = "MULTI_BLOCKER_GROUP"
                  selected_group = multis[0]["source_group"]
                  selected = multis[0]["multi_blocker_tickers"]
                  next_step = "AUDIT_TOP_MULTI_BLOCKER_GROUP_V8172"
              else:
                  mode = "NO_SOURCE_LANE"
                  selected_group = ""
                  selected = []
                  next_step = "REVIEW_REMAINING_POLICY_ONLY_BLOCKERS"

              out.sort(key=lambda r: (
                  int(r["missing_component_count"]),
                  r["ticker"],
                  r["blocker_reason"],
              ))

              OUT_CSV.parent.mkdir(parents=True, exist_ok=True)
              with OUT_CSV.open("w", encoding="utf-8-sig", newline="") as f:
                  w = csv.DictWriter(f, fieldnames=list(out[0]), lineterminator="\n")
                  w.writeheader()
                  w.writerows(out)

              summary = {
                  "version": VERSION,
                  "generated_at_kst": datetime.now(KST).isoformat(timespec="seconds"),
                  "status": "AUDIT_ONLY_POST_ELASTICITY_DYNAMIC_CURRENT_BLOCKERS",
                  "policy_version": POLICY,
                  "v8170_version": V8170_VERSION,
                  "v8170_result_commit": V8170_COMMIT,
                  "production_manifest": {
                      "basis_date": mf.get("basis_date"),
                      "source_build_id": mf.get("source_build_id"),
                      "source_commit": mf.get("source_commit"),
                      "kospi_rows": mf["tables"]["kospi"]["row_count"],
                      "decliners_rows": mf["tables"]["decliners"]["row_count"],
                      "decliners24_rows": mf["tables"]["decliners24"]["row_count"],
                  },
                  "scorer_universe_count": 120,
                  "ready_count": 22,
                  "limited_count": 98,
                  "limited_blocker_occurrences": 321,
                  "blocker_category_counts": dict(cats),
                  "source_group_counts": dict(groups),
                  "source_group_tickers": {
                      g: sorted(v) for g,v in group_tickers.items()
                  },
                  "recovery_status_counts": dict(rec),
                  "known_exhausted_evidence": {
                      "exact_da_exhausted_union_count": 67,
                      "exact_da_exhausted_union_tickers": sorted(da),
                      "score_cache_q2_exhausted_count": 2,
                      "score_cache_q2_exhausted_tickers": sorted(q2),
                      "v8104_exhausted_tickers": sorted(v8104),
                  },
                  "actionable_single_priority": singles,
                  "multi_blocker_priority": multis,
                  "selection_mode": mode,
                  "selected_source_group": selected_group,
                  "selected_ticker_count": len(selected),
                  "selected_tickers": selected,
                  "elasticity_apply_effect": {
                      "pre_apply_blocker_occurrences": 322,
                      "post_apply_blocker_occurrences": 321,
                      "reduced_by": 1,
                      "ready_before": 21,
                      "ready_after": 22,
                      "limited_before": 99,
                      "limited_after": 98,
                      "production_elasticity_rows_before": 151,
                      "production_elasticity_rows_after": 152,
                  },
                  "operational_side_issues": {
                      "build_api_run_35737577552": {
                          "status": "FAILED",
                          "cause": "PYKRX_KRX_LOGIN_RESPONSE_JSON_DECODE",
                          "separate_from_score_blocker_lane": True,
                      },
                      "us_sp500_run_35803064524": {
                          "status": "FAILED",
                          "cause": "MISSING_PYKRX_DEPENDENCY_IN_ISOLATED_BUILD",
                          "error": "ModuleNotFoundError: No module named 'pykrx'",
                          "separate_from_score_blocker_lane": True,
                      },
                  },
                  "hard_guards": {
                      "production_data_modified": False,
                      "production_api_modified": False,
                      "production_score_written": False,
                      "scoring_policy_modified": False,
                      "source_value_imputed": False,
                      "exhausted_lane_auto_requeried": False,
                  },
                  "next_step": next_step,
              }

              OUT_JSON.write_text(
                  json.dumps(summary, ensure_ascii=False, indent=2) + "\n",
                  encoding="utf-8",
              )
              OUT_LOG.write_text("\n".join([
                  f"VERSION={VERSION}",
                  "STATUS=AUDIT_ONLY_POST_ELASTICITY_DYNAMIC_CURRENT_BLOCKERS",
                  "SCORER_UNIVERSE=120",
                  "READY=22",
                  "LIMITED=98",
                  "BLOCKER_OCCURRENCES=321",
                  f"PRICE_ELASTICITY_BLOCKERS={groups.get('PRICE_ELASTICITY_20D',0)}",
                  f"FINANCIAL_VALUATION_BLOCKERS={groups.get('FINANCIAL_VALUATION_CACHE',0)}",
                  f"ACTIONABLE_SINGLE_BLOCKERS={sum(single_counts.values())}",
                  f"SELECTION_MODE={mode}",
                  f"SELECTED_SOURCE_GROUP={selected_group}",
                  f"SELECTED_TICKER_COUNT={len(selected)}",
                  "ELASTICITY_APPLY_REDUCED_BY=1",
                  "US_SP500_SIDE_ISSUE=MISSING_PYKRX_DEPENDENCY_IN_ISOLATED_BUILD",
                  "PRODUCTION_DATA_MODIFIED=false",
                  "STATUS_OK=true",
                  f"NEXT_STEP={next_step}",
              ]) + "\n", encoding="utf-8")

              OUT_DOC.parent.mkdir(parents=True, exist_ok=True)
              OUT_DOC.write_text("\n".join([
                  "# V8.17.1 post-elasticity dynamic blocker reaudit",
                  "",
                  "- Production scorer universe: 120.",
                  "- READY / LIMITED: 22 / 98.",
                  "- Current blockers: 321.",
                  "- V8.17.0 removed exactly one elasticity blocker and made 004990 READY.",
                  f"- Selection mode: {mode}.",
                  f"- Selected source group: {selected_group}.",
                  f"- Selected ticker count: {len(selected)}.",
                  "- Separate operational issue: US S&P500 isolated build is missing the pykrx dependency.",
                  "- No production data is modified in this audit.",
                  "",
                  f"Next: {next_step}",
                  "",
              ]), encoding="utf-8")

              print("V8171_REAUDIT=PASS")
              print(f"V8171_SELECTED_SOURCE_GROUP={selected_group}")
              print(f"V8171_SELECTED_TICKER_COUNT={len(selected)}")
              print(f"V8171_NEXT_STEP={next_step}")

          if __name__ == "__main__":
              main()
          PY

          python -m py_compile investment_score_current_blocker_reaudit_v8171.py
          python investment_score_current_blocker_reaudit_v8171.py \
            | tee /tmp/v8171_stdout.txt

          grep -q '^V8171_REAUDIT=PASS$' /tmp/v8171_stdout.txt
          grep -q '^BLOCKER_OCCURRENCES=321$' \
            latest/investment_score_current_blockers_v8171_run_log_latest.txt
          grep -q '^PRICE_ELASTICITY_BLOCKERS=36$' \
            latest/investment_score_current_blockers_v8171_run_log_latest.txt
          grep -q '^STATUS_OK=true$' \
            latest/investment_score_current_blockers_v8171_run_log_latest.txt

      - name: Validate outputs and production immutability
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import csv, json
          from pathlib import Path

          s = json.loads(Path(
              "latest/investment_score_current_blockers_v8171_summary_latest.json"
          ).read_text(encoding="utf-8"))

          assert s["version"] == (
              "2026-09-23-v8.17.1-post-elasticity-apply-dynamic-blocker-reaudit"
          )
          assert s["status"] == "AUDIT_ONLY_POST_ELASTICITY_DYNAMIC_CURRENT_BLOCKERS"
          assert s["v8170_result_commit"] == (
              "d1c8accf80fea6d1cf308228cd5384a5034dfaaa"
          )
          assert s["scorer_universe_count"] == 120
          assert s["ready_count"] == 22
          assert s["limited_count"] == 98
          assert s["limited_blocker_occurrences"] == 321
          assert s["source_group_counts"]["PRICE_ELASTICITY_20D"] == 36
          assert s["source_group_counts"]["FINANCIAL_VALUATION_CACHE"] == 49
          assert s["elasticity_apply_effect"]["reduced_by"] == 1
          assert s["elasticity_apply_effect"]["production_elasticity_rows_after"] == 152
          assert s["selection_mode"] in {
              "ACTIONABLE_SINGLE_BLOCKER",
              "MULTI_BLOCKER_GROUP",
              "NO_SOURCE_LANE",
          }
          assert s["operational_side_issues"]["us_sp500_run_35803064524"]["cause"] == (
              "MISSING_PYKRX_DEPENDENCY_IN_ISOLATED_BUILD"
          )
          assert all(v is False for v in s["hard_guards"].values())

          with Path(
              "latest/investment_score_current_blockers_v8171.csv"
          ).open(encoding="utf-8-sig", newline="") as f:
              assert len(list(csv.DictReader(f))) == 321

          print("V8171_OUTPUT_VALIDATION=PASS")
          PY

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            investment_score_current_blocker_reaudit_v8148.py \
            investment_score_current_blocker_reaudit_v8161.py \
            latest/investment_score_price_elasticity_production_v8170_summary_latest.json \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.json \
            latest/investment_score_price_elasticity_20d_run_log_latest.txt \
            latest/investment_score_source_cache_latest.csv \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            latest/investment_score_current_blockers_v8166_summary_latest.json \
            api/two_table_v1/manifest.json \
            > /tmp/v8171_protected.after

          diff -u /tmp/v8171_protected.before /tmp/v8171_protected.after

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/v8171_api.after
          diff -u /tmp/v8171_api.before /tmp/v8171_api.after

      - name: Restrict changed files and refuse concurrent protected drift
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          allowed = {
              "investment_score_current_blocker_reaudit_v8171.py",
              "latest/investment_score_current_blockers_v8171.csv",
              "latest/investment_score_current_blockers_v8171_summary_latest.json",
              "latest/investment_score_current_blockers_v8171_run_log_latest.txt",
              "docs/investment_score_current_blockers_v8171.md",
          }
          changed = set()
          for line in subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"], text=True
          ).splitlines():
              if line:
                  changed.add(line[3:].split(" -> ")[-1])
          bad = sorted(changed - allowed)
          if bad:
              raise SystemExit("V8171_UNEXPECTED_CHANGED_FILES:" + ",".join(bad))
          print("V8171_CHANGED_FILES_RESTRICTED=PASS")
          PY

          git fetch origin main

          python - <<'PY'
          import subprocess
          protected = {
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "investment_score_current_blocker_reaudit_v8148.py",
              "investment_score_current_blocker_reaudit_v8161.py",
              "latest/investment_score_price_elasticity_production_v8170_summary_latest.json",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.json",
              "latest/investment_score_price_elasticity_20d_run_log_latest.txt",
              "latest/investment_score_source_cache_latest.csv",
              "latest/financial_valuation_cache_latest.csv",
              "latest/investment_score_ocf_source_latest.csv",
              "latest/investment_score_supply_source_latest.csv",
              "latest/investment_score_current_blockers_v8166_summary_latest.json",
          }
          upstream = set(subprocess.check_output(
              ["git","diff","--name-only","HEAD..origin/main"], text=True
          ).splitlines())
          bad = sorted(p for p in upstream if p in protected or p.startswith("api/two_table_v1/"))
          if bad:
              raise SystemExit("V8171_CONCURRENT_PROTECTED_DRIFT:" + ",".join(bad))
          print("V8171_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

      - name: Commit and push V8.17.1 audit outputs
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            investment_score_current_blocker_reaudit_v8171.py \
            latest/investment_score_current_blockers_v8171.csv \
            latest/investment_score_current_blockers_v8171_summary_latest.json \
            latest/investment_score_current_blockers_v8171_run_log_latest.txt \
            docs/investment_score_current_blockers_v8171.md

          git diff --cached --check
          git commit -m "Reaudit blockers after elasticity apply v8.17.1"
          git pull --rebase origin main
          git push origin HEAD:main
