      - name: Restrict changed files and concurrent protected drift
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess
          allowed={
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/financial_valuation_run_log_latest.txt",
              "latest/investment_score_source_production_v8178_summary_latest.json",
              "latest/investment_score_source_production_v8178_run_log_latest.txt",
              "docs/investment_score_source_production_v8178.md",
          }
          changed=set()
          for line in subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"],text=True
          ).splitlines():
              if line:
                  changed.add(line[3:].split(" -> ")[-1])
          bad=sorted(changed-allowed)
          missing=sorted(allowed-changed)
          if bad:
              raise SystemExit("V8178_UNEXPECTED_CHANGED_FILES:"+",".join(bad))
          if missing:
              raise SystemExit("V8178_EXPECTED_CHANGED_FILES_MISSING:"+",".join(missing))
          print("V8178_CHANGED_FILES_RESTRICTED=PASS")
          PY

          git fetch origin main

          python - <<'PY'
          import subprocess
          protected={
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "investment_score_source_enricher_v854.py",
              ".github/workflows/v854-refresh-investment-score-source-cache.yml",
              "latest/investment_score_source_cache_latest.csv",
              "latest/investment_score_source_run_log_latest.txt",
              "latest/financial_valuation_cache_latest.csv",
              "latest/financial_valuation_run_log_latest.txt",
              "latest/investment_score_source_cache_candidate_v8177.csv",
              "latest/investment_score_source_stage_v8177_summary_latest.json",
          }
          upstream=set(subprocess.check_output(
              ["git","diff","--name-only","HEAD..origin/main"],text=True
          ).splitlines())
          bad=sorted(p for p in upstream if p in protected or p.startswith("api/two_table_v1/"))
          if bad:
              raise SystemExit("V8178_CONCURRENT_PROTECTED_DRIFT:"+",".join(bad))
          print("V8178_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

