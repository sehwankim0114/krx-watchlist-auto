name: Controlled narrow production price elasticity patch v8.18.3

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8183-controlled-narrow-price-elasticity-patch.yml"

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify V8.18.2 lineage and capture production state
        run: |
          set -euo pipefail

          git merge-base --is-ancestor \
            dc4c6ada8570a11b76b35d1ce86e71fd445440aa HEAD

          for f in \
            latest/investment_score_price_elasticity_candidate_v8182.csv \
            latest/investment_score_price_elasticity_stage_v8182_summary_latest.json \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.json \
            latest/investment_score_price_elasticity_20d_run_log_latest.txt \
            investment_score_dry_run_v882.py; do
            test -f "$f"
          done

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            latest/investment_score_price_elasticity_candidate_v8182.csv \
            latest/investment_score_price_elasticity_stage_v8182_summary_latest.json \
            latest/investment_score_source_cache_latest.csv \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            > /tmp/v8183_protected.before

          sha256sum \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.json \
            latest/investment_score_price_elasticity_20d_run_log_latest.txt \
            > /tmp/v8183_intended.before

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/v8183_api.before

      - name: Apply tested candidate with rollback and post regression
        run: |
          set -euo pipefail

          cat > investment_score_price_elasticity_production_patch_v8183.py <<'PY'
          #!/usr/bin/env python3
          import csv
          import json
          import shutil
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          import investment_score_dry_run_v882 as scorer

          VERSION="2026-09-23-v8.18.3-controlled-narrow-production-price-elasticity-patch"
          SOURCE_CONTRACT="2026-09-12-v8.7.5-price-elasticity-20-session-source"
          POLICY="2026-09-13-v8.8.0-explicit-100-point-scoring-contract"
          V8182_VERSION="2026-09-23-v8.18.2-stage-narrow-production-price-elasticity-patch"
          V8182_COMMIT="dc4c6ada8570a11b76b35d1ce86e71fd445440aa"

          TARGETS={
              "006040":{"name":"동원산업","pct":0.9959},
              "012630":{"name":"HDC","pct":2.5720},
              "078930":{"name":"GS","pct":2.2485},
          }
          TARGET_ORDER=["006040","012630","078930"]
          PREVIOUS_PATCH={
              "004990":1.3594,
              "006260":2.70,
              "267250":2.91,
          }

          ROOT=Path(".")
          KST=ZoneInfo("Asia/Seoul")

          PROD=ROOT/"latest/investment_score_price_elasticity_20d_latest.csv"
          META=ROOT/"latest/investment_score_price_elasticity_20d_latest.json"
          RUNLOG=ROOT/"latest/investment_score_price_elasticity_20d_run_log_latest.txt"
          CAND=ROOT/"latest/investment_score_price_elasticity_candidate_v8182.csv"
          STAGE=ROOT/"latest/investment_score_price_elasticity_stage_v8182_summary_latest.json"

          OUTJ=ROOT/"latest/investment_score_price_elasticity_production_v8183_summary_latest.json"
          OUTL=ROOT/"latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt"
          OUTD=ROOT/"docs/investment_score_price_elasticity_production_v8183.md"

          B_PROD=Path("/tmp/v8183_prod.backup.csv")
          B_META=Path("/tmp/v8183_meta.backup.json")
          B_LOG=Path("/tmp/v8183_log.backup.txt")

          BASE_CSV=Path("/tmp/v8183_base.csv")
          BASE_JSON=Path("/tmp/v8183_base.json")
          BASE_LOG=Path("/tmp/v8183_base.log")
          BASE_DOC=Path("/tmp/v8183_base.md")
          CAND_CSV=Path("/tmp/v8183_cand.csv")
          CAND_JSON=Path("/tmp/v8183_cand.json")
          CAND_LOG=Path("/tmp/v8183_cand.log")
          CAND_DOC=Path("/tmp/v8183_cand.md")
          POST_CSV=Path("/tmp/v8183_post.csv")
          POST_JSON=Path("/tmp/v8183_post.json")
          POST_LOG=Path("/tmp/v8183_post.log")
          POST_DOC=Path("/tmp/v8183_post.md")

          def tick(v):
              s="".join(c for c in str(v or "") if c.isdigit())
              return s.zfill(6) if s else ""

          def read_json(p):
              return json.loads(Path(p).read_text(encoding="utf-8-sig"))

          def rows(p):
              with Path(p).open(encoding="utf-8-sig",newline="") as f:
                  return list(csv.DictReader(f))

          def rmap(p):
              return {tick(r.get("ticker")):r for r in rows(p) if tick(r.get("ticker"))}

          def stable(r):
              return json.dumps(r,ensure_ascii=False,sort_keys=True,separators=(",",":"))

          def blocker_count(m):
              return sum(int(r.get("missing_component_count") or 0) for r in m.values())

          def run_score(elasticity,ocsv,ojson,olog,odoc):
              old={k:getattr(scorer,k) for k in ("VERSION","ELASTICITY","OUT_CSV","OUT_JSON","OUT_LOG","OUT_DOC")}
              try:
                  scorer.VERSION=VERSION
                  scorer.ELASTICITY=Path(elasticity)
                  scorer.OUT_CSV=Path(ocsv)
                  scorer.OUT_JSON=Path(ojson)
                  scorer.OUT_LOG=Path(olog)
                  scorer.OUT_DOC=Path(odoc)
                  rc=scorer.main()
              finally:
                  for k,v in old.items():
                      setattr(scorer,k,v)
              if rc not in (None,0):
                  raise RuntimeError("V8183_SCORER_FAILED:"+str(rc))

          def main():
              stage=read_json(STAGE)
              meta=read_json(META)

              assert stage["version"]==V8182_VERSION
              assert stage["status"]=="STAGED_NARROW_PRICE_ELASTICITY_PATCH_PASS"
              assert stage["policy_version"]==POLICY
              assert stage["v8181_result_commit"]=="9a9976855502ed931b1e5e0ddd72c7920b825f47"
              assert stage["next_step"]=="CONTROLLED_NARROW_PRODUCTION_PRICE_ELASTICITY_PATCH_V8183"

              st=stage["staged_cache"]
              rg=stage["scorer_regression"]
              assert (st["production_row_count"],st["staged_row_count"],st["row_delta"])==(152,155,3)
              assert st["added_tickers"]==TARGET_ORDER
              assert st["existing_row_changed_count"]==0
              assert st["target_values"]=={
                  "006040":0.9959,
                  "012630":2.572,
                  "078930":2.2485,
              }
              assert st["basis_date"]=="2026-09-22"

              assert (rg["baseline_ready_count"],rg["staged_ready_count"])==(14,17)
              assert (rg["baseline_limited_count"],rg["staged_limited_count"])==(143,140)
              assert (rg["baseline_blocker_occurrences"],rg["staged_blocker_occurrences"])==(543,540)
              assert rg["blocker_occurrences_reduced_by"]==3
              assert rg["changed_score_tickers"]==TARGET_ORDER
              assert rg["non_target_score_row_changed_count"]==0
              assert rg["newly_ready_tickers"]==TARGET_ORDER
              assert rg["lost_ready_count"]==0
              assert all(v is False for v in stage["hard_guards"].values())

              assert meta["version"]==SOURCE_CONTRACT
              assert meta["status"]=="READY_SOURCE_ONLY"
              assert meta["production_unique_tickers"]==152
              assert meta["ready_tickers"]==152
              assert meta["limited_tickers"]==0
              assert meta["basis_date"]=="2026-09-18"
              assert meta["latest_row_basis_date"]=="2026-09-21"

              np=meta["narrow_patch"]
              assert np["ticker_count"]==3
              assert np["tickers"]==["004990","006260","267250"]
              assert np["values"]=={
                  "004990":1.3594,
                  "006260":2.7,
                  "267250":2.91,
              }

              prod_rows=rows(PROD)
              cand_rows=rows(CAND)
              assert len(prod_rows)==152
              assert len(cand_rows)==155
              assert list(prod_rows[0])==list(cand_rows[0])

              prod_map=rmap(PROD)
              cand_map=rmap(CAND)
              assert len(prod_map)==152 and len(cand_map)==155
              assert set(cand_map)-set(prod_map)==set(TARGET_ORDER)
              assert all(stable(prod_map[c])==stable(cand_map[c]) for c in prod_map)

              for code in TARGET_ORDER:
                  tr=cand_map[code]
                  exp=TARGETS[code]
                  assert tr["name"]==exp["name"]
                  assert tr["source_status"]=="READY"
                  assert tr["basis_date"]=="2026-09-22"
                  assert int(tr["close_observation_count"])==21
                  assert int(tr["daily_return_observation_count"])==20
                  assert abs(float(tr["avg_daily_move_pct"])-exp["pct"])<1e-8

              run_score(PROD,BASE_CSV,BASE_JSON,BASE_LOG,BASE_DOC)
              run_score(CAND,CAND_CSV,CAND_JSON,CAND_LOG,CAND_DOC)

              base=rmap(BASE_CSV)
              cand_score=rmap(CAND_CSV)
              bs=read_json(BASE_JSON)
              cs=read_json(CAND_JSON)

              assert set(base)==set(cand_score) and len(base)==157
              assert (int(bs["ready_count"]),int(bs["limited_count"]),blocker_count(base))==(14,143,543)
              assert (int(cs["ready_count"]),int(cs["limited_count"]),blocker_count(cand_score))==(17,140,540)

              changed=[c for c in sorted(base) if stable(base[c])!=stable(cand_score[c])]
              assert changed==TARGET_ORDER

              shutil.copyfile(PROD,B_PROD)
              shutil.copyfile(META,B_META)
              shutil.copyfile(RUNLOG,B_LOG)

              try:
                  shutil.copyfile(CAND,PROD)
                  if PROD.read_bytes()!=CAND.read_bytes():
                      raise RuntimeError("V8183_APPLIED_BYTES_NOT_CANDIDATE")

                  now=datetime.now(KST).isoformat(timespec="seconds")
                  cumulative=dict(PREVIOUS_PATCH)
                  cumulative.update({c:TARGETS[c]["pct"] for c in TARGET_ORDER})
                  cumulative_tickers=sorted(cumulative)

                  new_meta=dict(meta)
                  new_meta.update({
                      "version":SOURCE_CONTRACT,
                      "refresh_version":VERSION,
                      "generated_at_kst":now,
                      "status":"READY_SOURCE_ONLY",
                      "basis_date":"2026-09-18",
                      "basis_date_semantics":"full_refresh_basis; per-row basis_date is authoritative for narrow-patched rows",
                      "latest_row_basis_date":"2026-09-22",
                      "production_unique_tickers":155,
                      "ready_tickers":155,
                      "limited_tickers":0,
                      "source":"official KRX STK_BYDD_TRD; v8.12.7 full refresh plus validated narrow additions",
                      "narrow_patch":{
                          "version":VERSION,
                          "promoted_from_version":V8182_VERSION,
                          "promoted_from_commit":V8182_COMMIT,
                          "ticker_count":6,
                          "tickers":cumulative_tickers,
                          "basis_date":"2026-09-22",
                          "values":cumulative,
                          "latest_added_tickers":TARGET_ORDER,
                      },
                  })
                  new_meta["hard_guards"]={
                      "investment_score_100_calculated":False,
                      "score_thresholds_defined":False,
                      "avg_daily_range_20_pct_substituted":False,
                      "production_api_changed":False,
                      "non_target_elasticity_rows_modified":False,
                  }
                  META.write_text(
                      json.dumps(new_meta,ensure_ascii=False,indent=2)+"\n",
                      encoding="utf-8",
                  )

                  RUNLOG.write_text("\n".join([
                      f"VERSION={SOURCE_CONTRACT}",
                      f"REFRESH_VERSION={VERSION}",
                      "FULL_REFRESH_BASIS_DATE=2026-09-18",
                      "LATEST_ROW_BASIS_DATE=2026-09-22",
                      "PRODUCTION_UNIQUE_TICKERS=155",
                      "PRICE_ELASTICITY_20D_READY=155",
                      "PRICE_ELASTICITY_20D_LIMITED=0",
                      "NARROW_PATCH_COUNT=6",
                      "NARROW_PATCH_TICKERS=004990,006040,006260,012630,078930,267250",
                      "LATEST_NARROW_PATCH_TICKERS=006040,012630,078930",
                      "CLOSE_OBSERVATIONS_REQUIRED=21",
                      "DAILY_RETURN_OBSERVATIONS_REQUIRED=20",
                      "AVG_DAILY_RANGE_20_PCT_SUBSTITUTED=false",
                      "INVESTMENT_SCORE_100_CALCULATED=false",
                      "SCORE_THRESHOLDS_DEFINED=false",
                      "NON_TARGET_ELASTICITY_ROWS_MODIFIED=false",
                      "PRODUCTION_DATA_CHANGED=true",
                      "PRODUCTION_API_CHANGED=false",
                      "PRODUCTION_SCORE_WRITTEN=false",
                      "STATUS=OK",
                  ])+"\n",encoding="utf-8")

                  post_map=rmap(PROD)
                  assert len(post_map)==155
                  assert all(stable(prod_map[c])==stable(post_map[c]) for c in prod_map)
                  for code in TARGET_ORDER:
                      assert stable(post_map[code])==stable(cand_map[code])

                  run_score(PROD,POST_CSV,POST_JSON,POST_LOG,POST_DOC)
                  post=rmap(POST_CSV)
                  ps=read_json(POST_JSON)

                  assert set(post)==set(cand_score)
                  mismatch=[
                      c for c in sorted(post)
                      if stable(post[c])!=stable(cand_score[c])
                  ]
                  if mismatch:
                      raise RuntimeError(
                          "V8183_POST_SCORE_NOT_STAGE:"+",".join(mismatch[:30])
                      )

                  assert (int(ps["ready_count"]),int(ps["limited_count"]),blocker_count(post))==(17,140,540)

                  newly_ready=[
                      c for c in sorted(base)
                      if base[c].get("score_status")!="READY"
                      and post[c].get("score_status")=="READY"
                  ]
                  assert newly_ready==TARGET_ORDER

                  lost_ready=[
                      c for c in sorted(base)
                      if base[c].get("score_status")=="READY"
                      and post[c].get("score_status")!="READY"
                  ]
                  assert not lost_ready

                  summary={
                      "version":VERSION,
                      "generated_at_kst":now,
                      "status":"PRODUCTION_NARROW_ELASTICITY_PATCH_APPLIED_POST_REGRESSION_PASS",
                      "policy_version":POLICY,
                      "source_contract_version":SOURCE_CONTRACT,
                      "v8182_version":V8182_VERSION,
                      "v8182_result_commit":V8182_COMMIT,
                      "production_cache":{
                          "row_count_before":152,
                          "row_count_after":155,
                          "row_delta":3,
                          "latest_added_tickers":TARGET_ORDER,
                          "cumulative_narrow_patch_tickers":cumulative_tickers,
                          "cumulative_narrow_patch_count":6,
                          "existing_row_changed_count":0,
                          "post_apply_exact_stage_bytes":True,
                      },
                      "scorer_regression":{
                          "universe_count":157,
                          "ready_before":14,
                          "ready_after":17,
                          "limited_before":143,
                          "limited_after":140,
                          "blockers_before":543,
                          "blockers_after":540,
                          "blockers_reduced_by":3,
                          "changed_score_row_count":3,
                          "changed_score_tickers":TARGET_ORDER,
                          "non_target_score_row_changed_count":0,
                          "newly_ready_count":3,
                          "newly_ready_tickers":TARGET_ORDER,
                          "lost_ready_count":0,
                          "post_score_equals_staged_score":True,
                      },
                      "rollback_guard":{
                          "enabled":True,
                          "restores_cache":True,
                          "restores_metadata":True,
                          "restores_run_log":True,
                      },
                      "hard_guards":{
                          "production_price_elasticity_cache_modified":True,
                          "production_price_elasticity_metadata_modified":True,
                          "production_price_elasticity_run_log_modified":True,
                          "production_source_cache_modified":False,
                          "production_financial_cache_modified":False,
                          "production_ocf_cache_modified":False,
                          "production_supply_source_modified":False,
                          "production_api_modified":False,
                          "production_score_written":False,
                          "scoring_policy_modified":False,
                          "atr_substituted":False,
                          "nonofficial_price_source_used":False,
                          "non_target_elasticity_rows_modified":False,
                          "ready_regression_count":0,
                      },
                      "next_step":"POST_ELASTICITY_APPLY_DYNAMIC_BLOCKER_REAUDIT_V8184",
                  }

                  OUTJ.write_text(
                      json.dumps(summary,ensure_ascii=False,indent=2)+"\n",
                      encoding="utf-8",
                  )
                  OUTL.write_text("\n".join([
                      f"VERSION={VERSION}",
                      "STATUS=PRODUCTION_NARROW_ELASTICITY_PATCH_APPLIED_POST_REGRESSION_PASS",
                      "PRODUCTION_ROWS_BEFORE=152",
                      "PRODUCTION_ROWS_AFTER=155",
                      "LATEST_NARROW_PATCH_COUNT=3",
                      "LATEST_NARROW_PATCH_TICKERS=006040,012630,078930",
                      "CUMULATIVE_NARROW_PATCH_COUNT=6",
                      "SCORER_UNIVERSE=157",
                      "READY_BEFORE=14",
                      "READY_AFTER=17",
                      "LIMITED_BEFORE=143",
                      "LIMITED_AFTER=140",
                      "BLOCKERS_BEFORE=543",
                      "BLOCKERS_AFTER=540",
                      "BLOCKER_REDUCED_BY=3",
                      "CHANGED_SCORE_ROWS=3",
                      "NON_TARGET_SCORE_ROW_CHANGED=0",
                      "NEWLY_READY=3",
                      "LOST_READY=0",
                      "POST_SCORE_EQUALS_STAGED=true",
                      "EXISTING_ELASTICITY_ROW_CHANGED_COUNT=0",
                      "ROLLBACK_GUARD=true",
                      "PRODUCTION_API_MODIFIED=false",
                      "PRODUCTION_SCORE_WRITTEN=false",
                      "SCORING_POLICY_MODIFIED=false",
                      "STATUS_OK=true",
                      "NEXT_STEP=POST_ELASTICITY_APPLY_DYNAMIC_BLOCKER_REAUDIT_V8184",
                  ])+"\n",encoding="utf-8")

                  OUTD.parent.mkdir(parents=True,exist_ok=True)
                  OUTD.write_text(
                      "# V8.18.3 controlled narrow production price-elasticity patch\n\n"
                      "- Added only 동원산업(006040), HDC(012630), GS(078930).\n"
                      "- Cache rows: 152 -> 155.\n"
                      "- Existing 152 rows are preserved field-for-field.\n"
                      "- READY / LIMITED: 14/143 -> 17/140.\n"
                      "- Blockers: 543 -> 540.\n"
                      "- Post-apply score equals the tested V8.18.2 staged state.\n"
                      "- API, scoring policy, and production score are not modified.\n"
                      "- Rollback guard covers cache, metadata, and run log.\n\n"
                      "Next: POST_ELASTICITY_APPLY_DYNAMIC_BLOCKER_REAUDIT_V8184\n",
                      encoding="utf-8"
                  )

              except Exception:
                  shutil.copyfile(B_PROD,PROD)
                  shutil.copyfile(B_META,META)
                  shutil.copyfile(B_LOG,RUNLOG)
                  raise

              print("V8183_CONTROLLED_APPLY=PASS")

          if __name__=="__main__":
              main()
          PY

          python -m py_compile investment_score_price_elasticity_production_patch_v8183.py
          python investment_score_price_elasticity_production_patch_v8183.py

          grep -q '^STATUS_OK=true$' \
            latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt
          grep -q '^PRODUCTION_ROWS_AFTER=155$' \
            latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt
          grep -q '^READY_AFTER=17$' \
            latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt
          grep -q '^BLOCKERS_AFTER=540$' \
            latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt
          grep -q '^ROLLBACK_GUARD=true$' \
            latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt
          grep -q '^LOST_READY=0$' \
            latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt

      - name: Verify intended only production mutation
        run: |
          set -euo pipefail

          sha256sum \
            config/investment_score_policy_v880.json \
            investment_score_dry_run_v882.py \
            latest/investment_score_price_elasticity_candidate_v8182.csv \
            latest/investment_score_price_elasticity_stage_v8182_summary_latest.json \
            latest/investment_score_source_cache_latest.csv \
            latest/financial_valuation_cache_latest.csv \
            latest/investment_score_ocf_source_latest.csv \
            latest/investment_score_supply_source_latest.csv \
            > /tmp/v8183_protected.after

          diff -u /tmp/v8183_protected.before /tmp/v8183_protected.after

          find api/two_table_v1 -maxdepth 1 -type f -print0 \
            | sort -z | xargs -0 sha256sum > /tmp/v8183_api.after
          diff -u /tmp/v8183_api.before /tmp/v8183_api.after

          sha256sum \
            latest/investment_score_price_elasticity_20d_latest.csv \
            latest/investment_score_price_elasticity_20d_latest.json \
            latest/investment_score_price_elasticity_20d_run_log_latest.txt \
            > /tmp/v8183_intended.after

          if diff -q /tmp/v8183_intended.before /tmp/v8183_intended.after >/dev/null; then
            echo "::error::Expected elasticity production changes were not detected"
            exit 1
          fi

      - name: Restrict changed files and concurrent protected drift
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed={
              "investment_score_price_elasticity_production_patch_v8183.py",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.json",
              "latest/investment_score_price_elasticity_20d_run_log_latest.txt",
              "latest/investment_score_price_elasticity_production_v8183_summary_latest.json",
              "latest/investment_score_price_elasticity_production_v8183_run_log_latest.txt",
              "docs/investment_score_price_elasticity_production_v8183.md",
          }

          changed=set()
          for line in subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"],
              text=True
          ).splitlines():
              if line:
                  changed.add(line[3:].split(" -> ")[-1])

          bad=sorted(changed-allowed)
          missing=sorted(allowed-changed)
          if bad:
              raise SystemExit("V8183_UNEXPECTED_CHANGED_FILES:"+",".join(bad))
          if missing:
              raise SystemExit("V8183_EXPECTED_CHANGED_FILES_MISSING:"+",".join(missing))

          print("V8183_CHANGED_FILES_RESTRICTED=PASS")
          PY

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected={
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_price_elasticity_candidate_v8182.csv",
              "latest/investment_score_price_elasticity_stage_v8182_summary_latest.json",
