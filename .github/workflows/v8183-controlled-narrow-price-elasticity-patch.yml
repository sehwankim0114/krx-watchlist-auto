          bad=sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if bad:
              raise SystemExit("V8183_CONCURRENT_PROTECTED_DRIFT:"+",".join(bad))

          print("V8183_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

