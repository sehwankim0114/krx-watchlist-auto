      - name: Restrict changed files and concurrent protected drift
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed={
              "investment_score_price_elasticity_multi_shadow_v8186.py",
              "latest/investment_score_price_elasticity_multi_source_v8186.csv",
              "latest/investment_score_price_elasticity_candidate_v8186.csv",
              "latest/investment_score_price_elasticity_multi_shadow_v8186.csv",
              "latest/investment_score_price_elasticity_multi_shadow_v8186_summary_latest.json",
              "latest/investment_score_price_elasticity_multi_shadow_v8186_run_log_latest.txt",
              "docs/investment_score_price_elasticity_multi_shadow_v8186.md",
          }

          changed=set()
          for line in subprocess.check_output(
              ["git","status","--porcelain","--untracked-files=all"],
              text=True
          ).splitlines():
              if line:
                  changed.add(line[3:].split(" -> ")[-1])

          bad=sorted(changed-allowed)
          if bad:
              raise SystemExit("V8186_UNEXPECTED_CHANGED_FILES:"+",".join(bad))

          print("V8186_CHANGED_FILES_RESTRICTED=PASS")
          PY

          git fetch origin main

          python - <<'PY'
          import subprocess

          protected={
              "config/investment_score_policy_v880.json",
              "investment_score_dry_run_v882.py",
              "latest/investment_score_price_elasticity_multi_audit_v8185.csv",
              "latest/investment_score_price_elasticity_multi_audit_v8185_summary_latest.json",
              "latest/investment_score_price_elasticity_20d_latest.csv",
              "latest/investment_score_price_elasticity_20d_latest.json",
              "latest/investment_score_price_elasticity_20d_run_log_latest.txt",
              "latest/investment_score_source_cache_latest.csv",
              "latest/financial_valuation_cache_latest.csv",
          }

          upstream=set(subprocess.check_output(
              ["git","diff","--name-only","HEAD..origin/main"],
              text=True
          ).splitlines())

          bad=sorted(
              p for p in upstream
              if p in protected or p.startswith("api/two_table_v1/")
          )
          if bad:
              raise SystemExit("V8186_CONCURRENT_PROTECTED_DRIFT:"+",".join(bad))

          print("V8186_NO_CONCURRENT_PROTECTED_DRIFT=PASS")
          PY

