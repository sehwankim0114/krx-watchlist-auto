name: Run patched V8.20.0B without workflow rewrite

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - ".github/workflows/v8200b_runtime_fixed_runner.yml"

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  run-patched-v8200b:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install runner helper
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install pyyaml

      - name: Execute V8.20.0B with runtime PYTHONPATH fix
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path
          import os
          import subprocess
          import yaml

          workflow = Path(".github/workflows/v8200b_fastlane.yml")
          if not workflow.exists():
              raise SystemExit("V8200B_ORIGINAL_WORKFLOW_MISSING")

          text = workflow.read_text(encoding="utf-8")

          old = '          python /tmp/v8200b_post.py | tee /tmp/v8200b_post_stdout.txt'
          new = '          PYTHONPATH="$GITHUB_WORKSPACE" python /tmp/v8200b_post.py | tee /tmp/v8200b_post_stdout.txt'

          if old not in text and new not in text:
              raise SystemExit("V8200B_RUNTIME_PATCH_TARGET_NOT_FOUND")

          patched = text.replace(old, new, 1)
          if new not in patched:
              raise SystemExit("V8200B_RUNTIME_PATCH_FAILED")

          data = yaml.safe_load(patched)
          steps = data["jobs"]["fastlane"]["steps"]

          run_steps = [(s.get("name", "unnamed"), s["run"]) for s in steps if "run" in s]

          print(f"V8200B_RUNTIME_RUN_STEP_COUNT={len(run_steps)}")
          print("V8200B_RUNTIME_PATCH=PASS")

          env = os.environ.copy()
          env["PYTHONPATH"] = env.get("GITHUB_WORKSPACE", os.getcwd())

          for idx, (name, script) in enumerate(run_steps, start=1):
              print(f"===== V8200B ORIGINAL RUN STEP {idx}/{len(run_steps)}: {name} =====", flush=True)
              subprocess.run(
                  ["bash", "-euo", "pipefail", "-c", script],
                  cwd=env.get("GITHUB_WORKSPACE", os.getcwd()),
                  env=env,
                  check=True,
              )

          print("V8200B_RUNTIME_FULL_EXECUTION=PASS")
          PY
