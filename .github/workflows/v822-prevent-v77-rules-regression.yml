name: V822 Prevent V77 Rules Regression

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v822-prevent-v77-rules-regression
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest

    env:
      TZ: Asia/Seoul
      PYTHONPYCACHEPREFIX: /tmp/v822_pycache

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m pip install --disable-pip-version-check PyYAML

      - name: Check V8.2.2 files
        run: |
          set -euo pipefail
          test -f repair_runtime_freshness_rules_v822.py
          test -f patch_runtime_freshness_v77.py
          test -f refresh_runtime_freshness_v77.py
          test -f build_api_json.py
          test -f validate_api_sync.py
          test -f docs/stock_table_rules_latest.md
          test -f .github/workflows/v77-runtime-freshness-gate.yml
          test -f .github/workflows/v822-prevent-v77-rules-regression.yml
          echo "V822_PREREQUISITES=OK"

      - name: Compile and self-test repair
        run: |
          set -euo pipefail
          python -m py_compile repair_runtime_freshness_rules_v822.py
          python repair_runtime_freshness_rules_v822.py --self-test \
            | tee /tmp/v822_self_test.txt
          grep -q "REPAIR_RUNTIME_FRESHNESS_RULES_V822_SELF_TEST=PASS" \
            /tmp/v822_self_test.txt

      - name: Apply V8.2.2 repair
        run: |
          set -euo pipefail
          python repair_runtime_freshness_rules_v822.py \
            | tee /tmp/v822_repair.txt
          grep -q "SCHEDULED_V77_PATCHER_DISABLED=PASS" \
            /tmp/v822_repair.txt
          grep -q "V77_NEWER_RULES_DOWNGRADE_GUARD=PASS" \
            /tmp/v822_repair.txt
          grep -q "RUNTIME_FRESHNESS_RULES_REPAIR_V822=PASS" \
            /tmp/v822_repair.txt

      - name: Verify scheduled workflow safety
        run: |
          set -euo pipefail
          python - <<'PY'
          import re
          from pathlib import Path
          import yaml

          path = Path(".github/workflows/v77-runtime-freshness-gate.yml")
          text = path.read_text(encoding="utf-8")
          payload = yaml.load(text, Loader=yaml.BaseLoader)
          triggers = set(payload.get("on") or {})
          assert triggers == {"workflow_dispatch", "schedule"}, triggers
          assert "python patch_runtime_freshness_v77.py" not in text
          assert "Install V7.7 into full API build" not in text
          assert "git add api" in text
          assert "V822_GLOBAL_RULES_VERSION_PROTECTION" in text

          rules = Path("docs/stock_table_rules_latest.md").read_text(
              encoding="utf-8"
          )
          match = re.search(r"- 규칙 버전:\s*`([^`]+)`", rules)
          assert match
          assert match.group(1) == (
              "2026-07-14-v8.0-request-time-position-alignment"
          )
          print("V77_SCHEDULE_ONLY_REFRESH=PASS")
          print("GLOBAL_RULES_VERSION_RESTORED_V80=PASS")
          PY

      - name: Rebuild API with restored global rules
        run: |
          set -euo pipefail
          python -m py_compile \
            patch_runtime_freshness_v77.py \
            refresh_runtime_freshness_v77.py \
            build_api_json.py
          python build_api_json.py | tee /tmp/v822_build.txt
          grep -q "BUILD_ID=" /tmp/v822_build.txt
          grep -q \
            "RULES_VERSION=2026-07-14-v8.0-request-time-position-alignment" \
            /tmp/v822_build.txt
          echo "V822_API_REBUILD=PASS"

      - name: Validate restored API and V8.2 contract
        run: |
          set -euo pipefail
          python validate_api_sync.py --api-dir api \
            | tee /tmp/v822_api_validation.txt
          grep -q "API_VALIDATION_STATUS=PASS" \
            /tmp/v822_api_validation.txt

          python - <<'PY'
          import json
          from pathlib import Path

          expected = "2026-07-14-v8.0-request-time-position-alignment"
          status = json.loads(
              Path("api/status.json").read_text(encoding="utf-8")
          )
          rules = json.loads(
              Path("api/stock_table_rules.json").read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path("api/manifest.json").read_text(encoding="utf-8")
          )
          assert status.get("rules_version") == expected
          assert rules.get("rules_version") == expected
          assert (manifest.get("rules") or {}).get("version") == expected
          contract = manifest.get("command_route_contract") or {}
          assert contract.get("command_count") == 13
          assert contract.get("ready_count") == 13
          assert contract.get("structure_ok") is True
          gate = status.get("runtime_freshness_gate") or {}
          assert gate.get("version") == (
              "2026-07-14-v7.7-runtime-freshness-gate"
          )
          print("GLOBAL_RULES_VERSION_V80=PASS")
          print("RUNTIME_GATE_COMPONENT_VERSION_V77=PASS")
          print("SOURCE_COMMAND_ROUTE_CONTRACT_13_OF_13=PASS")
          PY

      - name: Commit and push V8.2.2
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A \
            repair_runtime_freshness_rules_v822.py \
            patch_runtime_freshness_v77.py \
            build_api_json.py \
            docs/stock_table_rules_latest.md \
            api \
            latest

          if git diff --cached --quiet; then
            echo "::error::No V8.2.2 repair changes were produced."
            exit 1
          fi

          git commit -m "Prevent V7.7 rules-version regression v8.2.2"

          echo "WORKTREE_AFTER_COMMIT_BEGIN"
          git status --porcelain
          echo "WORKTREE_AFTER_COMMIT_END"
          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            exit 1
          fi

          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != \
               "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi
          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
