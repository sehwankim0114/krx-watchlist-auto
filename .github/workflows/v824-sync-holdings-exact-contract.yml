name: Sync holdings exact-ticker contract v8.2.4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-api-json-main
  cancel-in-progress: false

jobs:
  sync-contract:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply exact-ticker source contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import base64
          import json
          from pathlib import Path


          ROOT = Path.cwd()
          BUILD = ROOT / "build_stock_reference_api.py"
          MANIFEST = ROOT / "api" / "stock_reference_manifest.json"
          ACTION_SCHEMA = ROOT / "docs" / "custom_gpt_action_schema.yaml"
          INSTRUCTIONS = ROOT / "docs" / "custom_gpt_instructions.md"
          CONTRACT = ROOT / "docs" / "holdings_private_runtime_contract.md"
          VALIDATOR = ROOT / "validate_api_sync.py"
          STRUCTURE = ROOT / "docs" / "REPOSITORY_STRUCTURE.md"

          ACTION_SCHEMA_B64 = ""
          INSTRUCTIONS_B64 = ""
          CONTRACT_B64 = ""

          SCRIPT_VERSION = (
              "build_stock_reference_api.py "
              "v1.2.0-exact-ticker-action-v824"
          )
          POLICY_VERSION = (
              "2026-07-16-v8.2.4-holdings-exact-ticker"
          )
          USAGE = {
              "step_1": "Read ticker from the user's current message.",
              "step_2": (
                  "Use the first two ticker digits as prefix and keep the "
                  "full six-digit ticker."
              ),
              "step_3": (
                  "Call getStockReferenceShard with prefix, ticker and, "
                  "when known, market."
              ),
              "step_4": (
                  "Require status=OK, exact_match=true, "
                  "returned_row_count=1 and contains_user_holdings=false."
              ),
              "step_5": (
                  "Use only the returned exact market+ticker row; do not "
                  "substitute another row or source."
              ),
              "step_6": (
                  "Calculate quantity, cost basis, market value, "
                  "profit/loss and return only in the conversation."
              ),
              "prefix_only_call_forbidden": True,
              "required_parameters": ["prefix", "ticker"],
              "optional_parameters": ["market"],
              "cash_credit_rule": (
                  "Keep cash and credit lots as separate rows."
              ),
          }
          ACTION_CONTRACT = {
              "version": "2026-07-16-v8.2.4-exact-ticker-filter",
              "operation_id": "getStockReferenceShard",
              "action_domain": (
                  "https://krx-live-price-ksh.diaconos.workers.dev"
              ),
              "required_parameters": ["prefix", "ticker"],
              "optional_parameters": ["market"],
              "prefix_only_call_forbidden": True,
              "expected_response": {
                  "status": "OK",
                  "exact_match": True,
                  "returned_row_count": 1,
                  "contains_user_holdings": False,
                  "values_recalculated": False,
              },
          }


          def read(path: Path) -> str:
              if not path.exists():
                  raise SystemExit(f"Required file missing: {path}")
              return path.read_text(encoding="utf-8")


          def write_if_changed(path: Path, text: str) -> None:
              if not text.endswith("\n"):
                  text += "\n"
              if read(path) != text:
                  path.write_text(text, encoding="utf-8")


          def replace_known(text: str, old: str, new: str, label: str) -> str:
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one old block, found {count}"
                  )
              return text.replace(old, new, 1)


          build = read(BUILD)
          build = replace_known(
              build,
              '''SCRIPT_VERSION = (
              "build_stock_reference_api.py "
              "v1.1.0-summary-label-compat-v741"
          )''',
              '''SCRIPT_VERSION = (
              "build_stock_reference_api.py "
              "v1.2.0-exact-ticker-action-v824"
          )''',
              "build script version",
          )
          build = replace_known(
              build,
              '''POLICY_VERSION = (
              "2026-07-03-v6.0-private-holdings-runtime"
          )''',
              '''POLICY_VERSION = (
              "2026-07-16-v8.2.4-holdings-exact-ticker"
          )''',
              "build policy version",
          )

          action_contract_source = '''        "action_contract": {
                      "version": "2026-07-16-v8.2.4-exact-ticker-filter",
                      "operation_id": "getStockReferenceShard",
                      "action_domain": (
                          "https://krx-live-price-ksh.diaconos.workers.dev"
                      ),
                      "required_parameters": ["prefix", "ticker"],
                      "optional_parameters": ["market"],
                      "prefix_only_call_forbidden": True,
                      "expected_response": {
                          "status": "OK",
                          "exact_match": True,
                          "returned_row_count": 1,
                          "contains_user_holdings": False,
                          "values_recalculated": False,
                      },
                  },
          '''
          usage_source = '''        "usage": {
                      "step_1": (
                          "Read ticker from the user's current message."
                      ),
                      "step_2": (
                          "Use the first two ticker digits as prefix and keep "
                          "the full six-digit ticker."
                      ),
                      "step_3": (
                          "Call getStockReferenceShard with prefix, ticker "
                          "and, when known, market."
                      ),
                      "step_4": (
                          "Require status=OK, exact_match=true, "
                          "returned_row_count=1 and "
                          "contains_user_holdings=false."
                      ),
                      "step_5": (
                          "Use only the returned exact market+ticker row; "
                          "do not substitute another row or source."
                      ),
                      "step_6": (
                          "Calculate quantity, cost basis, market value, "
                          "profit/loss and return only in the conversation."
                      ),
                      "prefix_only_call_forbidden": True,
                      "required_parameters": ["prefix", "ticker"],
                      "optional_parameters": ["market"],
                      "cash_credit_rule": (
                          "Keep cash and credit lots as separate rows."
                      ),
                  },
          '''

          if '        "action_contract": {' not in build:
              marker = '        "usage": {'
              if build.count(marker) != 1:
                  raise SystemExit("build action-contract insertion marker mismatch")
              build = build.replace(marker, action_contract_source + marker, 1)

          usage_begin = build.find('        "usage": {')
          usage_end = build.find('        "source_files": [', usage_begin)
          if usage_begin < 0 or usage_end < 0:
              raise SystemExit("build usage block markers missing")
          build = build[:usage_begin] + usage_source + build[usage_end:]

          self_test_marker = '''        shard_files = sorted(
          '''
          self_test_block = '''        assert manifest["action_contract"][
                      "prefix_only_call_forbidden"
                  ] is True
                  assert manifest["action_contract"][
                      "required_parameters"
                  ] == ["prefix", "ticker"]
                  assert manifest["usage"][
                      "prefix_only_call_forbidden"
                  ] is True
                  assert manifest["usage"]["step_3"] == (
                      "Call getStockReferenceShard with prefix, ticker "
                      "and, when known, market."
                  )

                  shard_files = sorted(
          '''
          if 'manifest["action_contract"]' not in build:
              if build.count(self_test_marker) != 1:
                  raise SystemExit("build self-test insertion marker mismatch")
              build = build.replace(
                  self_test_marker,
                  self_test_block,
                  1,
              )
          if "Call getStockReferenceShard(prefix)." in build:
              raise SystemExit("old prefix-only manifest instruction remains")
          write_if_changed(BUILD, build)

          manifest = json.loads(read(MANIFEST))
          manifest["script_version"] = SCRIPT_VERSION
          manifest["policy_version"] = POLICY_VERSION
          manifest["action_contract"] = ACTION_CONTRACT
          manifest["usage"] = USAGE
          write_if_changed(
              MANIFEST,
              json.dumps(manifest, ensure_ascii=False, indent=2),
          )

          write_if_changed(
              ACTION_SCHEMA,
              base64.b64decode(ACTION_SCHEMA_B64).decode("utf-8"),
          )
          write_if_changed(
              INSTRUCTIONS,
              base64.b64decode(INSTRUCTIONS_B64).decode("utf-8"),
          )
          write_if_changed(
              CONTRACT,
              base64.b64decode(CONTRACT_B64).decode("utf-8"),
          )

          validator = read(VALIDATOR)
          validator = replace_known(
              validator,
              'SCRIPT_VERSION = "validate_api_sync.py v1.4_quote_key_aliases_v64"',
              'SCRIPT_VERSION = "validate_api_sync.py v1.5_holdings_exact_ticker_v824"',
              "validator version",
          )
          validation_block = '''    # HOLDINGS_EXACT_TICKER_CONTRACT_V824_BEGIN
              holdings_manifest = read_json(
                  api / "stock_reference_manifest.json"
              )
              if not holdings_manifest:
                  errors.append(
                      "stock_reference_manifest.json missing or invalid"
                  )
              else:
                  action_contract = holdings_manifest.get(
                      "action_contract"
                  ) or {}
                  usage = holdings_manifest.get("usage") or {}
                  if action_contract.get("operation_id") != (
                      "getStockReferenceShard"
                  ):
                      errors.append(
                          "holdings exact-ticker operation contract missing"
                      )
                  if action_contract.get("required_parameters") != [
                      "prefix",
                      "ticker",
                  ]:
                      errors.append(
                          "holdings required parameters must be prefix+ticker"
                      )
                  if action_contract.get(
                      "prefix_only_call_forbidden"
                  ) is not True:
                      errors.append(
                          "holdings prefix-only call must be forbidden"
                      )
                  if usage.get("prefix_only_call_forbidden") is not True:
                      errors.append(
                          "holdings usage allows prefix-only call"
                      )
                  step_3 = str(usage.get("step_3") or "")
                  if not all(
                      token in step_3
                      for token in ("prefix", "ticker", "market")
                  ):
                      errors.append(
                          "holdings usage step_3 lacks exact parameters"
                      )

              canonical_schema_path = (
                  api.parent / "docs" / "custom_gpt_action_schema.yaml"
              )
              if not canonical_schema_path.exists():
                  errors.append("canonical custom GPT schema missing")
              else:
                  schema_text = canonical_schema_path.read_text(
                      encoding="utf-8"
                  )
                  required_tokens = (
                      "version: 7.0.1",
                      "https://krx-live-price-ksh.diaconos.workers.dev",
                      "operationId: getStockReferenceShard",
                      "name: ticker",
                      "name: market",
                  )
                  for token in required_tokens:
                      if token not in schema_text:
                          errors.append(
                              "canonical custom GPT schema missing token: "
                              + token
                          )
                  if "https://raw.githubusercontent.com" in schema_text:
                      errors.append(
                          "raw GitHub Action domain is forbidden"
                      )
                  if schema_text.count("\\n- url: ") != 1:
                      errors.append(
                          "canonical custom GPT schema must use one server"
                      )

              instructions_path = (
                  api.parent / "docs" / "custom_gpt_instructions.md"
              )
              if not instructions_path.exists():
                  errors.append("canonical custom GPT instructions missing")
              else:
                  instructions_text = instructions_path.read_text(
                      encoding="utf-8"
                  )
                  instruction_tokens = (
                      "2026-07-16-v6.8.1-holdings-exact-filter",
                      "## 12. 보유종목표 개인정보 비저장 런타임",
                      "getStockReferenceShard를 prefix만으로 호출하지 않는다.",
                  )
                  for token in instruction_tokens:
                      if token not in instructions_text:
                          errors.append(
                              "canonical custom GPT instructions missing "
                              "token: " + token
                          )
              # HOLDINGS_EXACT_TICKER_CONTRACT_V824_END

          '''
          if "# HOLDINGS_EXACT_TICKER_CONTRACT_V824_BEGIN" not in validator:
              marker = "    live_schema_path = (\n"
              if validator.count(marker) != 1:
                  raise SystemExit("validator insertion marker mismatch")
              validator = validator.replace(
                  marker,
                  validation_block + marker,
                  1,
              )
          write_if_changed(VALIDATOR, validator)

          structure = read(STRUCTURE)
          old_structure = '''<!-- REQUEST_TIME_PRICE_STRUCTURE_V51_BEGIN -->
          ## 요청시점 현재가 Action

          - Worker: `https://krx-live-price-ksh.diaconos.workers.dev`
          - Action 스키마: `docs/custom_gpt_live_price_action_schema.yaml`
          - 호출 작업: `getRequestTimePriceHealth`, `getRequestTimePrices`
          - 공식 KRX 과거자료는 GitHub API에 유지한다.
          - 요청시점 가격은 Custom GPT 응답 작성 단계에서 모든 표 행에 결합한다.
          - 한 호출당 최대 50개이며 큰 표는 여러 배치로 나눈다.
          <!-- REQUEST_TIME_PRICE_STRUCTURE_V51_END -->'''
          new_structure = '''<!-- REQUEST_TIME_PRICE_STRUCTURE_V51_BEGIN -->
          ## 단일 Worker Action

          - 단일 Action 도메인: `https://krx-live-price-ksh.diaconos.workers.dev`
          - 설치용 통합 스키마: `docs/custom_gpt_action_schema.yaml`
          - `raw.githubusercontent.com`을 별도 Action으로 등록하지 않는다.
          - `docs/custom_gpt_live_price_action_schema.yaml`은 과거 요청시점 가격 계약의 호환 참고파일이며 별도 Action으로 설치하지 않는다.
          - 요청시점 가격은 Custom GPT 응답 작성 단계에서 모든 표 행에 결합한다.
          - 보유종목 공개 참고행은 `prefix+ticker`와 선택 `market`으로 정확히 한 행만 조회한다.
          <!-- REQUEST_TIME_PRICE_STRUCTURE_V51_END -->'''
          structure = replace_known(
              structure,
              old_structure,
              new_structure,
              "repository structure Action block",
          )
          write_if_changed(STRUCTURE, structure)

          print("V824_SOURCE_PATCH=PASS")
          print("CANONICAL_ACTION_DOMAIN_COUNT=1")
          print("RAW_GITHUB_ACTION_PRESENT=false")
          print("HOLDINGS_PREFIX_ONLY_CALL_FORBIDDEN=true")
          print("USER_HOLDINGS_PERSISTED=false")
          PY

      - name: Validate exact-ticker contract
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            build_stock_reference_api.py \
            validate_api_sync.py

          python build_stock_reference_api.py --self-test

          python - <<'PY'
          import json
          import re
          from pathlib import Path

          schema_text = Path(
              "docs/custom_gpt_action_schema.yaml"
          ).read_text(encoding="utf-8")
          operation_ids = re.findall(
              r"^\s+operationId:\s*([^\s]+)\s*$",
              schema_text,
              flags=re.MULTILINE,
          )
          assert len(operation_ids) == 30, len(operation_ids)
          assert len(set(operation_ids)) == 30
          assert schema_text.count("\n- url: ") == 1
          assert (
              "https://krx-live-price-ksh.diaconos.workers.dev"
              in schema_text
          )
          assert "https://raw.githubusercontent.com" not in schema_text

          manifest = json.loads(
              Path("api/stock_reference_manifest.json").read_text(
                  encoding="utf-8"
              )
          )
          assert manifest["status"] == "OK"
          assert manifest["privacy_policy"][
              "contains_user_holdings"
          ] is False
          assert manifest["action_contract"][
              "required_parameters"
          ] == ["prefix", "ticker"]
          assert manifest["action_contract"][
              "prefix_only_call_forbidden"
          ] is True
          assert manifest["usage"][
              "prefix_only_call_forbidden"
          ] is True
          assert "ticker" in manifest["usage"]["step_3"]
          assert "market" in manifest["usage"]["step_3"]

          instructions = Path(
              "docs/custom_gpt_instructions.md"
          ).read_text(encoding="utf-8")
          assert instructions.count(
              "## 12. 보유종목표 개인정보 비저장 런타임"
          ) == 1
          assert (
              "2026-07-16-v6.8.1-holdings-exact-filter"
              in instructions
          )
          print("V824_STATIC_CONTRACT_VALIDATION=PASS")
          print("OPERATION_ID_COUNT=30")
          print("SINGLE_ACTION_DOMAIN=PASS")
          print("HOLDINGS_MANIFEST_EXACT_TICKER=PASS")
          PY

          if test -n "$(git diff --name-only)"; then
            python validate_api_sync.py --api-dir api
          else
            echo "ALREADY_APPLIED=true"
          fi

      - name: Commit and push synchronized contract
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          EXPECTED_FILES="$(cat <<'EOF'
          api/stock_reference_manifest.json
          api/validation_report.json
          build_stock_reference_api.py
          docs/REPOSITORY_STRUCTURE.md
          docs/custom_gpt_action_schema.yaml
          docs/custom_gpt_instructions.md
          docs/holdings_private_runtime_contract.md
          validate_api_sync.py
          EOF
          )"

          ACTUAL_FILES="$(git status --porcelain | sed 's/^...//' | sort)"
          UNEXPECTED_FILES="$(
            comm -23 \
              <(printf '%s\n' "$ACTUAL_FILES" | sed '/^$/d') \
              <(printf '%s\n' "$EXPECTED_FILES" | sort)
          )"

          echo "CHANGED_FILES_BEGIN"
          printf '%s\n' "$ACTUAL_FILES"
          echo "CHANGED_FILES_END"

          if test -n "$UNEXPECTED_FILES"; then
            echo "::error::Unexpected files changed:"
            printf '%s\n' "$UNEXPECTED_FILES"
            exit 1
          fi

          if test -z "$ACTUAL_FILES"; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git add \
            api/stock_reference_manifest.json \
            api/validation_report.json \
            build_stock_reference_api.py \
            docs/REPOSITORY_STRUCTURE.md \
            docs/custom_gpt_action_schema.yaml \
            docs/custom_gpt_instructions.md \
            docs/holdings_private_runtime_contract.md \
            validate_api_sync.py

          git commit -m \
            "Synchronize holdings exact-ticker contract v8.2.4"

          git fetch origin main
          if test "$(git rev-parse HEAD^)" != \
            "$(git rev-parse origin/main)"; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
