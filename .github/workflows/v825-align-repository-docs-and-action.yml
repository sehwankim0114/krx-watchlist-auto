name: Align repository docs and unified Action v8.2.5

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-api-json-main
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: python -m pip install --quiet pyyaml

      - name: Align canonical documents and validator
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path


          root = Path.cwd()
          readme_path = root / "README_사용법.md"
          structure_path = root / "docs" / "REPOSITORY_STRUCTURE.md"
          validator_path = root / "validate_api_sync.py"
          active_legacy = (
              root / "docs" / "custom_gpt_live_price_action_schema.yaml"
          )
          archive_dir = root / "docs" / "archive" / "legacy-schemas"
          archived_legacy = (
              archive_dir
              / "custom_gpt_live_price_action_schema-v1.1.0.yaml"
          )
          archive_readme = archive_dir / "README.md"

          README_B64 = ""
          STRUCTURE_B64 = ""
          ARCHIVE_README_B64 = ""


          def decoded(value: str) -> str:
              return base64.b64decode(value).decode("utf-8")


          def write_if_changed(path: Path, text: str) -> None:
              if not text.endswith("\n"):
                  text += "\n"
              current = (
                  path.read_text(encoding="utf-8")
                  if path.exists()
                  else None
              )
              if current != text:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding="utf-8")


          def replace_known(
              text: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              if new in text:
                  return text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(
                      f"{label}: expected one old block, found {count}"
                  )
              return text.replace(old, new, 1)


          write_if_changed(readme_path, decoded(README_B64))
          write_if_changed(structure_path, decoded(STRUCTURE_B64))
          write_if_changed(archive_readme, decoded(ARCHIVE_README_B64))

          archive_dir.mkdir(parents=True, exist_ok=True)
          if active_legacy.exists():
              source_bytes = active_legacy.read_bytes()
              if archived_legacy.exists():
                  if archived_legacy.read_bytes() != source_bytes:
                      raise SystemExit("LEGACY_SCHEMA_ARCHIVE_CONFLICT")
                  active_legacy.unlink()
              else:
                  active_legacy.replace(archived_legacy)
          elif not archived_legacy.exists():
              raise SystemExit("LEGACY_LIVE_PRICE_SCHEMA_MISSING")

          validator = validator_path.read_text(encoding="utf-8")
          validator = replace_known(
              validator,
              'SCRIPT_VERSION = "validate_api_sync.py v1.5_holdings_exact_ticker_v824"',
              'SCRIPT_VERSION = "validate_api_sync.py v1.6_unified_action_v825"',
              "validator version",
          )

          old_required_tokens = '''        required_tokens = (
                      "version: 7.0.1",
                      "https://krx-live-price-ksh.diaconos.workers.dev",
                      "operationId: getStockReferenceShard",
                      "name: ticker",
                      "name: market",
                  )'''
          new_required_tokens = '''        required_tokens = (
                      "version: 7.0.1",
                      "https://krx-live-price-ksh.diaconos.workers.dev",
                      "operationId: getRequestTimePriceHealth",
                      "operationId: getRequestTimePrices",
                      "operationId: getHoldingsReferenceManifest",
                      "operationId: getStockReferenceShard",
                      "name: ticker",
                      "name: market",
                  )'''
          validator = replace_known(
              validator,
              old_required_tokens,
              new_required_tokens,
              "canonical schema required tokens",
          )

          old_server_check = '''        if schema_text.count("\\n- url: ") != 1:
                      errors.append(
                          "canonical custom GPT schema must use one server"
                      )
          '''
          new_server_check = '''        if schema_text.count("\\n- url: ") != 1:
                      errors.append(
                          "canonical custom GPT schema must use one server"
                      )
                  operation_ids = re.findall(
                      r"(?m)^\\s+operationId:\\s*([^\\s]+)\\s*$",
                      schema_text,
                  )
                  if len(operation_ids) != 30:
                      errors.append(
                          "canonical custom GPT operationId count must be 30"
                      )
                  if len(operation_ids) != len(set(operation_ids)):
                      errors.append(
                          "canonical custom GPT operationId values must be unique"
                      )

                  active_legacy_schema = (
                      api.parent
                      / "docs"
                      / "custom_gpt_live_price_action_schema.yaml"
                  )
                  archived_legacy_schema = (
                      api.parent
                      / "docs"
                      / "archive"
                      / "legacy-schemas"
                      / "custom_gpt_live_price_action_schema-v1.1.0.yaml"
                  )
                  if active_legacy_schema.exists():
                      errors.append(
                          "separate live-price Action schema must not remain active"
                      )
                  if not archived_legacy_schema.exists():
                      errors.append(
                          "legacy live-price schema archive is missing"
                      )
          '''
          validator = replace_known(
              validator,
              old_server_check,
              new_server_check,
              "unified Action server validation",
          )

          legacy_begin = validator.find("    live_schema_path = (\n")
          legacy_end_marker = (
              "    # REQUEST_TIME_PRICE_CONTRACT_V51_END\n"
          )
          legacy_end = validator.find(
              legacy_end_marker,
              legacy_begin,
          )
          if legacy_begin >= 0:
              if legacy_end < 0:
                  raise SystemExit(
                      "LEGACY_SCHEMA_VALIDATION_END_MARKER_MISSING"
                  )
              validator = (
                  validator[:legacy_begin]
                  + validator[legacy_end:]
              )
          elif "live_schema_path = (" in validator:
              raise SystemExit("UNKNOWN_LEGACY_SCHEMA_VALIDATION_BLOCK")

          validator_path.write_text(validator, encoding="utf-8")

          print("V825_DOCUMENT_ALIGNMENT=PASS")
          print("SINGLE_ACTION_SCHEMA=docs/custom_gpt_action_schema.yaml")
          print("SEPARATE_LIVE_PRICE_SCHEMA_ACTIVE=false")
          print("LEGACY_SCHEMA_ARCHIVED=true")
          print("RAW_GITHUB_ACTION_PRESENT=false")
          PY

      - name: Validate synchronized repository
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile validate_api_sync.py
          if test -n "$(git diff --name-only)"; then
            python validate_api_sync.py --api-dir api
          else
            echo "ALREADY_APPLIED=true"
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          import yaml


          root = Path.cwd()
          report = json.loads(
              (root / "api" / "validation_report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["status"] == "PASS", report.get("errors")
          assert not report.get("errors")

          schema_path = root / "docs" / "custom_gpt_action_schema.yaml"
          schema_text = schema_path.read_text(encoding="utf-8")
          schema = yaml.safe_load(schema_text)
          assert schema["servers"] == [{
              "url": "https://krx-live-price-ksh.diaconos.workers.dev"
          }]
          assert "https://raw.githubusercontent.com" not in schema_text

          operation_ids = []
          for path_item in schema["paths"].values():
              for operation in path_item.values():
                  if isinstance(operation, dict) and operation.get(
                      "operationId"
                  ):
                      operation_ids.append(operation["operationId"])
          assert len(operation_ids) == 30
          assert len(set(operation_ids)) == 30
          assert "getRequestTimePriceHealth" in operation_ids
          assert "getRequestTimePrices" in operation_ids
          assert "getStockReferenceShard" in operation_ids

          assert not (
              root / "docs" / "custom_gpt_live_price_action_schema.yaml"
          ).exists()
          assert (
              root
              / "docs"
              / "archive"
              / "legacy-schemas"
              / "custom_gpt_live_price_action_schema-v1.1.0.yaml"
          ).exists()

          docs = (
              (root / "README_사용법.md").read_text(encoding="utf-8")
              + "\n"
              + (root / "docs" / "REPOSITORY_STRUCTURE.md").read_text(
                  encoding="utf-8"
              )
          )
          assert "2026-06-30-v5-strict-contract" not in docs
          assert "apply-custom-gpt-v5-hardening.yml" not in docs
          assert "fix-rules-version-contract.yml" not in docs

          print("V825_VALIDATION=PASS")
          print("API_VALIDATION_STATUS=PASS")
          print("ACTION_OPERATION_ID_COUNT=30")
          print("SINGLE_ACTION_DOMAIN=PASS")
          print("ACTIVE_LEGACY_SCHEMA_COUNT=0")
          PY

      - name: Commit and push alignment
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git add -A -- \
            README_사용법.md \
            api/validation_report.json \
            docs \
            validate_api_sync.py

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            exit 0
          fi

          UNSTAGED="$(git status --porcelain | awk '$1 != "M" && $1 != "D" && $1 != "R" {print}')"
          if test -n "$UNSTAGED"; then
            echo "::error::Unexpected untracked or unstaged files."
            printf '%s\n' "$UNSTAGED"
            exit 1
          fi

          git commit -m \
            "Align repository documentation and unified Action contract v8.2.5"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            git status --short
            exit 1
          fi

          git fetch origin main
          if test "$(git rev-parse HEAD^)" != \
            "$(git rev-parse origin/main)"; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
