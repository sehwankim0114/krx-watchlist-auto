# One-time V8.2.6 updater. Remove after a successful run.
name: Apply live read-only API validation v8.2.6

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-live-read-only-api-validation-v826
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: python -m pip install --quiet pyyaml

      - name: Apply V8.2.6 validator contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path


          def replace_once(
              text: str,
              old: str,
              new: str,
              label: str,
          ) -> str:
              if new in text:
                  return text
              if text.count(old) != 1:
                  raise SystemExit(
                      f"{label}: expected one old token, got "
                      f"{text.count(old)}"
                  )
              return text.replace(old, new, 1)


          validator_path = Path("validate_api_sync.py")
          validator = validator_path.read_text(encoding="utf-8")
          validator = replace_once(
              validator,
              "from datetime import datetime, timedelta",
              "from datetime import datetime, timedelta, timezone",
              "timezone import",
          )
          validator = replace_once(
              validator,
              'SCRIPT_VERSION = "validate_api_sync.py '
              'v1.6_unified_action_v825"',
              'SCRIPT_VERSION = "validate_api_sync.py '
              'v1.7_read_only_check_v826"',
              "validator version",
          )
          validator = replace_once(
              validator,
              '    parser.add_argument("--api-dir", default="api")\n'
              "    args = parser.parse_args()",
              '    parser.add_argument("--api-dir", default="api")\n'
              '    parser.add_argument("--check-only", action="store_true")\n'
              "    args = parser.parse_args()",
              "check-only argument",
          )
          validator = replace_once(
              validator,
              '        "validated_at": datetime.utcnow().isoformat('
              'timespec="seconds") + "Z",',
              '        "validated_at": datetime.now(timezone.utc).isoformat(\n'
              '            timespec="seconds"\n'
              '        ).replace("+00:00", "Z"),',
              "timezone-aware validation timestamp",
          )
          validator = replace_once(
              validator,
              '    write_json(api / "validation_report.json", report)\n\n'
              '    print(f"API_VALIDATION_STATUS={report[\'status\']}")',
              '    if not args.check_only:\n'
              '        write_json(api / "validation_report.json", report)\n\n'
              '    print(f"API_VALIDATION_STATUS={report[\'status\']}")',
              "check-only write guard",
          )
          validator_path.write_text(validator, encoding="utf-8")

          structure_path = Path("docs/REPOSITORY_STRUCTURE.md")
          structure = structure_path.read_text(encoding="utf-8")
          old_line = (
              "- `safe-repository-cleanup.yml`: 저장소를 변경하지 않는 "
              "읽기 전용 V8.2.5 감사 도구"
          )
          new_line = (
              "- `safe-repository-cleanup.yml`: `--check-only` 실시간 API "
              "검증을 포함하고 저장소를 변경하지 않는 읽기 전용 "
              "V8.2.6 감사 도구"
          )
          if new_line not in structure:
              if structure.count(old_line) != 1:
                  raise SystemExit(
                      "repository structure V8.2.5 line missing or duplicated"
                  )
              structure = structure.replace(old_line, new_line, 1)
          structure_path.write_text(structure, encoding="utf-8")
          PY

      - name: Validate V8.2.6 without repository writes
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile validate_api_sync.py

          python - <<'PY'
          from pathlib import Path

          import yaml


          root = Path.cwd()
          workflow_dir = root / ".github" / "workflows"
          expected = {
              "build_api_json.yml",
              "collect-krx-watchlist.yml",
              "dart-fx-exposure-safe.yml",
              "maintenance-repair.yml",
              "safe-repository-cleanup.yml",
              "v6-apply-us-sp500-production.yml",
              "v731-daily-integrated-health.yml",
              "v77-runtime-freshness-gate.yml",
              "v826-live-read-only-api-validation.yml",
          }
          actual = {
              path.name for path in workflow_dir.glob("*.yml")
          } | {
              path.name for path in workflow_dir.glob("*.yaml")
          }
          if actual != expected:
              raise SystemExit(
                  "WORKFLOW_SET_MISMATCH="
                  + str({
                      "missing": sorted(expected - actual),
                      "unexpected": sorted(actual - expected),
                  })
              )

          safe_path = workflow_dir / "safe-repository-cleanup.yml"
          safe_text = safe_path.read_text(encoding="utf-8")
          safe_yaml = yaml.safe_load(safe_text)
          if safe_yaml.get("name") != (
              "Safe repository audit v8.2.6"
          ):
              raise SystemExit("PERMANENT_AUDIT_V826_NOT_INSTALLED")
          safe_tokens = (
              "validate_api_sync.py --check-only",
              "LIVE_API_VALIDATION_CHECK_ONLY=PASS",
              "VALIDATOR_CHECK_ONLY_MODE=PASS",
          )
          for token in safe_tokens:
              if token not in safe_text:
                  raise SystemExit("SAFE_AUDIT_TOKEN_MISSING=" + token)

          validator = (root / "validate_api_sync.py").read_text(
              encoding="utf-8"
          )
          validator_tokens = (
              "validate_api_sync.py v1.7_read_only_check_v826",
              'parser.add_argument("--check-only", action="store_true")',
              "datetime.now(timezone.utc)",
              "if not args.check_only:",
          )
          for token in validator_tokens:
              if token not in validator:
                  raise SystemExit("VALIDATOR_TOKEN_MISSING=" + token)

          print("V826_PATCH_STRUCTURE=PASS")
          print("WORKFLOW_COUNT=9_PRE_CLEANUP")
          print("PERMANENT_AUDIT_VERSION=V8.2.6")
          PY

          report_script="$(
            python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("api/validation_report.json").read_text(
                  encoding="utf-8"
              )
          )
          print(report.get("script", ""))
          PY
          )"
          if test "$report_script" != \
            "validate_api_sync.py v1.7_read_only_check_v826"; then
            python -W error::DeprecationWarning validate_api_sync.py
          fi

          report_hash_before="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          python -W error::DeprecationWarning \
            validate_api_sync.py --check-only
          report_hash_after="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          if test "$report_hash_before" != "$report_hash_after"; then
            echo "::error::Check-only mode changed validation_report.json."
            exit 1
          fi

          python - <<'PY'
          import json
          from pathlib import Path

          report = json.loads(
              Path("api/validation_report.json").read_text(
                  encoding="utf-8"
              )
          )
          assert report["script"] == (
              "validate_api_sync.py v1.7_read_only_check_v826"
          )
          assert report["status"] == "PASS"
          assert report["errors"] == []
          print("V826_API_VALIDATION=PASS")
          print("VALIDATOR_CHECK_ONLY_REPORT_UNCHANGED=PASS")
          PY

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

      - name: Commit and push V8.2.6
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git add -- \
            api/validation_report.json \
            docs/REPOSITORY_STRUCTURE.md \
            validate_api_sync.py

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          if git diff --cached --quiet; then
            echo "ALREADY_APPLIED=true"
            echo "PUSH_SUCCESS=true"
            echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
            exit 0
          fi

          if ! git diff --quiet; then
            echo "::error::Unexpected unstaged tracked-file changes."
            git diff --name-status
            exit 1
          fi

          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$untracked"; then
            echo "::error::Unexpected untracked files."
            printf '%s\n' "$untracked"
            exit 1
          fi

          git commit -m \
            "Add live read-only API validation audit v8.2.6"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            git status --short
            exit 1
          fi

          git fetch origin main
          if test "$(git rev-parse HEAD^)" != \
            "$(git rev-parse origin/main)"; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
