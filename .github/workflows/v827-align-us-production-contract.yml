# One-time V8.2.7 documentation aligner. Remove after success.
name: Align US production workflow contract v8.2.7

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: align-us-production-contract-v827
  cancel-in-progress: false

jobs:
  align:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install schema validator
        run: python -m pip install --quiet pyyaml

      - name: Align V8.2.7 repository documentation
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path


          path = Path("docs/REPOSITORY_STRUCTURE.md")
          text = path.read_text(encoding="utf-8")

          old_us = (
              "- `v6-apply-us-sp500-production.yml`: "
              "미국 S&P500 운영자료 생성"
          )
          new_us = (
              "- `v6-apply-us-sp500-production.yml`: 통합 Action 계약을 "
              "보존하고 구형 route patch 없이 미국 S&P500 운영자료 생성"
          )
          if new_us not in text:
              if text.count(old_us) != 1:
                  raise SystemExit(
                      "US workflow documentation line missing or duplicated"
                  )
              text = text.replace(old_us, new_us, 1)

          old_audit = (
              "- `safe-repository-cleanup.yml`: `--check-only` 실시간 API "
              "검증을 포함하고 저장소를 변경하지 않는 읽기 전용 "
              "V8.2.6 감사 도구"
          )
          new_audit = (
              "- `safe-repository-cleanup.yml`: `--check-only` 실시간 API "
              "검증과 미국 운영경로 검사를 포함하고 저장소를 변경하지 "
              "않는 읽기 전용 V8.2.7 감사 도구"
          )
          if new_audit not in text:
              if text.count(old_audit) != 1:
                  raise SystemExit(
                      "safe audit documentation line missing or duplicated"
                  )
              text = text.replace(old_audit, new_audit, 1)

          path.write_text(text, encoding="utf-8")
          PY

      - name: Validate V8.2.7 contracts
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          import yaml


          root = Path.cwd()
          workflow_dir = root / ".github" / "workflows"
          expected = {
              "build_api_json.yml",
              "collect-krx-watchlist.yml",
              "dart-fx-exposure-safe.yml",
              "maintenance-repair.yml",
              "safe-repository-cleanup.yml",
              "v6-apply-us-sp500-production.yml",
              "v731-daily-integrated-health.yml",
              "v77-runtime-freshness-gate.yml",
              "v827-align-us-production-contract.yml",
          }
          actual = {
              path.name for path in workflow_dir.glob("*.yml")
          } | {
              path.name for path in workflow_dir.glob("*.yaml")
          }
          if actual != expected:
              raise SystemExit(
                  "WORKFLOW_SET_MISMATCH="
                  + str({
                      "missing": sorted(expected - actual),
                      "unexpected": sorted(actual - expected),
                  })
              )

          us_path = workflow_dir / "v6-apply-us-sp500-production.yml"
          us_text = us_path.read_text(encoding="utf-8")
          us_yaml = yaml.safe_load(us_text)
          if us_yaml.get("name") != "US S&P500 Production v8.2.7":
              raise SystemExit("US_WORKFLOW_V827_NOT_INSTALLED")
          if "patch_us_watchlist_production_routes.py" in us_text:
              raise SystemExit("LEGACY_US_ROUTE_PATCHER_STILL_ACTIVE")
          for token in (
              "US_UNIFIED_ACTION_CONTRACT=PASS",
              "US_ROUTE_PATCHER_USED=false",
              "TABLE_SYSTEM_VERSION=V8.2.7",
          ):
              if token not in us_text:
                  raise SystemExit("US_WORKFLOW_TOKEN_MISSING=" + token)

          safe_path = workflow_dir / "safe-repository-cleanup.yml"
          safe_text = safe_path.read_text(encoding="utf-8")
          safe_yaml = yaml.safe_load(safe_text)
          if safe_yaml.get("name") != "Safe repository audit v8.2.7":
              raise SystemExit("SAFE_AUDIT_V827_NOT_INSTALLED")
          if "US_PRODUCTION_NO_LEGACY_PATCHER=PASS" not in safe_text:
              raise SystemExit("SAFE_AUDIT_US_CHECK_MISSING")

          docs = (root / "docs" / "REPOSITORY_STRUCTURE.md").read_text(
              encoding="utf-8"
          )
          for token in (
              "구형 route patch 없이",
              "읽기 전용 V8.2.7 감사 도구",
          ):
              if token not in docs:
                  raise SystemExit("V827_DOCUMENT_TOKEN_MISSING=" + token)

          print("V827_CONTRACT_ALIGNMENT=PASS")
          print("WORKFLOW_COUNT=9_PRE_CLEANUP")
          print("US_LEGACY_ROUTE_PATCH_ACTIVE=false")
          print("US_UNIFIED_ACTION_CONTRACT=PASS")
          PY

          report_hash_before="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          python -W error::DeprecationWarning \
            validate_api_sync.py --check-only
          report_hash_after="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          if test "$report_hash_before" != "$report_hash_after"; then
            echo "::error::Check-only validation changed the report."
            exit 1
          fi
          echo "API_VALIDATION_CHECK_ONLY=PASS"

      - name: Commit and push V8.2.7 alignment
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git add -- docs/REPOSITORY_STRUCTURE.md

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          if git diff --cached --quiet; then
            echo "ALREADY_APPLIED=true"
            echo "PUSH_SUCCESS=true"
            echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
            exit 0
          fi

          if ! git diff --quiet; then
            echo "::error::Unexpected unstaged tracked-file changes."
            git diff --name-status
            exit 1
          fi

          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$untracked"; then
            echo "::error::Unexpected untracked files."
            printf '%s\n' "$untracked"
            exit 1
          fi

          git commit -m \
            "Align US production workflow contract v8.2.7"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            git status --short
            exit 1
          fi

          git fetch origin main
          if test "$(git rev-parse HEAD^)" != \
            "$(git rev-parse origin/main)"; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
