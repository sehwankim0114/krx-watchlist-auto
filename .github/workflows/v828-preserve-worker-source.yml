# One-time V8.2.8.1 permission-safe Worker source preservation.
# This workflow intentionally does not modify other workflow files.
name: Preserve deployed Worker source contract v8.2.8.1

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: preserve-worker-source-contract-v8281
  cancel-in-progress: false

jobs:
  preserve:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install schema validator
        run: python -m pip install --quiet pyyaml

      - name: Preserve V1.3.6 Worker source
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import base64
          from pathlib import Path


          WORKER_SOURCE_B64 = ""
          WORKER_VALIDATOR_B64 = ""
          WORKER_README_B64 = ""


          def decoded(value: str) -> str:
              return base64.b64decode(value).decode("utf-8")


          def write_if_changed(path: Path, text: str) -> None:
              if not text.endswith("\n"):
                  text += "\n"
              current = (
                  path.read_text(encoding="utf-8")
                  if path.exists()
                  else None
              )
              if current != text:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding="utf-8")


          root = Path.cwd()
          write_if_changed(
              root / "worker" / "krx-live-price-worker.js",
              decoded(WORKER_SOURCE_B64),
          )
          write_if_changed(
              root / "worker" / "validate_worker.mjs",
              decoded(WORKER_VALIDATOR_B64),
          )
          write_if_changed(
              root / "worker" / "README.md",
              decoded(WORKER_README_B64),
          )

          structure_path = root / "docs" / "REPOSITORY_STRUCTURE.md"
          structure = structure_path.read_text(encoding="utf-8")

          old_audit = (
              "- `safe-repository-cleanup.yml`: `--check-only` 실시간 API "
              "검증과 미국 운영경로 검사를 포함하고 저장소를 변경하지 "
              "않는 읽기 전용 V8.2.7 감사 도구"
          )
          new_audit = (
              "- `safe-repository-cleanup.yml`: `--check-only` 실시간 API "
              "검증, 미국 운영경로 및 Worker 원본 회귀검사를 포함하고 "
              "저장소를 변경하지 않는 읽기 전용 V8.2.8 감사 도구"
          )
          if new_audit not in structure:
              if structure.count(old_audit) != 1:
                  raise SystemExit(
                      "V8.2.7 audit documentation line missing or duplicated"
                  )
              structure = structure.replace(old_audit, new_audit, 1)

          data_anchor = (
              "- `docs/workflow_archive/`: 완료된 과거 GitHub Actions 기록"
          )
          worker_data = (
              "- `worker/`: 배포된 단일 Action Worker 원본과 회귀검증기"
          )
          if worker_data not in structure:
              if structure.count(data_anchor) != 1:
                  raise SystemExit(
                      "Worker data-folder anchor missing or duplicated"
                  )
              structure = structure.replace(
                  data_anchor,
                  data_anchor + "\n" + worker_data,
                  1,
              )

          source_anchor = (
              "- 보유종목 비저장 계약: "
              "`docs/holdings_private_runtime_contract.md`"
          )
          worker_sources = (
              "- Worker 배포 원본: "
              "`worker/krx-live-price-worker.js`\n"
              "- Worker 회귀검증기: "
              "`worker/validate_worker.mjs`"
          )
          if worker_sources not in structure:
              if structure.count(source_anchor) != 1:
                  raise SystemExit(
                      "Worker source anchor missing or duplicated"
                  )
              structure = structure.replace(
                  source_anchor,
                  source_anchor + "\n" + worker_sources,
                  1,
              )

          write_if_changed(structure_path, structure)
          print("WORKER_SOURCE_PRESERVATION=PASS")
          print("WORKER_BUILD_VERSION=1.3.6-us-watchlist-compact")
          print("PERMISSION_SAFE_NO_WORKFLOW_UPDATE=true")
          PY

      - name: Validate source preservation
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          import yaml


          root = Path.cwd()
          workflow_dir = root / ".github" / "workflows"
          expected = {
              "build_api_json.yml",
              "collect-krx-watchlist.yml",
              "dart-fx-exposure-safe.yml",
              "maintenance-repair.yml",
              "safe-repository-cleanup.yml",
              "v6-apply-us-sp500-production.yml",
              "v731-daily-integrated-health.yml",
              "v77-runtime-freshness-gate.yml",
              "v828-preserve-worker-source.yml",
          }
          actual = {
              path.name for path in workflow_dir.glob("*.yml")
          } | {
              path.name for path in workflow_dir.glob("*.yaml")
          }
          if actual != expected:
              raise SystemExit(
                  "WORKFLOW_SET_MISMATCH="
                  + str({
                      "missing": sorted(expected - actual),
                      "unexpected": sorted(actual - expected),
                  })
              )

          one_time_path = (
              workflow_dir / "v828-preserve-worker-source.yml"
          )
          one_time = yaml.safe_load(
              one_time_path.read_text(encoding="utf-8")
          )
          if one_time.get("name") != (
              "Preserve deployed Worker source contract v8.2.8.1"
          ):
              raise SystemExit("PERMISSION_SAFE_V8281_NOT_INSTALLED")

          safe_path = workflow_dir / "safe-repository-cleanup.yml"
          safe_text = safe_path.read_text(encoding="utf-8")
          safe_yaml = yaml.safe_load(safe_text)
          if safe_yaml.get("name") != "Safe repository audit v8.2.7":
              raise SystemExit(
                  "PERMANENT_SAFE_AUDIT_WAS_UNEXPECTEDLY_CHANGED"
              )

          source = (
              root / "worker" / "krx-live-price-worker.js"
          ).read_text(encoding="utf-8")
          if 'BUILD_VERSION = "1.3.6-us-watchlist-compact"' not in source:
              raise SystemExit("WORKER_BUILD_VERSION_MISMATCH")
          if "COMPACT_US_WATCHLIST_V1" not in source:
              raise SystemExit("US_COMPACT_TRANSFORM_MISSING")

          structure = (
              root / "docs" / "REPOSITORY_STRUCTURE.md"
          ).read_text(encoding="utf-8")
          for token in (
              "읽기 전용 V8.2.8 감사 도구",
              "worker/krx-live-price-worker.js",
              "worker/validate_worker.mjs",
          ):
              if token not in structure:
                  raise SystemExit(
                      "V828_DOCUMENT_TOKEN_MISSING=" + token
                  )

          print("V8281_PERMISSION_SAFE_CONTRACT=PASS")
          print("WORKFLOW_COUNT=9_PRE_CLEANUP")
          print("WORKER_CANONICAL_SOURCE=PASS")
          print("PERMANENT_WORKFLOW_CHANGED=false")
          PY

          node --check worker/krx-live-price-worker.js
          node worker/validate_worker.mjs .

          report_hash_before="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          python -W error::DeprecationWarning \
            validate_api_sync.py --check-only
          report_hash_after="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          if test "$report_hash_before" != "$report_hash_after"; then
            echo "::error::Check-only validation changed the report."
            exit 1
          fi
          echo "API_VALIDATION_CHECK_ONLY=PASS"

          if ! git diff --quiet -- \
            .github/workflows/safe-repository-cleanup.yml; then
            echo "::error::Permanent workflow was changed."
            exit 1
          fi
          echo "PERMISSION_SAFE_NO_WORKFLOW_UPDATE=PASS"

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

      - name: Commit and push Worker source
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git add -- \
            docs/REPOSITORY_STRUCTURE.md \
            worker/README.md \
            worker/krx-live-price-worker.js \
            worker/validate_worker.mjs

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          if git diff --cached --quiet; then
            echo "ALREADY_APPLIED=true"
            echo "PUSH_SUCCESS=true"
            echo "MANUAL_SAFE_AUDIT_REPLACEMENT_REQUIRED=true"
            echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
            exit 0
          fi

          if ! git diff --quiet; then
            echo "::error::Unexpected unstaged tracked-file changes."
            git diff --name-status
            exit 1
          fi

          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$untracked"; then
            echo "::error::Unexpected untracked files."
            printf '%s\n' "$untracked"
            exit 1
          fi

          git commit -m \
            "Preserve deployed Worker source contract v8.2.8"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            git status --short
            exit 1
          fi

          git fetch origin main
          if test "$(git rev-parse HEAD^)" != \
            "$(git rev-parse origin/main)"; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_SAFE_AUDIT_REPLACEMENT_REQUIRED=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
