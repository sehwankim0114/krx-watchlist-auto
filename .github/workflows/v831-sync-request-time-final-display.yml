# One-time V8.3.1 permission-safe instruction synchronization.
# This workflow intentionally does not modify permanent workflow files.
name: Synchronize Custom GPT request-time final display v8.3.1

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-request-time-final-display-v831
  cancel-in-progress: false

jobs:
  synchronize:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install schema validator
        run: python -m pip install --quiet pyyaml

      - name: Synchronize V6.8.2 instructions and validator contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import base64
          import hashlib
          from pathlib import Path


          INSTRUCTIONS_B64 = ""
          EXPECTED_INSTRUCTIONS_SHA256 = "4233268d3b8f8085f1b96702b55d1ac3371a1366e86c9cb0d1d982382ac85944"


          def decoded(value: str) -> str:
              return base64.b64decode(value).decode("utf-8")


          def digest(text: str) -> str:
              return hashlib.sha256(text.encode("utf-8")).hexdigest()


          def write_if_changed(path: Path, text: str) -> None:
              if not text.endswith("\n"):
                  text += "\n"
              current = (
                  path.read_text(encoding="utf-8")
                  if path.exists()
                  else None
              )
              if current != text:
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_text(text, encoding="utf-8")


          instructions = decoded(INSTRUCTIONS_B64)
          actual_hash = digest(instructions)
          if actual_hash != EXPECTED_INSTRUCTIONS_SHA256:
              raise SystemExit(
                  "Embedded instructions SHA256 mismatch: " + actual_hash
              )

          root = Path.cwd()
          write_if_changed(
              root / "docs" / "custom_gpt_instructions.md",
              instructions,
          )

          validator_path = root / "validate_api_sync.py"
          validator = validator_path.read_text(encoding="utf-8")
          old_version = (
              'SCRIPT_VERSION = '
              '"validate_api_sync.py v1.7_read_only_check_v826"'
          )
          new_version = (
              'SCRIPT_VERSION = '
              '"validate_api_sync.py '
              'v1.8_request_time_final_display_v831"'
          )
          if new_version not in validator:
              if validator.count(old_version) != 1:
                  raise SystemExit(
                      "V1.7 validator version token missing or duplicated"
                  )
              validator = validator.replace(
                  old_version,
                  new_version,
                  1,
              )

          old_instruction_tokens = (
              "instruction_tokens = (\n"
              '            "2026-07-16-v6.8.1-holdings-exact-filter",\n'
              '            "## 12. 보유종목표 개인정보 비저장 런타임",\n'
              '            "getStockReferenceShard를 prefix만으로 '
              '호출하지 않는다.",\n'
              "        )"
          )
          new_instruction_tokens = (
              "instruction_tokens = (\n"
              '            "2026-07-17-v6.8.2-request-time-final-display",\n'
              '            "### 5-1. V8.0 요청시점 최종 표시",\n'
              '            "request_time_final_recommendation_mark",\n'
              '            "가치매수구간 위 · 1차 익절구간 전",\n'
              '            "## 12. 보유종목표 개인정보 비저장 런타임",\n'
              '            "getStockReferenceShard를 prefix만으로 '
              '호출하지 않는다.",\n'
              "        )"
          )
          if new_instruction_tokens not in validator:
              if validator.count(old_instruction_tokens) != 1:
                  raise SystemExit(
                      "V6.8.1 instruction token block missing or duplicated"
                  )
              validator = validator.replace(
                  old_instruction_tokens,
                  new_instruction_tokens,
                  1,
              )
          write_if_changed(validator_path, validator)

          structure_path = root / "docs" / "REPOSITORY_STRUCTURE.md"
          structure = structure_path.read_text(encoding="utf-8")
          old_audit = (
              "- `safe-repository-cleanup.yml`: `--check-only` 실시간 API "
              "검증, 미국 운영경로 및 Worker V1.3.8의 KOSPI Action V2·"
              "원본 오류 대체경로 회귀검사를 포함하고 저장소를 변경하지 "
              "않는 읽기 전용 V8.3.0 감사 도구"
          )
          new_audit = (
              "- `safe-repository-cleanup.yml`: `--check-only` 실시간 API "
              "검증, Worker V1.3.8 및 Custom GPT V6.8.2 요청시점 최종표시 "
              "회귀검사를 포함하고 저장소를 변경하지 않는 읽기 전용 "
              "V8.3.1 감사 도구"
          )
          if new_audit not in structure:
              if structure.count(old_audit) != 1:
                  raise SystemExit(
                      "V8.3.0 audit documentation line missing or duplicated"
                  )
              structure = structure.replace(old_audit, new_audit, 1)
          write_if_changed(structure_path, structure)

          print("CUSTOM_GPT_INSTRUCTIONS_SYNC=PASS")
          print(
              "CUSTOM_GPT_INSTRUCTIONS_VERSION="
              "2026-07-17-v6.8.2-request-time-final-display"
          )
          print("REQUEST_TIME_FINAL_DISPLAY_CONTRACT=PASS")
          print("VALIDATOR_VERSION=v1.8_request_time_final_display_v831")
          print("PERMISSION_SAFE_NO_WORKFLOW_UPDATE=true")
          PY

      - name: Validate V8.3.1 synchronization
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          import yaml


          root = Path.cwd()
          workflow_dir = root / ".github" / "workflows"
          expected = {
              "build_api_json.yml",
              "collect-krx-watchlist.yml",
              "dart-fx-exposure-safe.yml",
              "maintenance-repair.yml",
              "safe-repository-cleanup.yml",
              "v6-apply-us-sp500-production.yml",
              "v731-daily-integrated-health.yml",
              "v77-runtime-freshness-gate.yml",
              "v831-sync-request-time-final-display.yml",
          }
          actual = {
              path.name for path in workflow_dir.glob("*.yml")
          } | {
              path.name for path in workflow_dir.glob("*.yaml")
          }
          if actual != expected:
              raise SystemExit(
                  "WORKFLOW_SET_MISMATCH="
                  + str({
                      "missing": sorted(expected - actual),
                      "unexpected": sorted(actual - expected),
                  })
              )

          one_time = yaml.safe_load(
              (
                  workflow_dir
                  / "v831-sync-request-time-final-display.yml"
              ).read_text(encoding="utf-8")
          )
          if one_time.get("name") != (
              "Synchronize Custom GPT request-time final display v8.3.1"
          ):
              raise SystemExit("PERMISSION_SAFE_V831_NOT_INSTALLED")

          safe_yaml = yaml.safe_load(
              (
                  workflow_dir / "safe-repository-cleanup.yml"
              ).read_text(encoding="utf-8")
          )
          if safe_yaml.get("name") != "Safe repository audit v8.3.0":
              raise SystemExit(
                  "PERMANENT_SAFE_AUDIT_WAS_UNEXPECTEDLY_CHANGED"
              )

          instructions = (
              root / "docs" / "custom_gpt_instructions.md"
          ).read_text(encoding="utf-8")
          instruction_tokens = (
              "2026-07-17-v6.8.2-request-time-final-display",
              "### 5-1. V8.0 요청시점 최종 표시",
              "request_time_final_recommendation_mark",
              "중간권 · 범위위치 42.3%",
              "가치매수구간 위 · 1차 익절구간 전",
              "getStockReferenceShard를 prefix만으로 호출하지 않는다.",
          )
          for token in instruction_tokens:
              if token not in instructions:
                  raise SystemExit(
                      "V682_INSTRUCTION_TOKEN_MISSING=" + token
                  )

          validator = (
              root / "validate_api_sync.py"
          ).read_text(encoding="utf-8")
          validator_tokens = (
              "validate_api_sync.py v1.8_request_time_final_display_v831",
              "2026-07-17-v6.8.2-request-time-final-display",
              'parser.add_argument("--check-only", action="store_true")',
          )
          for token in validator_tokens:
              if token not in validator:
                  raise SystemExit(
                      "VALIDATOR_V831_TOKEN_MISSING=" + token
                  )

          worker = (
              root / "worker" / "krx-live-price-worker.js"
          ).read_text(encoding="utf-8")
          if 'BUILD_VERSION = "1.3.8-kospi-action-compact"' not in worker:
              raise SystemExit("WORKER_V138_REGRESSION")

          structure = (
              root / "docs" / "REPOSITORY_STRUCTURE.md"
          ).read_text(encoding="utf-8")
          if "읽기 전용 V8.3.1 감사 도구" not in structure:
              raise SystemExit("V831_DOCUMENTATION_MISSING")

          print("V831_PERMISSION_SAFE_CONTRACT=PASS")
          print("WORKFLOW_COUNT=9_PRE_CLEANUP")
          print("CUSTOM_GPT_CANONICAL_INSTRUCTIONS=PASS")
          print("PERMANENT_WORKFLOW_CHANGED=false")
          PY

          python -m py_compile validate_api_sync.py
          node --check worker/krx-live-price-worker.js
          node worker/validate_worker.mjs .

          report_hash_before="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          python -W error::DeprecationWarning \
            validate_api_sync.py --check-only
          report_hash_after="$(
            sha256sum api/validation_report.json | awk '{print $1}'
          )"
          if test "$report_hash_before" != "$report_hash_after"; then
            echo "::error::Check-only validation changed the report."
            exit 1
          fi
          echo "API_VALIDATION_CHECK_ONLY=PASS"

          if ! git diff --quiet -- \
            .github/workflows/safe-repository-cleanup.yml; then
            echo "::error::Permanent workflow was changed."
            exit 1
          fi
          echo "PERMISSION_SAFE_NO_WORKFLOW_UPDATE=PASS"

          find . -type d -name __pycache__ -prune \
            -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) \
            -delete

      - name: Commit and push V6.8.2 canonical instructions
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git add -- \
            docs/REPOSITORY_STRUCTURE.md \
            docs/custom_gpt_instructions.md \
            validate_api_sync.py

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          if git diff --cached --quiet; then
            echo "ALREADY_APPLIED=true"
            echo "PUSH_SUCCESS=true"
            echo "MANUAL_SAFE_AUDIT_REPLACEMENT_REQUIRED=true"
            echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
            exit 0
          fi

          if ! git diff --quiet; then
            echo "::error::Unexpected unstaged tracked-file changes."
            git diff --name-status
            exit 1
          fi

          untracked="$(git ls-files --others --exclude-standard)"
          if test -n "$untracked"; then
            echo "::error::Unexpected untracked files."
            printf '%s\n' "$untracked"
            exit 1
          fi

          git commit -m \
            "Synchronize Custom GPT request-time final display v8.3.1"

          if test -n "$(git status --porcelain)"; then
            echo "::error::Uncommitted changes remain."
            git status --short
            exit 1
          fi

          git fetch origin main
          if test "$(git rev-parse HEAD^)" != \
            "$(git rev-parse origin/main)"; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_SAFE_AUDIT_REPLACEMENT_REQUIRED=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
