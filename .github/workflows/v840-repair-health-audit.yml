name: Repair health and audit contracts v8.4.0

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v840-repair-health-audit
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install validation dependency
        run: python -m pip install --quiet pyyaml

      - name: Apply V8.4.0 repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              if old not in text:
                  raise SystemExit(f"PATCH_ANCHOR_MISSING={path}:{old}")
              p.write_text(text.replace(old, new, 1), encoding="utf-8")

          health = "validate_daily_integrated_health_v731.py"
          replace(health,
              'CHECKER_VERSION = "2026-07-10-v7.6.1-financial-payload-health"',
              'CHECKER_VERSION = "2026-08-29-v8.4.0-worker-v138-health-alignment"')
          replace(health, 'EXPECTED_WORKER_BUILD_PREFIX = "1.3.2-"',
                          'EXPECTED_WORKER_BUILD_PREFIX = "1.3.8-"')
          replace(health, 'DEFAULT_MAX_WATCHLIST_BYTES = 70000',
                          'DEFAULT_MAX_WATCHLIST_BYTES = 90000')
          replace(health, '"max_payload_bytes": 70000,',
                          '"max_payload_bytes": 90000,')

          audit = ".github/workflows/safe-repository-cleanup.yml"
          replace(audit, '# V8.3.3 live read-only repository audit',
                         '# V8.4.0 live read-only repository audit')
          replace(audit, 'name: Safe repository audit v8.3.3',
                         'name: Safe repository audit v8.4.0')
          replace(audit,
              '              "dart-fx-exposure-safe.yml",\n'
              '              "maintenance-repair.yml",',
              '              "dart-fx-exposure-safe.yml",\n'
              '              "kospi-consecutive-decliners.yml",\n'
              '              "maintenance-repair.yml",')
          replace(audit, 'print("WORKFLOW_COUNT=8")',
                         'print("WORKFLOW_COUNT=9")')

          structure = "docs/REPOSITORY_STRUCTURE.md"
          replace(structure,
              '- `v77-runtime-freshness-gate.yml`: 요청시점 최신성 상태 갱신',
              '- `v77-runtime-freshness-gate.yml`: 요청시점 최신성 상태 갱신\n'
              '- `kospi-consecutive-decliners.yml`: 코스피 연속하락 후보 생성(현재 수동 실행, 정식 Action 경로 통합 전)')
          replace(structure, '읽기 전용 V8.3.3 감사 도구',
                             '읽기 전용 V8.4.0 감사 도구')
          PY

      - name: Validate repaired contracts
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile validate_daily_integrated_health_v731.py
          python validate_api_sync.py --check-only
          node worker/validate_worker.mjs .
          python validate_daily_integrated_health_v731.py \
            --repo-root . \
            --output-json /tmp/v840-health.json \
            --output-md /tmp/v840-health.md
          python - <<'PY'
          import json
          import yaml
          from pathlib import Path

          report = json.loads(Path('/tmp/v840-health.json').read_text())
          assert report['status'] == 'PASS'
          assert report['critical_count'] == 0
          assert report['warning_count'] == 0
          yaml.safe_load(Path('.github/workflows/safe-repository-cleanup.yml').read_text())
          print('V840_HEALTH_ALIGNMENT=PASS')
          print('WORKFLOW_COUNT=9')
          print('DAILY_HEALTH_CRITICAL_COUNT=0')
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -- \
            validate_daily_integrated_health_v731.py \
            .github/workflows/safe-repository-cleanup.yml \
            docs/REPOSITORY_STRUCTURE.md
          if git diff --cached --quiet; then
            echo "NO_CHANGES=true"
            exit 0
          fi
          git commit -m "Repair health and audit contracts v8.4.0"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PUSH_SUCCESS=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
