name: Repair KOSPI payload and Worker v8.4.1

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v841-repair-payload-and-worker
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"

      - name: Install packages
        run: |
          python -m pip install --quiet -r requirements.txt
          python -m pip install --quiet pyyaml

      - name: Apply V8.4.1 source repair
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          def replace(path, old, new, count=1):
              p = Path(path)
              text = p.read_text(encoding="utf-8")
              actual = text.count(old)
              if actual != count:
                  raise SystemExit(
                      f"PATCH_ANCHOR_COUNT={path}:{actual}:expected={count}:{old}"
                  )
              p.write_text(text.replace(old, new), encoding="utf-8")

          replace(
              "apply_recommendation_icon_v79.py",
              '"max_payload_bytes": 70000,',
              '"max_payload_bytes": 90000,',
          )
          replace(
              "apply_display_normalization_v74.py",
              '"max_payload_bytes": 70000,',
              '"max_payload_bytes": 90000,',
          )
          replace(
              "apply_kr_sector_theme_v72.py",
              "MAX_PAYLOAD_BYTES = 70000",
              "MAX_PAYLOAD_BYTES = 90000",
          )

          worker = "worker/krx-live-price-worker.js"
          replace(
              worker,
              'const BUILD_VERSION = "1.3.8-kospi-action-compact";',
              'const BUILD_VERSION = "1.3.9-kospi-action-compact-v2";',
          )
          replace(
              worker,
              'krx-watchlist-cloudflare-proxy/1.3.8',
              'krx-watchlist-cloudflare-proxy/1.3.9',
              count=2,
          )
          replace(
              worker,
              '// and the preserved 3-month low/high. The request-time policy and official\n'
              '// freshness objects are obtained from their dedicated Actions.',
              '// and the preserved 3-month low/high. code duplicates quote_key, and\n'
              '// quote_market duplicates this KOSPI-only table\'s market identity, so both are\n'
              '// omitted from the compact response. The request-time policy and official\n'
              '// freshness objects are obtained from their dedicated Actions.',
          )
          replace(
              worker,
              '      "rank",\n'
              '      "operating_loss",\n'
              '      "supply_burden",\n'
              '      "current_position",',
              '      "rank",\n'
              '      "code",\n'
              '      "quote_market",\n'
              '      "operating_loss",\n'
              '      "supply_burden",\n'
              '      "current_position",',
          )
          replace(
              worker,
              'relativePath === "kospi_watchlist.json" ? "1.1" : "1.0"',
              'relativePath === "kospi_watchlist.json" ? "1.2" : "1.0"',
          )

          validator = "worker/validate_worker.mjs"
          replace(
              validator,
              '  compactKospiWatchlist.compact_response.transform_version,\n  "1.1",',
              '  compactKospiWatchlist.compact_response.transform_version,\n  "1.2",',
          )
          replace(
              validator,
              '  "name",\n  "code",\n  "quote_key",\n  "quote_market",\n  "static_price",',
              '  "name",\n  "quote_key",\n  "static_price",',
          )
          replace(
              validator,
              'const removedKospiDuplicateKeys = [\n  "rank",\n  "operating_loss",',
              'const removedKospiDuplicateKeys = [\n  "rank",\n  "code",\n  "quote_market",\n  "operating_loss",',
          )
          replace(
              validator,
              '    assert.equal(compactRow.code, sourceRow.code, `${filename}.${index}`);',
              '    if (filename === "kospi_watchlist.json") {\n'
              '      assert.equal(compactRow.quote_key, sourceRow.quote_key, `${filename}.${index}`);\n'
              '      assert.equal(Object.hasOwn(compactRow, "code"), false, `${filename}.${index}.code`);\n'
              '    } else {\n'
              '      assert.equal(compactRow.code, sourceRow.code, `${filename}.${index}`);\n'
              '    }',
          )
          replace(
              validator,
              'assert.equal(health.build_version, "1.3.8-kospi-action-compact");',
              'assert.equal(health.build_version, "1.3.9-kospi-action-compact-v2");',
          )
          replace(
              validator,
              'console.log("WORKER_V138_VALIDATION=PASS");',
              'console.log("WORKER_V139_VALIDATION=PASS");',
          )

          replace(
              "validate_daily_integrated_health_v731.py",
              'EXPECTED_WORKER_BUILD_PREFIX = "1.3.8-"',
              'EXPECTED_WORKER_BUILD_PREFIX = "1.3.9-"',
          )
          replace(
              "worker/README.md",
              '`1.3.8-kospi-action-compact`',
              '`1.3.9-kospi-action-compact-v2`',
          )
          replace("worker/README.md", "## V1.3.8 핵심 계약", "## V1.3.9 핵심 계약")
          replace(
              "worker/README.md",
              '- 코피표 30행을 `KOSPI_ACTION_V2` 응답 프로필로 30,000바이트 미만에 제공합니다.',
              '- 코피표 30행을 `KOSPI_ACTION_V2` 응답 프로필로 30,000바이트 미만에 제공합니다. 중복 식별값 `code`·`quote_market`은 제외하고 `quote_key`와 KOSPI 표 식별자를 사용합니다.',
          )
          replace(
              "docs/REPOSITORY_STRUCTURE.md",
              'Worker V1.3.8 및 Custom GPT V6.8.3 단일 추천 아이콘 회귀검사를 포함하고 저장소를 변경하지 않는 읽기 전용 V8.4.0 감사 도구',
              'Worker V1.3.9 및 Custom GPT V6.8.3 단일 추천 아이콘 회귀검사를 포함하고 저장소를 변경하지 않는 읽기 전용 V8.4.1 감사 도구',
          )
          PY

      - name: Validate complete build in isolation
        shell: bash
        run: |
          set -euo pipefail
          test_dir="$(mktemp -d)"
          rsync -a --exclude='.git' ./ "$test_dir/"
          cd "$test_dir"
          python -m py_compile \
            apply_kr_sector_theme_v72.py \
            apply_display_normalization_v74.py \
            apply_recommendation_icon_v79.py \
            build_api_json.py \
            validate_api_sync.py \
            validate_daily_integrated_health_v731.py
          python build_api_json.py
          python validate_api_sync.py --api-dir api
          node worker/validate_worker.mjs .
          python - <<'PY'
          import json
          from pathlib import Path

          table = json.loads(Path('api/kospi_watchlist.json').read_text())
          report = json.loads(Path('api/validation_report.json').read_text())
          size = Path('api/kospi_watchlist.json').stat().st_size
          assert table['row_count'] == 30
          assert table['payload_size_limit_bytes'] == 90000
          assert size < 90000
          assert report['status'] == 'PASS'
          assert not report.get('errors')
          print(f'KOSPI_SOURCE_BYTES={size}')
          print('KOSPI_SOURCE_LIMIT_90000=PASS')
          print('API_BUILD_VALIDATION=PASS')
          PY

      - name: Commit and push source repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -- \
            apply_kr_sector_theme_v72.py \
            apply_display_normalization_v74.py \
            apply_recommendation_icon_v79.py \
            validate_daily_integrated_health_v731.py \
            worker/krx-live-price-worker.js \
            worker/validate_worker.mjs \
            worker/README.md \
            docs/REPOSITORY_STRUCTURE.md
          git commit -m "Repair KOSPI payload and Worker v8.4.1"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "PUSH_SUCCESS=true"
          echo "WORKER_SOURCE_BUILD=1.3.9-kospi-action-compact-v2"
          echo "MANUAL_CLOUDFLARE_DEPLOY_REQUIRED=true"
          echo "MANUAL_SAFE_AUDIT_REPLACEMENT_REQUIRED=true"
          echo "MANUAL_WORKFLOW_CLEANUP_REQUIRED=true"
