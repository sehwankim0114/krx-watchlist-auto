# V8.5.0 stage-one preview only: no repository writes or production activation.
name: Preview KOSPI and decliners v8.5.0

"on":
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v850-two-table-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Validate two-table data without publishing
        id: preview
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          v850_tmp="$(mktemp -d)"
          export V850_CODE_DIR="$v850_tmp/code"
          mkdir "$V850_CODE_DIR"
          printf 'artifact_path=%s\n' "$v850_tmp/output" >> "$GITHUB_OUTPUT"
          git_before="$(git status --porcelain)"
          python - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          bundle = json.loads("{\"stock_table_metrics_v850.py\":{\"sha256\":\"957063e69ddb68c815245fcedf3f090b41a4d992396b1dc579f42952c6829fc9\",\"zlib_base64\":\"\"},\"build_stock_table_preview_v850.py\":{\"sha256\":\"affb3995ef15f5cec110d7bd6c9a22a0b478cf3397edde227a64a7c7eb78a94a\",\"zlib_base64\":\"\"},\"test_stock_table_metrics_v850.py\":{\"sha256\":\"50161cabe3715381ccbad4b51c3bf70d7332c69617fcd86765b8729aec5508c8\",\"zlib_base64\":\"\"},\"docs/two_table_preview_v850.md\":{\"sha256\":\"4eba5c50ee03f915fad7ea41ad3fe431b133656e5207b43e5e144ffcc3b17978\",\"zlib_base64\":\"\"}}")
          root = Path(os.environ['V850_CODE_DIR'])
          for name, item in bundle.items():
              target = root / name
              if target.resolve().is_relative_to(root.resolve()) is not True:
                  raise SystemExit('INVALID_BUNDLE_PATH')
              content = zlib.decompress(base64.b64decode(item['zlib_base64'], validate=True))
              if hashlib.sha256(content).hexdigest() != item['sha256']:
                  raise SystemExit('BUNDLE_INTEGRITY_FAILED=' + name)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(content)
          print('V850_EMBEDDED_SOURCE_INTEGRITY=PASS')
          PY
          python -m unittest discover -s "$V850_CODE_DIR" -p 'test_stock_table_metrics_v850.py' -v
          echo "V850_UNIT_AND_GUARD_TESTS=PASS"
          python validate_api_sync.py --check-only
          node worker/validate_worker.mjs .
          python "$V850_CODE_DIR/build_stock_table_preview_v850.py" \
            --repo "$GITHUB_WORKSPACE" --output-dir "$v850_tmp/output"
          git diff --exit-code
          if test "$git_before" != "$(git status --porcelain)"; then
            echo "::error::Preview changed repository files"
            git status --short
            exit 1
          fi
          echo "V850_PREVIEW_READ_ONLY=PASS"
      - name: Upload development preview
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v850-two-table-preview
          path: ${{ steps.preview.outputs.artifact_path }}
          if-no-files-found: ignore
          retention-days: 7

