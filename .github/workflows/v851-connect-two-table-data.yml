# V8.5.1 installs non-workflow sources and inactive prepared datasets only.
name: Connect scheduled two-table data v8.5.1

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-api-json-main
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Install integration-test dependencies
        run: python -m pip install --quiet "pandas>=2.0,<3" "requests>=2.31" "lxml>=5"
      - name: Install and validate the scheduled data connection
        id: install
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          test -z "$(git status --porcelain)"
          v851_tmp="$(mktemp -d)"
          export V851_TASK_DIR="$v851_tmp"
          mkdir "$v851_tmp/logs"
          printf 'artifact_path=%s\n' "$v851_tmp/logs" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          root = Path.cwd().resolve()
          bundle = json.loads('{"stock_table_metrics_v850.py":{"sha256":"957063e69ddb68c815245fcedf3f090b41a4d992396b1dc579f42952c6829fc9","old_sha256":null,"zlib_base64":""},"build_stock_table_preview_v850.py":{"sha256":"affb3995ef15f5cec110d7bd6c9a22a0b478cf3397edde227a64a7c7eb78a94a","old_sha256":null,"zlib_base64":""},"test_stock_table_metrics_v850.py":{"sha256":"50161cabe3715381ccbad4b51c3bf70d7332c69617fcd86765b8729aec5508c8","old_sha256":null,"zlib_base64":""},"docs/two_table_preview_v850.md":{"sha256":"4eba5c50ee03f915fad7ea41ad3fe431b133656e5207b43e5e144ffcc3b17978","old_sha256":null,"zlib_base64":""},"build_two_table_shadow_v851.py":{"sha256":"bade1951df708e7217aea10178e516e557e09e1d4b27816cd11eb6d6a5efb402","old_sha256":null,"zlib_base64":""},"test_two_table_shadow_v851.py":{"sha256":"067a51f8c9ae53da4d30ad281ae06eb9ad274bc0b85744a2fdee49b49dfe9978","old_sha256":null,"zlib_base64":""},"docs/two_table_shadow_v851.md":{"sha256":"df63a550a45fc2ff5ca4933c3886edb5649c151f2ad86ae465f67166bb405301","old_sha256":null,"zlib_base64":""},"build_api_json.py":{"sha256":"5b6d30c32a628d55ecf15d603b4383608e8ba6a5bd4ca91a3aa5d3fa78b58a6b","old_sha256":"965b0dfbf583341720d49265cda21e91263786ee3d5d42600fffe39c65c36ff9","zlib_base64":""},"validate_api_sync.py":{"sha256":"d7dd9fed309408137c9bfbc0813fcb4eb95f0bc330143e7348516bbd62e75454","old_sha256":"b8f7c1609a273250b1a01618350d3e7714444d8d31177b4dcde0af127476128c","zlib_base64":""},"docs/REPOSITORY_STRUCTURE.md":{"sha256":"9f07fc55b54c5f2db8dddccb50a3b17eeb9dca7a1e83bb49c88ff72cd34546dc","old_sha256":"02b4a8612da00b524a8109103d00462fc1cb6d8671ceaac5170207783e78726c","zlib_base64":""}}')
          decoded = {}
          for name, item in bundle.items():
              target = root / name
              if target.is_symlink() or not target.resolve().is_relative_to(root):
                  raise SystemExit('V851_UNSAFE_TARGET=' + name)
              raw = zlib.decompress(base64.b64decode(item['zlib_base64'], validate=True))
              if hashlib.sha256(raw).hexdigest() != item['sha256']:
                  raise SystemExit('V851_EMBEDDED_INTEGRITY_FAILED=' + name)
              if target.exists():
                  if not target.is_file():
                      raise SystemExit('V851_TARGET_NOT_FILE=' + name)
                  digest = hashlib.sha256(target.read_bytes()).hexdigest()
                  if digest not in {item['old_sha256'], item['sha256']}:
                      raise SystemExit('V851_SOURCE_CHANGED_REVIEW_REQUIRED=' + name)
              elif item['old_sha256'] is not None:
                  raise SystemExit('V851_REQUIRED_SOURCE_MISSING=' + name)
              decoded[name] = raw
          # Validate every target before writing any source file.
          for name, raw in decoded.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
          (Path(os.environ['V851_TASK_DIR']) / 'source_names.json').write_text(json.dumps(list(decoded)))
          print('V851_EMBEDDED_SOURCE_INTEGRITY=PASS')
          print('V851_SOURCE_BASELINE_GUARD=PASS')
          PY
          python -m unittest test_stock_table_metrics_v850 test_two_table_shadow_v851 -v 2>&1 | tee "$v851_tmp/logs/unit-tests.txt"
          echo 'V851_UNIT_AND_GUARD_TESTS=PASS'
          python build_two_table_shadow_v851.py --repo "$GITHUB_WORKSPACE" | tee "$v851_tmp/logs/shadow-build.txt"
          python validate_api_sync.py --check-only | tee "$v851_tmp/logs/api-check.txt"
          node worker/validate_worker.mjs . | tee "$v851_tmp/logs/worker-check.txt"
          git clone --quiet --shared --no-hardlinks "$GITHUB_WORKSPACE" "$v851_tmp/integration"
          python - <<'PY'
          import json, os, shutil
          from pathlib import Path
          temp = Path(os.environ['V851_TASK_DIR'])
          root = Path(os.environ['GITHUB_WORKSPACE'])
          for name in json.loads((temp / 'source_names.json').read_text()):
              target = temp / 'integration' / name
              target.parent.mkdir(parents=True, exist_ok=True)
              shutil.copyfile(root / name, target)
          PY
          (
            cd "$v851_tmp/integration"
            # A full build with the repository's official sector cache; no new collection.
            python - <<'PY'
          from unittest.mock import patch
          import build_api_json
          with patch('collect_kr_sector_theme_v72.fetch_official', side_effect=RuntimeError('V851_OFFLINE_INTEGRATION_OFFICIAL_CACHE')):
              code = build_api_json.main()
          if code != 0:
              raise SystemExit(code)
          print('V851_FULL_BUILD_INTEGRATION=PASS')
          PY
            python validate_api_sync.py --check-only
            node worker/validate_worker.mjs .
            python build_two_table_shadow_v851.py --repo . --check-only
          ) 2>&1 | tee "$v851_tmp/logs/full-build-integration.txt"
          python - <<'PY'
          import json, os, re, subprocess
          from pathlib import Path
          root = Path.cwd()
          temp = Path(os.environ['V851_TASK_DIR'])
          source_names = set(json.loads((temp / 'source_names.json').read_text()))
          tracked = subprocess.check_output(['git','diff','HEAD','--name-only','-z']).decode().split('\0')
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          pattern = re.compile(r'api/two_table_v1/(?:manifest|(?:kospi|decliners|decliners24)(?:\.compact\.[1-9][0-9]*)?)\.json')
          for name in filter(None, tracked + untracked):
              if name not in source_names and not pattern.fullmatch(name):
                  raise SystemExit('V851_UNEXPECTED_CHANGE=' + name)
          manifest = json.loads((root / 'api/two_table_v1/manifest.json').read_text())
          (temp / 'logs/shadow-manifest.json').write_text(json.dumps(manifest, ensure_ascii=False, indent=2))
          print('V851_EXISTING_API_WORKER_GPT_UNCHANGED=PASS')
          print('V851_CHANGED_FILE_ALLOWLIST=PASS')
          print('PRODUCTION_ACTIVATION_ALLOWED=false')
          print('STANDALONE_SWING_TABLE_ENABLED=false')
          PY
      - name: Push only validated non-workflow changes
        shell: bash
        env:
          V851_BASE_SHA: ${{ steps.install.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -- stock_table_metrics_v850.py build_stock_table_preview_v850.py test_stock_table_metrics_v850.py docs/two_table_preview_v850.md build_two_table_shadow_v851.py test_two_table_shadow_v851.py docs/two_table_shadow_v851.md build_api_json.py validate_api_sync.py docs/REPOSITORY_STRUCTURE.md api/two_table_v1
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo '::error::Workflow files must never be committed by this installer.'
            exit 1
          fi
          git fetch --no-tags origin main
          if test "$(git rev-parse origin/main)" != "$V851_BASE_SHA"; then
            echo '::error::Main advanced during validation. Nothing was pushed. Rerun on current main.'
            echo 'V851_REMOTE_MAIN_CHANGED=true'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'V851_ALREADY_INSTALLED=true'
          else
            git diff --cached --stat
            git commit -m "Connect scheduled two-table shadow data v8.5.1"
            git push origin HEAD:main
          fi
          echo 'PUSH_SUCCESS=true'
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo 'V851_SCHEDULED_DATA_CONNECTION=PASS'
          echo 'PRODUCTION_ACTIVATION_ALLOWED=false'
          echo 'MANUAL_CLOUDFLARE_DEPLOY_REQUIRED=false'
          echo 'MANUAL_GPT_REPLACEMENT_REQUIRED=false'
          echo 'MANUAL_WORKFLOW_CLEANUP_REQUIRED=true'
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v851-two-table-connection-validation
          path: ${{ steps.install.outputs.artifact_path }}
          if-no-files-found: ignore
          retention-days: 7
