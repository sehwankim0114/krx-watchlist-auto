name: Install metric glossary table footer v8.5.10

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-api-json-main
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture protected baseline
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sha256sum stock_table_metrics_v850.py > /tmp/v8510_metrics.sha
          sha256sum worker/krx-live-price-worker.js > /tmp/v8510_worker.sha
          sha256sum latest/stock_table_metric_glossary_latest.json > /tmp/v8510_glossary.sha
          cp api/two_table_v1/kospi.compact.1.json /tmp/v8510_before_kospi_compact.json
          echo "PROTECTED_BASELINE=PASS"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install "PyYAML>=6.0,<7"
          python - <<'PY'
          import yaml
          print("PYYAML_IMPORT=PASS")
          print("PYYAML_VERSION=" + yaml.__version__)
          PY

      - name: Apply V8.5.10 source contract
        shell: bash
        env:
          PATCHER_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY2'
          import base64, os
          from pathlib import Path
          Path("/tmp/v8510_patcher.py").write_bytes(base64.b64decode(os.environ["PATCHER_B64"]))
          PY2
          python -m py_compile /tmp/v8510_patcher.py
          python /tmp/v8510_patcher.py | tee /tmp/v8510_patch.txt
          grep -q '^V8510_PATCH_SOURCE=PASS$' /tmp/v8510_patch.txt

      - name: Compile and run regression tests
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile \
            build_stock_table_preview_v850.py \
            build_two_table_shadow_v851.py \
            two_table_release_v853.py \
            validate_two_table_clients_v853.py \
            test_stock_table_metrics_v850.py \
            test_two_table_release_v853.py

          python -m unittest \
            test_stock_table_metrics_v850.py \
            test_two_table_release_v853.py \
            2>&1 | tee /tmp/v8510_tests.txt

          grep -q '^OK$' /tmp/v8510_tests.txt
          echo "V8510_REGRESSION_TESTS=PASS"

      - name: Rebuild production bundle with glossary metadata
        shell: bash
        run: |
          set -euo pipefail
          python two_table_release_v853.py --repo . | tee /tmp/v8510_release.txt
          python two_table_release_v853.py --repo . --check-only | tee /tmp/v8510_release_check.txt

          grep -q '^V853_TWO_TABLE_RELEASE_CONTRACT=PASS$' /tmp/v8510_release.txt
          grep -q '^V853_TWO_TABLE_RELEASE_CONTRACT=PASS$' /tmp/v8510_release_check.txt
          grep -q '^TWO_TABLE_RELEASE_STATUS=READY$' /tmp/v8510_release.txt
          grep -q '^PRODUCTION_ACTIVATION_ALLOWED=true$' /tmp/v8510_release.txt
          echo "V8510_TWO_TABLE_REBUILD=PASS"

      - name: Validate Action client and payload sizes
        shell: bash
        run: |
          set -euo pipefail
          python validate_two_table_clients_v853.py --repo . | tee /tmp/v8510_clients.txt
          grep -q '^V8510_METRIC_GLOSSARY_CLIENT_CONTRACT=PASS$' /tmp/v8510_clients.txt

          python - <<'PY2' | tee /tmp/v8510_payloads.txt
          import json
          from pathlib import Path

          glossary = json.loads(Path("latest/stock_table_metric_glossary_latest.json").read_text(encoding="utf-8"))
          expected_version = glossary["version"]
          expected_footer = glossary["compact_footer_text"].strip()
          pages = sorted(Path("api/two_table_v1").glob("*.compact.*.json"))
          if not pages:
              raise SystemExit("NO_COMPACT_PAGES")

          max_source = (0, "")
          max_worker = (0, "")
          for path in pages:
              raw = path.read_bytes()
              payload = json.loads(raw)
              if payload.get("metric_glossary_version") != expected_version:
                  raise SystemExit(f"GLOSSARY_VERSION_MISMATCH:{path}")
              if payload.get("metric_glossary_footer") != expected_footer:
                  raise SystemExit(f"GLOSSARY_FOOTER_MISMATCH:{path}")
              if any(not isinstance(row, list) or len(row) != 14 for row in payload.get("rows", [])):
                  raise SystemExit(f"ROW_WIDTH_CHANGED:{path}")
              source_size = len(raw)
              sample = {**payload, "transport": {"mode":"production","next_page_url":None,"source":"github-production-bundle"}}
              worker_size = len(json.dumps(sample, ensure_ascii=False, separators=(",", ":")).encode("utf-8"))
              if source_size > 28500:
                  raise SystemExit(f"SOURCE_PAGE_TOO_LARGE:{path}:{source_size}")
              if worker_size > 30000:
                  raise SystemExit(f"WORKER_RESPONSE_TOO_LARGE:{path}:{worker_size}")
              max_source = max(max_source, (source_size, path.name))
              max_worker = max(max_worker, (worker_size, path.name))

          before = json.loads(Path("/tmp/v8510_before_kospi_compact.json").read_text())
          after = json.loads(Path("api/two_table_v1/kospi.compact.1.json").read_text())
          allowed = {"metric_glossary_version", "metric_glossary_footer", "version", "release_stage", "display_contract", "disclosure", "transport"}
          for key in allowed:
              before.pop(key, None)
              after.pop(key, None)
          if before != after:
              raise SystemExit("KOSPI_COMPACT_DATA_CHANGED_BEYOND_ALLOWED_METADATA")

          print("V8510_COMPACT_PAGES_CHECKED=" + str(len(pages)))
          print("V8510_MAX_SOURCE_PAGE_BYTES=" + str(max_source[0]) + ":" + max_source[1])
          print("V8510_MAX_SIMULATED_WORKER_BYTES=" + str(max_worker[0]) + ":" + max_worker[1])
          print("V8510_KOSPI_ROW_DATA_UNCHANGED=PASS")
          print("V8510_GLOSSARY_PAYLOAD_CONTRACT=PASS")
          PY2

          grep -q '^V8510_KOSPI_ROW_DATA_UNCHANGED=PASS$' /tmp/v8510_payloads.txt
          grep -q '^V8510_GLOSSARY_PAYLOAD_CONTRACT=PASS$' /tmp/v8510_payloads.txt

      - name: Validate full API and protect calculation runtime
        shell: bash
        run: |
          set -euo pipefail
          python validate_api_sync.py --api-dir api | tee /tmp/v8510_api_sync.txt
          if [ -f worker/validate_worker.mjs ]; then
            node worker/validate_worker.mjs | tee /tmp/v8510_worker_validate.txt
          fi

          sha256sum -c /tmp/v8510_metrics.sha
          sha256sum -c /tmp/v8510_worker.sha
          sha256sum -c /tmp/v8510_glossary.sha

          python - <<'PY2'
          from pathlib import Path
          schema = Path("docs/custom_gpt_action_schema.yaml").read_text(encoding="utf-8")
          instructions = Path("docs/custom_gpt_instructions.md").read_text(encoding="utf-8")
          if "version: 7.1.1" not in schema or "metric_glossary_footer" not in schema:
              raise SystemExit("SCHEMA_GLOSSARY_CONTRACT_MISSING")
          if "2026-09-11-v6.9.1-metric-glossary-footer" not in instructions:
              raise SystemExit("INSTRUCTIONS_VERSION_MISSING")
          if "표 바로 아래 최소 각주 첫 줄" not in instructions:
              raise SystemExit("INSTRUCTIONS_DISPLAY_RULE_MISSING")
          if len(instructions) > 8000:
              raise SystemExit(f"INSTRUCTIONS_TOO_LONG:{len(instructions)}")
          print("V8510_SCHEMA_AND_INSTRUCTIONS=PASS")
          print(f"V8510_INSTRUCTIONS_CHARS={len(instructions)}")
          PY2

          echo "V8510_METRIC_FORMULA_UNCHANGED=PASS"
          echo "V8510_WORKER_SOURCE_UNCHANGED=PASS"
          echo "V8510_GLOSSARY_SOURCE_UNCHANGED=PASS"

      - name: Commit V8.5.10 source and production bundle
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "${ env.BASE_SHA }" ]; then
            echo "::error::Remote main changed after checkout. Rerun this workflow."
            echo "BASE_SHA=${ env.BASE_SHA }"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            build_stock_table_preview_v850.py \
            two_table_release_v853.py \
            validate_two_table_clients_v853.py \
            test_stock_table_metrics_v850.py \
            test_two_table_release_v853.py \
            docs/custom_gpt_action_schema.yaml \
            docs/custom_gpt_instructions.md \
            docs/metric_glossary_output_contract_v8510.md \
            api/two_table_v1

          STAGED="$(git diff --cached --name-only || true)"
          echo "V8510_STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "V8510_STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file staged unexpectedly"
            exit 1
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              build_stock_table_preview_v850.py|two_table_release_v853.py|validate_two_table_clients_v853.py|test_stock_table_metrics_v850.py|test_two_table_release_v853.py|docs/custom_gpt_action_schema.yaml|docs/custom_gpt_instructions.md|docs/metric_glossary_output_contract_v8510.md|api/two_table_v1/*)
                ;;
              *)
                echo "::error::Unexpected staged path: $p"
                exit 1
                ;;
            esac
          done <<< "$STAGED"

          echo "WORKFLOW_FILES_STAGED=false"
          if git diff --cached --quiet; then
            echo "::error::V8.5.10 produced no staged changes"
            exit 1
          fi

          git commit -m "Add V8.5.10 metric glossary table footer"
          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V8510_METRIC_GLOSSARY_RELEASE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "CONFIRMED_SWING_LOW_STOP_CALCULATED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          echo "----- V8.5.10 patch -----"
          test -f /tmp/v8510_patch.txt && cat /tmp/v8510_patch.txt || true
          echo "----- V8.5.10 release -----"
          test -f /tmp/v8510_release.txt && cat /tmp/v8510_release.txt || true
          echo "----- V8.5.10 client validation -----"
          test -f /tmp/v8510_clients.txt && cat /tmp/v8510_clients.txt || true
          echo "----- V8.5.10 payload sizes -----"
          test -f /tmp/v8510_payloads.txt && cat /tmp/v8510_payloads.txt || true
          git status --short || true
