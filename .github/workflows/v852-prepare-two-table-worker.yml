# Installs reviewed Worker sources only; no Cloudflare or GPT deployment.
name: Prepare guarded two-table Worker v8.5.2

"on":
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-api-json-main
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout current main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Apply and validate guarded Worker sources
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1
          test -z "$(git status --porcelain)"
          v852_tmp="$(mktemp -d)"
          export V852_TASK_DIR="$v852_tmp"
          mkdir "$v852_tmp/logs"
          printf 'artifact_path=%s\n' "$v852_tmp/logs" >> "$GITHUB_OUTPUT"
          printf 'base_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          python - <<'PY'
          import base64, hashlib, json, os, zlib
          from pathlib import Path
          root = Path.cwd().resolve()
          rollout = json.loads((root / 'api/two_table_v1/manifest.json').read_text())
          if rollout.get('release_stage') != 'SCHEDULED_SHADOW_ONLY' or any(rollout.get(k) is not False for k in (
              'production_activation_allowed', 'custom_gpt_route_enabled', 'safe_to_analyze_as_latest', 'standalone_swing_table_enabled')):
              raise SystemExit('V852_REQUIRES_INACTIVE_V851_DATASET')
          bundle = json.loads('{"worker/krx-live-price-worker.js":{"sha256":"cad090692f5a2377465b6fded1f7a4acc040adea7bf5cb6e2a4793b1b79eeaf8","old_sha256":"665fefbcd44c8b0965c5ca28c88dea9c1042d5a64a26038a904bd2d10c420b6f","zlib_base64":""},"worker/validate_worker.mjs":{"sha256":"c2e509c24571ec93ebe110aa32120778d837f5ce4e2f9417ff74ca281ea7e3f5","old_sha256":"a525370486bfeadebcf415400bcedf1a2052600bce37f86ae153114c8c59385a","zlib_base64":""},"worker/validate_two_table_proxy_v852.mjs":{"sha256":"29268e8a0f8874b30caae7422a9de3c5b68bd6fcd4a19f5fd3646ccc7ca9ef4d","old_sha256":null,"zlib_base64":""},"worker/README.md":{"sha256":"87ad0321f57d75937943c949636289c4d95110e13d37def3bc5e13b38c4bba61","old_sha256":"386240f45b643895c80596b207800b2c63d877b985031b64a10dfb50e5d99235","zlib_base64":""},"validate_daily_integrated_health_v731.py":{"sha256":"90fb294f69838c166d25e014ac3d8156c28dc97624340811dac9b8dacf634a53","old_sha256":"b8fc1428efa285be8c882e0714f7aee2022f58a7d0278285111146e6aab1ce72","zlib_base64":""},"test_worker_rollout_health_v852.py":{"sha256":"260e145bf16f904e09a41b835134645ff527eda459496e9028b2e0b7cf388baf","old_sha256":null,"zlib_base64":""},"docs/REPOSITORY_STRUCTURE.md":{"sha256":"d83bfba9ecf9a7034ccfe57d724d5062d45832cea7f2858865bf9cf27f49f09a","old_sha256":"9f07fc55b54c5f2db8dddccb50a3b17eeb9dca7a1e83bb49c88ff72cd34546dc","zlib_base64":""},"docs/two_table_worker_v852.md":{"sha256":"2c4841f1a91ff350c2e466fe45085279ff33afb2cd7a88871419600ec3694782","old_sha256":null,"zlib_base64":""}}')
          decoded = {}
          for name, item in bundle.items():
              target = root / name
              if target.is_symlink() or not target.resolve().is_relative_to(root):
                  raise SystemExit('V852_UNSAFE_TARGET=' + name)
              raw = zlib.decompress(base64.b64decode(item['zlib_base64'], validate=True))
              if hashlib.sha256(raw).hexdigest() != item['sha256']:
                  raise SystemExit('V852_EMBEDDED_INTEGRITY_FAILED=' + name)
              if target.exists():
                  if not target.is_file():
                      raise SystemExit('V852_TARGET_NOT_FILE=' + name)
                  current = hashlib.sha256(target.read_bytes()).hexdigest()
                  if current not in {item['old_sha256'], item['sha256']}:
                      raise SystemExit('V852_SOURCE_CHANGED_REVIEW_REQUIRED=' + name)
              elif item['old_sha256'] is not None:
                  raise SystemExit('V852_REQUIRED_SOURCE_MISSING=' + name)
              if name.endswith('.py'):
                  compile(raw, name, 'exec')
              decoded[name] = raw
          for name, raw in decoded.items():
              target = root / name
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_bytes(raw)
          (Path(os.environ['V852_TASK_DIR']) / 'source_names.json').write_text(json.dumps(list(decoded)))
          print('V852_EMBEDDED_SOURCE_INTEGRITY=PASS')
          print('V852_SOURCE_BASELINE_GUARD=PASS')
          PY
          python -m unittest test_stock_table_metrics_v850 test_two_table_shadow_v851 test_worker_rollout_health_v852 -v 2>&1 | tee "$v852_tmp/logs/python-tests.txt"
          echo 'V852_PYTHON_REGRESSION=PASS'
          python validate_api_sync.py --check-only | tee "$v852_tmp/logs/api-check.txt"
          python build_two_table_shadow_v851.py --repo . --check-only | tee "$v852_tmp/logs/shadow-check.txt"
          node worker/validate_worker.mjs . | tee "$v852_tmp/logs/legacy-worker-check.txt"
          node worker/validate_two_table_proxy_v852.mjs . | tee "$v852_tmp/logs/two-table-worker-check.txt"
          python validate_daily_integrated_health_v731.py --skip-remote \
            --output-json "$v852_tmp/logs/health.json" --output-md "$v852_tmp/logs/health.md"
          python - <<'PY'
          import json, os, subprocess
          from pathlib import Path
          temp = Path(os.environ['V852_TASK_DIR'])
          allowed = set(json.loads((temp / 'source_names.json').read_text()))
          tracked = subprocess.check_output(['git','diff','HEAD','--name-only','-z']).decode().split('\0')
          untracked = subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
          for name in filter(None, tracked + untracked):
              if name not in allowed:
                  raise SystemExit('V852_UNEXPECTED_CHANGE=' + name)
          print('V852_CHANGED_FILE_ALLOWLIST=PASS')
          print('V852_EXISTING_API_AND_GPT_UNCHANGED=PASS')
          print('V852_WORKER_SOURCE_VALIDATION=PASS')
          print('PRODUCTION_ACTIVATION_ALLOWED=false')
          print('STANDALONE_SWING_TABLE_ENABLED=false')
          PY
      - name: Push only validated non-workflow changes
        shell: bash
        env:
          V852_BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -- worker/krx-live-price-worker.js worker/validate_worker.mjs worker/validate_two_table_proxy_v852.mjs worker/README.md validate_daily_integrated_health_v731.py test_worker_rollout_health_v852.py docs/REPOSITORY_STRUCTURE.md docs/two_table_worker_v852.md
          if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
            echo '::error::Workflow files must not be committed by this installer.'
            exit 1
          fi
          git fetch --no-tags origin main
          if test "$(git rev-parse origin/main)" != "$V852_BASE_SHA"; then
            echo '::error::Main changed during validation. Nothing was pushed. Rerun on current main.'
            echo 'V852_REMOTE_MAIN_CHANGED=true'
            exit 1
          fi
          if git diff --cached --quiet; then
            echo 'V852_ALREADY_INSTALLED=true'
          else
            git diff --cached --stat
            git commit -m "Prepare guarded two-table Worker v8.5.2"
            git push origin HEAD:main
          fi
          echo 'PUSH_SUCCESS=true'
          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo 'WORKER_SOURCE_BUILD=1.4.0-two-table-guarded-preview'
          echo 'V852_WORKER_SOURCE_CONNECTION=PASS'
          echo 'PRODUCTION_ACTIVATION_ALLOWED=false'
          echo 'MANUAL_CLOUDFLARE_DEPLOY_REQUIRED=true'
          echo 'MANUAL_SAFE_AUDIT_REPLACEMENT_REQUIRED=true'
          echo 'MANUAL_GPT_REPLACEMENT_REQUIRED=false'
          echo 'MANUAL_WORKFLOW_CLEANUP_REQUIRED=true'
      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v852-two-table-worker-validation
          path: ${{ steps.prepare.outputs.artifact_path }}
          if-no-files-found: ignore
          retention-days: 7
