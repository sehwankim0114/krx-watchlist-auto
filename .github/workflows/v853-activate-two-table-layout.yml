name: Activate new stock table layouts v8.5.3
'on':
  workflow_dispatch: null
permissions:
  contents: write
concurrency:
  group: build-api-json-main
  cancel-in-progress: false
jobs:
  activate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      PYTHONDONTWRITEBYTECODE: '1'
    steps:
    - name: Checkout current main
      uses: actions/checkout@v6
      with:
        ref: main
        fetch-depth: 1
    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'
    - name: Set up Node
      uses: actions/setup-node@v6
      with:
        node-version: '22'
    - name: Install build dependencies including YAML
      run: python -m pip install --quiet -r requirements.txt PyYAML
    - name: Build and validate the complete release
      id: prepare
      shell: bash
      run: |
        set -euo pipefail
        export PYTHONDONTWRITEBYTECODE=1
        test -z "$(git status --porcelain)"
        v853_temp="$(mktemp -d)"
        export V853_TASK_DIR="$v853_temp"
        mkdir "$v853_temp/logs"
        printf 'artifact_path=%s\n' "$v853_temp/logs" >> "$GITHUB_OUTPUT"
        printf 'base_sha=%s\n' "$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
        python - <<'PY'
        import base64, hashlib, json, os, urllib.error, urllib.request, zlib
        from pathlib import Path
        root = Path.cwd().resolve()
        HEALTH_URL = 'https://krx-live-price-ksh.diaconos.workers.dev/health'
        EXPECTED_WORKER = '1.4.0-two-table-guarded-preview'
        class NoRedirect(urllib.request.HTTPRedirectHandler):
            def redirect_request(self, request, file, code, msg, headers, newurl):
                return None
        request = urllib.request.Request(HEALTH_URL, method='GET', headers={
            'Accept': 'application/json',
            'User-Agent': 'krx-watchlist-health-v7.3',
            'Cache-Control': 'no-cache',
        })
        try:
            with urllib.request.build_opener(NoRedirect()).open(request, timeout=25) as response:
                raw_health = response.read(100001)
                if len(raw_health) > 100000:
                    raise ValueError('RESPONSE_TOO_LARGE')
                health = json.loads(raw_health)
        except urllib.error.HTTPError as exc:
            raise SystemExit('V853_DEPLOYED_WORKER_PREREQUISITE_HTTP_' + str(exc.code)) from None
        except (OSError, TimeoutError, json.JSONDecodeError, ValueError) as exc:
            raise SystemExit('V853_DEPLOYED_WORKER_PREREQUISITE_FAILED=' + str(exc)) from None
        if not isinstance(health, dict) or health.get('status') != 'OK' or health.get('build_version') != EXPECTED_WORKER:
            raise SystemExit('V853_DEPLOYED_WORKER_V140_REQUIRED')
        proxy = health.get('two_table_proxy') or {}
        for key, expected in {
            'version': '1',
            'page_limit_bytes': 30000,
            'page_limit_rows': 30,
            'sha256_required': True,
            'later_pages_require_build_id': True,
            'cache_mode': 'NO_STORE_CONTROL_RECHECK',
            'values_recalculated': False,
            'standalone_swing_table_enabled': False,
            'paths': ['/tables/v1/kospi', '/tables/v1/decliners', '/tables/v1/decliners24'],
        }.items():
            if proxy.get(key) != expected or type(proxy.get(key)) is not type(expected):
                raise SystemExit('V853_DEPLOYED_WORKER_PROXY_MISMATCH=' + key)
        print('V853_DEPLOYED_WORKER_PREREQUISITE=PASS')
        bundle = json.loads('{"two_table_release_v853.py":{"sha256":"dddd8c7b9e1803dcc9f5e245caced6339b2c1dee2268a30f84538d3f2972b780","old_sha256":null,"zlib_base64":""},"config/two_table_release.json":{"sha256":"f8756531c42b83a9f5dc274bf215c106534fb0f7d345d06b14556f91934801d4","old_sha256":null,"zlib_base64":""},"test_two_table_release_v853.py":{"sha256":"5c3a026b8026f00316c18640b74f8c1654ff3044703dfd48c97ad26aadca670e","old_sha256":null,"zlib_base64":""},"validate_two_table_clients_v853.py":{"sha256":"78afbb152c58fba0bb69a26c691a2372a4fe250fa83f2ddd390bb0a28f7f19cf","old_sha256":null,"zlib_base64":""},"worker/validate_two_table_release_v853.mjs":{"sha256":"6444a432ccc788e2dd2dac43d58236149985186f67e582594eab799fa50b0de9","old_sha256":null,"zlib_base64":""},"worker/validate_two_table_proxy_v852.mjs":{"sha256":"352c91b1b4aaf870942c6efacaaebfcfdef8a02a7127155231826c52a90ac518","old_sha256":"29268e8a0f8874b30caae7422a9de3c5b68bd6fcd4a19f5fd3646ccc7ca9ef4d","zlib_base64":""},"build_api_json.py":{"sha256":"ff98e2ef22bb6df9e378070fa4f396935cfeed74149a8c525dffe1e594d350f4","old_sha256":"5b6d30c32a628d55ecf15d603b4383608e8ba6a5bd4ca91a3aa5d3fa78b58a6b","zlib_base64":""},"validate_api_sync.py":{"sha256":"eb261d17573e63506b3da9884f4a2242b86961dfe84cea12b07288375fa839f0","old_sha256":"d7dd9fed309408137c9bfbc0813fcb4eb95f0bc330143e7348516bbd62e75454","zlib_base64":""},"table_command_routes_v82.py":{"sha256":"9b141895ad42c0e1bc08537961483a47c5cfbdf438d98d3be29249f981f78fb3","old_sha256":"3cb34ecbf289141d1f0e319150eb5747a1838703400d29fc1273ecf7ea3a38dd","zlib_base64":""},"validate_table_command_routes_v82.py":{"sha256":"415ad2c827fbde6265d625e581bea6a09f4b7eaa007580f060bc1372aa681b23","old_sha256":"ef17cde31b2a9f0a5b12c6e3232ed4b9f3568ae47c0ec1a8859b9a0fb9400843","zlib_base64":""},"docs/custom_gpt_action_schema.yaml":{"sha256":"a733e4839f43998b897393c48509578df3000cc39894b445daafc36f551eda08","old_sha256":"a08a0a86c552b4bde8e386e1528a390edd632ab058ac499d25318c9cb7f96bee","zlib_base64":""},"docs/custom_gpt_instructions.md":{"sha256":"d4b130ee9d9d8563541501a7e061a76e2f76a53ada36d9c297fd35e43c3b424d","old_sha256":"1ab1d5a97d016ffd8edeeb9e465f4c43e0eeb7cf539c12d73420456966f63958","zlib_base64":""},"docs/stock_table_rules_latest.md":{"sha256":"302d0af435df091589cbb0029d95dd2869132ff7a148e95b799d8c6ce55e40ed","old_sha256":"44e773a99978dfc6bc807177f1e8efbbc4450cbaee744459fe7c11f83d574f5f","zlib_base64":""},"docs/two_table_release_v853.md":{"sha256":"c91cce8be745118af26c35642ab5d38fe642c3bc7e0f80082f37770f8677e704","old_sha256":null,"zlib_base64":""},"docs/REPOSITORY_STRUCTURE.md":{"sha256":"b8b69c7e23630e67640006a5eb1f90cb3408d8af8e39ea6c3e5b96ffef1946b6","old_sha256":"d83bfba9ecf9a7034ccfe57d724d5062d45832cea7f2858865bf9cf27f49f09a","zlib_base64":""}}')
        decoded = {}
        for name, item in bundle.items():
            target = root / name
            if target.is_symlink() or not target.resolve().is_relative_to(root):
                raise SystemExit('V853_UNSAFE_TARGET=' + name)
            raw = zlib.decompress(base64.b64decode(item['zlib_base64'], validate=True))
            if hashlib.sha256(raw).hexdigest() != item['sha256']:
                raise SystemExit('V853_EMBEDDED_INTEGRITY_FAILED=' + name)
            if target.exists():
                if not target.is_file() or hashlib.sha256(target.read_bytes()).hexdigest() not in {item['old_sha256'], item['sha256']}:
                    raise SystemExit('V853_SOURCE_CHANGED_REVIEW_REQUIRED=' + name)
            elif item['old_sha256'] is not None:
                raise SystemExit('V853_REQUIRED_SOURCE_MISSING=' + name)
            if name.endswith('.py'):
                compile(raw, name, 'exec')
            decoded[name] = raw
        for name, raw in decoded.items():
            p = root / name; p.parent.mkdir(parents=True, exist_ok=True); p.write_bytes(raw)
        (Path(os.environ['V853_TASK_DIR']) / 'source_names.json').write_text(json.dumps(list(decoded)))
        print('V853_EMBEDDED_SOURCE_INTEGRITY=PASS')
        print('V853_SOURCE_BASELINE_GUARD=PASS')
        PY
        python -m unittest test_stock_table_metrics_v850 test_two_table_shadow_v851 test_worker_rollout_health_v852 test_two_table_release_v853 -v 2>&1 | tee "$v853_temp/logs/python-tests.txt"
        python sync_official_status.py --output-dir latest
        python - <<'PY'
        import json, subprocess
        from pathlib import Path
        s = json.loads(Path('latest/official_data_status_latest.json').read_text())
        mode = s.get('run_mode') or s.get('final_run_mode') or 'official'
        subprocess.run(['python', 'render_data_freshness_notice.py', '--output-dir', 'latest',
                        '--mode', mode if mode in ('official', 'aux') else 'official'], check=True)
        PY
        python build_api_json.py | tee "$v853_temp/logs/build.txt"
        python validate_api_sync.py --api-dir api | tee "$v853_temp/logs/api-check.txt"
        python two_table_release_v853.py --repo . --check-only
        python validate_two_table_clients_v853.py --repo .
        python validate_table_command_routes_v82.py
        node worker/validate_worker.mjs . | tee "$v853_temp/logs/legacy-worker.txt"
        node worker/validate_two_table_proxy_v852.mjs . | tee "$v853_temp/logs/inactive-worker.txt"
        node worker/validate_two_table_release_v853.mjs . | tee "$v853_temp/logs/production-worker.txt"
        python validate_daily_integrated_health_v731.py --skip-remote \
          --output-json "$v853_temp/logs/health.json" --output-md "$v853_temp/logs/health.md"
        python - <<'PY'
        import json, os, subprocess
        from pathlib import Path
        temp = Path(os.environ['V853_TASK_DIR'])
        allowed = set(json.loads((temp / 'source_names.json').read_text())) | set(['latest/official_data_status_latest.json', 'latest/official_data_status_latest.txt', 'latest/data_freshness_notice_latest.json', 'latest/data_freshness_notice_latest.txt', 'latest/krx_sector_theme_latest.json', 'latest/krx_sector_theme_latest.csv', 'latest/krx_sector_theme_run_log_latest.txt'])
        names = subprocess.check_output(['git','diff','HEAD','--name-only','-z']).decode().split('\0')
        names += subprocess.check_output(['git','ls-files','--others','--exclude-standard','-z']).decode().split('\0')
        for name in filter(None, names):
            if name not in allowed and not name.startswith('api/'):
                raise SystemExit('V853_UNEXPECTED_CHANGE=' + name)
        m = json.loads(Path('api/two_table_v1/manifest.json').read_text())
        if m.get('status') != 'READY' or m.get('production_activation_allowed') is not True:
            raise SystemExit('V853_SOURCE_NOT_FRESH_REBUILD_REQUIRED')
        report = json.loads((temp / 'logs/health.json').read_text())
        if report.get('status') != 'PASS' or report.get('critical_count') != 0 or report.get('warning_count') != 0:
            raise SystemExit('V853_DAILY_HEALTH_NOT_CLEAN')
        print('V853_CHANGED_FILE_ALLOWLIST=PASS')
        print('V853_LAYOUT_RELEASE_VALIDATION=PASS')
        print('V853_WORKER_REDEPLOY_REQUIRED=false')
        print('INCOMPLETE_METRICS_EXPLICIT=true')
        PY
    - name: Push only validated non-workflow changes
      shell: bash
      env:
        V853_BASE_SHA: ${{ steps.prepare.outputs.base_sha }}
      run: |
        set -euo pipefail
        git config user.name "github-actions"
        git config user.email "github-actions@users.noreply.github.com"
        git add -- two_table_release_v853.py config/two_table_release.json test_two_table_release_v853.py validate_two_table_clients_v853.py worker/validate_two_table_release_v853.mjs worker/validate_two_table_proxy_v852.mjs build_api_json.py validate_api_sync.py table_command_routes_v82.py validate_table_command_routes_v82.py docs/custom_gpt_action_schema.yaml docs/custom_gpt_instructions.md docs/stock_table_rules_latest.md docs/two_table_release_v853.md docs/REPOSITORY_STRUCTURE.md api latest/official_data_status_latest.json latest/official_data_status_latest.txt latest/data_freshness_notice_latest.json latest/data_freshness_notice_latest.txt latest/krx_sector_theme_latest.json latest/krx_sector_theme_latest.csv latest/krx_sector_theme_run_log_latest.txt
        if git diff --cached --name-only | grep -E '^\.github/workflows/'; then
          echo '::error::Workflow files must be uploaded manually, never pushed by this installer.'
          exit 1
        fi
        git fetch --no-tags origin main
        if test "$(git rev-parse origin/main)" != "$V853_BASE_SHA"; then
          echo '::error::Main changed during validation. Nothing was pushed. Rerun this workflow on current main.'
          echo 'V853_REMOTE_MAIN_CHANGED=true'
          exit 1
        fi
        if git diff --cached --quiet; then
          echo 'V853_ALREADY_INSTALLED=true'
        else
          git diff --cached --stat
          git commit -m "Activate guarded new table layout v8.5.3"
          git push origin HEAD:main
        fi
        echo 'PUSH_SUCCESS=true'
        echo "COMMIT_SHA=$(git rev-parse HEAD)"
        echo 'V853_LAYOUT_RELEASE=PASS'
        echo 'WORKER_SOURCE_BUILD=1.4.0-two-table-guarded-preview'
        echo 'MANUAL_CLOUDFLARE_DEPLOY_REQUIRED=false'
        echo 'MANUAL_GPT_SCHEMA_AND_INSTRUCTIONS_REPLACEMENT_REQUIRED=true'
        echo 'MANUAL_WORKFLOW_CLEANUP_REQUIRED=true'
        echo 'INCOMPLETE_METRICS_EXPLICIT=true'
        echo 'STANDALONE_SWING_TABLE_ENABLED=false'
    - name: Upload validation evidence
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: v853-layout-validation
        path: ${{ steps.prepare.outputs.artifact_path }}
        if-no-files-found: ignore
        retention-days: 7
