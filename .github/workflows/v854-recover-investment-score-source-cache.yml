name: Recover investment-score source cache v8.5.4

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: recover-investment-score-source-cache-v854
  cancel-in-progress: false

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore V8.5.4 source files in runner
        shell: bash
        env:
          SCRIPT_B64: ""
          DOC_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("investment_score_source_enricher_v854.py").write_bytes(
              base64.b64decode(os.environ["SCRIPT_B64"])
          )
          Path("docs/investment_score_source_contract_v854.md").write_bytes(
              base64.b64decode(os.environ["DOC_B64"])
          )
          print("SOURCE_ENRICHER_RESTORED=PASS")
          print("SOURCE_CONTRACT_RESTORED=PASS")
          PY

      - name: Static safety validation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile investment_score_source_enricher_v854.py
          python investment_score_source_enricher_v854.py --self-test | tee /tmp/source_selftest.txt
          grep -q 'SELF_TEST=PASS' /tmp/source_selftest.txt
          grep -q 'SCORE_VALUES_GENERATED=false' /tmp/source_selftest.txt
          grep -q 'NET_CASH_CALCULATED=false' /tmp/source_selftest.txt
          grep -q 'EV_EBITDA_CALCULATED=false' /tmp/source_selftest.txt
          echo "STATIC_SAFETY_VALIDATION=PASS"

      - name: Bootstrap official source cache
        shell: bash
        run: |
          set -euo pipefail
          test -n "${DART_API_KEY:-}" || {
            echo "::error::DART_API_KEY secret is missing"
            exit 1
          }

          python investment_score_source_enricher_v854.py             --output-dir latest             --workers 4             --timeout 30             --max-full-account-calls 5000             | tee /tmp/source_bootstrap.txt

          grep -q 'INVESTMENT_SCORE_SOURCE_STATUS=OK' /tmp/source_bootstrap.txt
          grep -q 'INVESTMENT_SCORE_100_CALCULATED=false' /tmp/source_bootstrap.txt
          grep -q 'NET_CASH_CALCULATED=false' /tmp/source_bootstrap.txt
          grep -q 'EV_EBITDA_CALCULATED=false' /tmp/source_bootstrap.txt

      - name: Validate generated cache
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import pandas as pd
          from pathlib import Path

          path = Path("latest/investment_score_source_cache_latest.csv")
          if not path.exists():
              raise SystemExit("SOURCE_CACHE_MISSING")

          df = pd.read_csv(path, dtype=str, encoding="utf-8-sig").fillna("")
          if len(df) == 0:
              raise SystemExit("SOURCE_CACHE_EMPTY")

          required = {
              "three_year_source_status",
              "quarter_source_status",
              "cash_and_cash_equivalents",
              "core_debt_candidates_json",
              "lease_liability_candidates_json",
              "other_financial_liability_candidates_json",
              "net_cash_value",
              "ev_ebitda_value",
              "investment_score_100",
              "score_threshold_policy_status",
          }
          missing = required - set(df.columns)
          if missing:
              raise SystemExit(f"SOURCE_CACHE_COLUMNS_MISSING:{sorted(missing)}")

          if (df["investment_score_100"].str.strip() != "").any():
              raise SystemExit("INVESTMENT_SCORE_MUST_REMAIN_EMPTY")
          if (df["net_cash_value"].str.strip() != "").any():
              raise SystemExit("NET_CASH_MUST_REMAIN_EMPTY")
          if (df["ev_ebitda_value"].str.strip() != "").any():
              raise SystemExit("EV_EBITDA_MUST_REMAIN_EMPTY")
          if not (df["score_threshold_policy_status"] == "NOT_DEFINED").all():
              raise SystemExit("SCORE_THRESHOLD_POLICY_STATUS_INVALID")

          # JSON columns must at least be syntactically valid.
          for column in (
              "core_debt_candidates_json",
              "lease_liability_candidates_json",
              "other_financial_liability_candidates_json",
              "depreciation_amortization_candidates_json",
          ):
              for value in df[column]:
                  json.loads(value or "[]")

          print(f"SOURCE_CACHE_ROWS={len(df)}")
          print(
              "THREE_YEAR_READY="
              f"{int((df['three_year_source_status'] == 'READY').sum())}"
          )
          print(
              "QUARTER_READY="
              f"{int((df['quarter_source_status'] == 'READY_Q2_SOURCE').sum())}"
          )
          print(
              "DEEP_READY="
              f"{int((df['deep_source_status'] == 'OK').sum())}"
          )
          print("NO_SCORE_GENERATION_GUARD=PASS")
          print("NO_NET_CASH_CALCULATION_GUARD=PASS")
          print("NO_EV_EBITDA_CALCULATION_GUARD=PASS")
          PY

      - name: Assert no workflow file is staged
        shell: bash
        run: |
          set -euo pipefail

          # This recovery run must never commit a .github/workflows change.
          git add             investment_score_source_enricher_v854.py             docs/investment_score_source_contract_v854.md             latest/investment_score_source_cache_latest.csv             latest/investment_score_source_run_log_latest.txt

          STAGED="$(git diff --cached --name-only)"
          echo "STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file unexpectedly staged"
            exit 1
          fi

          echo "NO_WORKFLOW_FILE_STAGED=PASS"

      - name: Commit and push non-workflow V8.5.4 files
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            echo "V854_NONWORKFLOW_RECOVERY=PASS"
            exit 0
          fi

          git commit -m "Add V8.5.4 investment score source cache"
          git fetch origin main

          LOCAL_PARENT="$(git rev-parse HEAD^)"
          REMOTE_MAIN="$(git rev-parse origin/main)"
          if [ "$LOCAL_PARENT" != "$REMOTE_MAIN" ]; then
            echo "REMOTE_MAIN_CHANGED=true"
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          # Safety check again after possible rebase.
          if git diff-tree --no-commit-id --name-only -r HEAD | grep -q '^\.github/workflows/'; then
            echo "::error::Final commit contains workflow changes"
            exit 1
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V854_NONWORKFLOW_RECOVERY=PASS"
          echo "WORKFLOW_FILES_CHANGED=false"
          echo "INVESTMENT_SCORE_100_CALCULATED=false"
          echo "NEXT_PENDING=CONNECT_OFFICIAL_COLLECTION_WORKFLOW"
