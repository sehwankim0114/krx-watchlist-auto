name: Install V8.5.4.1 transient source retention guard

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  install:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Patch source enricher with transient retention guard
        shell: bash
        env:
          PATCH_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os

          code = base64.b64decode(
              os.environ["PATCH_B64"]
          ).decode("utf-8")
          exec(compile(code, "<v8541_patch>", "exec"))
          PY

      - name: Compile and self-test patched source
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile investment_score_source_enricher_v854.py
          python investment_score_source_enricher_v854.py --self-test             | tee /tmp/v8541_selftest.txt

          grep -q 'SELF_TEST=PASS' /tmp/v8541_selftest.txt
          grep -q 'SCORE_VALUES_GENERATED=false' /tmp/v8541_selftest.txt
          grep -q 'NET_CASH_CALCULATED=false' /tmp/v8541_selftest.txt
          grep -q 'EV_EBITDA_CALCULATED=false' /tmp/v8541_selftest.txt
          grep -q 'v1.0.1-transient-retention-guard'             investment_score_source_enricher_v854.py

          echo "V8541_STATIC_VALIDATION=PASS"

      - name: Restore pre-timeout source cache as retention baseline
        shell: bash
        run: |
          set -euo pipefail

          BASELINE_COMMIT="16600c9483870e311ec40814597bc150cf98b4c1"

          git cat-file -e             "${BASELINE_COMMIT}:latest/investment_score_source_cache_latest.csv"

          git show             "${BASELINE_COMMIT}:latest/investment_score_source_cache_latest.csv"             > latest/investment_score_source_cache_latest.csv

          python - <<'PY'
          import pandas as pd

          path = "latest/investment_score_source_cache_latest.csv"
          df = pd.read_csv(
              path,
              dtype=str,
              encoding="utf-8-sig",
          ).fillna("")

          print(f"RETENTION_BASELINE_ROWS={len(df)}")
          if len(df) < 140:
              raise SystemExit(
                  f"RETENTION_BASELINE_TOO_SMALL:{len(df)}"
              )
          print("RETENTION_BASELINE_RESTORED=PASS")
          PY

      - name: Run guarded official source refresh
        shell: bash
        run: |
          set -euo pipefail

          test -n "${DART_API_KEY:-}" || {
            echo "::error::DART_API_KEY secret is missing"
            exit 1
          }

          python investment_score_source_enricher_v854.py             --output-dir latest             --workers 4             --timeout 30             --max-full-account-calls 5000             | tee /tmp/v8541_refresh.txt

          grep -q 'INVESTMENT_SCORE_SOURCE_STATUS=OK'             /tmp/v8541_refresh.txt
          grep -q 'INVESTMENT_SCORE_100_CALCULATED=false'             /tmp/v8541_refresh.txt
          grep -q 'NET_CASH_CALCULATED=false'             /tmp/v8541_refresh.txt
          grep -q 'EV_EBITDA_CALCULATED=false'             /tmp/v8541_refresh.txt
          grep -q 'SOURCE_RETENTION_GUARD=PASS'             latest/investment_score_source_run_log_latest.txt

          echo "----- V8.5.4.1 retention result -----"
          cat latest/investment_score_source_run_log_latest.txt

      - name: Validate retention safety and output
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import pandas as pd
          from pathlib import Path

          cache = Path(
              "latest/investment_score_source_cache_latest.csv"
          )
          log_path = Path(
              "latest/investment_score_source_run_log_latest.txt"
          )

          df = pd.read_csv(
              cache,
              dtype=str,
              encoding="utf-8-sig",
          ).fillna("")

          log = {}
          for line in log_path.read_text(
              encoding="utf-8"
          ).splitlines():
              if "=" in line:
                  key, value = line.split("=", 1)
                  log[key] = value

          targets = int(log.get("TARGETS", "0"))
          transient = int(
              log.get("TRANSIENT_UPSTREAM_FAILURES", "0")
          )
          retained = int(
              log.get("TRANSIENT_ROWS_RETAINED", "0")
          )

          if len(df) < targets:
              raise SystemExit(
                  f"OUTPUT_BELOW_CURRENT_TARGETS:{len(df)}<{targets}"
              )

          if transient > 0 and retained == 0:
              raise SystemExit(
                  "TRANSIENT_FAILURES_PRESENT_BUT_NOT_RETAINED"
              )

          if (
              df["investment_score_100"]
              .astype(str)
              .str.strip()
              .ne("")
              .any()
          ):
              raise SystemExit(
                  "INVESTMENT_SCORE_MUST_REMAIN_EMPTY"
              )

          if (
              df["net_cash_value"]
              .astype(str)
              .str.strip()
              .ne("")
              .any()
          ):
              raise SystemExit("NET_CASH_MUST_REMAIN_EMPTY")

          if (
              df["ev_ebitda_value"]
              .astype(str)
              .str.strip()
              .ne("")
              .any()
          ):
              raise SystemExit("EV_EBITDA_MUST_REMAIN_EMPTY")

          retained_rows = int(
              (
                  df["source_cache_status"]
                  == "RETAINED_TRANSIENT_SOURCE"
              ).sum()
          )

          print(f"OUTPUT_ROWS={len(df)}")
          print(f"CURRENT_TARGETS={targets}")
          print(f"TRANSIENT_UPSTREAM_FAILURES={transient}")
          print(f"TRANSIENT_ROWS_RETAINED={retained}")
          print(
              f"RETAINED_TRANSIENT_SOURCE_ROWS={retained_rows}"
          )
          print("V8541_RETENTION_SAFETY=PASS")
          PY

      - name: Commit and push V8.5.4.1 non-workflow update
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add             investment_score_source_enricher_v854.py             latest/investment_score_source_cache_latest.csv             latest/investment_score_source_run_log_latest.txt

          STAGED="$(git diff --cached --name-only)"

          echo "STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "STAGED_FILES_END"

          if printf '%s\n' "$STAGED"             | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file unexpectedly staged"
            exit 1
          fi

          echo "NO_WORKFLOW_FILE_STAGED=PASS"

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            echo "V8541_TRANSIENT_RETENTION_GUARD=PASS"
            exit 0
          fi

          git commit -m             "Add V8.5.4.1 transient source retention guard"

          git fetch origin main

          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            echo "REMOTE_MAIN_CHANGED=true"
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          if git diff-tree             --no-commit-id             --name-only             -r HEAD             | grep -q '^\.github/workflows/'; then
            echo "::error::Final commit contains workflow changes"
            exit 1
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V8541_TRANSIENT_RETENTION_GUARD=PASS"
          echo "WORKFLOW_FILES_CHANGED=false"
          echo "INVESTMENT_SCORE_100_CALCULATED=false"
          echo "NEXT_PENDING=EARNINGS_OUTLOOK_CHANGE_SOURCE"
