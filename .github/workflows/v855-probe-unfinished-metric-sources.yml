name: Probe unfinished metric sources v8.5.5

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v855-unfinished-metric-source-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore probe script
        shell: bash
        env:
          PROBE_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("/tmp/v855_probe.py").write_bytes(
              base64.b64decode(os.environ["PROBE_B64"])
          )
          PY
          python -m py_compile /tmp/v855_probe.py

      - name: Run read-only source readiness probe
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KRX_AUTH_KEY:-}" || {
            echo "::error::KRX_AUTH_KEY secret is missing"
            exit 1
          }
          python /tmp/v855_probe.py | tee /tmp/v855_probe_output.txt

          grep -q 'V855_UNFINISHED_METRIC_SOURCE_PROBE=PASS' /tmp/v855_probe_output.txt
          grep -q 'REPOSITORY_WRITE=false' /tmp/v855_probe_output.txt
          grep -q 'METRIC_VALUES_GENERATED=false' /tmp/v855_probe_output.txt

          echo "----- V8.5.5 probe summary -----"
          cat /tmp/v855_probe_output.txt
          echo "----- report -----"
          cat /tmp/v855_probe/v855-unfinished-metric-source-readiness.md

      - name: Verify repository unchanged
        shell: bash
        run: |
          set -euo pipefail
          if [ -n "$(git status --porcelain)" ]; then
            echo "::error::Repository changed during read-only probe"
            git status --short
            exit 1
          fi
          echo "ORIGINAL_CHECKOUT_UNCHANGED=PASS"
          echo "NO_COMMIT_NO_PUSH_NO_DEPLOY=PASS"

      - name: Upload V8.5.5 probe artifact
        uses: actions/upload-artifact@v6
        with:
          name: unfinished-metric-source-readiness-v855
          path: |
            /tmp/v855_probe/v855-unfinished-metric-source-readiness.json
            /tmp/v855_probe/v855-unfinished-metric-source-readiness.md
          if-no-files-found: error
          retention-days: 14
