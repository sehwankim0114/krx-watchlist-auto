name: Build compact 260d active-stock history v8.5.7

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - collect-krx-watchlist
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Seoul
      KRX_AUTH_KEY: ${{ secrets.KRX_AUTH_KEY }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore V8.5.7 source-only builder and contract
        shell: bash
        env:
          BUILDER_B64: ""
          CONTRACT_B64: ""
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("active_stock_long_history_builder_v857.py").write_bytes(
              base64.b64decode(os.environ["BUILDER_B64"])
          )
          Path("docs").mkdir(parents=True, exist_ok=True)
          Path("docs/active_stock_long_history_contract_v857.md").write_bytes(
              base64.b64decode(os.environ["CONTRACT_B64"])
          )
          PY

          python -m py_compile active_stock_long_history_builder_v857.py

          python active_stock_long_history_builder_v857.py \
            --self-test \
            | tee /tmp/v857_self_test.txt

          grep -q '^SELF_TEST=PASS$' /tmp/v857_self_test.txt
          grep -q '^SECTOR_RS_CALCULATED=false$' /tmp/v857_self_test.txt
          grep -q '^CONFIRMED_SWING_LOW_STOP_CALCULATED=false$' /tmp/v857_self_test.txt
          grep -q '^STANDALONE_SWING_METRICS_CALCULATED=false$' /tmp/v857_self_test.txt
          grep -q '^INVESTMENT_SCORE_100_CALCULATED=false$' /tmp/v857_self_test.txt
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v857_self_test.txt

      - name: Build or refresh compact 260-session source cache
        shell: bash
        run: |
          set -euo pipefail

          test -n "${KRX_AUTH_KEY:-}" || {
            echo "::error::KRX_AUTH_KEY secret is missing"
            exit 1
          }

          python active_stock_long_history_builder_v857.py \
            --output-dir latest \
            --target-sessions 260 \
            --timeout 40 \
            --max-lookback-days 500 \
            | tee /tmp/v857_build.txt

          grep -q '^V857_COMPACT_HISTORY_STATUS=READY$' /tmp/v857_build.txt
          grep -q '^SECTOR_RS_CALCULATED=false$' /tmp/v857_build.txt
          grep -q '^CONFIRMED_SWING_LOW_STOP_CALCULATED=false$' /tmp/v857_build.txt
          grep -q '^STANDALONE_SWING_METRICS_CALCULATED=false$' /tmp/v857_build.txt
          grep -q '^INVESTMENT_SCORE_100_CALCULATED=false$' /tmp/v857_build.txt
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v857_build.txt

          echo "----- V8.5.7 build summary -----"
          cat /tmp/v857_build.txt

          if [ -f latest/active_stock_long_history_260d_run_log_latest.txt ]; then
            echo "----- persisted run log -----"
            cat latest/active_stock_long_history_260d_run_log_latest.txt
          fi

      - name: Validate compact history contract
        shell: bash
        run: |
          set -euo pipefail

          python active_stock_long_history_builder_v857.py \
            --output-dir latest \
            --target-sessions 260 \
            --validate-only \
            | tee /tmp/v857_validate.txt

          grep -q '^V857_VALIDATION=PASS$' /tmp/v857_validate.txt
          grep -q '^DISTINCT_MARKET_DATES=260$' /tmp/v857_validate.txt
          grep -q '^SECTOR_RS_CALCULATED=false$' /tmp/v857_validate.txt
          grep -q '^CONFIRMED_SWING_LOW_STOP_CALCULATED=false$' /tmp/v857_validate.txt
          grep -q '^STANDALONE_SWING_METRICS_CALCULATED=false$' /tmp/v857_validate.txt
          grep -q '^INVESTMENT_SCORE_100_CALCULATED=false$' /tmp/v857_validate.txt
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v857_validate.txt

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          cache = Path("latest/active_stock_long_history_260d_latest.csv")
          meta = Path("latest/active_stock_long_history_260d_meta_latest.json")
          log = Path("latest/active_stock_long_history_260d_run_log_latest.txt")

          for p in (cache, meta, log):
              if not p.exists():
                  raise SystemExit(f"missing required V8.5.7 output: {p}")

          if cache.stat().st_size >= 20 * 1024 * 1024:
              raise SystemExit("compact cache exceeded 20 MiB safety gate")

          with cache.open(encoding="utf-8-sig", newline="") as f:
              header = next(csv.reader(f))

          expected = [
              "date", "market", "ticker", "name", "open", "high", "low",
              "close", "volume", "trading_value", "market_cap", "listed_shares",
          ]
          if header != expected:
              raise SystemExit(f"unexpected compact-cache header: {header}")

          forbidden = {
              "sector_rs", "rs_sector", "rs_1m", "rs_3m",
              "confirmed_swing_low_stop", "trailing_stop",
              "trailing_stop_price", "standalone_swing_metric",
              "investment_score_100", "score_total",
          }
          if forbidden.intersection(header):
              raise SystemExit("metric column leaked into source-only cache")

          payload = json.loads(meta.read_text(encoding="utf-8"))
          if payload.get("status") != "READY":
              raise SystemExit("V8.5.7 meta status is not READY")
          if payload.get("request_time_price_eligible") is not False:
              raise SystemExit("request-time price eligibility guard failed")

          guards = payload.get("hard_guards") or {}
          required_false = [
              "sector_rs_calculated",
              "confirmed_swing_low_stop_calculated",
              "standalone_swing_metrics_calculated",
              "investment_score_100_calculated",
              "request_time_price_substitution",
          ]
          for key in required_false:
              if guards.get(key) is not False:
                  raise SystemExit(f"hard guard is not false: {key}")

          print("V857_SOURCE_ONLY_CONTRACT_GUARD=PASS")
          print(f"CACHE_BYTES={cache.stat().st_size}")
          PY

      - name: Commit V8.5.7 non-workflow files only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            active_stock_long_history_builder_v857.py \
            docs/active_stock_long_history_contract_v857.md \
            latest/active_stock_long_history_260d_latest.csv \
            latest/active_stock_long_history_260d_meta_latest.json \
            latest/active_stock_long_history_260d_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"

          if printf '%s\n' "${STAGED}" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file was staged unexpectedly"
            printf '%s\n' "${STAGED}"
            exit 1
          fi

          if [ -n "${STAGED}" ]; then
            while IFS= read -r p; do
              case "${p}" in
                active_stock_long_history_builder_v857.py|\
                docs/active_stock_long_history_contract_v857.md|\
                latest/active_stock_long_history_260d_latest.csv|\
                latest/active_stock_long_history_260d_meta_latest.json|\
                latest/active_stock_long_history_260d_run_log_latest.txt)
                  ;;
                *)
                  echo "::error::Unexpected staged path: ${p}"
                  exit 1
                  ;;
              esac
            done <<< "${STAGED}"
          fi

          echo "WORKFLOW_FILES_STAGED=false"

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            exit 0
          fi

          git commit -m "Update V8.5.7 compact active-stock history"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V857_COMPACT_HISTORY_RELEASE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "SECTOR_RS_CALCULATED=false"
          echo "CONFIRMED_SWING_LOW_STOP_CALCULATED=false"
          echo "STANDALONE_SWING_METRICS_CALCULATED=false"
          echo "INVESTMENT_SCORE_100_CALCULATED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final release report
        if: always()
        shell: bash
        run: |
          echo "----- V8.5.7 final report -----"
          if [ -f /tmp/v857_build.txt ]; then
            cat /tmp/v857_build.txt
          fi
          if [ -f /tmp/v857_validate.txt ]; then
            cat /tmp/v857_validate.txt
          fi
          git status --short || true
