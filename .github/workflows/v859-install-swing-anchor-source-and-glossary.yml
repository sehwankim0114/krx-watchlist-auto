name: Install swing-anchor source and glossary v8.5.9

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Build compact 260d active-stock history v8.5.7
    types:
      - completed

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  install:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Restore V8.5.9 builder and contract
        shell: bash
        env:
          BUILDER_B64: ""
          CONTRACT_B64: ""
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("swing_anchor_source_v859.py").write_bytes(
              base64.b64decode(os.environ["BUILDER_B64"])
          )
          Path("docs").mkdir(parents=True, exist_ok=True)
          Path("docs/swing_anchor_source_contract_v859.md").write_bytes(
              base64.b64decode(os.environ["CONTRACT_B64"])
          )
          PY

          python -m py_compile swing_anchor_source_v859.py

          python swing_anchor_source_v859.py --self-test \
            | tee /tmp/v859_self_test.txt

          grep -q '^SELF_TEST=PASS$' /tmp/v859_self_test.txt
          grep -q '^CONFIRMED_SWING_LOW_STOP_CALCULATED=false$' /tmp/v859_self_test.txt
          grep -q '^STANDALONE_SWING_TABLE_ENABLED=false$' /tmp/v859_self_test.txt
          grep -q '^METRIC_FORMULA_CHANGED=false$' /tmp/v859_self_test.txt

      - name: Build V8.5.9 source evidence
        shell: bash
        run: |
          set -euo pipefail

          python swing_anchor_source_v859.py \
            | tee /tmp/v859_build.txt

          grep -q '^V859_SWING_ANCHOR_SOURCE_STATUS=READY$' /tmp/v859_build.txt
          grep -q '^KOSPI30_SWING_ANCHOR_EXACT_MATCHES=30$' /tmp/v859_build.txt
          grep -q '^KOSPI30_SWING_ANCHOR_MISMATCHES=0$' /tmp/v859_build.txt
          grep -q '^GLOSSARY_TERMS=5$' /tmp/v859_build.txt
          grep -q '^GLOSSARY_FUTURE_TABLE_DISPLAY_REQUIRED=true$' /tmp/v859_build.txt
          grep -q '^CONFIRMED_SWING_LOW_STOP_CALCULATED=false$' /tmp/v859_build.txt
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v859_build.txt

          cat /tmp/v859_build.txt

      - name: Validate V8.5.9 source-only contract
        shell: bash
        run: |
          set -euo pipefail

          python swing_anchor_source_v859.py --validate-only \
            | tee /tmp/v859_validate.txt

          grep -q '^V859_VALIDATION=PASS$' /tmp/v859_validate.txt
          grep -q '^GLOSSARY_TERMS=5$' /tmp/v859_validate.txt
          grep -q '^CONFIRMED_SWING_LOW_STOP_EMPTY_ALL=PASS$' /tmp/v859_validate.txt
          grep -q '^KOSPI30_SWING_ANCHOR_EXACT_MATCHES=30$' /tmp/v859_validate.txt
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v859_validate.txt

          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          meta = json.loads(
              Path("latest/swing_anchor_source_meta_latest.json")
              .read_text(encoding="utf-8")
          )
          glossary = json.loads(
              Path("latest/stock_table_metric_glossary_latest.json")
              .read_text(encoding="utf-8")
          )

          with Path("latest/swing_anchor_source_latest.csv").open(
              encoding="utf-8-sig", newline=""
          ) as f:
              rows = list(csv.DictReader(f))

          if meta.get("status") != "READY":
              raise SystemExit("meta status not READY")
          if meta.get("source_only") is not True:
              raise SystemExit("source-only guard failed")
          if meta.get("metric_formula_changed") is not False:
              raise SystemExit("metric formula guard failed")
          if len(glossary.get("terms") or {}) != 5:
              raise SystemExit("glossary term count != 5")
          if not glossary.get("compact_footer_text"):
              raise SystemExit("glossary compact footer missing")
          if any(str(r.get("confirmed_swing_low_stop") or "").strip() for r in rows):
              raise SystemExit("confirmed swing-low stop unexpectedly populated")

          print("V859_PERSISTED_CONTRACT_GUARD=PASS")
          print(f"ROWS={len(rows)}")
          print("TABLE_FOOTNOTE_GLOSSARY_READY=PASS")
          PY

      - name: Commit V8.5.9 non-workflow files only
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            swing_anchor_source_v859.py \
            docs/swing_anchor_source_contract_v859.md \
            latest/swing_anchor_source_latest.csv \
            latest/swing_anchor_source_meta_latest.json \
            latest/stock_table_metric_glossary_latest.json \
            latest/swing_anchor_source_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"

          if printf '%s\n' "${STAGED}" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file was staged unexpectedly"
            exit 1
          fi

          if [ -n "${STAGED}" ]; then
            while IFS= read -r p; do
              case "${p}" in
                swing_anchor_source_v859.py|\
                docs/swing_anchor_source_contract_v859.md|\
                latest/swing_anchor_source_latest.csv|\
                latest/swing_anchor_source_meta_latest.json|\
                latest/stock_table_metric_glossary_latest.json|\
                latest/swing_anchor_source_run_log_latest.txt)
                  ;;
                *)
                  echo "::error::Unexpected staged path: ${p}"
                  exit 1
                  ;;
              esac
            done <<< "${STAGED}"
          fi

          echo "WORKFLOW_FILES_STAGED=false"

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            echo "V859_SWING_ANCHOR_SOURCE_RELEASE=PASS"
            exit 0
          fi

          git commit -m "Add V8.5.9 swing anchor source and glossary"

          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V859_SWING_ANCHOR_SOURCE_RELEASE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "CONFIRMED_SWING_LOW_STOP_CALCULATED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          echo "----- V8.5.9 build -----"
          test -f /tmp/v859_build.txt && cat /tmp/v859_build.txt || true
          echo "----- V8.5.9 validation -----"
          test -f /tmp/v859_validate.txt && cat /tmp/v859_validate.txt || true
          git status --short || true
