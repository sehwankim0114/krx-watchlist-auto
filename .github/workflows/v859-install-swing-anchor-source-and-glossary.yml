name: Install swing-anchor source and glossary v8.5.9

on:
  workflow_dispatch:

  workflow_run:
    workflows:
      - Build API JSON
    types:
      - completed
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: v859-swing-source-v870-safe
  cancel-in-progress: false

jobs:
  install:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install "pykrx==1.2.8"

      - name: Ensure canonical V8.7 metric glossary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("latest/stock_table_metric_glossary_latest.json")
          if not path.exists():
              raise SystemExit("V870_GLOSSARY_MISSING")

          data = json.loads(path.read_text(encoding="utf-8-sig"))
          terms = data.get("terms")
          if not isinstance(terms, dict):
              raise SystemExit("V870_GLOSSARY_TERMS_NOT_OBJECT")

          base = {"swing", "ma", "atr14", "rs_kospi", "streak"}
          full = base | {"rs_sector"}
          actual = set(terms)

          if actual == base:
              terms["rs_sector"] = {
                  "label": "업종RS 1M/3M",
                  "short": "같은 기간 공식 KRX 업종지수 대비 상대수익률 차이(%p)",
                  "detail": (
                      "종목 수익률에서 같은 기간 공식 KRX 업종지수 수익률을 뺀 값이다. "
                      "양수면 해당 업종지수보다 강했고 음수면 약했다는 뜻이다. "
                      "KOSPI 대비 RS와는 별도 지표다."
                  ),
              }
          elif actual != full:
              raise SystemExit(
                  "V870_GLOSSARY_UNEXPECTED_TERMS:"
                  + ",".join(sorted(actual))
              )

          data["version"] = "2026-09-12-v8.7.0-sector-rs-glossary"
          policy = data.setdefault("display_policy", {})
          policy["attach_to_stock_tables"] = True

          footer = str(data.get("compact_footer_text") or "").strip()
          sector_text = "업종RS=공식 KRX 업종지수 대비 상대수익률 차이(%p)"
          if sector_text not in footer:
              footer = (footer.rstrip(" ·") + " · " + sector_text).strip(" ·")
          data["compact_footer_text"] = footer

          if set(data["terms"]) != full:
              raise SystemExit("V870_GLOSSARY_REPAIR_FAILED")
          if len(footer) > 850:
              raise SystemExit("V870_GLOSSARY_FOOTER_TOO_LONG")

          path.write_text(
              json.dumps(data, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          print("V870_GLOSSARY_REPAIR=PASS")
          print("GLOSSARY_TERMS=6")
          print("RS_SECTOR_GLOSSARY=READY")
          print("GLOSSARY_VERSION=" + data["version"])
          PY

      - name: Rebuild current V8.7 production API on manual dispatch
        if: github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile \
            sync_official_status.py \
            render_data_freshness_notice.py \
            build_api_json.py \
            validate_api_sync.py \
            stock_table_metrics_v850.py \
            build_stock_table_preview_v850.py \
            build_two_table_shadow_v851.py \
            sector_rs_source_v870.py \
            two_table_release_v870.py

          python sync_official_status.py --output-dir latest
          python render_data_freshness_notice.py --output-dir latest --mode official

          python build_api_json.py
          python validate_api_sync.py --api-dir api
          python two_table_release_v870.py --repo . --check-only

          python - <<'PY'
          import json
          from pathlib import Path

          status = json.loads(Path("api/status.json").read_text(encoding="utf-8"))
          validation = json.loads(
              Path("api/validation_report.json").read_text(encoding="utf-8")
          )
          manifest = json.loads(
              Path("api/two_table_v1/manifest.json").read_text(encoding="utf-8")
          )
          glossary = json.loads(
              Path("latest/stock_table_metric_glossary_latest.json").read_text(
                  encoding="utf-8"
              )
          )

          if status.get("status") != "READY":
              raise SystemExit("API_STATUS_NOT_READY")
          if status.get("api_sync_ok") is not True:
              raise SystemExit("API_SYNC_NOT_OK")
          if status.get("official_fresh_now") is not True:
              raise SystemExit("OFFICIAL_NOT_FRESH")
          if status.get("safe_to_analyze_as_latest") is not True:
              raise SystemExit("SAFE_TO_ANALYZE_FALSE")
          if status.get("confirmed_basis_date") != "2026-09-15":
              raise SystemExit(
                  "UNEXPECTED_BASIS_DATE:"
                  + str(status.get("confirmed_basis_date"))
              )
          if validation.get("status") != "PASS":
              raise SystemExit("API_VALIDATION_NOT_PASS")
          if manifest.get("release_stage") != "PRODUCTION":
              raise SystemExit("RELEASE_STAGE_NOT_PRODUCTION")
          if manifest.get("production_activation_allowed") is not True:
              raise SystemExit("PRODUCTION_NOT_ACTIVATED")
          if manifest.get("custom_gpt_route_enabled") is not True:
              raise SystemExit("CUSTOM_GPT_ROUTE_NOT_ENABLED")
          if manifest.get("safe_to_analyze_as_latest") is not True:
              raise SystemExit("MANIFEST_SAFE_TO_ANALYZE_FALSE")
          if set(glossary.get("terms") or {}) != {
              "swing", "ma", "atr14", "rs_kospi", "rs_sector", "streak"
          }:
              raise SystemExit("GLOSSARY_NOT_V870")

          sector = manifest.get("sector_rs_source") or {}
          if sector.get("rs_values_ready") != sector.get("rs_values_expected"):
              raise SystemExit("SECTOR_RS_COVERAGE_INCOMPLETE")

          tables = manifest.get("tables") or {}
          kospi = tables.get("kospi") or {}
          if kospi.get("row_count") != 30:
              raise SystemExit("KOSPI_ROW_COUNT_NOT_30")

          print("V870_PRODUCTION_RECOVERY=PASS")
          print("API_BUILD_ID=" + str(status.get("build_id")))
          print("BASIS_DATE=" + str(status.get("confirmed_basis_date")))
          print("API_STATUS=READY")
          print("API_VALIDATION_STATUS=PASS")
          print("PRODUCTION_ACTIVATION_ALLOWED=true")
          print("CUSTOM_GPT_ROUTE_ENABLED=true")
          print("SAFE_TO_ANALYZE_AS_LATEST=true")
          print("KOSPI_ROWS=30")
          print(
              "RS_SECTOR_VALUES="
              + str(sector.get("rs_values_ready"))
              + "/"
              + str(sector.get("rs_values_expected"))
          )
          PY

      - name: Refresh V8.5.9 swing evidence without publishing its old glossary
        shell: bash
        run: |
          set -euo pipefail

          python -m py_compile swing_anchor_source_v859.py

          SHOULD_RUN="$(
            python - <<'PY'
          import json
          from pathlib import Path

          cache_path = Path("latest/active_stock_long_history_260d_meta_latest.json")
          api_path = Path("api/two_table_v1/kospi.json")

          if not cache_path.exists() or not api_path.exists():
              print("false")
              raise SystemExit(0)

          cache = json.loads(cache_path.read_text(encoding="utf-8-sig"))
          api = json.loads(api_path.read_text(encoding="utf-8-sig"))
          cache_basis = str(
              cache.get("cache_max_date")
              or cache.get("source_max_date")
              or ""
          )
          api_basis = str(api.get("basis_date") or "")

          print("true" if cache_basis and cache_basis == api_basis else "false")
          PY
          )"

          echo "V859_SOURCE_REFRESH_ELIGIBLE=$SHOULD_RUN"

          if [ "$SHOULD_RUN" != "true" ]; then
            echo "V859_SOURCE_REFRESH=SKIPPED_BASIS_NOT_ALIGNED"
            exit 0
          fi

          cp latest/stock_table_metric_glossary_latest.json \
            /tmp/v870_metric_glossary_backup.json

          restore_glossary() {
            cp /tmp/v870_metric_glossary_backup.json \
              latest/stock_table_metric_glossary_latest.json
          }
          trap restore_glossary EXIT

          set +e
          python swing_anchor_source_v859.py --self-test \
            | tee /tmp/v859_self_test.txt
          SELF_RC=${PIPESTATUS[0]}

          BUILD_RC=0
          VALIDATE_RC=0
          if [ "$SELF_RC" -eq 0 ]; then
            python swing_anchor_source_v859.py \
              | tee /tmp/v859_build.txt
            BUILD_RC=${PIPESTATUS[0]}
          fi

          if [ "$SELF_RC" -eq 0 ] && [ "$BUILD_RC" -eq 0 ]; then
            python swing_anchor_source_v859.py --validate-only \
              | tee /tmp/v859_validate.txt
            VALIDATE_RC=${PIPESTATUS[0]}
          fi
          set -e

          restore_glossary
          trap - EXIT

          if [ "$SELF_RC" -ne 0 ] || [ "$BUILD_RC" -ne 0 ] || [ "$VALIDATE_RC" -ne 0 ]; then
            echo "::warning::V8.5.9 swing evidence refresh failed; V8.7 production remains authoritative."
            echo "V859_SOURCE_REFRESH=NONBLOCKING_FAILURE"
            exit 0
          fi

          grep -q '^SELF_TEST=PASS$' /tmp/v859_self_test.txt
          grep -q '^V859_SWING_ANCHOR_SOURCE_STATUS=READY$' /tmp/v859_build.txt
          grep -q '^KOSPI30_SWING_ANCHOR_EXACT_MATCHES=30$' /tmp/v859_build.txt
          grep -q '^KOSPI30_SWING_ANCHOR_MISMATCHES=0$' /tmp/v859_build.txt
          grep -q '^V859_VALIDATION=PASS$' /tmp/v859_validate.txt

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("latest/stock_table_metric_glossary_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          expected = {"swing", "ma", "atr14", "rs_kospi", "rs_sector", "streak"}
          if set(data.get("terms") or {}) != expected:
              raise SystemExit("V859_GLOSSARY_ISOLATION_FAILED")
          print("V859_GLOSSARY_ISOLATION=PASS")
          print("V859_SOURCE_REFRESH=PASS")
          PY

      - name: Final V8.7 contract check
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from pathlib import Path

          glossary = json.loads(
              Path("latest/stock_table_metric_glossary_latest.json").read_text(
                  encoding="utf-8"
              )
          )
          expected = {"swing", "ma", "atr14", "rs_kospi", "rs_sector", "streak"}
          if set(glossary.get("terms") or {}) != expected:
              raise SystemExit("FINAL_GLOSSARY_CONTRACT_FAILED")

          print("FINAL_GLOSSARY_TERMS=6")
          print("FINAL_RS_SECTOR_GLOSSARY=READY")
          print("V859_V870_COMPATIBILITY=PASS")
          PY

      - name: Commit protected outputs
        shell: bash
        run: |
          set -euo pipefail

          find . -type d -name __pycache__ -prune -exec rm -rf {} +
          find . -type f \( -name "*.pyc" -o -name "*.pyo" \) -delete

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add -A api latest

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
          else
            git commit -m "Keep V8.5.9 swing evidence compatible with V8.7 production"
          fi

          git fetch origin main

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
          else
            echo "REMOTE_MAIN_CHANGED=false"
          fi

          git push origin HEAD:main

          echo "FINAL_COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V859_V870_PERMANENT_GUARD=PASS"
