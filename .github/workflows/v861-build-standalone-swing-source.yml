name: Build standalone swing source v8.6.1

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  build-source:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TZ: Asia/Seoul

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture source commit
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          echo "BASE_SHA=$(git rev-parse HEAD)"

      - name: Restore V8.6.1 builder and contract
        shell: bash
        env:
          BUILDER_B64: ""
          CONTRACT_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64
          import os
          from pathlib import Path

          Path("standalone_swing_source_v861.py").write_bytes(
              base64.b64decode(os.environ["BUILDER_B64"])
          )
          Path("docs/standalone_swing_source_contract_v861.md").write_bytes(
              base64.b64decode(os.environ["CONTRACT_B64"])
          )
          PY

          python -m py_compile standalone_swing_source_v861.py
          echo "V861_SOURCE_FILES_RESTORED=PASS"

      - name: Build source-only standalone swing cache
        shell: bash
        run: |
          set -euo pipefail
          python standalone_swing_source_v861.py | tee /tmp/v861-build.log

          grep -q '^V861_STANDALONE_SWING_SOURCE_STATUS=READY_SOURCE_ONLY$' /tmp/v861-build.log
          grep -q '^KOSPI30_EXACT_MATCHES=30$' /tmp/v861-build.log
          grep -q '^KOSPI30_MISMATCHES=0$' /tmp/v861-build.log
          grep -q '^SECTOR_RS_CALCULATED=false$' /tmp/v861-build.log
          grep -q '^CONFIRMED_SWING_LOW_STOP_CALCULATED=false$' /tmp/v861-build.log
          grep -q '^STANDALONE_SWING_TABLE_ENABLED=false$' /tmp/v861-build.log
          grep -q '^METRIC_FORMULA_CHANGED=false$' /tmp/v861-build.log
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v861-build.log
          grep -q '^V861_STANDALONE_SWING_SOURCE_VALIDATION=PASS$' /tmp/v861-build.log

      - name: Validate source cache contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/v861-validate.log
          import csv
          import json
          from pathlib import Path

          meta = json.loads(Path("latest/standalone_swing_source_meta_latest.json").read_text(encoding="utf-8"))
          payload = json.loads(Path("latest/standalone_swing_source_latest.json").read_text(encoding="utf-8"))
          with Path("latest/standalone_swing_source_latest.csv").open(encoding="utf-8-sig", newline="") as f:
              csv_rows = list(csv.DictReader(f))

          assert meta["status"] == "READY_SOURCE_ONLY"
          assert payload["status"] == "READY_SOURCE_ONLY"
          assert meta["source_only"] is True and payload["source_only"] is True
          assert meta["standalone_swing_table_enabled"] is False
          assert payload["standalone_swing_table_enabled"] is False
          assert meta["request_time_price_eligible"] is False
          assert payload["request_time_price_eligible"] is False
          assert meta["output_rows"] == payload["row_count"] == len(payload["rows"]) == len(csv_rows)
          assert meta["history_target_ticker_count"] == payload["row_count"]
          assert meta["kospi30_exact_matches"] == 30
          assert meta["kospi30_mismatches"] == 0

          required_pending = {
              "rsi", "macd", "return_1w", "return_6m", "return_ytd", "return_52w",
              "rs_sector", "confirmed_swing_low_stop", "investment_score_100",
              "earnings_outlook_change",
          }
          assert set(payload["pending_metrics"]) == required_pending

          for row in payload["rows"]:
              assert set(row["pending_metrics"]) == required_pending
              assert all(value is None for value in row["pending_metrics"].values())
              tr = row.get("trailing_reference") or {}
              assert tr.get("confirmed_swing_low_stop") is None
              if tr:
                  assert tr.get("status") == "REFERENCE_ONLY_NOT_ORDER"

          safety = payload["safety"]
          assert safety == {
              "metric_formula_changed": False,
              "sector_rs_calculated": False,
              "confirmed_swing_low_stop_calculated": False,
              "investment_score_100_calculated": False,
              "earnings_outlook_change_calculated": False,
              "rsi_calculated": False,
              "macd_calculated": False,
              "request_time_price_substitution": False,
          }

          print("V861_OUTPUT_ROWS=" + str(payload["row_count"]))
          print("V861_METRIC_OK_ROWS=" + str(meta["metric_ok_rows"]))
          print("V861_KOSPI30_REGRESSION=30/30")
          print("V861_PENDING_FIELDS_NULL=PASS")
          print("V861_SOURCE_ONLY_CONTRACT=PASS")
          PY

          grep -q '^V861_KOSPI30_REGRESSION=30/30$' /tmp/v861-validate.log
          grep -q '^V861_PENDING_FIELDS_NULL=PASS$' /tmp/v861-validate.log
          grep -q '^V861_SOURCE_ONLY_CONTRACT=PASS$' /tmp/v861-validate.log

      - name: Verify production files unchanged
        shell: bash
        run: |
          set -euo pipefail
          git diff -- api/two_table_v1 stock_table_metrics_v850.py worker/krx-live-price-worker.js
          if ! git diff --quiet -- api/two_table_v1 stock_table_metrics_v850.py worker/krx-live-price-worker.js; then
            echo "::error::Production table, metric formula, or Worker changed unexpectedly"
            exit 1
          fi
          echo "PRODUCTION_TWO_TABLE_FILES_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"

      - name: Commit V8.6.1 source cache
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::Remote main changed after checkout. Rerun V8.6.1 from latest main."
            echo "BASE_SHA=$BASE_SHA"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            standalone_swing_source_v861.py \
            docs/standalone_swing_source_contract_v861.md \
            latest/standalone_swing_source_latest.json \
            latest/standalone_swing_source_latest.csv \
            latest/standalone_swing_source_meta_latest.json \
            latest/standalone_swing_source_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"
          echo "V861_STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "V861_STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file staged unexpectedly"
            exit 1
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              standalone_swing_source_v861.py|\
              docs/standalone_swing_source_contract_v861.md|\
              latest/standalone_swing_source_latest.json|\
              latest/standalone_swing_source_latest.csv|\
              latest/standalone_swing_source_meta_latest.json|\
              latest/standalone_swing_source_run_log_latest.txt)
                ;;
              *)
                echo "::error::Unexpected staged path: $p"
                exit 1
                ;;
            esac
          done <<< "$STAGED"

          echo "WORKFLOW_FILES_STAGED=false"

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
          else
            git commit -m "Add V8.6.1 standalone swing source cache"
          fi

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            git push origin HEAD:main
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V861_STANDALONE_SWING_SOURCE_RELEASE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "SECTOR_RS_CALCULATED=false"
          echo "CONFIRMED_SWING_LOW_STOP_CALCULATED=false"
          echo "INVESTMENT_SCORE_100_CALCULATED=false"
          echo "EARNINGS_OUTLOOK_CHANGE_CALCULATED=false"
          echo "RSI_CALCULATED=false"
          echo "MACD_CALCULATED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          echo "----- V8.6.1 build -----"
          test -f /tmp/v861-build.log && cat /tmp/v861-build.log || true
          echo "----- V8.6.1 validation -----"
          test -f /tmp/v861-validate.log && cat /tmp/v861-validate.log || true
          git status --short || true
