name: Compare standalone swing return bases v8.7.14

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8714-standalone-swing-return-basis-evidence
  cancel-in-progress: false

jobs:
  compare:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Compare 1W YTD 52W basis candidates
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import math
          import statistics
          from collections import defaultdict
          from datetime import date, timedelta
          from pathlib import Path

          HISTORY = Path("latest/active_stock_long_history_260d_latest.csv")
          HISTORY_META = Path("latest/active_stock_long_history_260d_meta_latest.json")
          EXTENDED = Path("latest/standalone_swing_extended_returns_latest.json")
          DISPLAY = Path("latest/standalone_swing_display_merge_readiness_latest.json")
          OUT = Path("/tmp/v8714_return_basis_evidence")
          OUT.mkdir(parents=True, exist_ok=True)

          for p in (HISTORY, HISTORY_META, EXTENDED, DISPLAY):
              if not p.is_file():
                  raise SystemExit("MISSING_REQUIRED_SOURCE:" + str(p))

          def read_json(p):
              return json.loads(p.read_text(encoding="utf-8-sig"))

          def fnum(v):
              try:
                  x = float(str(v).replace(",", ""))
                  if math.isfinite(x) and x > 0:
                      return x
              except Exception:
                  pass
              return None

          history_meta = read_json(HISTORY_META)
          extended = read_json(EXTENDED)
          display = read_json(DISPLAY)

          if history_meta.get("status") != "READY":
              raise SystemExit("HISTORY_META_NOT_READY")
          if extended.get("status") != "READY_SOURCE_ONLY":
              raise SystemExit("EXTENDED_RETURNS_NOT_READY")
          if display.get("status") != "FROZEN_PREPRODUCTION_READY":
              raise SystemExit("DISPLAY_MERGE_NOT_FROZEN")
          if display.get("production_activation_allowed") is not False:
              raise SystemExit("PRODUCTION_ALREADY_ALLOWED")

          basis_s = extended.get("basis_date")
          if not basis_s or history_meta.get("cache_max_date") != basis_s:
              raise SystemExit("BASIS_DATE_MISMATCH")
          if display.get("basis_date") != basis_s:
              raise SystemExit("DISPLAY_BASIS_DATE_MISMATCH")

          basis = date.fromisoformat(basis_s)

          rb = extended.get("return_basis") or {}
          if rb.get("6m") != "CALENDAR_MONTHS_FIRST_MARKET_SESSION_ON_OR_AFTER":
              raise SystemExit("EXISTING_6M_CONTRACT_MISMATCH")
          if any(rb.get(k) is not None for k in ("1w", "ytd", "52w")):
              raise SystemExit("UNAPPROVED_RETURN_BASIS_ALREADY_SET")

          with HISTORY.open(encoding="utf-8-sig", newline="") as f:
              raw_rows = list(csv.DictReader(f))

          by_ticker = defaultdict(list)
          name_by_ticker = {}
          market_by_ticker = {}

          for r in raw_rows:
              ticker = str(r.get("ticker") or "").zfill(6)
              ds = str(r.get("date") or "")
              close = fnum(r.get("close"))
              if not ticker.isdigit() or len(ticker) != 6 or not ds or close is None:
                  continue
              try:
                  d = date.fromisoformat(ds)
              except Exception:
                  continue
              if d > basis:
                  continue
              by_ticker[ticker].append((d, close))
              if r.get("name"):
                  name_by_ticker[ticker] = r.get("name")
              if r.get("market"):
                  market_by_ticker[ticker] = r.get("market")

          for t in by_ticker:
              dedup = {}
              for d, c in by_ticker[t]:
                  dedup[d] = c
              by_ticker[t] = sorted(dedup.items())

          target_tickers = [str(x).zfill(6) for x in (history_meta.get("target_tickers") or [])]
          if len(target_tickers) != 235:
              raise SystemExit("TARGET_TICKER_COUNT_MISMATCH")
          if set(target_tickers) != set(by_ticker):
              missing = sorted(set(target_tickers) - set(by_ticker))
              extra = sorted(set(by_ticker) - set(target_tickers))
              raise SystemExit(
                  "HISTORY_TICKER_SET_MISMATCH:"
                  + json.dumps({"missing": missing[:10], "extra": extra[:10]}, ensure_ascii=False)
              )

          all_dates = sorted({d for bars in by_ticker.values() for d, _ in bars})
          first_session_current_year = min(d for d in all_dates if d.year == basis.year)
          last_session_prior_year = max(d for d in all_dates if d.year < basis.year)

          calendar_1w_target = basis - timedelta(days=7)
          calendar_52w_target = basis - timedelta(weeks=52)

          def close_on_or_after(bars, target):
              for d, c in bars:
                  if d >= target:
                      return d, c
              return None

          def close_exact(bars, target):
              for d, c in bars:
                  if d == target:
                      return d, c
              return None

          def close_n_sessions_before_basis(bars, n):
              eligible = [(d, c) for d, c in bars if d <= basis]
              if len(eligible) < n + 1 or eligible[-1][0] != basis:
                  return None
              return eligible[-(n + 1)]

          def ret(start, end_close):
              if start is None or end_close is None:
                  return None
              _, c = start
              if c <= 0:
                  return None
              return 100.0 * (end_close / c - 1.0)

          rows = []
          counts = {
              "total": len(target_tickers),
              "1w_calendar_ready": 0,
              "1w_5session_ready": 0,
              "1w_both_ready": 0,
              "1w_same_start_date": 0,
              "1w_same_return": 0,
              "ytd_first_session_ready": 0,
              "ytd_prior_year_close_ready": 0,
              "ytd_both_ready": 0,
              "ytd_same_start_date": 0,
              "52w_calendar_ready": 0,
              "52w_252session_ready": 0,
              "52w_both_ready": 0,
              "52w_same_start_date": 0,
          }

          diff_1w = []
          diff_ytd = []
          diff_52w = []
          day_gap_ytd = []
          day_gap_52w = []

          for ticker in target_tickers:
              bars = by_ticker[ticker]
              end = close_exact(bars, basis)
              if end is None:
                  raise SystemExit("BASIS_CLOSE_MISSING:" + ticker)
              end_close = end[1]

              s1_cal = close_on_or_after(bars, calendar_1w_target)
              s1_5 = close_n_sessions_before_basis(bars, 5)
              r1_cal = ret(s1_cal, end_close)
              r1_5 = ret(s1_5, end_close)
              if r1_cal is not None:
                  counts["1w_calendar_ready"] += 1
              if r1_5 is not None:
                  counts["1w_5session_ready"] += 1
              if r1_cal is not None and r1_5 is not None:
                  counts["1w_both_ready"] += 1
                  if s1_cal[0] == s1_5[0]:
                      counts["1w_same_start_date"] += 1
                  d = abs(r1_cal - r1_5)
                  diff_1w.append(d)
                  if d < 1e-12:
                      counts["1w_same_return"] += 1

              sy_first = close_exact(bars, first_session_current_year)
              sy_prev = close_exact(bars, last_session_prior_year)
              ry_first = ret(sy_first, end_close)
              ry_prev = ret(sy_prev, end_close)
              if ry_first is not None:
                  counts["ytd_first_session_ready"] += 1
              if ry_prev is not None:
                  counts["ytd_prior_year_close_ready"] += 1
              if ry_first is not None and ry_prev is not None:
                  counts["ytd_both_ready"] += 1
                  if sy_first[0] == sy_prev[0]:
                      counts["ytd_same_start_date"] += 1
                  diff_ytd.append(abs(ry_first - ry_prev))
                  day_gap_ytd.append((sy_first[0] - sy_prev[0]).days)

              s52_cal = close_on_or_after(bars, calendar_52w_target)
              s52_252 = close_n_sessions_before_basis(bars, 252)
              r52_cal = ret(s52_cal, end_close)
              r52_252 = ret(s52_252, end_close)
              if r52_cal is not None:
                  counts["52w_calendar_ready"] += 1
              if r52_252 is not None:
                  counts["52w_252session_ready"] += 1
              if r52_cal is not None and r52_252 is not None:
                  counts["52w_both_ready"] += 1
                  if s52_cal[0] == s52_252[0]:
                      counts["52w_same_start_date"] += 1
                  diff_52w.append(abs(r52_cal - r52_252))
                  day_gap_52w.append(abs((s52_cal[0] - s52_252[0]).days))

              rows.append({
                  "ticker": ticker,
                  "name": name_by_ticker.get(ticker),
                  "market": market_by_ticker.get(ticker),
                  "basis_date": basis_s,
                  "one_week": {
                      "calendar_7d_first_session_on_or_after": {
                          "start_date": s1_cal[0].isoformat() if s1_cal else None,
                          "pct": round(r1_cal, 4) if r1_cal is not None else None,
                      },
                      "five_prior_market_sessions": {
                          "start_date": s1_5[0].isoformat() if s1_5 else None,
                          "pct": round(r1_5, 4) if r1_5 is not None else None,
                      },
                  },
                  "ytd": {
                      "first_market_session_current_year": {
                          "start_date": sy_first[0].isoformat() if sy_first else None,
                          "pct": round(ry_first, 4) if ry_first is not None else None,
                      },
                      "last_market_session_prior_year": {
                          "start_date": sy_prev[0].isoformat() if sy_prev else None,
                          "pct": round(ry_prev, 4) if ry_prev is not None else None,
                      },
                  },
                  "fifty_two_week": {
                      "calendar_52w_first_session_on_or_after": {
                          "target_date": calendar_52w_target.isoformat(),
                          "start_date": s52_cal[0].isoformat() if s52_cal else None,
                          "pct": round(r52_cal, 4) if r52_cal is not None else None,
                      },
                      "252_prior_market_sessions": {
                          "start_date": s52_252[0].isoformat() if s52_252 else None,
                          "pct": round(r52_252, 4) if r52_252 is not None else None,
                      },
                  },
              })

          def stats(values):
              if not values:
                  return {"count": 0, "mean_abs_pp": None, "median_abs_pp": None, "max_abs_pp": None}
              return {
                  "count": len(values),
                  "mean_abs_pp": round(statistics.mean(values), 4),
                  "median_abs_pp": round(statistics.median(values), 4),
                  "max_abs_pp": round(max(values), 4),
              }

          result = {
              "version": "2026-09-13-v8.7.14-standalone-swing-return-basis-evidence",
              "status": "READY_EVIDENCE_ONLY",
              "repository_write": False,
              "production_change": False,
              "worker_change": False,
              "metric_formula_selected": False,
              "basis_date": basis_s,
              "source_row_count": len(target_tickers),
              "existing_approved_contract": {
                  "6m": "CALENDAR_MONTHS_FIRST_MARKET_SESSION_ON_OR_AFTER",
                  "1w": None,
                  "ytd": None,
                  "52w": None,
              },
              "candidate_definitions": {
                  "1w": {
                      "A": "CALENDAR_7D_FIRST_MARKET_SESSION_ON_OR_AFTER",
                      "B": "FIVE_PRIOR_MARKET_SESSIONS",
                  },
                  "ytd": {
                      "A": "FIRST_OFFICIAL_MARKET_SESSION_OF_CURRENT_CALENDAR_YEAR",
                      "B": "LAST_OFFICIAL_MARKET_SESSION_OF_PRIOR_CALENDAR_YEAR",
                      "global_current_year_first_session": first_session_current_year.isoformat(),
                      "global_prior_year_last_session": last_session_prior_year.isoformat(),
                  },
                  "52w": {
                      "A": "CALENDAR_52_WEEKS_FIRST_MARKET_SESSION_ON_OR_AFTER",
                      "B": "252_PRIOR_MARKET_SESSIONS",
                      "calendar_target_date": calendar_52w_target.isoformat(),
                  },
              },
              "counts": counts,
              "difference_stats": {
                  "1w_abs_return_difference_pp": stats(diff_1w),
                  "ytd_abs_return_difference_pp": stats(diff_ytd),
                  "52w_abs_return_difference_pp": stats(diff_52w),
                  "ytd_start_calendar_day_gap": {
                      "count": len(day_gap_ytd),
                      "min": min(day_gap_ytd) if day_gap_ytd else None,
                      "max": max(day_gap_ytd) if day_gap_ytd else None,
                  },
                  "52w_start_calendar_day_gap_abs": {
                      "count": len(day_gap_52w),
                      "min": min(day_gap_52w) if day_gap_52w else None,
                      "median": statistics.median(day_gap_52w) if day_gap_52w else None,
                      "max": max(day_gap_52w) if day_gap_52w else None,
                  },
              },
              "decision_notes": {
                  "1w": "Evidence only; no selection in V8.7.14.",
                  "ytd": "Evidence only; no selection in V8.7.14.",
                  "52w": "Evidence only; no selection in V8.7.14.",
                  "consistency_observation": (
                      "Approved 1M/3M/6M use calendar-period targets resolved to the "
                      "first market session on/after the target date. Observation only."
                  ),
              },
              "rows": rows,
              "safety": {
                  "return_1w_written_to_source": False,
                  "return_ytd_written_to_source": False,
                  "return_52w_written_to_source": False,
                  "integrated_source_changed": False,
                  "production_changed": False,
                  "worker_changed": False,
                  "standalone_command_defined": False,
                  "standalone_route_enabled": False,
                  "final_header_selected": False,
              },
          }

          (OUT / "standalone-swing-return-basis-evidence-v8714.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          s1 = stats(diff_1w)
          sy = stats(diff_ytd)
          s52 = stats(diff_52w)

          md = [
              "# V8.7.14 독립 스윙 1W·YTD·52W 기준 비교",
              "",
              f"- 기준일: {basis_s}",
              f"- 전체 종목: {len(target_tickers)}",
              f"- 기존 승인 6M: {rb.get('6m')}",
              "- 이번 단계는 비교 증거만 생성하며 1W·YTD·52W 공식을 선택하지 않음",
              "",
              "## 1W",
              f"- A 캘린더 7일: 준비 {counts['1w_calendar_ready']}/{len(target_tickers)}",
              f"- B 5거래세션: 준비 {counts['1w_5session_ready']}/{len(target_tickers)}",
              f"- 둘 다 준비: {counts['1w_both_ready']}",
              f"- 시작일 동일: {counts['1w_same_start_date']}",
              f"- 수익률 동일: {counts['1w_same_return']}",
              f"- 평균 절대차: {s1['mean_abs_pp']}%p",
              "",
              "## YTD",
              f"- A 올해 첫 공식 거래일({first_session_current_year}): 준비 {counts['ytd_first_session_ready']}/{len(target_tickers)}",
              f"- B 전년 마지막 공식 거래일({last_session_prior_year}): 준비 {counts['ytd_prior_year_close_ready']}/{len(target_tickers)}",
              f"- 둘 다 준비: {counts['ytd_both_ready']}",
              f"- 평균 절대차: {sy['mean_abs_pp']}%p",
              f"- 최대 절대차: {sy['max_abs_pp']}%p",
              "",
              "## 52W",
              f"- A 캘린더 52주(target {calendar_52w_target}): 준비 {counts['52w_calendar_ready']}/{len(target_tickers)}",
              f"- B 252거래세션: 준비 {counts['52w_252session_ready']}/{len(target_tickers)}",
              f"- 둘 다 준비: {counts['52w_both_ready']}",
              f"- 시작일 동일: {counts['52w_same_start_date']}",
              f"- 평균 절대차: {s52['mean_abs_pp']}%p",
              f"- 최대 절대차: {s52['max_abs_pp']}%p",
              "",
              "## 해석",
              "- 1W는 현재 기준일에서 두 후보가 같은 거래일을 가리킬 수 있어 현재 결과만으로 계약을 선택하면 안 됨.",
              "- YTD는 올해 첫 종가 기준과 전년 말 종가 기준이라는 의미 차이가 있으므로 명시적 계약이 필요.",
              "- 52W는 캘린더 52주와 252거래세션이 다른 시작일을 가리킬 수 있어 선택에 따라 수익률이 달라짐.",
              "- 기존 1M·3M·6M의 캘린더 기간 방식과의 일관성은 관찰사항일 뿐, 이번 단계에서는 새 공식을 승인하지 않음.",
          ]

          (OUT / "standalone-swing-return-basis-evidence-v8714.md").write_text(
              "\n".join(md) + "\n",
              encoding="utf-8",
          )

          print("V8714_RETURN_BASIS_EVIDENCE=READY_EVIDENCE_ONLY")
          print("BASIS_DATE=" + basis_s)
          print("SOURCE_ROWS=" + str(len(target_tickers)))
          print("ONE_WEEK_CALENDAR_READY=" + str(counts["1w_calendar_ready"]))
          print("ONE_WEEK_5SESSION_READY=" + str(counts["1w_5session_ready"]))
          print("ONE_WEEK_BOTH_READY=" + str(counts["1w_both_ready"]))
          print("ONE_WEEK_SAME_START_DATE=" + str(counts["1w_same_start_date"]))
          print("ONE_WEEK_SAME_RETURN=" + str(counts["1w_same_return"]))
          print("YTD_FIRST_SESSION_READY=" + str(counts["ytd_first_session_ready"]))
          print("YTD_PRIOR_YEAR_CLOSE_READY=" + str(counts["ytd_prior_year_close_ready"]))
          print("YTD_BOTH_READY=" + str(counts["ytd_both_ready"]))
          print("FIFTY2W_CALENDAR_READY=" + str(counts["52w_calendar_ready"]))
          print("FIFTY2W_252SESSION_READY=" + str(counts["52w_252session_ready"]))
          print("FIFTY2W_BOTH_READY=" + str(counts["52w_both_ready"]))
          print("FIFTY2W_SAME_START_DATE=" + str(counts["52w_same_start_date"]))
          print("FORMULA_SELECTED=false")
          print("RETURN_1W_SOURCE_WRITE=false")
          print("RETURN_YTD_SOURCE_WRITE=false")
          print("RETURN_52W_SOURCE_WRITE=false")
          print("PRODUCTION_CHANGE=false")
          print("WORKER_CHANGE=false")
          print("STANDALONE_COMMAND_DEFINED=false")
          print("STANDALONE_ROUTE_ENABLED=false")
          print("FINAL_HEADER_SELECTED=false")
          PY

      - name: Validate evidence-only safety
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("/tmp/v8714_return_basis_evidence/standalone-swing-return-basis-evidence-v8714.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "READY_EVIDENCE_ONLY"
          assert p["repository_write"] is False
          assert p["production_change"] is False
          assert p["worker_change"] is False
          assert p["metric_formula_selected"] is False

          assert p["existing_approved_contract"]["6m"] == "CALENDAR_MONTHS_FIRST_MARKET_SESSION_ON_OR_AFTER"
          assert p["existing_approved_contract"]["1w"] is None
          assert p["existing_approved_contract"]["ytd"] is None
          assert p["existing_approved_contract"]["52w"] is None

          assert p["counts"]["total"] == 235
          assert p["safety"]["return_1w_written_to_source"] is False
          assert p["safety"]["return_ytd_written_to_source"] is False
          assert p["safety"]["return_52w_written_to_source"] is False
          assert p["safety"]["integrated_source_changed"] is False
          assert p["safety"]["production_changed"] is False
          assert p["safety"]["worker_changed"] is False
          assert p["safety"]["standalone_command_defined"] is False
          assert p["safety"]["standalone_route_enabled"] is False
          assert p["safety"]["final_header_selected"] is False

          print("V8714_EXISTING_6M_CONTRACT_PRESERVED=PASS")
          print("V8714_NO_UNAPPROVED_FORMULA_SELECTION=PASS")
          print("V8714_NO_SOURCE_WRITE=PASS")
          print("V8714_READ_ONLY_SAFETY=PASS")
          PY

          git diff --exit-code
          git diff --cached --exit-code

          echo "ORIGINAL_CHECKOUT_UNCHANGED=PASS"
          echo "NO_COMMIT_NO_PUSH_NO_DEPLOY=PASS"

      - name: Upload V8.7.14 return-basis evidence
        uses: actions/upload-artifact@v6
        with:
          name: standalone-swing-return-basis-evidence-v8714
          path: |
            /tmp/v8714_return_basis_evidence/standalone-swing-return-basis-evidence-v8714.json
            /tmp/v8714_return_basis_evidence/standalone-swing-return-basis-evidence-v8714.md
          if-no-files-found: error
          retention-days: 14
