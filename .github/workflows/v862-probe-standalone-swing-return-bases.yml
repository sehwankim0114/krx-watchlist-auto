name: Freeze standalone swing display merge contract v8.7.13

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture base and protected hashes
        shell: bash
        run: |
          set -euo pipefail

          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          sha256sum latest/standalone_swing_integrated_latest.json > /tmp/integrated.sha
          sha256sum latest/standalone_swing_preproduction_readiness_latest.json > /tmp/preprod.sha
          sha256sum api/manifest.json > /tmp/manifest.sha
          sha256sum docs/custom_gpt_action_schema.yaml > /tmp/schema.sha
          sha256sum worker/krx-live-price-worker.js > /tmp/worker.sha
          sha256sum stock_table_metrics_v850.py > /tmp/metrics.sha
          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.sha

          echo "V8713_BASE_SHA=$(git rev-parse HEAD)"

      - name: Restore V8.7.13 builder and contract
        shell: bash
        env:
          BUILDER_B64: ""
          DOC_B64: ""
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64, os
          from pathlib import Path

          Path("standalone_swing_display_merge_freeze_v8713.py").write_bytes(
              base64.b64decode(os.environ["BUILDER_B64"])
          )
          Path("docs/standalone_swing_display_merge_contract_v8713.md").write_bytes(
              base64.b64decode(os.environ["DOC_B64"])
          )
          PY

          python -m py_compile standalone_swing_display_merge_freeze_v8713.py
          echo "V8713_SOURCE_RESTORE=PASS"

      - name: Freeze display merge contract
        shell: bash
        run: |
          set -euo pipefail

          python standalone_swing_display_merge_freeze_v8713.py | tee /tmp/v8713.log

          grep -q '^V8713_DISPLAY_MERGE_FREEZE_STATUS=FROZEN_PREPRODUCTION_READY$' /tmp/v8713.log
          grep -q '^SOURCE_ROWS=235$' /tmp/v8713.log
          grep -q '^RANGE3M_POSITION_READY_CAPACITY=213$' /tmp/v8713.log
          grep -q '^RANGE3M_POSITION_UNAVAILABLE=22$' /tmp/v8713.log
          grep -q '^V8712_DISPLAY_MERGE_EVIDENCE=PASS$' /tmp/v8713.log
          grep -q '^REQUEST_PRICE_OPERATION_ID=getRequestTimePrices$' /tmp/v8713.log
          grep -q '^REQUEST_PRICE_RETRY_POLICY=10-5-2$' /tmp/v8713.log
          grep -q '^REQUEST_TIME_PRICE_OVERLAY_ONLY=true$' /tmp/v8713.log
          grep -q '^STATIC_PRICE_FALLBACK_ALLOWED=false$' /tmp/v8713.log
          grep -q '^POSITION_PCT_CLAMPED=false$' /tmp/v8713.log
          grep -q '^RANGE_UNAVAILABLE_DISPLAY=자료 미제공$' /tmp/v8713.log
          grep -q '^CONFIRMED_METRICS_RECOMPUTED=false$' /tmp/v8713.log
          grep -q '^STATIC_RANGE_POSITION_COPIED=false$' /tmp/v8713.log
          grep -q '^REMAINING_ACTIVATION_BLOCKER_COUNT=8$' /tmp/v8713.log
          grep -q '^FINAL_HEADER_SELECTED=false$' /tmp/v8713.log
          grep -q '^STANDALONE_COMMAND_DEFINED=false$' /tmp/v8713.log
          grep -q '^ACTION_ROUTE_ENABLED=false$' /tmp/v8713.log
          grep -q '^PRODUCTION_ACTIVATION_ALLOWED=false$' /tmp/v8713.log
          grep -q '^V8713_DISPLAY_MERGE_CONTRACT_VALIDATION=PASS$' /tmp/v8713.log

      - name: Validate frozen display merge readiness
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' | tee /tmp/v8713-validate.log
          import json
          from pathlib import Path

          p = json.loads(
              Path("latest/standalone_swing_display_merge_readiness_latest.json")
              .read_text(encoding="utf-8")
          )
          m = json.loads(
              Path("latest/standalone_swing_display_merge_readiness_meta_latest.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "FROZEN_PREPRODUCTION_READY"
          assert m["status"] == "FROZEN_PREPRODUCTION_READY"
          assert p["display_merge_contract_frozen"] is True
          assert p["production_activation_allowed"] is False
          assert p["standalone_swing_table_enabled"] is False
          assert p["action_route_enabled"] is False
          assert p["standalone_command_defined"] is False
          assert p["final_header_selected"] is False
          assert p["final_position_label_selected"] is False
          assert p["recommendation_contract_selected"] is False
          assert p["price_zone_contract_selected"] is False

          cap = p["range3m_position_capacity"]
          assert cap["ready"] == 213
          assert cap["unavailable"] == 22
          assert len(cap["unavailable_rows"]) == 22
          assert all(r["display"] == "자료 미제공" for r in cap["unavailable_rows"])

          c = p["request_time_display_merge_contract"]
          assert c["price_source_operation_id"] == "getRequestTimePrices"
          assert c["retry_policy"] == [10, 5, 2]
          assert c["retry_only_failed"] is True
          assert c["final_failure_display"] == "⚪ 현재가 확인 실패"
          assert c["request_time_price_is_overlay_only"] is True
          assert c["official_close_is_reference_only"] is True
          assert c["static_price_fallback_allowed"] is False
          assert c["position_pct_clamped_to_0_100"] is False
          assert c["position_when_range_unavailable"] is None
          assert c["position_unavailable_display"] == "자료 미제공"
          assert c["static_range_position_copied_as_request_position"] is False
          assert c["confirmed_metrics_recomputed"] is False

          e = p["evidence"]["v8712_request_time_display_merge_preview"]
          assert e["result"] == "PASS"
          assert e["findings"]["quote_success"] == 235
          assert e["findings"]["quote_failed"] == 0
          assert e["findings"]["position_ready"] == 213
          assert e["findings"]["position_unavailable"] == 22
          assert e["findings"]["static_fallback_count"] == 0
          assert e["findings"]["confirmed_metric_mutation_count"] == 0

          assert p["resolved_activation_blocker"] == "REQUEST_TIME_DISPLAY_MERGE_CONTRACT_NOT_FROZEN_FOR_STANDALONE"
          assert len(p["remaining_activation_blockers"]) == 8
          assert m["remaining_activation_blocker_count"] == 8

          s = p["safety"]
          assert all(v is False for v in s.values())

          print("V8713_FROZEN_DISPLAY_MERGE_OBJECT=PASS")
          print("V8713_RANGE_UNAVAILABLE_NULL_POLICY=PASS")
          print("V8713_CONFIRMED_METRICS_IMMUTABLE=PASS")
          print("V8713_NO_PREMATURE_HEADER_COMMAND_ROUTE=PASS")
          print("V8713_SAFETY=PASS")
          PY

      - name: Verify protected sources unchanged
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c /tmp/integrated.sha
          sha256sum -c /tmp/preprod.sha
          sha256sum -c /tmp/manifest.sha
          sha256sum -c /tmp/schema.sha
          sha256sum -c /tmp/worker.sha
          sha256sum -c /tmp/metrics.sha

          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.after.sha
          diff -u /tmp/two_table.sha /tmp/two_table.after.sha

          git diff --exit-code -- \
            latest/standalone_swing_integrated_latest.json \
            latest/standalone_swing_preproduction_readiness_latest.json \
            api/manifest.json \
            docs/custom_gpt_action_schema.yaml \
            worker/krx-live-price-worker.js \
            stock_table_metrics_v850.py \
            api/two_table_v1

          echo "PROTECTED_SOURCE_FILES_CHANGED=false"
          echo "PRODUCTION_TWO_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "ACTION_SCHEMA_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"

      - name: Commit V8.7.13 display merge freeze
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::Remote main changed after checkout. Rerun V8.7.13 from latest main."
            echo "BASE_SHA=$BASE_SHA"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            standalone_swing_display_merge_freeze_v8713.py \
            docs/standalone_swing_display_merge_contract_v8713.md \
            latest/standalone_swing_display_merge_readiness_latest.json \
            latest/standalone_swing_display_merge_readiness_meta_latest.json \
            latest/standalone_swing_display_merge_readiness_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"
          echo "V8713_STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "V8713_STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow staged unexpectedly"
            exit 1
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              standalone_swing_display_merge_freeze_v8713.py|\
              docs/standalone_swing_display_merge_contract_v8713.md|\
              latest/standalone_swing_display_merge_readiness_latest.json|\
              latest/standalone_swing_display_merge_readiness_meta_latest.json|\
              latest/standalone_swing_display_merge_readiness_run_log_latest.txt) ;;
              *)
                echo "::error::Unexpected staged path: $p"
                exit 1
                ;;
            esac
          done <<< "$STAGED"

          echo "WORKFLOW_FILES_STAGED=false"

          if ! git diff --cached --quiet; then
            git commit -m "Freeze V8.7.13 standalone swing display merge contract"
            git push origin HEAD:main
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V8713_STANDALONE_SWING_DISPLAY_MERGE_FREEZE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "DISPLAY_MERGE_CONTRACT_FROZEN=true"
          echo "PRODUCTION_ACTIVATION_ALLOWED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "ACTION_ROUTE_ENABLED=false"
          echo "STANDALONE_COMMAND_DEFINED=false"
          echo "FINAL_HEADER_SELECTED=false"
          echo "PRODUCTION_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "ACTION_SCHEMA_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          test -f /tmp/v8713.log && cat /tmp/v8713.log || true
          test -f /tmp/v8713-validate.log && cat /tmp/v8713-validate.log || true
          git status --short || true
