name: Diagnose standalone swing data gaps v8.7.8

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v878-standalone-swing-gap-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Diagnose MA and ATR gaps
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          from collections import defaultdict, Counter
          from pathlib import Path

          from stock_table_metrics_v850 import normalize_bars

          INTEGRATED = Path("latest/standalone_swing_integrated_latest.json")
          SWING = Path("latest/standalone_swing_source_latest.json")
          HISTORY = Path("latest/active_stock_long_history_260d_latest.csv")
          HISTORY_META = Path("latest/active_stock_long_history_260d_meta_latest.json")
          OUT = Path("/tmp/v878_standalone_swing_gap_diagnostic")
          OUT.mkdir(parents=True, exist_ok=True)

          for p in (INTEGRATED, SWING, HISTORY, HISTORY_META):
              if not p.is_file():
                  raise SystemExit("MISSING_REQUIRED_SOURCE:" + str(p))

          integrated = json.loads(INTEGRATED.read_text(encoding="utf-8-sig"))
          swing = json.loads(SWING.read_text(encoding="utf-8-sig"))
          history_meta = json.loads(HISTORY_META.read_text(encoding="utf-8-sig"))

          if integrated.get("status") != "READY_SOURCE_ONLY":
              raise SystemExit("INTEGRATED_SOURCE_NOT_READY")
          if swing.get("status") != "READY_SOURCE_ONLY":
              raise SystemExit("SWING_SOURCE_NOT_READY")
          if history_meta.get("status") != "READY":
              raise SystemExit("LONG_HISTORY_NOT_READY")

          basis = integrated.get("basis_date")
          if not basis:
              raise SystemExit("BASIS_MISSING")
          if swing.get("basis_date") != basis:
              raise SystemExit("SWING_BASIS_MISMATCH")
          if history_meta.get("cache_max_date") != basis:
              raise SystemExit("HISTORY_BASIS_MISMATCH")

          integrated_rows = {
              str(r["ticker"]).zfill(6): r
              for r in integrated.get("rows") or []
          }
          swing_rows = {
              str(r["ticker"]).zfill(6): r
              for r in swing.get("rows") or []
          }

          if set(integrated_rows) != set(swing_rows):
              raise SystemExit("INTEGRATED_SWING_TICKER_SET_MISMATCH")

          with HISTORY.open(encoding="utf-8-sig", newline="") as f:
              history_rows = list(csv.DictReader(f))

          by_ticker = defaultdict(list)
          for row in history_rows:
              ticker = str(row.get("ticker") or "").zfill(6)
              if ticker in integrated_rows:
                  by_ticker[ticker].append(row)

          if set(by_ticker) != set(integrated_rows):
              missing = sorted(set(integrated_rows) - set(by_ticker))
              raise SystemExit("LONG_HISTORY_TICKER_MISSING:" + ",".join(missing[:20]))

          ma_gap_rows = []
          atr_gap_rows = []
          atr_ready_rows = []
          classifications = Counter()

          for ticker in sorted(integrated_rows):
              irow = integrated_rows[ticker]
              srow = swing_rows[ticker]
              raw_rows = sorted(by_ticker[ticker], key=lambda x: str(x["date"]))
              bars = normalize_bars(raw_rows, basis)

              if not bars or bars[-1]["date"] != basis:
                  raise SystemExit("LATEST_BAR_MISSING:" + ticker)

              ma = irow.get("ma") or {}
              missing_ma_periods = [
                  p for p in (5, 20, 60, 120)
                  if (ma.get(str(p)) or {}).get("value") is None
                  or (ma.get(str(p)) or {}).get("direction") is None
              ]

              if missing_ma_periods:
                  ma_gap_rows.append({
                      "ticker": ticker,
                      "name": irow.get("name"),
                      "market": irow.get("market"),
                      "observation_count": len(bars),
                      "history_min_date": bars[0]["date"],
                      "history_max_date": bars[-1]["date"],
                      "missing_ma_periods": missing_ma_periods,
                      "required_for_direction": {
                          "5": 10,
                          "20": 25,
                          "60": 65,
                          "120": 125,
                      },
                      "source_missing": (srow.get("missing") or {}),
                  })

              atr = irow.get("atr14") or {}
              atr_ready = atr.get("pct") is not None
              last126 = bars[-126:]

              missing_hl_dates = [
                  b["date"]
                  for b in last126
                  if b.get("high") is None or b.get("low") is None
              ]
              missing_hl_last20 = [
                  b["date"]
                  for b in bars[-20:]
                  if b.get("high") is None or b.get("low") is None
              ]

              raw_map = {str(r["date"]): r for r in raw_rows}
              raw_missing_count = 0
              raw_invalid_count = 0
              raw_examples = []

              for day in missing_hl_dates:
                  raw = raw_map.get(day) or {}
                  high_raw = raw.get("high")
                  low_raw = raw.get("low")
                  close_raw = raw.get("close")

                  def num(v):
                      try:
                          return float(str(v).replace(",", ""))
                      except Exception:
                          return None

                  h = num(high_raw)
                  l = num(low_raw)
                  c = num(close_raw)

                  if h is None or l is None:
                      raw_missing_count += 1
                      kind = "RAW_HIGH_OR_LOW_MISSING"
                  else:
                      raw_invalid_count += 1
                      kind = "RAW_OHLC_INVALID_RELATION"

                  if len(raw_examples) < 8:
                      raw_examples.append({
                          "date": day,
                          "kind": kind,
                          "raw_high": high_raw,
                          "raw_low": low_raw,
                          "raw_close": close_raw,
                      })

              if atr_ready:
                  atr_ready_rows.append(ticker)
                  continue

              if len(bars) < 15:
                  reason = "HISTORY_SHORT_LT_15"
              elif missing_hl_dates:
                  if raw_missing_count and raw_invalid_count:
                      reason = "MIXED_RAW_MISSING_AND_INVALID_OHLC"
                  elif raw_missing_count:
                      reason = "RAW_HIGH_OR_LOW_MISSING_IN_LAST126"
                  else:
                      reason = "RAW_OHLC_INVALID_RELATION_IN_LAST126"
              else:
                  reason = "UNEXPECTED_ATR_NULL_WITH_COMPLETE_LAST126"

              classifications[reason] += 1
              atr_gap_rows.append({
                  "ticker": ticker,
                  "name": irow.get("name"),
                  "market": irow.get("market"),
                  "observation_count": len(bars),
                  "history_min_date": bars[0]["date"],
                  "history_max_date": bars[-1]["date"],
                  "atr_source_status": (srow.get("missing") or {}).get("atr14"),
                  "diagnostic_reason": reason,
                  "last126_bar_count": len(last126),
                  "missing_high_low_last126_count": len(missing_hl_dates),
                  "missing_high_low_last20_count": len(missing_hl_last20),
                  "first_missing_high_low_date": missing_hl_dates[0] if missing_hl_dates else None,
                  "last_missing_high_low_date": missing_hl_dates[-1] if missing_hl_dates else None,
                  "raw_high_low_missing_count": raw_missing_count,
                  "raw_ohlc_invalid_relation_count": raw_invalid_count,
                  "raw_examples": raw_examples,
              })

          expected_ma_gap_count = (
              len(integrated_rows)
              - sum(
                  1
                  for row in integrated_rows.values()
                  if all(
                      (row.get("ma") or {}).get(str(p), {}).get("value") is not None
                      and (row.get("ma") or {}).get(str(p), {}).get("direction") is not None
                      for p in (5, 20, 60, 120)
                  )
              )
          )

          expected_atr_gap_count = (
              len(integrated_rows)
              - sum(
                  1 for row in integrated_rows.values()
                  if (row.get("atr14") or {}).get("pct") is not None
              )
          )

          if len(ma_gap_rows) != expected_ma_gap_count:
              raise SystemExit("MA_GAP_COUNT_INTERNAL_MISMATCH")
          if len(atr_gap_rows) != expected_atr_gap_count:
              raise SystemExit("ATR_GAP_COUNT_INTERNAL_MISMATCH")

          unexpected_atr = [
              r for r in atr_gap_rows
              if r["diagnostic_reason"] == "UNEXPECTED_ATR_NULL_WITH_COMPLETE_LAST126"
          ]

          result = {
              "version": "2026-09-12-v8.7.8-standalone-swing-gap-diagnostic",
              "status": "READY_EVIDENCE_ONLY",
              "repository_write": False,
              "production_change": False,
              "worker_change": False,
              "metric_formula_change": False,
              "basis_date": basis,
              "row_count": len(integrated_rows),
              "ma_full_ready_count": len(integrated_rows) - len(ma_gap_rows),
              "ma_gap_count": len(ma_gap_rows),
              "atr14_ready_count": len(atr_ready_rows),
              "atr14_gap_count": len(atr_gap_rows),
              "atr14_gap_classification_counts": dict(sorted(classifications.items())),
              "unexpected_atr_null_count": len(unexpected_atr),
              "ma_gap_rows": ma_gap_rows,
              "atr_gap_rows": atr_gap_rows,
              "decision": {
                  "ma_formula_change_required": False,
                  "atr_formula_change_required": False,
                  "auto_fill_missing_values": False,
                  "static_price_substitution": False,
                  "note": (
                      "This diagnostic classifies source/history gaps only. "
                      "It does not relax or change the validated MA/ATR formulas."
                  ),
              },
          }

          (OUT / "standalone-swing-gap-diagnostic-v878.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          md = [
              "# V8.7.8 독립 스윙 데이터 결측 진단",
              "",
              f"- 기준일: {basis}",
              f"- 전체 종목: {len(integrated_rows)}",
              f"- MA5/20/60/120 전체 준비: {len(integrated_rows)-len(ma_gap_rows)}/{len(integrated_rows)}",
              f"- MA 결측: {len(ma_gap_rows)}",
              f"- ATR14 준비: {len(atr_ready_rows)}/{len(integrated_rows)}",
              f"- ATR14 결측: {len(atr_gap_rows)}",
              f"- 예상 밖 ATR null: {len(unexpected_atr)}",
              "",
              "## MA 결측 종목",
          ]

          if ma_gap_rows:
              for r in ma_gap_rows:
                  md.append(
                      f"- {r['name']}({r['ticker']}, {r['market']}): "
                      f"관측 {r['observation_count']}일, 결측 MA={r['missing_ma_periods']}, "
                      f"history {r['history_min_date']}~{r['history_max_date']}"
                  )
          else:
              md.append("- 없음")

          md += ["", "## ATR14 결측 분류"]
          for reason, count in sorted(classifications.items()):
              md.append(f"- {reason}: {count}종목")

          md += ["", "## ATR14 결측 종목"]
          for r in atr_gap_rows:
              md.append(
                  f"- {r['name']}({r['ticker']}, {r['market']}): "
                  f"{r['diagnostic_reason']}, 관측 {r['observation_count']}일, "
                  f"최근126 고가/저가 결측 {r['missing_high_low_last126_count']}일, "
                  f"최근20 결측 {r['missing_high_low_last20_count']}일"
              )

          md += [
              "",
              "## 안전 판정",
              "- 이 진단은 MA/ATR 계산식을 변경하지 않습니다.",
              "- 결측치를 임의 보간하지 않습니다.",
              "- 요청시점 현재가 또는 정적 종가로 결측을 대체하지 않습니다.",
              "- repository·production·Worker를 변경하지 않습니다.",
          ]

          (OUT / "standalone-swing-gap-diagnostic-v878.md").write_text(
              "\n".join(md) + "\n",
              encoding="utf-8",
          )

          print("V878_GAP_DIAGNOSTIC=READY_EVIDENCE_ONLY")
          print("BASIS_DATE=" + basis)
          print("TOTAL_ROWS=" + str(len(integrated_rows)))
          print("MA_FULL_READY=" + str(len(integrated_rows)-len(ma_gap_rows)))
          print("MA_GAP_COUNT=" + str(len(ma_gap_rows)))
          print("ATR14_READY=" + str(len(atr_ready_rows)))
          print("ATR14_GAP_COUNT=" + str(len(atr_gap_rows)))
          print("UNEXPECTED_ATR_NULL_COUNT=" + str(len(unexpected_atr)))
          for reason, count in sorted(classifications.items()):
              print("ATR_CLASS_" + reason + "=" + str(count))
          print("MA_FORMULA_CHANGE_REQUIRED=false")
          print("ATR_FORMULA_CHANGE_REQUIRED=false")
          print("AUTO_FILL_MISSING_VALUES=false")
          print("REPOSITORY_WRITE=false")
          print("PRODUCTION_CHANGE=false")
          print("WORKER_CHANGE=false")
          print("REQUEST_TIME_PRICE_SUBSTITUTION=false")
          PY

      - name: Validate diagnostic safety
        shell: bash
        run: |
          set -euo pipefail

          test -f /tmp/v878_standalone_swing_gap_diagnostic/standalone-swing-gap-diagnostic-v878.json
          test -f /tmp/v878_standalone_swing_gap_diagnostic/standalone-swing-gap-diagnostic-v878.md

          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("/tmp/v878_standalone_swing_gap_diagnostic/standalone-swing-gap-diagnostic-v878.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "READY_EVIDENCE_ONLY"
          assert p["repository_write"] is False
          assert p["production_change"] is False
          assert p["worker_change"] is False
          assert p["metric_formula_change"] is False
          assert p["ma_full_ready_count"] + p["ma_gap_count"] == p["row_count"]
          assert p["atr14_ready_count"] + p["atr14_gap_count"] == p["row_count"]
          assert p["decision"]["ma_formula_change_required"] is False
          assert p["decision"]["atr_formula_change_required"] is False
          assert p["decision"]["auto_fill_missing_values"] is False
          assert p["decision"]["static_price_substitution"] is False

          print("V878_COUNT_RECONCILIATION=PASS")
          print("V878_NO_FORMULA_CHANGE=PASS")
          print("V878_NO_AUTOFILL=PASS")
          print("V878_READ_ONLY_SAFETY=PASS")
          PY

          git diff --exit-code
          git diff --cached --exit-code

          echo "ORIGINAL_CHECKOUT_UNCHANGED=PASS"
          echo "NO_COMMIT_NO_PUSH_NO_DEPLOY=PASS"

      - name: Upload V8.7.8 diagnostic artifact
        uses: actions/upload-artifact@v6
        with:
          name: standalone-swing-gap-diagnostic-v878
          path: |
            /tmp/v878_standalone_swing_gap_diagnostic/standalone-swing-gap-diagnostic-v878.json
            /tmp/v878_standalone_swing_gap_diagnostic/standalone-swing-gap-diagnostic-v878.md
          if-no-files-found: error
          retention-days: 14
