name: Preview standalone swing request-time display merge v8.7.12

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8712-standalone-swing-display-merge-preview
  cancel-in-progress: false

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build request-time display merge preview
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import hashlib
          import json
          import math
          import time
          import urllib.parse
          import urllib.request
          from pathlib import Path

          SOURCE = Path("latest/standalone_swing_integrated_latest.json")
          READINESS = Path("latest/standalone_swing_preproduction_readiness_latest.json")
          MANIFEST = Path("api/manifest.json")
          OUT = Path("/tmp/v8712_standalone_swing_display_merge")
          OUT.mkdir(parents=True, exist_ok=True)

          WORKER = "https://krx-live-price-ksh.diaconos.workers.dev"

          for p in (SOURCE, READINESS, MANIFEST):
              if not p.is_file():
                  raise SystemExit("MISSING_REQUIRED_SOURCE:" + str(p))

          def read_json(p):
              return json.loads(p.read_text(encoding="utf-8-sig"))

          def sha256(p):
              h = hashlib.sha256()
              with p.open("rb") as f:
                  for chunk in iter(lambda: f.read(1024 * 1024), b""):
                      h.update(chunk)
              return h.hexdigest()

          source = read_json(SOURCE)
          readiness = read_json(READINESS)
          manifest = read_json(MANIFEST)

          if source.get("status") != "READY_SOURCE_ONLY":
              raise SystemExit("INTEGRATED_SOURCE_NOT_READY")
          if readiness.get("status") != "FROZEN_PREPRODUCTION_READY":
              raise SystemExit("PREPRODUCTION_NOT_FROZEN")
          if readiness.get("production_activation_allowed") is not False:
              raise SystemExit("PRODUCTION_ALREADY_ALLOWED")
          if readiness.get("standalone_swing_table_enabled") is not False:
              raise SystemExit("STANDALONE_TABLE_ALREADY_ENABLED")
          if readiness.get("action_route_enabled") is not False:
              raise SystemExit("STANDALONE_ROUTE_ALREADY_ENABLED")

          route = (manifest.get("command_route_contract") or {})
          two = route.get("two_table_release") or {}
          if two.get("effective_command_count") != 15:
              raise SystemExit("EFFECTIVE_COMMAND_COUNT_MISMATCH")
          if two.get("standalone_swing_table_enabled") is not False:
              raise SystemExit("MANIFEST_STANDALONE_MUST_REMAIN_DISABLED")

          price_policy = manifest.get("request_time_price_policy") or {}
          if price_policy.get("action_operation_id") != "getRequestTimePrices":
              raise SystemExit("REQUEST_PRICE_OPERATION_MISMATCH")
          if price_policy.get("initial_batch_size") != 10:
              raise SystemExit("REQUEST_PRICE_INITIAL_BATCH_MISMATCH")
          if price_policy.get("retry_batch_sizes") != [5, 2]:
              raise SystemExit("REQUEST_PRICE_RETRY_BATCH_MISMATCH")
          if price_policy.get("retry_only_failed") is not True:
              raise SystemExit("REQUEST_PRICE_RETRY_SCOPE_MISMATCH")

          rows = source.get("rows") or []
          if len(rows) != int(source.get("row_count") or 0):
              raise SystemExit("SOURCE_ROW_COUNT_MISMATCH")

          source_sha_before = sha256(SOURCE)

          items = []
          by_key = {}
          for row in rows:
              ticker = str(row.get("ticker") or "").zfill(6)
              market = row.get("market")
              if market not in ("KOSPI", "KOSDAQ"):
                  raise SystemExit("INVALID_MARKET:" + str(market))
              key = ticker + "|" + market
              items.append(key)
              by_key[key] = row

          def request_json(url, timeout=15):
              req = urllib.request.Request(
                  url,
                  headers={
                      "Accept": "application/json",
                      "User-Agent": "krx-watchlist-v8712-display-merge-preview",
                      "Cache-Control": "no-cache",
                  },
              )
              with urllib.request.urlopen(req, timeout=timeout) as resp:
                  raw = resp.read(2_000_000)
                  if resp.status != 200:
                      raise RuntimeError(f"HTTP_{resp.status}")
              return json.loads(raw.decode("utf-8"))

          health = request_json(WORKER + "/health")
          if health.get("status") != "OK":
              raise SystemExit("WORKER_HEALTH_NOT_OK")

          quote_success = {}
          quote_errors = {}
          attempts = []

          def response_key(q):
              ticker = q.get("ticker") or q.get("code") or q.get("quote_key")
              market = q.get("market")
              if ticker is not None:
                  ticker = str(ticker).strip()
                  if "|" in ticker:
                      ticker = ticker.split("|", 1)[0]
                  if ticker.isdigit():
                      ticker = ticker.zfill(6)
              if ticker and market in ("KOSPI", "KOSDAQ"):
                  return ticker + "|" + market

              inp = str(q.get("input") or "")
              if "|" in inp:
                  t, m = inp.split("|", 1)
                  t = t.strip().zfill(6)
                  m = m.strip()
                  if t.isdigit() and len(t) == 6 and m in ("KOSPI", "KOSDAQ"):
                      return t + "|" + m
              return None

          def extract_price(q):
              for field in ("current_price", "price"):
                  v = q.get(field)
                  if isinstance(v, bool) or v is None:
                      continue
                  try:
                      x = float(v)
                  except Exception:
                      continue
                  if math.isfinite(x) and x > 0:
                      return x
              return None

          limits = {"initial10": 10, "retry5": 5, "retry2": 2}

          def call_batch(batch, stage, ordinal):
              if len(batch) > limits[stage]:
                  raise RuntimeError("BATCH_LIMIT_VIOLATION")
              url = WORKER + "/quotes?" + urllib.parse.urlencode({"items": ",".join(batch)})
              payload = None
              http_error = None
              started = time.time()
              try:
                  payload = request_json(url)
              except Exception as exc:
                  http_error = f"{type(exc).__name__}:{exc}"

              successes = set()
              failures = set(batch)

              if isinstance(payload, dict):
                  for q in payload.get("quotes") or []:
                      if not isinstance(q, dict):
                          continue
                      key = response_key(q)
                      if key not in failures:
                          continue
                      price = extract_price(q)
                      if q.get("ok") is True and price is not None:
                          successes.add(key)
                          failures.discard(key)
                          quote_success[key] = {
                              "price": price,
                              "price_time": q.get("price_time"),
                              "traded_at": q.get("traded_at"),
                              "price_as_of": q.get("price_as_of"),
                              "source": q.get("source"),
                              "price_source": q.get("price_source"),
                              "market_status": q.get("market_status"),
                              "session_status": q.get("session_status"),
                              "after_hours_reflected": q.get("after_hours_reflected"),
                          }
                          quote_errors.pop(key, None)
                      else:
                          quote_errors[key] = {
                              "error_code": q.get("error_code"),
                              "error": q.get("error"),
                          }

              if http_error:
                  for key in batch:
                      quote_errors[key] = {
                          "error_code": "HTTP_OR_PARSE_ERROR",
                          "error": http_error,
                      }

              attempts.append({
                  "stage": stage,
                  "ordinal": ordinal,
                  "batch_size": len(batch),
                  "success_count": len(successes),
                  "failure_count": len(failures),
                  "elapsed_ms": round((time.time() - started) * 1000, 1),
                  "http_error": http_error,
              })
              time.sleep(0.10)
              return [x for x in batch if x in failures]

          def chunks(seq, n):
              for i in range(0, len(seq), n):
                  yield seq[i:i+n]

          failed10 = []
          for i, batch in enumerate(chunks(items, 10), 1):
              failed10 += call_batch(batch, "initial10", i)

          failed5 = []
          for i, batch in enumerate(chunks(failed10, 5), 1):
              failed5 += call_batch(batch, "retry5", i)

          failed2 = []
          for i, batch in enumerate(chunks(failed5, 2), 1):
              failed2 += call_batch(batch, "retry2", i)

          final_failed = list(dict.fromkeys(failed2))
          final_failed_set = set(final_failed)

          def price_icon(abs_diff_pct):
              # Existing documented stock-table rule:
              # <0.5 none; 0.5~<1.5 blue; 1.5~<3 orange; >=3 red.
              if abs_diff_pct < 0.5:
                  return ""
              if abs_diff_pct < 1.5:
                  return "🟦"
              if abs_diff_pct < 3.0:
                  return "🟠"
              return "🔴"

          merged = []
          counts = {
              "total": len(items),
              "quote_success": 0,
              "quote_failed": 0,
              "position_ready": 0,
              "position_unavailable": 0,
              "position_below_range": 0,
              "position_inside_range": 0,
              "position_above_range": 0,
              "icon_none": 0,
              "icon_blue": 0,
              "icon_orange": 0,
              "icon_red": 0,
              "icon_white": 0,
              "static_fallback_count": 0,
              "confirmed_metric_mutation_count": 0,
          }

          immutable_fields = [
              "price_performance", "swing", "ma", "run", "streak",
              "rs_kospi_pp", "sector_benchmark", "rs_sector_pp",
              "atr14", "avg_daily_range_20_pct", "range_3m",
              "trailing_reference", "matches_decliners_24",
              "pending_metrics",
          ]

          for key in items:
              row = by_key[key]
              baseline = {
                  field: json.dumps(row.get(field), ensure_ascii=False, sort_keys=True)
                  for field in immutable_fields
              }

              if key in quote_success:
                  counts["quote_success"] += 1
                  q = quote_success[key]
                  price = q["price"]
                  official = row.get("official_close")
                  diff_pct = None
                  icon = ""
                  if isinstance(official, (int, float)) and official > 0:
                      diff_pct = 100.0 * (price / official - 1.0)
                      icon = price_icon(abs(diff_pct))
                  if icon == "":
                      counts["icon_none"] += 1
                  elif icon == "🟦":
                      counts["icon_blue"] += 1
                  elif icon == "🟠":
                      counts["icon_orange"] += 1
                  elif icon == "🔴":
                      counts["icon_red"] += 1

                  r3 = row.get("range_3m") or {}
                  low, high = r3.get("low"), r3.get("high")
                  position_pct = None
                  position_state = "UNAVAILABLE"
                  if (
                      isinstance(low, (int, float))
                      and isinstance(high, (int, float))
                      and high > low
                  ):
                      position_pct = 100.0 * (price - low) / (high - low)
                      counts["position_ready"] += 1
                      if position_pct < 0:
                          position_state = "BELOW_RANGE"
                          counts["position_below_range"] += 1
                      elif position_pct > 100:
                          position_state = "ABOVE_RANGE"
                          counts["position_above_range"] += 1
                      else:
                          position_state = "INSIDE_RANGE"
                          counts["position_inside_range"] += 1
                  else:
                      counts["position_unavailable"] += 1

                  output = {
                      "ticker": row.get("ticker"),
                      "name": row.get("name"),
                      "market": row.get("market"),
                      "basis_date": row.get("basis_date"),
                      "request_time_quote_status": "OK",
                      "request_time_price": price,
                      "request_time_price_icon": icon,
                      "request_vs_official_close_pct": round(diff_pct, 4) if diff_pct is not None else None,
                      "request_time_position_pct": round(position_pct, 4) if position_pct is not None else None,
                      "request_time_position_state": position_state,
                      "position_range_source": {
                          "low": low,
                          "high": high,
                          "basis": "CONFIRMED_DAILY_3M_RANGE",
                      },
                      "price_metadata": {
                          "price_time": q.get("price_time"),
                          "traded_at": q.get("traded_at"),
                          "price_as_of": q.get("price_as_of"),
                          "source": q.get("source"),
                          "price_source": q.get("price_source"),
                          "market_status": q.get("market_status"),
                          "session_status": q.get("session_status"),
                          "after_hours_reflected": q.get("after_hours_reflected"),
                      },
                      "official_close_reference_only": official,
                      "confirmed_metrics_recomputed": False,
                      "recommendation_recomputed": False,
                      "price_zone_recomputed": False,
                      "final_position_label_selected": False,
                  }
              else:
                  counts["quote_failed"] += 1
                  counts["icon_white"] += 1
                  output = {
                      "ticker": row.get("ticker"),
                      "name": row.get("name"),
                      "market": row.get("market"),
                      "basis_date": row.get("basis_date"),
                      "request_time_quote_status": "FAILED",
                      "request_time_price": None,
                      "request_time_price_icon": "⚪",
                      "request_vs_official_close_pct": None,
                      "request_time_position_pct": None,
                      "request_time_position_state": "UNAVAILABLE",
                      "position_range_source": {
                          "low": (row.get("range_3m") or {}).get("low"),
                          "high": (row.get("range_3m") or {}).get("high"),
                          "basis": "CONFIRMED_DAILY_3M_RANGE",
                      },
                      "price_metadata": None,
                      "official_close_reference_only": row.get("official_close"),
                      "display_policy": "⚪ 현재가 확인 실패",
                      "confirmed_metrics_recomputed": False,
                      "recommendation_recomputed": False,
                      "price_zone_recomputed": False,
                      "final_position_label_selected": False,
                      "error": quote_errors.get(key),
                  }
                  # No fallback by construction.
                  if output["request_time_price"] == row.get("official_close") and row.get("official_close") is not None:
                      counts["static_fallback_count"] += 1

              # This preview must never mutate confirmed-daily source values.
              for field in immutable_fields:
                  after = json.dumps(row.get(field), ensure_ascii=False, sort_keys=True)
                  if after != baseline[field]:
                      counts["confirmed_metric_mutation_count"] += 1

              merged.append(output)

          if counts["quote_success"] + counts["quote_failed"] != counts["total"]:
              raise SystemExit("QUOTE_TERMINAL_COUNT_MISMATCH")
          if counts["static_fallback_count"] != 0:
              raise SystemExit("STATIC_FALLBACK_DETECTED")
          if counts["confirmed_metric_mutation_count"] != 0:
              raise SystemExit("CONFIRMED_METRIC_MUTATION_DETECTED")

          source_sha_after = sha256(SOURCE)
          if source_sha_after != source_sha_before:
              raise SystemExit("SOURCE_FILE_CHANGED_DURING_PREVIEW")

          result = {
              "version": "2026-09-13-v8.7.12-standalone-swing-request-time-display-merge-preview",
              "status": "READY_PREVIEW_ONLY",
              "basis_date": source.get("basis_date"),
              "repository_write": False,
              "production_change": False,
              "worker_change": False,
              "action_schema_change": False,
              "standalone_command_defined": False,
              "standalone_route_enabled": False,
              "final_header_selected": False,
              "final_position_label_selected": False,
              "recommendation_contract_selected": False,
              "price_zone_contract_selected": False,
              "source_row_count": len(rows),
              "counts": counts,
              "request_time_price_contract": {
                  "operation_id": "getRequestTimePrices",
                  "retry_policy": [10, 5, 2],
                  "failed_display": "⚪ 현재가 확인 실패",
                  "static_fallback_allowed": False,
              },
              "display_merge_contract_preview": {
                  "request_time_price_is_overlay_only": True,
                  "official_close_is_reference_only": True,
                  "position_range_uses_confirmed_3m_low_high": True,
                  "position_formula": "(request_time_price-low)/(high-low)*100",
                  "position_pct_clamped_to_0_100": False,
                  "confirmed_metrics_recomputed": False,
                  "static_range_position_copied_as_request_position": False,
                  "price_diff_icon_thresholds_abs_pct": {
                      "none_lt": 0.5,
                      "blue_from": 0.5,
                      "blue_lt": 1.5,
                      "orange_from": 1.5,
                      "orange_lt": 3.0,
                      "red_from": 3.0,
                      "failure": "⚪",
                  },
                  "not_frozen_in_v8712": [
                      "final_position_label_bands",
                      "price_zone",
                      "recommendation_mark",
                      "final_table_header",
                      "command_name",
                      "route",
                  ],
              },
              "attempt_log": attempts,
              "rows": merged,
              "source_sha256": source_sha_before,
          }

          (OUT / "standalone-swing-display-merge-v8712.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          sample = merged[:15]
          md = [
              "# V8.7.12 독립 스윙 요청현재가 표시 결합 Preview",
              "",
              f"- 기준일: {source.get('basis_date')}",
              f"- 전체 종목: {counts['total']}",
              f"- 현재가 성공: {counts['quote_success']}",
              f"- 현재가 실패: {counts['quote_failed']}",
              f"- 요청시점 3개월 범위위치 계산 가능: {counts['position_ready']}",
              f"- 범위 아래: {counts['position_below_range']}",
              f"- 범위 안: {counts['position_inside_range']}",
              f"- 범위 위: {counts['position_above_range']}",
              f"- 정적 종가 fallback: {counts['static_fallback_count']}",
              f"- 확정 지표 mutation: {counts['confirmed_metric_mutation_count']}",
              "",
              "## 이번 단계에서 확정하지 않는 것",
              "- 최종 현재위치 한글 라벨 구간",
              "- 가치매수/익절 가격구간",
              "- 추천 아이콘",
              "- 최종 독립 스윙표 헤더",
              "- 새 명령어·route",
              "",
              "## 샘플",
              "",
              "|종목|시장|요청현재가|현재가표식|공식종가 대비|요청시점 범위위치%|범위상태|",
              "|---|---|---:|---|---:|---:|---|",
          ]
          for r in sample:
              diff = r["request_vs_official_close_pct"]
              pos = r["request_time_position_pct"]
              md.append(
                  f"|{r['name']}({r['ticker']})|{r['market']}|"
                  f"{'실패' if r['request_time_price'] is None else format(r['request_time_price'], ',.0f')}|"
                  f"{r['request_time_price_icon'] or '-'}|"
                  f"{'-' if diff is None else format(diff, '+.2f') + '%'}|"
                  f"{'-' if pos is None else format(pos, '.2f') + '%'}|"
                  f"{r['request_time_position_state']}|"
              )

          md += [
              "",
              "※ 요청현재가는 보조 overlay이며 1M/3M/6M·스윙·MA·RS·ATR·연속등락을 재계산하지 않습니다.",
              "※ 범위위치%는 확정 일봉의 3개월 저·고가에 요청가격을 대입하며 0~100으로 잘라내지 않습니다.",
              "※ 이 Preview는 최종 헤더·명령어·route·추천·가격구간을 확정하지 않습니다.",
          ]

          (OUT / "standalone-swing-display-merge-v8712.md").write_text(
              "\n".join(md) + "\n",
              encoding="utf-8",
          )

          print("V8712_DISPLAY_MERGE_PREVIEW=READY_PREVIEW_ONLY")
          print("SOURCE_ROWS=" + str(counts["total"]))
          print("QUOTE_SUCCESS=" + str(counts["quote_success"]))
          print("QUOTE_FAILED=" + str(counts["quote_failed"]))
          print("POSITION_READY=" + str(counts["position_ready"]))
          print("POSITION_BELOW_RANGE=" + str(counts["position_below_range"]))
          print("POSITION_INSIDE_RANGE=" + str(counts["position_inside_range"]))
          print("POSITION_ABOVE_RANGE=" + str(counts["position_above_range"]))
          print("STATIC_FALLBACK_COUNT=" + str(counts["static_fallback_count"]))
          print("CONFIRMED_METRIC_MUTATION_COUNT=" + str(counts["confirmed_metric_mutation_count"]))
          print("POSITION_PCT_CLAMPED=false")
          print("FINAL_POSITION_LABEL_SELECTED=false")
          print("RECOMMENDATION_CONTRACT_SELECTED=false")
          print("PRICE_ZONE_CONTRACT_SELECTED=false")
          print("FINAL_HEADER_SELECTED=false")
          print("STANDALONE_COMMAND_DEFINED=false")
          print("STANDALONE_ROUTE_ENABLED=false")
          print("REPOSITORY_WRITE=false")
          print("PRODUCTION_CHANGE=false")
          print("WORKER_CHANGE=false")
          PY

      - name: Validate preview safety
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("/tmp/v8712_standalone_swing_display_merge/standalone-swing-display-merge-v8712.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "READY_PREVIEW_ONLY"
          assert p["repository_write"] is False
          assert p["production_change"] is False
          assert p["worker_change"] is False
          assert p["action_schema_change"] is False
          assert p["standalone_command_defined"] is False
          assert p["standalone_route_enabled"] is False
          assert p["final_header_selected"] is False
          assert p["final_position_label_selected"] is False
          assert p["recommendation_contract_selected"] is False
          assert p["price_zone_contract_selected"] is False

          c = p["counts"]
          assert c["quote_success"] + c["quote_failed"] == c["total"]
          assert c["static_fallback_count"] == 0
          assert c["confirmed_metric_mutation_count"] == 0

          m = p["display_merge_contract_preview"]
          assert m["request_time_price_is_overlay_only"] is True
          assert m["official_close_is_reference_only"] is True
          assert m["position_range_uses_confirmed_3m_low_high"] is True
          assert m["position_pct_clamped_to_0_100"] is False
          assert m["confirmed_metrics_recomputed"] is False
          assert m["static_range_position_copied_as_request_position"] is False

          print("V8712_OVERLAY_ONLY=PASS")
          print("V8712_CONFIRMED_METRICS_IMMUTABLE=PASS")
          print("V8712_NO_STATIC_FALLBACK=PASS")
          print("V8712_NO_PREMATURE_HEADER_COMMAND_ROUTE=PASS")
          print("V8712_READ_ONLY_SAFETY=PASS")
          PY

          git diff --exit-code
          git diff --cached --exit-code

          echo "ORIGINAL_CHECKOUT_UNCHANGED=PASS"
          echo "NO_COMMIT_NO_PUSH_NO_DEPLOY=PASS"

      - name: Upload V8.7.12 display-merge preview
        uses: actions/upload-artifact@v6
        with:
          name: standalone-swing-display-merge-v8712
          path: |
            /tmp/v8712_standalone_swing_display_merge/standalone-swing-display-merge-v8712.json
            /tmp/v8712_standalone_swing_display_merge/standalone-swing-display-merge-v8712.md
          if-no-files-found: error
          retention-days: 14
