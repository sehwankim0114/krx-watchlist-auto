name: Freeze standalone swing preproduction contract v8.7.11

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  freeze:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture base and protected hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

          sha256sum stock_table_metrics_v850.py > /tmp/metric.sha
          sha256sum worker/krx-live-price-worker.js > /tmp/worker.sha
          sha256sum docs/custom_gpt_action_schema.yaml > /tmp/schema.sha
          sha256sum README_사용법.md > /tmp/readme.sha
          sha256sum latest/standalone_swing_integrated_latest.json > /tmp/integrated.sha
          sha256sum latest/standalone_swing_integrated_meta_latest.json > /tmp/integrated_meta.sha
          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.sha

          echo "V8711_BASE_SHA=$(git rev-parse HEAD)"

      - name: Restore V8.7.11 builder and contract
        shell: bash
        env:
          BUILDER_B64: ""
          CONTRACT_B64: ""
        run: |
          set -euo pipefail

          python - <<'PY'
          import base64, os
          from pathlib import Path

          Path("standalone_swing_preproduction_freeze_v8711.py").write_bytes(
              base64.b64decode(os.environ["BUILDER_B64"])
          )
          Path("docs/standalone_swing_preproduction_contract_v8711.md").write_bytes(
              base64.b64decode(os.environ["CONTRACT_B64"])
          )
          PY

          python -m py_compile standalone_swing_preproduction_freeze_v8711.py
          echo "V8711_SOURCE_RESTORE=PASS"

      - name: Freeze validated preproduction contract
        shell: bash
        run: |
          set -euo pipefail

          python standalone_swing_preproduction_freeze_v8711.py | tee /tmp/v8711.log

          grep -q '^V8711_PREPRODUCTION_FREEZE_STATUS=FROZEN_PREPRODUCTION_READY$' /tmp/v8711.log
          grep -q '^ROW_COUNT=235$' /tmp/v8711.log
          grep -q '^RETURN_6M_READY=234$' /tmp/v8711.log
          grep -q '^MA_FULL_READY=234$' /tmp/v8711.log
          grep -q '^ATR14_READY=209$' /tmp/v8711.log
          grep -q '^RANGE20_READY=225$' /tmp/v8711.log
          grep -q '^KOSPI_SECTOR_RS_READY=210$' /tmp/v8711.log
          grep -q '^KOSDAQ_SECTOR_RS_NULL=25$' /tmp/v8711.log
          grep -q '^V879_DATA_QUALITY_EVIDENCE=PASS$' /tmp/v8711.log
          grep -q '^V8710_REQUEST_PRICE_EVIDENCE=PASS$' /tmp/v8711.log
          grep -q '^REQUEST_PRICE_OPERATION_ID=getRequestTimePrices$' /tmp/v8711.log
          grep -q '^REQUEST_PRICE_RETRY_POLICY=10-5-2$' /tmp/v8711.log
          grep -q '^PREPRODUCTION_CONTRACT_FROZEN=true$' /tmp/v8711.log
          grep -q '^PRODUCTION_ACTIVATION_ALLOWED=false$' /tmp/v8711.log
          grep -q '^STANDALONE_COMMAND_DEFINED=false$' /tmp/v8711.log
          grep -q '^FINAL_HEADER_SELECTED=false$' /tmp/v8711.log
          grep -q '^V8711_PREPRODUCTION_CONTRACT_VALIDATION=PASS$' /tmp/v8711.log

      - name: Validate frozen readiness object
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' | tee /tmp/v8711-validate.log
          import json
          from pathlib import Path

          p = json.loads(
              Path("latest/standalone_swing_preproduction_readiness_latest.json")
              .read_text(encoding="utf-8")
          )
          m = json.loads(
              Path("latest/standalone_swing_preproduction_readiness_meta_latest.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "FROZEN_PREPRODUCTION_READY"
          assert m["status"] == "FROZEN_PREPRODUCTION_READY"
          assert p["preproduction_contract_frozen"] is True
          assert p["data_layer_ready_for_preproduction"] is True
          assert p["request_time_price_path_ready_for_preproduction"] is True

          assert p["production_activation_allowed"] is False
          assert p["standalone_swing_table_enabled"] is False
          assert p["action_route_enabled"] is False
          assert p["standalone_command_defined"] is False
          assert p["final_header_selected"] is False

          c = p["snapshot_counts"]
          assert c["row_count"] == 235
          assert c["kospi"] == 210
          assert c["kosdaq"] == 25
          assert c["return_6m_ready"] == 234
          assert c["ma_full_ready"] == 234
          assert c["atr14_ready"] == 209
          assert c["range20_ready"] == 225
          assert c["rs_sector_ready"] == 210
          assert c["rs_sector_null"] == 25
          assert c["confirmed_stop_ready"] == 0
          assert c["pending_nonnull_violations"] == 0

          q = p["request_time_price_contract"]
          assert q["operation_id"] == "getRequestTimePrices"
          assert [q["initial_batch_max"], q["retry_failed_batch_max"], q["final_retry_failed_batch_max"]] == [10, 5, 2]
          assert q["final_failure_display"] == "⚪ 현재가 확인 실패"
          assert q["static_price_fallback_allowed"] is False
          assert q["new_price_action_required"] is False
          assert q["must_revalidate_at_activation"] is True

          assert p["evidence"]["v879_data_quality_gate"]["result"] == "PASS"
          assert p["evidence"]["v8710_request_time_price_path"]["result"] == "PASS"
          assert p["evidence"]["v8710_request_time_price_path"]["success_count"] == 235
          assert p["evidence"]["v8710_request_time_price_path"]["static_price_substitution_count"] == 0

          s = p["safety"]
          assert s["production_table_changed"] is False
          assert s["worker_changed"] is False
          assert s["action_schema_changed"] is False
          assert s["metric_formula_changed"] is False
          assert s["request_time_price_substitution"] is False
          assert s["new_command_invented"] is False
          assert s["new_route_invented"] is False
          assert s["final_header_invented"] is False
          assert s["pending_metric_autofill"] is False

          assert len(p["activation_blockers"]) > 0
          assert m["activation_blocker_count"] == len(p["activation_blockers"])

          print("V8711_FROZEN_READINESS_OBJECT=PASS")
          print("V8711_VALIDATED_SNAPSHOT=PASS")
          print("V8711_REQUEST_PRICE_POLICY=PASS")
          print("V8711_NO_PREMATURE_ACTIVATION=PASS")
          print("V8711_NO_INVENTED_CONTRACTS=PASS")
          PY

      - name: Verify protected production sources unchanged
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c /tmp/metric.sha
          sha256sum -c /tmp/worker.sha
          sha256sum -c /tmp/schema.sha
          sha256sum -c /tmp/readme.sha
          sha256sum -c /tmp/integrated.sha
          sha256sum -c /tmp/integrated_meta.sha

          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.after.sha
          diff -u /tmp/two_table.sha /tmp/two_table.after.sha

          git diff --exit-code -- \
            stock_table_metrics_v850.py \
            worker/krx-live-price-worker.js \
            docs/custom_gpt_action_schema.yaml \
            README_사용법.md \
            latest/standalone_swing_integrated_latest.json \
            latest/standalone_swing_integrated_meta_latest.json \
            api/two_table_v1

          echo "PROTECTED_SOURCE_FILES_CHANGED=false"
          echo "PRODUCTION_TWO_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "ACTION_SCHEMA_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"

      - name: Commit V8.7.11 frozen preproduction contract
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::Remote main changed after checkout. Rerun V8.7.11 from latest main."
            echo "BASE_SHA=$BASE_SHA"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            standalone_swing_preproduction_freeze_v8711.py \
            docs/standalone_swing_preproduction_contract_v8711.md \
            latest/standalone_swing_preproduction_readiness_latest.json \
            latest/standalone_swing_preproduction_readiness_meta_latest.json \
            latest/standalone_swing_preproduction_readiness_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"
          echo "V8711_STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "V8711_STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow staged unexpectedly"
            exit 1
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              standalone_swing_preproduction_freeze_v8711.py|\
              docs/standalone_swing_preproduction_contract_v8711.md|\
              latest/standalone_swing_preproduction_readiness_latest.json|\
              latest/standalone_swing_preproduction_readiness_meta_latest.json|\
              latest/standalone_swing_preproduction_readiness_run_log_latest.txt) ;;
              *)
                echo "::error::Unexpected staged path: $p"
                exit 1
                ;;
            esac
          done <<< "$STAGED"

          echo "WORKFLOW_FILES_STAGED=false"

          if ! git diff --cached --quiet; then
            git commit -m "Freeze V8.7.11 standalone swing preproduction contract"
            git push origin HEAD:main
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V8711_STANDALONE_SWING_PREPRODUCTION_FREEZE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "PREPRODUCTION_CONTRACT_FROZEN=true"
          echo "PRODUCTION_ACTIVATION_ALLOWED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "ACTION_ROUTE_ENABLED=false"
          echo "STANDALONE_COMMAND_DEFINED=false"
          echo "FINAL_HEADER_SELECTED=false"
          echo "PRODUCTION_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "ACTION_SCHEMA_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          test -f /tmp/v8711.log && cat /tmp/v8711.log || true
          test -f /tmp/v8711-validate.log && cat /tmp/v8711-validate.log || true
          git status --short || true
