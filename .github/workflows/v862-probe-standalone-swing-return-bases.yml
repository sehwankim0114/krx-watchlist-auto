name: Build standalone swing 6M return source v8.7.2

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture base and protected hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sha256sum stock_table_metrics_v850.py > /tmp/metric.sha
          sha256sum worker/krx-live-price-worker.js > /tmp/worker.sha
          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.sha
          echo "V872_BASE_SHA=$(git rev-parse HEAD)"

      - name: Restore V8.7.2 source builder
        shell: bash
        env:
          BUILDER_B64: ""
          CONTRACT_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path("standalone_swing_extended_returns_v872.py").write_bytes(
              base64.b64decode(os.environ["BUILDER_B64"])
          )
          Path("docs/standalone_swing_extended_returns_contract_v872.md").write_bytes(
              base64.b64decode(os.environ["CONTRACT_B64"])
          )
          PY
          python -m py_compile standalone_swing_extended_returns_v872.py
          echo "V872_SOURCE_RESTORE=PASS"

      - name: Build and validate extended return source
        shell: bash
        run: |
          set -euo pipefail
          python standalone_swing_extended_returns_v872.py | tee /tmp/v872.log

          grep -q '^V872_EXTENDED_RETURN_SOURCE_STATUS=READY_SOURCE_ONLY$' /tmp/v872.log
          grep -q '^TARGET_TICKERS=235$' /tmp/v872.log
          grep -q '^RETURN_6M_READY=234$' /tmp/v872.log
          grep -q '^RETURN_6M_SHORT=1$' /tmp/v872.log
          grep -q '^RETURN_6M_SHORT_TICKER=439960$' /tmp/v872.log
          grep -q '^PRODUCTION_1M_3M_REGRESSION_EXACT_MATCHES=30$' /tmp/v872.log
          grep -q '^RETURN_1W_CALCULATED=false$' /tmp/v872.log
          grep -q '^RETURN_YTD_CALCULATED=false$' /tmp/v872.log
          grep -q '^RETURN_52W_CALCULATED=false$' /tmp/v872.log
          grep -q '^STANDALONE_SWING_TABLE_ENABLED=false$' /tmp/v872.log
          grep -q '^METRIC_FORMULA_CHANGED=false$' /tmp/v872.log
          grep -q '^PRODUCTION_TABLE_CHANGED=false$' /tmp/v872.log
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v872.log
          grep -q '^V872_EXTENDED_RETURN_SOURCE_VALIDATION=PASS$' /tmp/v872.log

      - name: Verify protected production sources unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/metric.sha
          sha256sum -c /tmp/worker.sha
          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.after.sha
          diff -u /tmp/two_table.sha /tmp/two_table.after.sha

          git diff --exit-code -- stock_table_metrics_v850.py worker/krx-live-price-worker.js api/two_table_v1

          echo "METRIC_FORMULA_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "PRODUCTION_TWO_TABLE_CHANGED=false"

      - name: Validate output contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/v872-validate.log
          import json
          from pathlib import Path

          p = json.loads(Path("latest/standalone_swing_extended_returns_latest.json").read_text())
          m = json.loads(Path("latest/standalone_swing_extended_returns_meta_latest.json").read_text())

          assert p["status"] == "READY_SOURCE_ONLY"
          assert m["status"] == "READY_SOURCE_ONLY"
          assert p["source_only"] is True and m["source_only"] is True
          assert p["standalone_swing_table_enabled"] is False
          assert m["standalone_swing_table_enabled"] is False
          assert p["request_time_price_eligible"] is False
          assert p["return_basis"] == {
              "6m": "CALENDAR_MONTHS_FIRST_MARKET_SESSION_ON_OR_AFTER",
              "1w": None, "ytd": None, "52w": None,
          }
          assert p["row_count"] == 235
          assert p["return_6m_ready_count"] == 234
          assert p["return_6m_short_count"] == 1
          assert p["return_6m_short"][0]["ticker"] == "439960"
          assert p["production_1m_3m_regression_exact_matches"] == 30

          for row in p["rows"]:
              assert row["return_1w"] is None
              assert row["return_ytd"] is None
              assert row["return_52w"] is None

          s = p["safety"]
          assert s["return_6m_calculated"] is True
          assert s["return_1w_calculated"] is False
          assert s["return_ytd_calculated"] is False
          assert s["return_52w_calculated"] is False
          assert s["metric_formula_changed"] is False
          assert s["production_table_changed"] is False
          assert s["request_time_price_substitution"] is False

          print("V872_OUTPUT_CONTRACT=PASS")
          print("V872_6M_READY=234/235")
          print("V872_PENDING_1W_YTD_52W_NULL=PASS")
          PY

          grep -q '^V872_OUTPUT_CONTRACT=PASS$' /tmp/v872-validate.log
          grep -q '^V872_6M_READY=234/235$' /tmp/v872-validate.log
          grep -q '^V872_PENDING_1W_YTD_52W_NULL=PASS$' /tmp/v872-validate.log

      - name: Commit source-only outputs
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::Remote main changed after checkout. Rerun from latest main."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            standalone_swing_extended_returns_v872.py \
            docs/standalone_swing_extended_returns_contract_v872.md \
            latest/standalone_swing_extended_returns_latest.json \
            latest/standalone_swing_extended_returns_latest.csv \
            latest/standalone_swing_extended_returns_meta_latest.json \
            latest/standalone_swing_extended_returns_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"
          echo "V872_STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "V872_STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow staged unexpectedly"
            exit 1
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              standalone_swing_extended_returns_v872.py|\
              docs/standalone_swing_extended_returns_contract_v872.md|\
              latest/standalone_swing_extended_returns_latest.json|\
              latest/standalone_swing_extended_returns_latest.csv|\
              latest/standalone_swing_extended_returns_meta_latest.json|\
              latest/standalone_swing_extended_returns_run_log_latest.txt) ;;
              *) echo "::error::Unexpected staged path: $p"; exit 1 ;;
            esac
          done <<< "$STAGED"

          if ! git diff --cached --quiet; then
            git commit -m "Add V8.7.2 standalone swing 6M return source"
            git push origin HEAD:main
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V872_STANDALONE_SWING_6M_SOURCE_RELEASE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "RETURN_1W_CALCULATED=false"
          echo "RETURN_YTD_CALCULATED=false"
          echo "RETURN_52W_CALCULATED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "PRODUCTION_TABLE_CHANGED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          test -f /tmp/v872.log && cat /tmp/v872.log || true
          test -f /tmp/v872-validate.log && cat /tmp/v872-validate.log || true
          git status --short || true
