name: Probe full standalone swing sector RS v8.7.4

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v874-standalone-swing-sector-rs-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "V874_DEPENDENCIES=PASS"

      - name: Probe full KOSPI standalone sector RS
        shell: bash
        run: |
          set -euo pipefail

          test -n "${KRX_ID:-}" || { echo "::error::KRX_ID secret missing"; exit 1; }
          test -n "${KRX_PW:-}" || { echo "::error::KRX_PW secret missing"; exit 1; }

          python - <<'PY'
          from __future__ import annotations

          import contextlib
          import io
          import json
          import time
          from collections import Counter, defaultdict
          from pathlib import Path

          from pykrx import stock

          import sector_rs_source_v870 as sector

          OUT = Path("/tmp/v874_standalone_sector_rs")
          OUT.mkdir(parents=True, exist_ok=True)

          SWING = Path("latest/standalone_swing_source_latest.json")
          EXT = Path("latest/standalone_swing_extended_returns_latest.json")
          GLOSSARY = Path("latest/stock_table_metric_glossary_latest.json")
          TABLE_DIR = Path("api/two_table_v1")
          TABLES = ("kospi", "decliners", "decliners24")

          def read(path):
              return json.loads(path.read_text(encoding="utf-8-sig"))

          for p in (SWING, EXT, GLOSSARY, Path("sector_rs_source_v870.py")):
              if not p.is_file():
                  raise SystemExit("MISSING_REQUIRED_SOURCE:" + str(p))

          swing = read(SWING)
          ext = read(EXT)
          glossary = read(GLOSSARY)

          if swing.get("status") != "READY_SOURCE_ONLY":
              raise SystemExit("SWING_SOURCE_NOT_READY")
          if ext.get("status") != "READY_SOURCE_ONLY":
              raise SystemExit("EXTENDED_RETURN_SOURCE_NOT_READY")
          if swing.get("standalone_swing_table_enabled") is not False:
              raise SystemExit("SWING_TABLE_ALREADY_ENABLED")
          if ext.get("standalone_swing_table_enabled") is not False:
              raise SystemExit("EXT_TABLE_ALREADY_ENABLED")

          basis = swing.get("basis_date")
          if not basis or ext.get("basis_date") != basis:
              raise SystemExit("BASIS_MISMATCH")

          swing_rows = {
              str(r["ticker"]).zfill(6): r
              for r in swing.get("rows") or []
          }
          if len(swing_rows) != int(swing.get("row_count") or 0):
              raise SystemExit("SWING_ROW_COUNT_MISMATCH")

          kospi_tickers = sorted(
              ticker for ticker, row in swing_rows.items()
              if row.get("market") == "KOSPI"
          )
          kosdaq_tickers = sorted(
              ticker for ticker, row in swing_rows.items()
              if row.get("market") == "KOSDAQ"
          )
          unknown_market = sorted(
              ticker for ticker, row in swing_rows.items()
              if row.get("market") not in ("KOSPI", "KOSDAQ")
          )
          if unknown_market:
              raise SystemExit("UNKNOWN_MARKET:" + ",".join(unknown_market))

          # Current production RS snapshot used as a strict regression gate.
          prod = {}
          for name in TABLES:
              payload = read(TABLE_DIR / f"{name}.json")
              if payload.get("status") != "READY":
                  raise SystemExit("PRODUCTION_NOT_READY:" + name)
              if payload.get("basis_date") != basis:
                  raise SystemExit("PRODUCTION_BASIS_MISMATCH:" + name)
              for row in payload.get("rows") or []:
                  ticker = str(row.get("ticker") or "").zfill(6)
                  metrics = row.get("metrics") or {}
                  rs = metrics.get("rs_sector_pp")
                  benchmark = metrics.get("sector_benchmark")
                  if not isinstance(rs, dict) or rs.get("1") is None or rs.get("3") is None:
                      raise SystemExit("PRODUCTION_RS_NOT_READY:" + ticker)
                  snap = {
                      "rs_sector_pp": {"1": rs["1"], "3": rs["3"]},
                      "sector_benchmark": benchmark,
                      "name": row.get("name"),
                  }
                  if ticker in prod and prod[ticker] != snap:
                      raise SystemExit("PRODUCTION_DUPLICATE_MISMATCH:" + ticker)
                  prod[ticker] = snap

          if not prod:
              raise SystemExit("PRODUCTION_RS_EMPTY")

          # Official KRX source retrieval: exact same helper used by V8.7.0.
          basis_compact, names, members, basic = sector.fetch_official_sources(basis)
          if basis_compact != basis.replace("-", ""):
              raise SystemExit("OFFICIAL_BASIS_MISMATCH")

          mapping = {}
          mapping_errors = {}

          # Probe each ticker independently so one unmapped stock does not destroy
          # the evidence artifact.
          for ticker in kospi_tickers:
              try:
                  one = sector.build_mapping({ticker}, names, members, basic)
                  mapping[ticker] = one[ticker]
              except Exception as exc:
                  mapping_errors[ticker] = repr(exc)

          # Gather all required official industry-index close series.
          starts = []
          for ticker in mapping:
              src = swing_rows[ticker].get("returns") or {}
              for p in ("1", "3"):
                  item = src.get(p) or {}
                  if item.get("status") == "OK" and item.get("start_date"):
                      starts.append(item["start_date"])
          if not starts:
              raise SystemExit("RETURN_STARTS_EMPTY")

          earliest = min(starts).replace("-", "")
          index_closes = {}
          index_errors = {}
          for idx in sorted({m["benchmark_ticker"] for m in mapping.values()}):
              try:
                  with contextlib.redirect_stdout(io.StringIO()), contextlib.redirect_stderr(io.StringIO()):
                      df = stock.get_index_ohlcv_by_date(
                          earliest, basis.replace("-", ""), idx
                      )
                  if df is None or df.empty or "종가" not in df.columns:
                      raise ValueError("INDEX_OHLCV_EMPTY")
                  index_closes[idx] = {
                      (dt.strftime("%Y-%m-%d") if hasattr(dt, "strftime") else str(dt)[:10]): float(value)
                      for dt, value in df["종가"].items()
                  }
              except Exception as exc:
                  index_errors[idx] = repr(exc)
              time.sleep(0.08)

          rows = []
          value_ready = 0
          value_errors = {}

          for ticker in kospi_tickers:
              s = swing_rows[ticker]
              m = mapping.get(ticker)
              item = {
                  "ticker": ticker,
                  "name": s.get("name"),
                  "market": "KOSPI",
                  "mapping_status": "READY" if m else "UNMAPPED",
                  "mapping": m,
                  "rs_sector_pp": None,
                  "error": mapping_errors.get(ticker),
              }

              if m:
                  idx = m["benchmark_ticker"]
                  closes = index_closes.get(idx)
                  if not closes:
                      item["mapping_status"] = "INDEX_HISTORY_FAILED"
                      item["error"] = index_errors.get(idx, "INDEX_HISTORY_UNAVAILABLE")
                  else:
                      values = {}
                      ok = True
                      for p in ("1", "3"):
                          src = (s.get("returns") or {}).get(p) or {}
                          start = src.get("start_date")
                          pct = src.get("pct")
                          if src.get("status") != "OK" or start is None or pct is None:
                              ok = False
                              item["error"] = f"STOCK_RETURN_NOT_READY:{p}"
                              break
                          if start not in closes or basis not in closes:
                              ok = False
                              item["error"] = f"INDEX_DATE_MISSING:{p}:{start}"
                              break
                          start_close = closes[start]
                          end_close = closes[basis]
                          if start_close <= 0:
                              ok = False
                              item["error"] = f"INDEX_START_CLOSE_INVALID:{p}:{start}"
                              break
                          index_return = 100.0 * (end_close / start_close - 1.0)
                          values[p] = round(float(pct) - index_return, 4)

                      if ok:
                          item["rs_sector_pp"] = values
                          item["mapping_status"] = "READY_WITH_VALUES"
                          value_ready += 1
                      else:
                          value_errors[ticker] = item["error"]

              rows.append(item)

          # Strict production regression: extended calculation must reproduce
          # every currently published V8.7.0 production value and benchmark.
          regression_matches = 0
          regression_mismatches = []
          by_ticker = {r["ticker"]: r for r in rows}

          for ticker, expected in sorted(prod.items()):
              actual = by_ticker.get(ticker)
              if actual is None:
                  regression_mismatches.append({
                      "ticker": ticker,
                      "reason": "NOT_IN_STANDALONE_KOSPI_SOURCE",
                  })
                  continue

              expected_b = expected.get("sector_benchmark") or {}
              actual_b = actual.get("mapping") or {}
              actual_rs = actual.get("rs_sector_pp")

              benchmark_ok = (
                  str(expected_b.get("benchmark_ticker")) == str(actual_b.get("benchmark_ticker"))
                  and expected_b.get("benchmark_name") == actual_b.get("benchmark_name")
              )
              rs_ok = actual_rs == expected["rs_sector_pp"]

              if benchmark_ok and rs_ok:
                  regression_matches += 1
              else:
                  regression_mismatches.append({
                      "ticker": ticker,
                      "name": expected.get("name"),
                      "expected_rs": expected["rs_sector_pp"],
                      "actual_rs": actual_rs,
                      "expected_benchmark": expected_b,
                      "actual_benchmark": actual_b,
                  })

          footer = glossary.get("compact_footer_text")
          if not footer:
              raise SystemExit("GLOSSARY_COMPACT_FOOTER_TEXT_MISSING")

          result = {
              "version": "2026-09-12-v8.7.4-standalone-sector-rs-coverage-probe",
              "status": "READY_EVIDENCE_ONLY",
              "repository_write": False,
              "production_change": False,
              "standalone_swing_table_enabled": False,
              "basis_date": basis,
              "source_ticker_count": len(swing_rows),
              "market_counts": {
                  "KOSPI": len(kospi_tickers),
                  "KOSDAQ": len(kosdaq_tickers),
              },
              "kospi_mapping_ready_count": len(mapping),
              "kospi_mapping_missing_count": len(kospi_tickers) - len(mapping),
              "kospi_rs_value_ready_count": value_ready,
              "kospi_rs_value_missing_count": len(kospi_tickers) - value_ready,
              "kosdaq_sector_rs_status": "NOT_PROBED_CURRENT_CONTRACT_KOSPI_ONLY",
              "production_unique_ticker_count": len(prod),
              "production_regression_exact_matches": regression_matches,
              "production_regression_mismatch_count": len(regression_mismatches),
              "production_regression_mismatches": regression_mismatches,
              "index_history_error_count": len(index_errors),
              "mapping_errors": mapping_errors,
              "value_errors": value_errors,
              "glossary_footer_text": footer,
              "rows": rows,
              "safety": {
                  "new_sector_contract_defined": False,
                  "kosdaq_sector_mapping_invented": False,
                  "production_table_changed": False,
                  "worker_changed": False,
                  "metric_formula_changed": False,
                  "request_time_price_substitution": False,
              },
          }

          (OUT / "standalone-sector-rs-coverage-v874.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          md = [
              "# V8.7.4 독립 스윙 업종RS 전체범위 Probe",
              "",
              f"- 기준일: {basis}",
              f"- 전체 독립 스윙 source: {len(swing_rows)}",
              f"- KOSPI: {len(kospi_tickers)}",
              f"- KOSDAQ: {len(kosdaq_tickers)}",
              f"- KOSPI 공식 업종 매핑 성공: {len(mapping)}/{len(kospi_tickers)}",
              f"- KOSPI 업종RS 값 계산 성공: {value_ready}/{len(kospi_tickers)}",
              f"- 기존 production 회귀 일치: {regression_matches}/{len(prod)}",
              f"- 기존 production 회귀 불일치: {len(regression_mismatches)}",
              f"- 업종지수 히스토리 오류: {len(index_errors)}",
              "",
              "## 원칙",
              "",
              "- 기존 V8.7.0 공식 KRX KOSPI 업종지수 매핑 로직만 재사용한다.",
              "- KOSDAQ 25종목에는 새 업종 매핑 규칙을 만들지 않는다.",
              "- repository·production·Worker를 수정하지 않는다.",
              "- 요청시점 현재가로 업종RS를 재계산하지 않는다.",
              "",
              "## 핵심 용어 읽는 법",
              "",
              footer,
          ]

          if mapping_errors:
              md += ["", "## KOSPI 미매핑 종목"]
              for ticker, error in sorted(mapping_errors.items()):
                  md.append(
                      f"- {swing_rows[ticker].get('name')}({ticker}): `{error}`"
                  )

          if regression_mismatches:
              md += ["", "## Production 회귀 불일치"]
              for x in regression_mismatches[:20]:
                  md.append("- " + json.dumps(x, ensure_ascii=False))

          (OUT / "standalone-sector-rs-coverage-v874.md").write_text(
              "\n".join(md) + "\n", encoding="utf-8"
          )

          print("V874_SECTOR_RS_PROBE=READY_EVIDENCE_ONLY")
          print("SOURCE_TICKERS=" + str(len(swing_rows)))
          print("KOSPI_TICKERS=" + str(len(kospi_tickers)))
          print("KOSDAQ_TICKERS=" + str(len(kosdaq_tickers)))
          print("KOSPI_MAPPING_READY=" + str(len(mapping)))
          print("KOSPI_MAPPING_MISSING=" + str(len(kospi_tickers) - len(mapping)))
          print("KOSPI_RS_VALUE_READY=" + str(value_ready))
          print("KOSPI_RS_VALUE_MISSING=" + str(len(kospi_tickers) - value_ready))
          print("PRODUCTION_UNIQUE_TICKERS=" + str(len(prod)))
          print("PRODUCTION_REGRESSION_EXACT_MATCHES=" + str(regression_matches))
          print("PRODUCTION_REGRESSION_MISMATCHES=" + str(len(regression_mismatches)))
          print("INDEX_HISTORY_ERRORS=" + str(len(index_errors)))
          print("GLOSSARY_FOOTER_KEY=compact_footer_text")
          print("GLOSSARY_FOOTER_READY=true")
          print("KOSDAQ_SECTOR_MAPPING_INVENTED=false")
          print("REPOSITORY_WRITE=false")
          print("PRODUCTION_CHANGE=false")
          print("REQUEST_TIME_PRICE_SUBSTITUTION=false")
          PY

      - name: Validate probe safety
        shell: bash
        run: |
          set -euo pipefail

          test -f /tmp/v874_standalone_sector_rs/standalone-sector-rs-coverage-v874.json
          test -f /tmp/v874_standalone_sector_rs/standalone-sector-rs-coverage-v874.md

          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("/tmp/v874_standalone_sector_rs/standalone-sector-rs-coverage-v874.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "READY_EVIDENCE_ONLY"
          assert p["repository_write"] is False
          assert p["production_change"] is False
          assert p["standalone_swing_table_enabled"] is False
          assert p["source_ticker_count"] == p["market_counts"]["KOSPI"] + p["market_counts"]["KOSDAQ"]
          assert p["production_regression_mismatch_count"] == 0
          assert p["production_regression_exact_matches"] == p["production_unique_ticker_count"]
          assert p["glossary_footer_text"].startswith("읽는 법:")
          assert p["kosdaq_sector_rs_status"] == "NOT_PROBED_CURRENT_CONTRACT_KOSPI_ONLY"

          s = p["safety"]
          assert s["new_sector_contract_defined"] is False
          assert s["kosdaq_sector_mapping_invented"] is False
          assert s["production_table_changed"] is False
          assert s["worker_changed"] is False
          assert s["metric_formula_changed"] is False
          assert s["request_time_price_substitution"] is False

          print("V874_PRODUCTION_RS_REGRESSION=PASS")
          print("V874_GLOSSARY_FOOTER_FIX=PASS")
          print("V874_READ_ONLY_SAFETY=PASS")
          PY

          git diff --exit-code
          git diff --cached --exit-code

          echo "ORIGINAL_CHECKOUT_UNCHANGED=PASS"
          echo "NO_COMMIT_NO_PUSH_NO_DEPLOY=PASS"

      - name: Upload V8.7.4 evidence
        uses: actions/upload-artifact@v6
        with:
          name: standalone-sector-rs-coverage-v874
          path: |
            /tmp/v874_standalone_sector_rs/standalone-sector-rs-coverage-v874.json
            /tmp/v874_standalone_sector_rs/standalone-sector-rs-coverage-v874.md
          if-no-files-found: error
          retention-days: 14
