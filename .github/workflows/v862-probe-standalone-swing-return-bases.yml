                  "from_trough_pct", "from_peak_pct", "momentum_5d_pct",
                  "ma5_direction", "ma20_direction", "ma60_direction", "ma120_direction",
                  "mean_run_days", "streak_direction", "streak_days", "streak_change_pct",
