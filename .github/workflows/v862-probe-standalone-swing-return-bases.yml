                          "rs_sector_3m_pp": rss.get("3"),
                          "atr14_pct": atr.get("pct"),
                          "avg_daily_range_20_pct": row.get("avg_daily_range_20_pct"),
                          "ma20_reference": trailing.get("ma20_close_level"),
                          "confirmed_swing_low_stop": None,
                          "rsi": None,
