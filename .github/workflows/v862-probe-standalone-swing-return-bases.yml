      - name: Guard protected production files
        shell: bash
        run: |
          set -euo pipefail

          git diff --exit-code -- \
            api/manifest.json \
            docs/custom_gpt_action_schema.yaml \
            worker/krx-live-price-worker.js \
            stock_table_metrics_v850.py \
            api/two_table_v1

          echo "PRODUCTION_TWO_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "ACTION_SCHEMA_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"

      - name: Commit V8.7.18 readiness synchronization
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "::error::Remote main changed after checkout. Rerun V8.7.18 from latest main."
            echo "BASE_SHA=$BASE_SHA"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            docs/standalone_swing_readiness_sync_v8718.md \
            standalone_swing_readiness_sync_v8718.py \
            latest/standalone_swing_preproduction_readiness_latest.json \
            latest/standalone_swing_preproduction_readiness_meta_latest.json \
            latest/standalone_swing_preproduction_readiness_run_log_latest.txt \
            latest/standalone_swing_display_merge_readiness_latest.json \
            latest/standalone_swing_display_merge_readiness_meta_latest.json \
            latest/standalone_swing_display_merge_readiness_run_log_latest.txt

          mapfile -t staged < <(git diff --cached --name-only | sort)

          echo "V8718_STAGED_FILES_BEGIN"
          printf '%s\n' "${staged[@]}"
          echo "V8718_STAGED_FILES_END"

          if [[ "${#staged[@]}" -ne 8 ]]; then
            echo "::error::Expected exactly 8 staged files, got ${#staged[@]}"
            exit 1
          fi

          if printf '%s\n' "${staged[@]}" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file staged unexpectedly"
            exit 1
          fi

          git commit -m "Sync V8.7.18 standalone swing readiness"
          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V8718_READINESS_SYNC=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "RETURN_BASIS_CONTRACT_FROZEN=true"
          echo "REQUEST_TIME_DISPLAY_MERGE_CONTRACT_FROZEN=true"
          echo "ACTIVATION_BLOCKER_COUNT=7"
          echo "PENDING_METRIC_COUNT=5"
          echo "PRODUCTION_ACTIVATION_ALLOWED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "ACTION_ROUTE_ENABLED=false"
          echo "STANDALONE_COMMAND_DEFINED=false"
          echo "FINAL_HEADER_SELECTED=false"
          echo "PRODUCTION_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "ACTION_SCHEMA_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          test -f /tmp/v8718.log && cat /tmp/v8718.log || true
          git status --short || true
