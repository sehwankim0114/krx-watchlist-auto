name: Build integrated standalone swing source v8.7.6

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Capture base and protected hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sha256sum stock_table_metrics_v850.py > /tmp/metric.sha
          sha256sum worker/krx-live-price-worker.js > /tmp/worker.sha
          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.sha
          sha256sum latest/standalone_swing_source_latest.json > /tmp/swing_source.sha
          sha256sum latest/standalone_swing_extended_returns_latest.json > /tmp/extended_source.sha
          sha256sum latest/standalone_swing_sector_rs_latest.json > /tmp/sector_source.sha
          sha256sum latest/stock_table_metric_glossary_latest.json > /tmp/glossary.sha
          echo "V876_BASE_SHA=$(git rev-parse HEAD)"

      - name: Restore V8.7.6 builder and contract
        shell: bash
        env:
          BUILDER_B64: ""
          CONTRACT_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path("standalone_swing_integrated_v876.py").write_bytes(
              base64.b64decode(os.environ["BUILDER_B64"])
          )
          Path("docs/standalone_swing_integrated_contract_v876.md").write_bytes(
              base64.b64decode(os.environ["CONTRACT_B64"])
          )
          PY

          python -m py_compile standalone_swing_integrated_v876.py
          echo "V876_SOURCE_RESTORE=PASS"

      - name: Build integrated source-only cache
        shell: bash
        run: |
          set -euo pipefail

          python standalone_swing_integrated_v876.py | tee /tmp/v876.log

          grep -q '^V876_INTEGRATED_SWING_SOURCE_STATUS=READY_SOURCE_ONLY$' /tmp/v876.log
          grep -q '^GLOSSARY_FOOTER_READY=true$' /tmp/v876.log
          grep -q '^RETURN_1W_CALCULATED=false$' /tmp/v876.log
          grep -q '^RETURN_YTD_CALCULATED=false$' /tmp/v876.log
          grep -q '^RETURN_52W_CALCULATED=false$' /tmp/v876.log
          grep -q '^RSI_CALCULATED=false$' /tmp/v876.log
          grep -q '^MACD_CALCULATED=false$' /tmp/v876.log
          grep -q '^INVESTMENT_SCORE_100_CALCULATED=false$' /tmp/v876.log
          grep -q '^EARNINGS_OUTLOOK_CHANGE_CALCULATED=false$' /tmp/v876.log
          grep -q '^CONFIRMED_SWING_LOW_STOP_CALCULATED=false$' /tmp/v876.log
          grep -q '^KOSDAQ_SECTOR_MAPPING_INVENTED=false$' /tmp/v876.log
          grep -q '^STANDALONE_SWING_TABLE_ENABLED=false$' /tmp/v876.log
          grep -q '^ACTION_ROUTE_ENABLED=false$' /tmp/v876.log
          grep -q '^PRODUCTION_TABLE_CHANGED=false$' /tmp/v876.log
          grep -q '^WORKER_SOURCE_CHANGED=false$' /tmp/v876.log
          grep -q '^METRIC_FORMULA_CHANGED=false$' /tmp/v876.log
          grep -q '^REQUEST_TIME_PRICE_SUBSTITUTION=false$' /tmp/v876.log
          grep -q '^V876_INTEGRATED_SWING_SOURCE_VALIDATION=PASS$' /tmp/v876.log

      - name: Validate integrated contract
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY' | tee /tmp/v876-validate.log
          import json
          from pathlib import Path

          p = json.loads(
              Path("latest/standalone_swing_integrated_latest.json")
              .read_text(encoding="utf-8")
          )
          m = json.loads(
              Path("latest/standalone_swing_integrated_meta_latest.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "READY_SOURCE_ONLY"
          assert m["status"] == "READY_SOURCE_ONLY"
          assert p["source_only"] is True and m["source_only"] is True
          assert p["standalone_swing_table_enabled"] is False
          assert m["standalone_swing_table_enabled"] is False
          assert p["action_route_enabled"] is False
          assert m["action_route_enabled"] is False
          assert p["request_time_price_eligible"] is False
          assert p["row_count"] == m["row_count"]
          assert p["row_count"] == p["market_counts"]["KOSPI"] + p["market_counts"]["KOSDAQ"]
          assert p["return_6m_ready_count"] + p["return_6m_missing_count"] == p["row_count"]
          assert p["kospi_sector_rs_ready_count"] == p["market_counts"]["KOSPI"]
          assert p["kosdaq_sector_rs_null_count"] == p["market_counts"]["KOSDAQ"]
          assert p["metric_glossary_footer"].startswith("읽는 법:")

          expected_pending = {
              "return_1w", "return_ytd", "return_52w", "rsi", "macd",
              "investment_score_100", "earnings_outlook_change",
              "confirmed_swing_low_stop",
          }
          assert set(p["pending_metrics"]) == expected_pending

          for row in p["rows"]:
              assert set(row["pending_metrics"]) == expected_pending
              assert all(v is None for v in row["pending_metrics"].values())
              assert row["price_performance"]["1w"] is None
              assert row["price_performance"]["ytd"] is None
              assert row["price_performance"]["52w"] is None
              assert row["trailing_reference"]["confirmed_swing_low_stop"] is None
              if row["market"] == "KOSPI":
                  assert row["rs_sector_pp"]["1"] is not None
                  assert row["rs_sector_pp"]["3"] is not None
                  assert row["sector_benchmark"] is not None
              else:
                  assert row["market"] == "KOSDAQ"
                  assert row["rs_sector_pp"] == {"1": None, "3": None}
                  assert row["sector_benchmark"] is None

          s = p["safety"]
          assert s["standalone_swing_table_enabled"] is False
          assert s["action_route_enabled"] is False
          assert s["production_table_changed"] is False
          assert s["worker_changed"] is False
          assert s["metric_formula_changed"] is False
          assert s["request_time_price_substitution"] is False

          print("V876_INTEGRATED_CONTRACT=PASS")
          print("V876_TICKER_SET_ALIGNMENT=PASS")
          print("V876_PENDING_METRICS_NULL=PASS")
          print("V876_KOSPI_SECTOR_RS_READY=PASS")
          print("V876_KOSDAQ_SECTOR_RS_NULL=PASS")
          print("V876_GLOSSARY_FOOTER=PASS")
          PY

      - name: Verify protected sources unchanged
        shell: bash
        run: |
          set -euo pipefail

          sha256sum -c /tmp/metric.sha
          sha256sum -c /tmp/worker.sha
          sha256sum -c /tmp/swing_source.sha
          sha256sum -c /tmp/extended_source.sha
          sha256sum -c /tmp/sector_source.sha
          sha256sum -c /tmp/glossary.sha

          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.after.sha
          diff -u /tmp/two_table.sha /tmp/two_table.after.sha

          git diff --exit-code -- \
            stock_table_metrics_v850.py \
            worker/krx-live-price-worker.js \
            api/two_table_v1 \
            latest/standalone_swing_source_latest.json \
            latest/standalone_swing_extended_returns_latest.json \
            latest/standalone_swing_sector_rs_latest.json \
            latest/stock_table_metric_glossary_latest.json

          echo "PROTECTED_SOURCE_FILES_CHANGED=false"
          echo "PRODUCTION_TWO_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"

      - name: Commit V8.7.6 integrated source
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::Remote main changed after checkout. Rerun V8.7.6 from latest main."
            echo "BASE_SHA=$BASE_SHA"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            standalone_swing_integrated_v876.py \
            docs/standalone_swing_integrated_contract_v876.md \
            latest/standalone_swing_integrated_latest.json \
            latest/standalone_swing_integrated_latest.csv \
            latest/standalone_swing_integrated_meta_latest.json \
            latest/standalone_swing_integrated_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"
          echo "V876_STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "V876_STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow staged unexpectedly"
            exit 1
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              standalone_swing_integrated_v876.py|\
              docs/standalone_swing_integrated_contract_v876.md|\
              latest/standalone_swing_integrated_latest.json|\
              latest/standalone_swing_integrated_latest.csv|\
              latest/standalone_swing_integrated_meta_latest.json|\
              latest/standalone_swing_integrated_run_log_latest.txt) ;;
              *)
                echo "::error::Unexpected staged path: $p"
                exit 1
                ;;
            esac
          done <<< "$STAGED"

          echo "WORKFLOW_FILES_STAGED=false"

          if ! git diff --cached --quiet; then
            git commit -m "Add V8.7.6 integrated standalone swing source"
            git push origin HEAD:main
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V876_INTEGRATED_STANDALONE_SWING_RELEASE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "ACTION_ROUTE_ENABLED=false"
          echo "PRODUCTION_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          test -f /tmp/v876.log && cat /tmp/v876.log || true
          test -f /tmp/v876-validate.log && cat /tmp/v876-validate.log || true
          git status --short || true
