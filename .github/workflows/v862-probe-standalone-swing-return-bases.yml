              }
              write_json(OUT_JSON, payload)

              csv_fields = [
                  "basis_date", "market", "ticker", "name", "official_close",
                  "return_1w_pct", "return_1m_pct", "return_3m_pct", "return_6m_pct",
                  "return_ytd_pct", "return_52w_pct",
