name: Correct standalone swing return-basis resolver evidence v8.7.15

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v8715-standalone-swing-return-basis-resolver-correction
  cancel-in-progress: false

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Correct resolver evidence using official market sessions
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from __future__ import annotations

          import csv
          import json
          import math
          import statistics
          from collections import defaultdict
          from datetime import date, timedelta
          from pathlib import Path

          from stock_table_metrics_v850 import normalize_bars, period_return

          HISTORY = Path("latest/active_stock_long_history_260d_latest.csv")
          HISTORY_META = Path("latest/active_stock_long_history_260d_meta_latest.json")
          INDEX = Path("latest/official_index_history_latest.csv")
          EXTENDED = Path("latest/standalone_swing_extended_returns_latest.json")
          DISPLAY = Path("latest/standalone_swing_display_merge_readiness_latest.json")
          OUT = Path("/tmp/v8715_return_basis_resolver_correction")
          OUT.mkdir(parents=True, exist_ok=True)

          for p in (HISTORY, HISTORY_META, INDEX, EXTENDED, DISPLAY):
              if not p.is_file():
                  raise SystemExit("MISSING_REQUIRED_SOURCE:" + str(p))

          def read_json(p):
              return json.loads(p.read_text(encoding="utf-8-sig"))

          def read_csv(p):
              with p.open(encoding="utf-8-sig", newline="") as f:
                  return list(csv.DictReader(f))

          history_meta = read_json(HISTORY_META)
          extended = read_json(EXTENDED)
          display = read_json(DISPLAY)

          if history_meta.get("status") != "READY":
              raise SystemExit("HISTORY_META_NOT_READY")
          if extended.get("status") != "READY_SOURCE_ONLY":
              raise SystemExit("EXTENDED_RETURNS_NOT_READY")
          if display.get("status") != "FROZEN_PREPRODUCTION_READY":
              raise SystemExit("DISPLAY_MERGE_NOT_FROZEN")
          if display.get("production_activation_allowed") is not False:
              raise SystemExit("PRODUCTION_ALREADY_ALLOWED")

          basis = str(extended.get("basis_date") or "")
          if not basis or history_meta.get("cache_max_date") != basis:
              raise SystemExit("BASIS_MISMATCH")
          if display.get("basis_date") != basis:
              raise SystemExit("DISPLAY_BASIS_MISMATCH")

          approved = extended.get("return_basis") or {}
          if approved.get("6m") != "CALENDAR_MONTHS_FIRST_MARKET_SESSION_ON_OR_AFTER":
              raise SystemExit("APPROVED_6M_CONTRACT_MISMATCH")
          if any(approved.get(k) is not None for k in ("1w", "ytd", "52w")):
              raise SystemExit("PENDING_RETURN_ALREADY_APPROVED_UNEXPECTEDLY")

          history = read_csv(HISTORY)
          target = [str(x).zfill(6) for x in (history_meta.get("target_tickers") or [])]
          target_set = set(target)
          if len(target) != 235 or len(target_set) != 235:
              raise SystemExit("TARGET_UNIVERSE_MISMATCH")

          by_ticker = defaultdict(list)
          identity = {}
          for row in history:
              ticker = str(row.get("ticker") or "").zfill(6)
              if ticker in target_set:
                  by_ticker[ticker].append(row)
                  identity[ticker] = {
                      "name": str(row.get("name") or ""),
                      "market": str(row.get("market") or ""),
                  }

          if set(by_ticker) != target_set:
              raise SystemExit("TARGET_HISTORY_SET_MISMATCH")

          index_rows = read_csv(INDEX)
          sessions = sorted({
              str(r["date"])
              for r in index_rows
              if str(r.get("market")) == "KOSPI" and str(r.get("date")) <= basis
          })
          if not sessions or sessions[-1] != basis:
              raise SystemExit("KOSPI_SESSION_CALENDAR_NOT_CURRENT")

          basis_d = date.fromisoformat(basis)
          session_dates = [date.fromisoformat(s) for s in sessions]
          session_index = {s: i for i, s in enumerate(sessions)}
          if basis not in session_index:
              raise SystemExit("BASIS_SESSION_MISSING")

          # Exact official-session resolvers. These do NOT use a ticker's first
          # available post-listing row as a substitute for the intended start date.
          def official_on_or_after(target_day: date):
              t = target_day.isoformat()
              eligible = [s for s in sessions if t <= s <= basis]
              return eligible[0] if eligible else None

          def official_n_sessions_before_basis(n: int):
              i = session_index[basis]
              if i < n:
                  return None
              return sessions[i - n]

          current_year_sessions = [
              s for s in sessions if date.fromisoformat(s).year == basis_d.year
          ]
          prior_year_sessions = [
              s for s in sessions if date.fromisoformat(s).year == basis_d.year - 1
          ]
          if not current_year_sessions or not prior_year_sessions:
              raise SystemExit("YTD_SESSION_CALENDAR_INCOMPLETE")

          ytd_first_session = current_year_sessions[0]
          ytd_prior_year_close = prior_year_sessions[-1]
          one_week_calendar_start = official_on_or_after(basis_d - timedelta(days=7))
          one_week_5session_start = official_n_sessions_before_basis(5)
          fifty2_calendar_start = official_on_or_after(basis_d - timedelta(weeks=52))
          fifty2_252session_start = official_n_sessions_before_basis(252)

          if not all([
              one_week_calendar_start,
              one_week_5session_start,
              fifty2_calendar_start,
              fifty2_252session_start,
          ]):
              raise SystemExit("GLOBAL_START_SESSION_RESOLUTION_FAILED")

          def stock_return_at_start(bars, start_date):
              prices = {b["date"]: b["close"] for b in bars}
              if start_date not in prices or basis not in prices:
                  return {
                      "pct": None,
                      "start_date": start_date,
                      "status": "HISTORY_SHORT_OR_DATE_MISSING",
                  }
              start = prices[start_date]
              end = prices[basis]
              return {
                  "pct": round(100.0 * (end / start - 1.0), 4),
                  "start_date": start_date,
                  "status": "OK",
              }

          rows = []
          counts = {
              "total": 235,
              "1w_calendar_ready": 0,
              "1w_5session_ready": 0,
              "1w_both_ready": 0,
              "1w_same_start_date": 0,
              "1w_same_return": 0,
              "ytd_first_session_ready": 0,
              "ytd_prior_year_close_ready": 0,
              "ytd_both_ready": 0,
              "52w_calendar_ready": 0,
              "52w_252session_ready": 0,
              "52w_both_ready": 0,
              "52w_same_start_date": 0,
          }

          miss = {
              "1w_calendar": [],
              "1w_5session": [],
              "ytd_first_session": [],
              "ytd_prior_year_close": [],
              "52w_calendar": [],
              "52w_252session": [],
          }
          diff_1w = []
          diff_ytd = []
          diff_52w = []

          # Regression: approved 6M resolver must still produce the exact stored source.
          stored_6m = {
              str(r["ticker"]).zfill(6): r["return_6m"]
              for r in (extended.get("rows") or [])
          }
          if len(stored_6m) != 235:
              raise SystemExit("STORED_6M_ROW_COUNT_MISMATCH")

          sixm_exact = 0
          sixm_mismatch = []

          for ticker in sorted(target):
              bars = normalize_bars(by_ticker[ticker], basis)

              actual6 = period_return(bars, basis, 6, sessions)
              expected6 = stored_6m[ticker]
              if actual6 == expected6:
                  sixm_exact += 1
              else:
                  sixm_mismatch.append({
                      "ticker": ticker,
                      "expected": expected6,
                      "actual": actual6,
                  })

              r1a = stock_return_at_start(bars, one_week_calendar_start)
              r1b = stock_return_at_start(bars, one_week_5session_start)
              rya = stock_return_at_start(bars, ytd_first_session)
              ryb = stock_return_at_start(bars, ytd_prior_year_close)
              r52a = stock_return_at_start(bars, fifty2_calendar_start)
              r52b = stock_return_at_start(bars, fifty2_252session_start)

              candidates = [
                  ("1w_calendar", r1a, "1w_calendar_ready"),
                  ("1w_5session", r1b, "1w_5session_ready"),
                  ("ytd_first_session", rya, "ytd_first_session_ready"),
                  ("ytd_prior_year_close", ryb, "ytd_prior_year_close_ready"),
                  ("52w_calendar", r52a, "52w_calendar_ready"),
                  ("52w_252session", r52b, "52w_252session_ready"),
              ]
              for key, res, count_key in candidates:
                  if res["status"] == "OK":
                      counts[count_key] += 1
                  else:
                      miss[key].append({
                          "ticker": ticker,
                          "name": identity[ticker]["name"],
                          "market": identity[ticker]["market"],
                          "history_rows": len(bars),
                          "history_min_date": bars[0]["date"] if bars else None,
                          "intended_start_date": res["start_date"],
                          "status": res["status"],
                      })

              if r1a["status"] == "OK" and r1b["status"] == "OK":
                  counts["1w_both_ready"] += 1
                  if r1a["start_date"] == r1b["start_date"]:
                      counts["1w_same_start_date"] += 1
                  d = abs(r1a["pct"] - r1b["pct"])
                  diff_1w.append(d)
                  if d < 1e-12:
                      counts["1w_same_return"] += 1

              if rya["status"] == "OK" and ryb["status"] == "OK":
                  counts["ytd_both_ready"] += 1
                  diff_ytd.append(abs(rya["pct"] - ryb["pct"]))

              if r52a["status"] == "OK" and r52b["status"] == "OK":
                  counts["52w_both_ready"] += 1
                  if r52a["start_date"] == r52b["start_date"]:
                      counts["52w_same_start_date"] += 1
                  diff_52w.append(abs(r52a["pct"] - r52b["pct"]))

              rows.append({
                  "ticker": ticker,
                  "name": identity[ticker]["name"],
                  "market": identity[ticker]["market"],
                  "basis_date": basis,
                  "one_week": {
                      "calendar_7d_official_session": r1a,
                      "five_prior_official_sessions": r1b,
                  },
                  "ytd": {
                      "first_official_session_current_year": rya,
                      "prior_year_final_official_session": ryb,
                  },
                  "fifty_two_week": {
                      "calendar_52w_official_session": r52a,
                      "252_prior_official_sessions": r52b,
                  },
              })

          if sixm_exact != 235 or sixm_mismatch:
              raise SystemExit(
                  "APPROVED_6M_REGRESSION_FAILED:"
                  + json.dumps(sixm_mismatch, ensure_ascii=False)[:5000]
              )

          def stats(vals):
              if not vals:
                  return {
                      "count": 0,
                      "mean_abs_pp": None,
                      "median_abs_pp": None,
                      "max_abs_pp": None,
                  }
              return {
                  "count": len(vals),
                  "mean_abs_pp": round(statistics.mean(vals), 4),
                  "median_abs_pp": round(statistics.median(vals), 4),
                  "max_abs_pp": round(max(vals), 4),
              }

          # Correctness expectations derived from official-session resolver.
          # Do not silently accept the V8.7.14 naive per-ticker first-available result.
          expected_52w_missing = {"217590", "439960"}
          actual_52w_cal_missing = {r["ticker"] for r in miss["52w_calendar"]}
          actual_52w_252_missing = {r["ticker"] for r in miss["52w_252session"]}

          if actual_52w_cal_missing != expected_52w_missing:
              raise SystemExit(
                  "UNEXPECTED_52W_CALENDAR_MISSING_SET:"
                  + json.dumps(sorted(actual_52w_cal_missing), ensure_ascii=False)
              )
          if actual_52w_252_missing != expected_52w_missing:
              raise SystemExit(
                  "UNEXPECTED_52W_252_MISSING_SET:"
                  + json.dumps(sorted(actual_52w_252_missing), ensure_ascii=False)
              )
          if counts["52w_calendar_ready"] != 233:
              raise SystemExit("CORRECTED_52W_CALENDAR_READY_MUST_BE_233")
          if counts["52w_252session_ready"] != 233:
              raise SystemExit("CORRECTED_52W_252_READY_MUST_BE_233")

          expected_ytd_missing = {"439960"}
          if {r["ticker"] for r in miss["ytd_first_session"]} != expected_ytd_missing:
              raise SystemExit("UNEXPECTED_YTD_FIRST_SESSION_MISSING_SET")
          if {r["ticker"] for r in miss["ytd_prior_year_close"]} != expected_ytd_missing:
              raise SystemExit("UNEXPECTED_YTD_PRIOR_YEAR_MISSING_SET")

          result = {
              "version": "2026-09-13-v8.7.15-return-basis-resolver-correction",
              "status": "READY_CORRECTED_EVIDENCE_ONLY",
              "repository_write": False,
              "production_change": False,
              "worker_change": False,
              "formula_selected": False,
              "basis_date": basis,
              "source_row_count": 235,
              "official_session_calendar_source": str(INDEX),
              "approved_6m_regression_exact_matches": sixm_exact,
              "v8714_issue": {
                  "issue": (
                      "V8.7.14 calendar candidate used each ticker's first available bar "
                      "on/after the target date, which can substitute an IPO/listing date "
                      "months after the intended 52W target."
                  ),
                  "impact": "52W calendar readiness was overstated as 235/235 instead of 233/235.",
                  "affected_tickers": ["217590", "439960"],
                  "v8714_safety_result_invalidated": False,
                  "v8714_formula_coverage_evidence_for_52w_invalidated": True,
              },
              "official_start_sessions": {
                  "1w_calendar_7d": one_week_calendar_start,
                  "1w_5_prior_sessions": one_week_5session_start,
                  "ytd_first_current_year": ytd_first_session,
                  "ytd_prior_year_final": ytd_prior_year_close,
                  "52w_calendar": fifty2_calendar_start,
                  "52w_252_prior_sessions": fifty2_252session_start,
              },
              "counts": counts,
              "missing": miss,
              "difference_stats": {
                  "1w_abs_return_difference_pp": stats(diff_1w),
                  "ytd_abs_return_difference_pp": stats(diff_ytd),
                  "52w_abs_return_difference_pp": stats(diff_52w),
              },
              "candidate_observations": {
                  "1w": (
                      "Both candidates resolve to the same official start session at this basis; "
                      "coverage and values are identical. No formula selected."
                  ),
                  "ytd": (
                      "Both candidates cover 234/235 and differ semantically and numerically. "
                      "No formula selected."
                  ),
                  "52w": (
                      "Both corrected candidates cover 233/235. Calendar 52W and 252-session "
                      "start dates differ; no formula selected."
                  ),
                  "calendar_family_consistency": (
                      "Approved 1M/3M/6M use official market-session calendar targets. "
                      "This remains an observation, not an approval."
                  ),
              },
              "rows": rows,
              "safety": {
                  "integrated_source_changed": False,
                  "extended_return_source_changed": False,
                  "return_1w_written": False,
                  "return_ytd_written": False,
                  "return_52w_written": False,
                  "production_changed": False,
                  "worker_changed": False,
                  "standalone_command_defined": False,
                  "standalone_route_enabled": False,
                  "final_header_selected": False,
              },
          }

          (OUT / "standalone-swing-return-basis-resolver-correction-v8715.json").write_text(
              json.dumps(result, ensure_ascii=False, indent=2, allow_nan=False) + "\n",
              encoding="utf-8",
          )

          md = [
              "# V8.7.15 독립 스윙 수익률 시작일 해석 교정",
              "",
              f"- 기준일: {basis}",
              "- 상태: READY_CORRECTED_EVIDENCE_ONLY",
              f"- 기존 승인 6M 회귀 일치: {sixm_exact}/235",
              "",
              "## V8.7.14에서 발견된 문제",
              "- 종목별 `첫 available bar`를 사용해 목표일보다 훨씬 뒤 상장된 종목도 캘린더 52W 계산 가능으로 셈.",
              "- 공식 시장세션을 먼저 정하는 기존 `period_return()` 계약과 다름.",
              "- 따라서 V8.7.14의 52W 캘린더 235/235 커버리지는 공식선택 근거로 사용하지 않음.",
              "",
              "## 공식 세션 시작일",
              f"- 1W 캘린더 7일: {one_week_calendar_start}",
              f"- 1W 5거래세션: {one_week_5session_start}",
              f"- YTD 올해 첫 거래일: {ytd_first_session}",
              f"- YTD 전년 마지막 거래일: {ytd_prior_year_close}",
              f"- 52W 캘린더: {fifty2_calendar_start}",
              f"- 52W 252거래세션: {fifty2_252session_start}",
              "",
              "## 교정된 커버리지",
              f"- 1W 캘린더: {counts['1w_calendar_ready']}/235",
              f"- 1W 5거래세션: {counts['1w_5session_ready']}/235",
              f"- YTD 올해 첫 거래일: {counts['ytd_first_session_ready']}/235",
              f"- YTD 전년 마지막 거래일: {counts['ytd_prior_year_close_ready']}/235",
              f"- 52W 캘린더: {counts['52w_calendar_ready']}/235",
              f"- 52W 252거래세션: {counts['52w_252session_ready']}/235",
              "",
              "## 52W 자료부족 종목",
          ]
          for r in miss["52w_calendar"]:
              md.append(
                  f"- {r['name']}({r['ticker']}): 이력 시작 {r['history_min_date']}, "
                  f"의도된 시작일 {r['intended_start_date']} → 자료 미제공"
              )

          md += [
              "",
              "## 안전",
              "- 이번 단계에서도 1W·YTD·52W 공식을 선택하지 않음.",
              "- 통합 source·extended-return source·production·Worker를 변경하지 않음.",
              "- 새 명령어·route·최종 헤더를 만들지 않음.",
          ]

          (OUT / "standalone-swing-return-basis-resolver-correction-v8715.md").write_text(
              "\n".join(md) + "\n",
              encoding="utf-8",
          )

          print("V8715_RESOLVER_CORRECTION=READY_CORRECTED_EVIDENCE_ONLY")
          print("BASIS_DATE=" + basis)
          print("SOURCE_ROWS=235")
          print("APPROVED_6M_REGRESSION_EXACT_MATCHES=" + str(sixm_exact))
          print("ONE_WEEK_CALENDAR_START=" + one_week_calendar_start)
          print("ONE_WEEK_5SESSION_START=" + one_week_5session_start)
          print("ONE_WEEK_CALENDAR_READY=" + str(counts["1w_calendar_ready"]))
          print("ONE_WEEK_5SESSION_READY=" + str(counts["1w_5session_ready"]))
          print("YTD_FIRST_SESSION=" + ytd_first_session)
          print("YTD_PRIOR_YEAR_CLOSE=" + ytd_prior_year_close)
          print("YTD_FIRST_SESSION_READY=" + str(counts["ytd_first_session_ready"]))
          print("YTD_PRIOR_YEAR_CLOSE_READY=" + str(counts["ytd_prior_year_close_ready"]))
          print("FIFTY2W_CALENDAR_START=" + fifty2_calendar_start)
          print("FIFTY2W_252SESSION_START=" + fifty2_252session_start)
          print("FIFTY2W_CALENDAR_READY=" + str(counts["52w_calendar_ready"]))
          print("FIFTY2W_252SESSION_READY=" + str(counts["52w_252session_ready"]))
          print("FIFTY2W_CALENDAR_MISSING=" + ",".join(sorted(actual_52w_cal_missing)))
          print("FIFTY2W_252SESSION_MISSING=" + ",".join(sorted(actual_52w_252_missing)))
          print("V8714_52W_COVERAGE_EVIDENCE_INVALIDATED=true")
          print("FORMULA_SELECTED=false")
          print("RETURN_1W_SOURCE_WRITE=false")
          print("RETURN_YTD_SOURCE_WRITE=false")
          print("RETURN_52W_SOURCE_WRITE=false")
          print("PRODUCTION_CHANGE=false")
          print("WORKER_CHANGE=false")
          print("STANDALONE_COMMAND_DEFINED=false")
          print("STANDALONE_ROUTE_ENABLED=false")
          print("FINAL_HEADER_SELECTED=false")
          PY

      - name: Validate corrected evidence safety
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          p = json.loads(
              Path("/tmp/v8715_return_basis_resolver_correction/standalone-swing-return-basis-resolver-correction-v8715.json")
              .read_text(encoding="utf-8")
          )

          assert p["status"] == "READY_CORRECTED_EVIDENCE_ONLY"
          assert p["repository_write"] is False
          assert p["production_change"] is False
          assert p["worker_change"] is False
          assert p["formula_selected"] is False
          assert p["approved_6m_regression_exact_matches"] == 235

          assert p["v8714_issue"]["v8714_safety_result_invalidated"] is False
          assert p["v8714_issue"]["v8714_formula_coverage_evidence_for_52w_invalidated"] is True

          c = p["counts"]
          assert c["total"] == 235
          assert c["1w_calendar_ready"] == 235
          assert c["1w_5session_ready"] == 235
          assert c["ytd_first_session_ready"] == 234
          assert c["ytd_prior_year_close_ready"] == 234
          assert c["52w_calendar_ready"] == 233
          assert c["52w_252session_ready"] == 233

          assert {r["ticker"] for r in p["missing"]["52w_calendar"]} == {"217590", "439960"}
          assert {r["ticker"] for r in p["missing"]["52w_252session"]} == {"217590", "439960"}
          assert {r["ticker"] for r in p["missing"]["ytd_first_session"]} == {"439960"}
          assert {r["ticker"] for r in p["missing"]["ytd_prior_year_close"]} == {"439960"}

          s = p["safety"]
          assert all(v is False for v in s.values())

          print("V8715_APPROVED_6M_REGRESSION=PASS")
          print("V8715_OFFICIAL_SESSION_RESOLVER=PASS")
          print("V8715_52W_SHORT_HISTORY_GUARD=PASS")
          print("V8715_NO_FORMULA_SELECTION=PASS")
          print("V8715_NO_SOURCE_WRITE=PASS")
          print("V8715_READ_ONLY_SAFETY=PASS")
          PY

          git diff --exit-code
          git diff --cached --exit-code

          echo "ORIGINAL_CHECKOUT_UNCHANGED=PASS"
          echo "NO_COMMIT_NO_PUSH_NO_DEPLOY=PASS"

      - name: Upload V8.7.15 corrected resolver evidence
        uses: actions/upload-artifact@v6
        with:
          name: standalone-swing-return-basis-resolver-correction-v8715
          path: |
            /tmp/v8715_return_basis_resolver_correction/standalone-swing-return-basis-resolver-correction-v8715.json
            /tmp/v8715_return_basis_resolver_correction/standalone-swing-return-basis-resolver-correction-v8715.md
          if-no-files-found: error
          retention-days: 14
