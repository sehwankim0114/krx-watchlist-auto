name: Build standalone swing sector RS source v8.7.5

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: collect-krx-watchlist-latest
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          echo "V875_DEPENDENCIES=PASS"

      - name: Capture base and protected hashes
        shell: bash
        run: |
          set -euo pipefail
          echo "BASE_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
          sha256sum stock_table_metrics_v850.py > /tmp/metric.sha
          sha256sum worker/krx-live-price-worker.js > /tmp/worker.sha
          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.sha

      - name: Restore V8.7.5 source files
        shell: bash
        env:
          BUILDER_B64: ""
          CONTRACT_B64: ""
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64, os
          from pathlib import Path
          Path("standalone_swing_sector_rs_v875.py").write_bytes(base64.b64decode(os.environ["BUILDER_B64"]))
          Path("docs/standalone_swing_sector_rs_contract_v875.md").write_bytes(base64.b64decode(os.environ["CONTRACT_B64"]))
          PY
          python -m py_compile standalone_swing_sector_rs_v875.py
          echo "V875_SOURCE_RESTORE=PASS"

      - name: Build source-only cache
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KRX_ID:-}" || { echo "::error::KRX_ID secret missing"; exit 1; }
          test -n "${KRX_PW:-}" || { echo "::error::KRX_PW secret missing"; exit 1; }

          python standalone_swing_sector_rs_v875.py | tee /tmp/v875.log

          grep -q '^V875_STANDALONE_SECTOR_RS_STATUS=READY_SOURCE_ONLY$' /tmp/v875.log
          grep -q '^PRODUCTION_REGRESSION_MISMATCHES=0$' /tmp/v875.log
          grep -q '^GLOSSARY_FOOTER_READY=true$' /tmp/v875.log
          grep -q '^KOSDAQ_SECTOR_MAPPING_INVENTED=false$' /tmp/v875.log
          grep -q '^STANDALONE_SWING_TABLE_ENABLED=false$' /tmp/v875.log
          grep -q '^V875_STANDALONE_SECTOR_RS_VALIDATION=PASS$' /tmp/v875.log

      - name: Validate output contract
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' | tee /tmp/v875-validate.log
          import json
          from pathlib import Path

          p = json.loads(Path("latest/standalone_swing_sector_rs_latest.json").read_text())
          m = json.loads(Path("latest/standalone_swing_sector_rs_meta_latest.json").read_text())

          assert p["status"] == "READY_SOURCE_ONLY"
          assert m["status"] == "READY_SOURCE_ONLY"
          assert p["source_only"] is True and m["source_only"] is True
          assert p["standalone_swing_table_enabled"] is False
          assert p["request_time_price_eligible"] is False
          assert p["row_count"] == p["market_counts"]["KOSPI"] + p["market_counts"]["KOSDAQ"]
          assert p["kospi_sector_rs_ready_count"] == p["market_counts"]["KOSPI"]
          assert p["kosdaq_sector_rs_null_count"] == p["market_counts"]["KOSDAQ"]
          assert p["production_regression_mismatches"] == 0
          assert p["production_regression_exact_matches"] == p["production_unique_ticker_count"]
          assert p["glossary_footer_text"].startswith("읽는 법:")

          for row in p["rows"]:
              if row["market"] == "KOSPI":
                  assert row["status"] == "READY"
                  assert row["rs_sector_pp"]["1"] is not None
                  assert row["rs_sector_pp"]["3"] is not None
                  assert row["sector_benchmark"] is not None
              else:
                  assert row["market"] == "KOSDAQ"
                  assert row["status"] == "NOT_SUPPORTED_CURRENT_CONTRACT"
                  assert row["rs_sector_pp"] == {"1": None, "3": None}
                  assert row["sector_benchmark"] is None

          print("V875_SOURCE_ONLY_CONTRACT=PASS")
          print("V875_KOSPI_FULL_COVERAGE=PASS")
          print("V875_KOSDAQ_NULL_GUARD=PASS")
          print("V875_PRODUCTION_REGRESSION=PASS")
          print("V875_GLOSSARY_FOOTER=PASS")
          PY

      - name: Verify production protected
        shell: bash
        run: |
          set -euo pipefail
          sha256sum -c /tmp/metric.sha
          sha256sum -c /tmp/worker.sha
          find api/two_table_v1 -type f -print0 | sort -z | xargs -0 sha256sum > /tmp/two_table.after.sha
          diff -u /tmp/two_table.sha /tmp/two_table.after.sha
          git diff --exit-code -- stock_table_metrics_v850.py worker/krx-live-price-worker.js api/two_table_v1
          echo "PRODUCTION_TWO_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"

      - name: Commit V8.7.5 source cache
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$BASE_SHA" ]; then
            echo "::error::Remote main changed after checkout. Rerun V8.7.5."
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             standalone_swing_sector_rs_v875.py             docs/standalone_swing_sector_rs_contract_v875.md             latest/standalone_swing_sector_rs_latest.json             latest/standalone_swing_sector_rs_latest.csv             latest/standalone_swing_sector_rs_meta_latest.json             latest/standalone_swing_sector_rs_run_log_latest.txt

          STAGED="$(git diff --cached --name-only || true)"
          echo "V875_STAGED_FILES_BEGIN"
          printf '%s\n' "$STAGED"
          echo "V875_STAGED_FILES_END"

          if printf '%s\n' "$STAGED" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow staged unexpectedly"
            exit 1
          fi

          while IFS= read -r p; do
            [ -z "$p" ] && continue
            case "$p" in
              standalone_swing_sector_rs_v875.py|              docs/standalone_swing_sector_rs_contract_v875.md|              latest/standalone_swing_sector_rs_latest.json|              latest/standalone_swing_sector_rs_latest.csv|              latest/standalone_swing_sector_rs_meta_latest.json|              latest/standalone_swing_sector_rs_run_log_latest.txt) ;;
              *) echo "::error::Unexpected staged path: $p"; exit 1 ;;
            esac
          done <<< "$STAGED"

          echo "WORKFLOW_FILES_STAGED=false"

          if ! git diff --cached --quiet; then
            git commit -m "Add V8.7.5 standalone swing sector RS source"
            git push origin HEAD:main
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V875_STANDALONE_SECTOR_RS_RELEASE=PASS"
          echo "WORKFLOW_FILES_STAGED=false"
          echo "STANDALONE_SWING_TABLE_ENABLED=false"
          echo "KOSDAQ_SECTOR_MAPPING_INVENTED=false"
          echo "PRODUCTION_TABLE_CHANGED=false"
          echo "WORKER_SOURCE_CHANGED=false"
          echo "METRIC_FORMULA_CHANGED=false"
          echo "REQUEST_TIME_PRICE_SUBSTITUTION=false"

      - name: Final report
        if: always()
        shell: bash
        run: |
          test -f /tmp/v875.log && cat /tmp/v875.log || true
          test -f /tmp/v875-validate.log && cat /tmp/v875-validate.log || true
          git status --short || true
