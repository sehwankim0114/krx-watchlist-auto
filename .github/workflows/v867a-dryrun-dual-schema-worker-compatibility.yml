name: Dry-run dual-schema Worker compatibility v8.6.7a

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: v867a-dual-schema-worker-dryrun
  cancel-in-progress: false

jobs:
  dryrun:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 1

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build temp dual-schema Worker candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v867a
          mkdir -p /tmp/v867a
          cp -a . /tmp/v867a/repo-current
          cp -a . /tmp/v867a/repo-v2fixture

          python - <<'PY'
          from pathlib import Path
          import re

          roots = (
              Path("/tmp/v867a/repo-current"),
              Path("/tmp/v867a/repo-v2fixture"),
          )

          for root in roots:
              worker = root / "worker/krx-live-price-worker.js"
              text = worker.read_text(encoding="utf-8")

              # 1) Replace the current single 14-column constant with
              #    explicit V1/V2 constants. Match by syntax, not whitespace.
              pattern_columns = re.compile(
                  r'const\s+TWO_TABLE_COLUMNS\s*=\s*\['
                  r'\s*"name"\s*,\s*"ticker"\s*,\s*"official_close"\s*,\s*"run"\s*,\s*"streak"\s*,'
                  r'\s*"range_3m"\s*,\s*"swing"\s*,\s*"ma"\s*,\s*"returns"\s*,\s*"rs_kospi_pp"\s*,'
                  r'\s*"atr14"\s*,\s*"activity"\s*,\s*"analysis"\s*,\s*"sector_theme"\s*'
                  r'\]\s*;',
                  re.S,
              )

              replacement_columns = (
                  'const TWO_TABLE_COLUMNS_V1 = ["name", "ticker", "official_close", "run", "streak",\n'
                  '  "range_3m", "swing", "ma", "returns", "rs_kospi_pp", "atr14", "activity",\n'
                  '  "analysis", "sector_theme"];\n'
                  'const TWO_TABLE_COLUMNS_V2 = ["name", "ticker", "official_close", "run", "streak",\n'
                  '  "range_3m", "swing", "ma", "returns", "rs_kospi_pp", "atr14", "activity",\n'
                  '  "analysis", "rs_sector_pp", "sector_theme"];\n\n'
                  'function acceptedTwoTableColumns(columns) {\n'
                  '  const encoded = JSON.stringify(columns);\n'
                  '  if (encoded === JSON.stringify(TWO_TABLE_COLUMNS_V1)) return TWO_TABLE_COLUMNS_V1;\n'
                  '  if (encoded === JSON.stringify(TWO_TABLE_COLUMNS_V2)) return TWO_TABLE_COLUMNS_V2;\n'
                  '  return null;\n'
                  '}'
              )

              text, count = pattern_columns.subn(replacement_columns, text, count=1)
              if count != 1:
                  raise SystemExit(f"TWO_TABLE_COLUMNS definition patch count={count}")

              # 2) Replace validation of one exact schema with validation of
              #    either the approved 14-column or 15-column schema.
              pattern_validation = re.compile(
                  r'twoTableRequire\('
                  r'JSON\.stringify\(p\.columns\)\s*===\s*JSON\.stringify\(TWO_TABLE_COLUMNS\),'
                  r'\s*"TWO_TABLE_COLUMNS_MISMATCH"\s*\);'
                  r'\s*const\s+tickers\s*=\s*new\s+Set\(\);'
                  r'\s*for\s*\(\s*const\s+row\s+of\s+p\.rows\s*\)\s*\{'
                  r'\s*twoTableRequire\('
                  r'Array\.isArray\(row\)\s*&&\s*row\.length\s*===\s*TWO_TABLE_COLUMNS\.length',
                  re.S,
              )

              replacement_validation = (
                  'const acceptedColumns = acceptedTwoTableColumns(p.columns);\n'
                  '  twoTableRequire(Boolean(acceptedColumns), "TWO_TABLE_COLUMNS_MISMATCH");\n'
                  '  const tickers = new Set();\n'
                  '  for (const row of p.rows) {\n'
                  '    twoTableRequire(Array.isArray(row) && row.length === acceptedColumns.length'
              )

              text, count = pattern_validation.subn(replacement_validation, text, count=1)
              if count != 1:
                  raise SystemExit(f"TWO_TABLE_COLUMNS validation patch count={count}")

              # 3) Only change candidate build identifier.
              old_build = 'const BUILD_VERSION = "1.4.0-two-table-guarded-preview";'
              new_build = 'const BUILD_VERSION = "1.4.1-two-table-dual-schema";'
              if old_build not in text:
                  raise SystemExit("BUILD_VERSION source value not found")
              text = text.replace(old_build, new_build, 1)

              worker.write_text(text, encoding="utf-8")

              # Existing regression files assert the old build identifier.
              for rel in (
                  "worker/validate_worker.mjs",
                  "worker/validate_two_table_proxy_v852.mjs",
              ):
                  p = root / rel
                  v = p.read_text(encoding="utf-8")
                  if '"1.4.0-two-table-guarded-preview"' in v:
                      v = v.replace(
                          '"1.4.0-two-table-guarded-preview"',
                          '"1.4.1-two-table-dual-schema"',
                      )
                  p.write_text(v, encoding="utf-8")

          print("REGEX_PATCH_CURRENT_AND_V2_FIXTURE=PASS")
          PY

      - name: Syntax check candidate
        shell: bash
        run: |
          set -euo pipefail
          node --check /tmp/v867a/repo-current/worker/krx-live-price-worker.js
          grep -F 'const TWO_TABLE_COLUMNS_V1' /tmp/v867a/repo-current/worker/krx-live-price-worker.js
          grep -F 'const TWO_TABLE_COLUMNS_V2' /tmp/v867a/repo-current/worker/krx-live-price-worker.js
          grep -F '"analysis", "rs_sector_pp", "sector_theme"' /tmp/v867a/repo-current/worker/krx-live-price-worker.js
          echo "DUAL_SCHEMA_WORKER_SYNTAX=PASS"

      - name: Run current 14-column regressions
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v867a/repo-current
          node worker/validate_worker.mjs .
          node worker/validate_two_table_proxy_v852.mjs .
          echo "CURRENT_14_COLUMN_REGRESSION=PASS"

      - name: Convert second temp repo to 15-column transport fixture
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path("/tmp/v867a/repo-v2fixture")
          base = root / "api/two_table_v1"
          manifest_path = base / "manifest.json"
          manifest = json.loads(manifest_path.read_text(encoding="utf-8"))

          old_cols = [
              "name", "ticker", "official_close", "run", "streak",
              "range_3m", "swing", "ma", "returns", "rs_kospi_pp",
              "atr14", "activity", "analysis", "sector_theme",
          ]
          new_cols = [
              "name", "ticker", "official_close", "run", "streak",
              "range_3m", "swing", "ma", "returns", "rs_kospi_pp",
              "atr14", "activity", "analysis", "rs_sector_pp", "sector_theme",
          ]

          rows_changed = 0
          max_bytes = 0

          for table in ("kospi", "decliners", "decliners24"):
              for filename in manifest["tables"][table]["pages"]:
                  path = base / filename
                  payload = json.loads(path.read_text(encoding="utf-8"))

                  if payload.get("columns") != old_cols:
                      raise SystemExit(f"unexpected source columns: {filename}")

                  payload["columns"] = new_cols
                  payload["rows"] = [
                      row[:-1] + [[0.0, 0.0], row[-1]]
                      for row in payload["rows"]
                  ]

                  if any(len(row) != 15 for row in payload["rows"]):
                      raise SystemExit(f"bad row width: {filename}")

                  raw = json.dumps(
                      payload,
                      ensure_ascii=False,
                      allow_nan=False,
                      separators=(",", ":"),
                  ).encode("utf-8")

                  if len(raw) > 30000:
                      raise SystemExit(f"page exceeds 30KB: {filename}:{len(raw)}")

                  path.write_bytes(raw)
                  manifest["files"][filename] = {
                      "sha256": hashlib.sha256(raw).hexdigest(),
                      "bytes": len(raw),
                  }
                  rows_changed += len(payload["rows"])
                  max_bytes = max(max_bytes, len(raw))

          manifest_path.write_text(
              json.dumps(
                  manifest,
                  ensure_ascii=False,
                  allow_nan=False,
                  separators=(",", ":"),
              ),
              encoding="utf-8",
          )

          print(f"SYNTHETIC_15_COLUMN_ROWS={rows_changed}")
          print(f"SYNTHETIC_15_COLUMN_MAX_BYTES={max_bytes}")
          PY

      - name: Run guarded route regression against 15-column fixture
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/v867a/repo-v2fixture
          node worker/validate_two_table_proxy_v852.mjs .
          echo "FUTURE_15_COLUMN_REGRESSION=PASS"

      - name: Write report
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          from datetime import datetime
          from pathlib import Path
          from zoneinfo import ZoneInfo

          out = Path("/tmp/v867a")
          data = {
              "probe_version": "2026-09-12-v8.6.7a-dual-schema-worker-compatibility-dryrun",
              "run_at_kst": datetime.now(ZoneInfo("Asia/Seoul")).isoformat(timespec="seconds"),
              "status": "READY_DUAL_SCHEMA_WORKER_FOR_STAGED_DEPLOYMENT",
              "candidate_build_version": "1.4.1-two-table-dual-schema",
              "current_14_column_regression": "PASS",
              "future_15_column_regression": "PASS",
              "unknown_schema_policy": "REJECT",
              "worker_values_recalculated": False,
              "repository_write": False,
              "worker_deployed": False,
              "production_modified": False,
          }
          (out / "v867a-dual-schema-worker-readiness.json").write_text(
              json.dumps(data, ensure_ascii=False, indent=2),
              encoding="utf-8",
          )

          lines = [
              "# V8.6.7a Worker 이중 스키마 호환 Dry-run",
              "",
              "- 판정: READY_DUAL_SCHEMA_WORKER_FOR_STAGED_DEPLOYMENT",
              "- 후보 Worker: 1.4.1-two-table-dual-schema",
              "- 현재 14열 production 회귀검증: PASS",
              "- 향후 15열(rs_sector_pp 포함) 회귀검증: PASS",
              "- 미승인 열구성: 계속 차단",
              "- Worker 값 재계산: 없음",
              "- 저장소 변경: 없음",
              "- Worker 실제 배포: 없음",
              "- production 데이터 변경: 없음",
          ]
          (out / "v867a-dual-schema-worker-readiness.md").write_text(
              "\n".join(lines) + "\n",
              encoding="utf-8",
          )

          (out / "krx-live-price-worker-v141-dual-schema.js").write_text(
              (out / "repo-current/worker/krx-live-price-worker.js").read_text(encoding="utf-8"),
              encoding="utf-8",
          )
          PY

      - name: Safety check
        shell: bash
        run: |
          set -euo pipefail
          git diff --exit-code
          git diff --cached --exit-code
          test -f /tmp/v867a/v867a-dual-schema-worker-readiness.json
          test -f /tmp/v867a/v867a-dual-schema-worker-readiness.md
          test -f /tmp/v867a/krx-live-price-worker-v141-dual-schema.js
          echo "ORIGINAL_REPOSITORY_UNCHANGED=PASS"
          echo "NO_COMMIT_NO_PUSH_NO_DEPLOY=PASS"

      - name: Upload V8.6.7a artifact
        uses: actions/upload-artifact@v6
        with:
          name: dual-schema-worker-readiness-v867a
          path: |
            /tmp/v867a/v867a-dual-schema-worker-readiness.json
            /tmp/v867a/v867a-dual-schema-worker-readiness.md
            /tmp/v867a/krx-live-price-worker-v141-dual-schema.js
          if-no-files-found: error
          retention-days: 14
