name: Promote official sector RS to production v8.7.0

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v870-promote-sector-rs-production
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      TZ: Asia/Seoul
      KRX_ID: ${{ secrets.KRX_ID }}
      KRX_PW: ${{ secrets.KRX_PW }}

    steps:
      - name: Checkout latest main
        uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          python -m pip install "pykrx==1.2.8"

      - name: Verify required KRX secrets
        shell: bash
        run: |
          set -euo pipefail
          test -n "${KRX_ID:-}" || { echo "::error::KRX_ID secret missing"; exit 1; }
          test -n "${KRX_PW:-}" || { echo "::error::KRX_PW secret missing"; exit 1; }
          echo "KRX_SECRETS_PRESENT=PASS"

      - name: Install V8.7.0 sector RS source and release code
        shell: bash
        run: |
          set -euo pipefail

          echo '' | base64 -d > sector_rs_source_v870.py
          echo '' | base64 -d > two_table_release_v870.py

          python -m py_compile sector_rs_source_v870.py two_table_release_v870.py
          echo "V870_SOURCE_FILES_INSTALLED=PASS"

      - name: Install sector RS contract and release configuration
        shell: bash
        run: |
          set -euo pipefail

          cat > docs/sector_rs_contract_v870.md <<'DOC'
          # 공식 KRX 업종 상대강도 계약 V8.7.0

          ## 목적
          코피표·연속하락표·2.4연속하락표의 `rs_sector_pp`를 공식 KRX 업종지수 기준으로 생성한다.
          이 값은 미래 예측이나 매수·매도 신호가 아니라 같은 기간 업종 대비 과거 상대수익률 차이(%p)다.

          ## 공식 소스
          - 종목→업종 근거: KRX 지수 구성종목
          - 종목 구분 및 우선주 연결 근거: KRX 전종목기본정보의 `ISU_NM`, `KIND_STKCERT_TP_NM`
          - 업종지수 수익률: 선택된 KRX 업종지수 공식 종가
          - 인증은 GitHub Actions의 `KRX_ID`, `KRX_PW` repository Secrets에서만 사용한다.
          - Worker·Custom GPT 런타임에는 KRX 인증정보를 저장하거나 전달하지 않는다.

          ## 업종 선택
          1. 기본 업종 후보는 KRX 1005~1026, 1045~1047 지수다.
          2. 금융(1021)과 증권(1024) 또는 보험(1025)이 함께 있으면 하위 업종을 사용한다.
          3. 좁은 공식 업종이 전혀 없고 제조(1027) 구성종목이면 제조(1027)를 사용한다.
          4. 직접 업종이 없는 우선주는 KRX가 우선주로 확인되고, 공식 `ISU_NM`의 종목유형 접미사를 제거한 발행회사 stem이 정확히 일치하는 보통주가 유일할 때만 그 보통주의 공식 업종을 승계한다.
          5. fuzzy 이름매칭, 종목코드 접두어 추정, `sector_theme` 대체는 금지한다.
          6. 모호하거나 근거가 부족하면 값 생성에 실패하며 production을 발행하지 않는다.

          ## 계산
          `업종RS 1M/3M = 종목 공식종가 수익률 - 선택된 공식 KRX 업종지수 수익률`

          - 단위: percentage points(%p)
          - 종목 수익률의 기존 `start_date`를 그대로 사용한다.
          - 업종지수도 동일한 `start_date`와 동일한 공식 기준일 종가를 사용한다.
          - 요청시점 현재가로 재계산하지 않는다.

          ## 우선주 정규화
          KRX 공식 종목명 끝에서만 다음 유형 접미사를 제거한다.
          - `보통주`
          - `우선주`
          - `N우선주`
          - `우선주(신형)`
          - `N우선주(신형)`

          ## 배포 안전장치
          - 모든 production 고유종목의 1M·3M 값이 준비되어야 한다.
          - compact 표는 `rs_sector_pp`가 추가된 15열 스키마를 사용한다.
          - 14열/15열 양쪽을 허용하는 Worker 1.4.1과 Action schema 7.1.2가 선행 배포되어야 한다.
          - `investment_score_100`, `earnings_outlook_change`, `confirmed_swing_low_stop`은 계속 `자료 미제공`이다.
          DOC

          python - <<'PY'
          import json
          from pathlib import Path

          release = {
              "version": "2026-09-12-v8.7.0-sector-rs-production-release",
              "enabled": True,
              "standalone_swing_table_enabled": False,
              "scope": "LAYOUT_VERIFIED_INDICATORS_AND_OFFICIAL_KRX_SECTOR_RS_WITH_DECLARED_GAPS",
              "unavailable_fields": [
                  "investment_score_100",
                  "earnings_outlook_change",
                  "confirmed_swing_low_stop"
              ],
              "missing_score_policy": "NO_SCORE_NO_AUTO_BUY_UPGRADE"
          }
          Path("config/two_table_release.json").write_text(
              json.dumps(release, ensure_ascii=False, separators=(",", ":")) + "\n",
              encoding="utf-8",
          )
          print("V870_RELEASE_CONFIG=PASS")
          PY

      - name: Update stock-table glossary for industry RS
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import json
          from pathlib import Path

          path = Path("latest/stock_table_metric_glossary_latest.json")
          data = json.loads(path.read_text(encoding="utf-8"))
          data["version"] = "2026-09-12-v8.7.0-sector-rs-production"
          terms = data["terms"]
          terms["rs_sector"] = {
              "label": "업종RS 1M/3M",
              "short": "같은 기간 공식 KRX 업종지수 대비 상대수익률 차이(%p)",
              "detail": "양수면 같은 기간 선택된 공식 KRX 업종지수보다 강했고 음수면 약했다는 뜻이다. KOSPI 대비 RS와 별개이며 요청시점 현재가로 재계산하지 않는다."
          }
          data["compact_footer_text"] = (
              "읽는 법: 스윙=최근 큰 가격파동의 현재 위치(미래예측 아님) · "
              "MA5/20/60/120=단기→중장기 이동평균 방향 · "
              "ATR14=최근 14기간 평균진폭(예상수익률 아님) · "
              "RS=KOSPI 대비 상대수익률 차이 · "
              "업종RS=같은 기간 공식 KRX 업종지수 대비 상대수익률 차이(%p) · "
              "연속등락=현재 연속 상승/하락 일수와 누적등락률"
          )
          path.write_text(json.dumps(data, ensure_ascii=False, indent=2) + "\n", encoding="utf-8")
          assert set(data["terms"]) == {"swing","ma","atr14","rs_kospi","rs_sector","streak"}
          assert len(data["compact_footer_text"]) <= 700
          print("V870_GLOSSARY=PASS")
          PY

      - name: Allow six-term glossary in preview builder
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path("build_stock_table_preview_v850.py")
          text = path.read_text(encoding="utf-8")
          old = 'set(glossary_terms) != {"swing", "ma", "atr14", "rs_kospi", "streak"}'
          new = 'set(glossary_terms) != {"swing", "ma", "atr14", "rs_kospi", "rs_sector", "streak"}'
          if old in text:
              text = text.replace(old, new, 1)
          elif new not in text:
              raise SystemExit("GLOSSARY_VALIDATOR_PATTERN_NOT_FOUND")
          path.write_text(text, encoding="utf-8")
          print("V850_GLOSSARY_VALIDATOR_UPDATED=PASS")
          PY

      - name: Wire V8.7.0 into daily Build API JSON
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          from pathlib import Path

          path = Path(".github/workflows/build_api_json.yml")
          text = path.read_text(encoding="utf-8")

          dart_line = "      DART_API_KEY: ${{ secrets.DART_API_KEY }}"
          krx_block = (
              "      KRX_ID: ${{ secrets.KRX_ID }}\n"
              "      KRX_PW: ${{ secrets.KRX_PW }}"
          )
          if "KRX_ID: ${{ secrets.KRX_ID }}" not in text:
              if dart_line not in text:
                  raise SystemExit("BUILD_WORKFLOW_DART_ENV_LINE_NOT_FOUND")
              text = text.replace(dart_line, dart_line + "\n" + krx_block, 1)

          old_name = "      - name: Publish V8.5.3 two-table production bundle"
          new_name = "      - name: Publish V8.7.0 two-table production bundle with sector RS"
          if old_name in text:
              text = text.replace(old_name, new_name, 1)
          elif new_name not in text:
              raise SystemExit("BUILD_WORKFLOW_RELEASE_STEP_NAME_NOT_FOUND")

          old_compile_tail = "            two_table_release_v853.py"
          new_compile_tail = (
              "            sector_rs_source_v870.py \\\n"
              "            two_table_release_v870.py"
          )
          if old_compile_tail in text:
              text = text.replace(old_compile_tail, new_compile_tail, 1)
          elif "two_table_release_v870.py" not in text:
              raise SystemExit("BUILD_WORKFLOW_COMPILE_TAIL_NOT_FOUND")

          text = text.replace(
              "python two_table_release_v853.py --repo .",
              "python two_table_release_v870.py --repo .",
          )
          text = text.replace(
              'echo "V853_DAILY_TWO_TABLE_PUBLISH=PASS"',
              'echo "V870_DAILY_TWO_TABLE_PUBLISH=PASS"',
          )

          if "V870_DAILY_TWO_TABLE_PUBLISH=PASS" not in text:
              raise SystemExit("BUILD_WORKFLOW_V870_WIRING_INCOMPLETE")

          path.write_text(text, encoding="utf-8")
          print("V870_DAILY_BUILD_WIRING=PASS")
          PY

      - name: Compile production implementation
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile             stock_table_metrics_v850.py             build_stock_table_preview_v850.py             build_two_table_shadow_v851.py             sector_rs_source_v870.py             two_table_release_v870.py
          echo "V870_PYTHON_COMPILE=PASS"

      - name: Verify pre-production dependencies
        shell: bash
        run: |
          set -euo pipefail

          grep -F 'const BUILD_VERSION = "1.4.1-two-table-dual-schema";' worker/krx-live-price-worker.js
          grep -F 'const TWO_TABLE_COLUMNS_V2' worker/krx-live-price-worker.js
          grep -F 'version: 7.1.2' docs/custom_gpt_action_schema.yaml
          grep -F 'maxItems: 15' docs/custom_gpt_action_schema.yaml

          echo "WORKER_141_SOURCE=PASS"
          echo "ACTION_SCHEMA_712_SOURCE=PASS"

      - name: Generate and validate V8.7.0 production bundle
        shell: bash
        run: |
          set -euo pipefail

          python two_table_release_v870.py --repo .
          python two_table_release_v870.py --repo . --check-only

          python - <<'PY'
          import json
          from pathlib import Path

          base = Path("api/two_table_v1")
          manifest = json.loads((base / "manifest.json").read_text(encoding="utf-8"))

          assert manifest["version"] == "2026-09-12-v8.7.0-sector-rs-production-release"
          assert manifest["release_stage"] == "PRODUCTION"
          assert manifest["production_activation_allowed"] is True
          assert manifest["custom_gpt_route_enabled"] is True
          assert manifest["status"] == "READY"
          assert "rs_sector" not in manifest.get("pending", [])
          assert manifest["explicit_missing"] == [
              "investment_score_100",
              "earnings_outlook_change",
              "confirmed_swing_low_stop",
          ]

          total_rows = 0
          total_ready = 0
          max_bytes = 0
          for table in ("kospi", "decliners", "decliners24"):
              canonical = json.loads((base / f"{table}.json").read_text(encoding="utf-8"))
              total_rows += canonical["row_count"]
              for row in canonical["rows"]:
                  rs = row["metrics"]["rs_sector_pp"]
                  assert isinstance(rs["1"], (int, float))
                  assert isinstance(rs["3"], (int, float))
                  assert "rs_sector" not in row["metrics"].get("missing", {})
                  total_ready += 1

              for name in manifest["tables"][table]["pages"]:
                  raw = (base / name).read_bytes()
                  max_bytes = max(max_bytes, len(raw))
                  payload = json.loads(raw)
                  assert payload["columns"][13] == "rs_sector_pp"
                  assert len(payload["columns"]) == 15
                  assert all(len(row) == 15 for row in payload["rows"])
                  assert len(raw) <= 28500

          audit = json.loads(Path("latest/sector_rs_source_latest.json").read_text(encoding="utf-8"))
          assert audit["unique_ticker_count"] == 136
          assert audit["rs_values_ready"] == audit["rs_values_expected"] == 272

          print(f"V870_TABLE_ROWS={total_rows}")
          print(f"V870_ROWS_WITH_SECTOR_RS={total_ready}")
          print(f"V870_UNIQUE_TICKERS={audit['unique_ticker_count']}")
          print(f"V870_RS_VALUES={audit['rs_values_ready']}/{audit['rs_values_expected']}")
          print(f"V870_MAX_COMPACT_BYTES={max_bytes}")
          print("V870_PRODUCTION_BUNDLE_LOCAL_VALIDATION=PASS")
          PY

      - name: Review change scope
        shell: bash
        run: |
          set -euo pipefail

          echo "CHANGED_FILES_BEGIN"
          git status --short
          echo "CHANGED_FILES_END"

          python - <<'PY'
          import subprocess

          allowed_exact = {
              ".github/workflows/build_api_json.yml",
              "build_stock_table_preview_v850.py",
              "config/two_table_release.json",
              "docs/sector_rs_contract_v870.md",
              "latest/stock_table_metric_glossary_latest.json",
              "latest/sector_rs_source_latest.json",
              "sector_rs_source_v870.py",
              "two_table_release_v870.py",
          }
          allowed_prefix = ("api/two_table_v1/",)

          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          unexpected = []
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              if path in allowed_exact or path.startswith(allowed_prefix):
                  continue
              unexpected.append(path)

          if unexpected:
              raise SystemExit("UNEXPECTED_CHANGED_FILES=" + repr(sorted(unexpected)))
          print("V870_CHANGE_SCOPE=PASS")
          PY

      - name: Commit and push V8.7.0 production promotion
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add             .github/workflows/build_api_json.yml             build_stock_table_preview_v850.py             config/two_table_release.json             docs/sector_rs_contract_v870.md             latest/stock_table_metric_glossary_latest.json             latest/sector_rs_source_latest.json             sector_rs_source_v870.py             two_table_release_v870.py             api/two_table_v1

          git commit -m "Promote official KRX sector RS to production"

          git fetch origin main
          if [ "$(git rev-parse HEAD^)" != "$(git rev-parse origin/main)" ]; then
            git rebase origin/main
          fi

          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "RS_SECTOR_PRODUCTION=true"
          echo "WORKER_DEPLOYMENT_REQUIRED=false"
          echo "ACTION_SCHEMA_REPLACEMENT_REQUIRED=false"
          echo "REMAINING_MISSING_FIELDS=investment_score_100,earnings_outlook_change,confirmed_swing_low_stop"
