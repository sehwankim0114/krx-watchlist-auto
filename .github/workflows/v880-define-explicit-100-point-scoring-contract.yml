            echo "::error::Production files changed"
            exit 1
          fi
          echo "V880_PRODUCTION_UNCHANGED=PASS"


      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              "config/investment_score_policy_v880.json",
              "docs/investment_score_scoring_contract_v880.md",
              "latest/investment_score_policy_v880_validation_latest.json",
              "latest/investment_score_policy_v880_validation_run_log_latest.txt",
          }

          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          if changed != allowed:
              raise SystemExit("CHANGE_SCOPE_MISMATCH=" + repr(sorted(changed)))

          print("CHANGE_SCOPE=PASS")
          PY


