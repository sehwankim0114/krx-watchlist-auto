              OUT_LOG.write_text("\n".join(log) + "\n", encoding="utf-8")

              print("V886_XBRL_DA_CONTEXT_AUDIT=PASS")
              print("\n".join(log))

          if __name__ == "__main__":
              main()
          PY

          python -m py_compile investment_score_xbrl_da_context_v886.py

