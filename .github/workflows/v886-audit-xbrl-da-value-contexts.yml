      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail

          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_xbrl_da_context_v886.py",
              "docs/investment_score_xbrl_da_context_audit_v886.md",
              "latest/investment_score_xbrl_da_context_v886.csv",
              "latest/investment_score_xbrl_da_context_v886_summary_latest.json",
              "latest/investment_score_xbrl_da_context_v886_run_log_latest.txt",
          }

          status = subprocess.check_output(
              ["git", "status", "--porcelain"],
              text=True,
          )

          changed = set()
          for line in status.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          if changed != allowed:
              raise SystemExit(
                  "CHANGE_SCOPE_MISMATCH=" + repr(sorted(changed))
              )

          print("V886_CHANGE_SCOPE=PASS")
          PY

      - name: Commit and push V8.8.6 audit
        shell: bash
        run: |
          set -euo pipefail

          git fetch origin main
          if [[ "$(git rev-parse origin/main)" != "$BASE_SHA" ]]; then
            echo "::error::Remote main changed after checkout. Rerun V8.8.6."
            echo "BASE_SHA=$BASE_SHA"
            echo "ORIGIN_MAIN=$(git rev-parse origin/main)"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -- \
            investment_score_xbrl_da_context_v886.py \
            docs/investment_score_xbrl_da_context_audit_v886.md \
            latest/investment_score_xbrl_da_context_v886.csv \
            latest/investment_score_xbrl_da_context_v886_summary_latest.json \
            latest/investment_score_xbrl_da_context_v886_run_log_latest.txt

          mapfile -t staged < <(git diff --cached --name-only | sort)

          echo "V886_STAGED_FILES_BEGIN"
          printf '%s\n' "${staged[@]}"
          echo "V886_STAGED_FILES_END"

          if [[ "${#staged[@]}" -ne 5 ]]; then
            echo "::error::Expected exactly 5 staged files, got ${#staged[@]}"
            exit 1
          fi

          if printf '%s\n' "${staged[@]}" | grep -q '^\.github/workflows/'; then
            echo "::error::Workflow file staged unexpectedly"
            exit 1
          fi

          git commit -m "Audit XBRL D&A value contexts v8.8.6"
          git push origin HEAD:main

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
          echo "V886_XBRL_DA_CONTEXT_AUDIT_RELEASE=PASS"
          echo "PRODUCTION_DATA_CHANGED=false"
          echo "PRODUCTION_INVESTMENT_SCORE_WRITTEN=false"
          echo "SCORING_POLICY_CHANGED=false"
          echo "NEW_DA_ID_APPROVED=false"
          echo "DA_VALUE_PROMOTED=false"
          echo "EV_EBITDA_RECALCULATED=false"
          echo "STANDALONE_SWING_CHANGED=false"

