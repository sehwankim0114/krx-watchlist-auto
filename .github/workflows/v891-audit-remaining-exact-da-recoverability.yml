            echo "::error::Protected production/policy/evidence files changed"
            git status --short
            exit 1
          fi
          echo "V891_PROTECTED_FILES_UNCHANGED=PASS"


      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess
          from pathlib import Path

          allowed = {
              "investment_score_da_recoverability_audit_v891.py",
              "docs/investment_score_da_recoverability_v891.md",
              "latest/investment_score_da_recoverability_v891.csv",
              "latest/investment_score_da_recoverability_v891_summary_latest.json",
              "latest/investment_score_da_recoverability_v891_run_log_latest.txt",
          }
          for p in allowed:
              if not Path(p).exists():
                  raise SystemExit("EXPECTED_OUTPUT_MISSING=" + p)

          out = subprocess.check_output(["git", "status", "--porcelain"], text=True)
          changed = set()
          for line in out.splitlines():
              if not line.strip():
                  continue
              path = line[3:]
              if " -> " in path:
                  path = path.split(" -> ", 1)[1]
              changed.add(path)

          unexpected = changed - allowed
          if unexpected:
              raise SystemExit("CHANGE_SCOPE_UNEXPECTED=" + repr(sorted(unexpected)))
          if not changed:
              raise SystemExit("NO_CHANGES_DETECTED")

          print("CHANGE_SCOPE=PASS")
          print("CHANGED_FILES=" + ",".join(sorted(changed)))
          PY


