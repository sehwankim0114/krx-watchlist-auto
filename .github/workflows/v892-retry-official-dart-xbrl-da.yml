              "docs/investment_score_da_official_retry_v892.md",
          }

          changed = set(
              x for x in subprocess.check_output(
                  ["git", "status", "--porcelain"], text=True
              ).splitlines()
              if x
              for x in [x[3:]]
          )

          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit("UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected))
          print("V892_CHANGED_FILES_RESTRICTED=PASS")
