      - name: Run V8.9.7 targeted DART supply audit
        shell: bash
        env:
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
        run: |
          set -euo pipefail
          python -m py_compile investment_score_supply_targeted_dart_audit_v897.py
          python investment_score_supply_targeted_dart_audit_v897.py
          grep -q '^STATUS_OK=true$' latest/investment_score_supply_targeted_dart_v897_run_log_latest.txt

      - name: Validate V8.9.7 outputs
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import csv
          import json
          from pathlib import Path

          s = json.loads(
              Path("latest/investment_score_supply_targeted_dart_v897_summary_latest.json")
              .read_text(encoding="utf-8")
          )
          with Path("latest/investment_score_supply_targeted_dart_v897.csv").open(
              encoding="utf-8-sig", newline=""
          ) as f:
              rows = list(csv.DictReader(f))

          assert s["status"] == "AUDIT_ONLY"
          assert s["target_count"] == 33
          assert s["single_blocker_target_count"] == 8
          assert len(rows) == 33
          assert set(s["single_blocker_targets"]) == {
              "003280", "063160", "066570", "071840",
              "081000", "086280", "100250", "286940",
          }
          assert (
              s["complete_180d_count"]
              + s["incomplete_180d_count"]
              + s["corp_code_unresolved_count"]
              == 33
          )
          assert (
              s["complete_180d_positive_burden_count"]
              + s["complete_180d_no_positive_burden_count"]
              == s["complete_180d_count"]
          )
          assert (
              s["source_overlay_candidate_count"]
              == s["complete_180d_count"]
          )
          assert s["automatic_production_patch"]["allowed"] is False
          assert s["automatic_production_patch"]["patched_ticker_count"] == 0
          assert s["audit_contract"]["absence_requires_all_chunks_complete"] is True
          assert s["hard_guards"]["production_api_changed"] is False
          assert s["hard_guards"]["production_investment_score_written"] is False
          assert s["hard_guards"]["scoring_policy_changed"] is False
          assert s["hard_guards"]["supply_policy_changed"] is False
          assert s["hard_guards"]["limited_absence_treated_as_complete"] is False
          assert s["hard_guards"]["incomplete_query_treated_as_absence"] is False
          assert s["hard_guards"]["issuer_mapping_guessed"] is False
          assert s["hard_guards"]["production_supply_status_overridden"] is False
          print("V897_OUTPUT_VALIDATION=PASS")
          PY

      - name: Verify protected files unchanged
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            config/investment_score_policy_v880.json \
            supply_burden_enricher.py \
            latest/investment_score_v880_dry_run_v895_latest.csv \
            latest/investment_score_v880_dry_run_v895_summary_latest.json \
            latest/investment_score_remaining_blockers_v896.csv \
            latest/investment_score_remaining_blockers_v896_summary_latest.json \
            api/two_table_v1/kospi.json \
            api/two_table_v1/kosdaq.json \
            > /tmp/v897_protected.after
          diff -u /tmp/v897_protected.before /tmp/v897_protected.after

      - name: Restrict changed files
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import subprocess

          allowed = {
              "investment_score_supply_targeted_dart_audit_v897.py",
              "latest/investment_score_supply_targeted_dart_v897.csv",
              "latest/investment_score_supply_targeted_dart_v897_summary_latest.json",
              "latest/investment_score_supply_targeted_dart_v897_run_log_latest.txt",
              "docs/investment_score_supply_targeted_dart_v897.md",
          }

          changed = {
              line[3:]
              for line in subprocess.check_output(
                  ["git", "status", "--porcelain"], text=True
              ).splitlines()
              if line
          }
          unexpected = sorted(changed - allowed)
          if unexpected:
              raise SystemExit("UNEXPECTED_CHANGED_FILES:" + ",".join(unexpected))
          print("V897_CHANGED_FILES_RESTRICTED=PASS")
          PY

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"

          git add \
            investment_score_supply_targeted_dart_audit_v897.py \
            latest/investment_score_supply_targeted_dart_v897.csv \
            latest/investment_score_supply_targeted_dart_v897_summary_latest.json \
            latest/investment_score_supply_targeted_dart_v897_run_log_latest.txt \
            docs/investment_score_supply_targeted_dart_v897.md

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT"
            exit 0
          fi

          git commit -m "Audit targeted DART supply completeness v8.9.7"
          git pull --rebase origin main
          git push origin HEAD:main
