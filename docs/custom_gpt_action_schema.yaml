openapi: 3.1.0
info:
  title: KRX Watchlist and Request-Time Price Unified API
  version: 7.1.0
  description: Single-domain unified Action for synchronized GitHub stock-table JSON, request-time KR/US auxiliary
    quotes, and health checks. Use this schema as the only Action set for krx-live-price-ksh.diaconos.workers.dev.
servers:
- url: https://krx-live-price-ksh.diaconos.workers.dev
paths:
  /health:
    get:
      operationId: getRequestTimePriceHealth
      summary: Check unified Worker health and provider configuration
      responses:
        '200':
          description: Worker health information
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'
  /quotes:
    get:
      operationId: getRequestTimePrices
      summary: Get request-time auxiliary prices for Korean or US stocks
      description: 'Pass comma-separated KEY|MARKET items. Examples: 005930|KOSPI,000660|KOSPI or AAPL|USA,NVDA|USA.
        The GPT must normally call at most 10 items per initial batch, then retry only failures in batches of at
        most 5 and 2.'
      parameters:
      - name: items
        in: query
        required: true
        description: Comma-separated stock keys with market, for example 005930|KOSPI,000660|KOSPI or AAPL|USA.
        schema:
          type: string
          minLength: 1
          example: 005930|KOSPI,000660|KOSPI
      responses:
        '200':
          description: Quote lookup result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
        '400':
          description: Invalid or excessive items
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuoteResponse'
  /sehwankim0114/krx-watchlist-auto/main/api/status.json:
    get:
      operationId: getApiStatus
      summary: Get API and official-data freshness gate
      responses:
        '200':
          description: Current synchronization and freshness status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/manifest.json:
    get:
      operationId: getApiManifest
      summary: Get generated table manifest
      responses:
        '200':
          description: API manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/validation_report.json:
    get:
      operationId: getApiValidationReport
      summary: Get API structural validation report
      responses:
        '200':
          description: API validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/stock_table_rules.json:
    get:
      operationId: getStockTableRules
      summary: Get current stock-table rules from GitHub
      responses:
        '200':
          description: Current rules and rules hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/watchlist.json:
    get:
      operationId: getWatchlist
      summary: Get active watchlist table
      responses:
        '200':
          description: Watchlist rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /tables/v1/{table}:
    get:
      operationId: getKospiWatchlist
      summary: Get new-format 코피표 or 연속하락표 with guarded pagination
      description: '코피표: table=kospi (30 rows). 연속하락표: decliners. 2.4연속하락표: decliners24.
        Production only. Fetch all pages, pin source_build_id after page 1. Never fall back to old tables or preview.'
      parameters:
      - name: table
        in: path
        required: true
        description: Exact command mapping; standalone swing table is not supported.
        schema:
          type: string
          enum: [kospi, decliners, decliners24]
      - name: page
        in: query
        required: false
        description: Page number starting at 1. Fetch through page_count; do not truncate results.
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 1
      - name: build_id
        in: query
        required: false
        description: Use page 1 source_build_id on every subsequent page; required when page exceeds 1.
        schema:
          type: string
          maxLength: 128
      responses:
        '200':
          description: One production page; decode each row using columns, render headers, and fetch all pages.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TwoTablePage'
        '400':
          description: Invalid table, page or missing build_id for later pages. No usable rows.
        '409':
          description: Not activated, stale, checksum or build mismatch. Restart once only for build changes; otherwise stop.
        '502':
          description: Oversized or invalid upstream data. Stop without fallback.
        '503':
          description: Data source or calendar unavailable. Stop without fallback.
  /sehwankim0114/krx-watchlist-auto/main/api/kosdaq_watchlist.json:
    get:
      operationId: getKosdaqWatchlist
      summary: Get compact KOSDAQ watchlist candidate rows
      description: Preferred default endpoint for 코닥표. Exactly 10 compact rows. Do not fall back to CSV or legacy
        full candidates.
      responses:
        '200':
          description: Get compact KOSDAQ watchlist candidate rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_candidates_30.json:
    get:
      operationId: getKospiCandidates
      summary: Get the single KOSPI candidate table with embedded recommendation markings
      responses:
        '200':
          description: KOSPI candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kosdaq_candidates_10.json:
    get:
      operationId: getKosdaqCandidates
      summary: Get the single KOSDAQ candidate table with embedded recommendation markings
      responses:
        '200':
          description: KOSDAQ candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_1m_candidates_30.json:
    get:
      operationId: getKospiOneMonthCandidates
      summary: Get the single KOSPI one-month candidate table with embedded recommendation markings
      responses:
        '200':
          description: KOSPI one-month candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_1m_recommend_7.json:
    get:
      operationId: getKospiOneMonthRecommendations
      summary: Get the explicit-request-only KOSPI one-month recommendation shortlist
      responses:
        '200':
          description: KOSPI one-month recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kosdaq_1m_candidates_10.json:
    get:
      operationId: getKosdaqOneMonthCandidates
      summary: Get the single KOSDAQ one-month candidate table with embedded recommendation markings
      responses:
        '200':
          description: KOSDAQ one-month candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kosdaq_1m_recommend_5.json:
    get:
      operationId: getKosdaqOneMonthRecommendations
      summary: Get the explicit-request-only KOSDAQ one-month recommendation shortlist
      responses:
        '200':
          description: KOSDAQ one-month recommendations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_gainers_1m.json:
    get:
      operationId: getKospiGainers
      summary: Get KOSPI rapid-rise candidates
      responses:
        '200':
          description: KOSPI rapid-rise table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_monthly_cycle.json:
    get:
      operationId: getMonthlyCycle
      summary: Get monthly-cycle candidates
      responses:
        '200':
          description: Monthly-cycle table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_fx_weakness_candidates_30.json:
    get:
      operationId: getFxWeaknessCandidates
      summary: Get the single FX-weakness candidate table with embedded recommendation markings
      responses:
        '200':
          description: FX-weakness candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_short_term_candidates_30.json:
    get:
      operationId: getShortTermCandidates
      summary: Get the single short-term candidate table with embedded recommendation markings
      responses:
        '200':
          description: Short-term candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/official_data_status.json:
    get:
      operationId: getOfficialDataStatus
      summary: Get canonical official KRX status snapshot
      responses:
        '200':
          description: Official KRX status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/current_price_basis.json:
    get:
      operationId: getCurrentPriceBasis
      summary: Get current-price adjustment status
      responses:
        '200':
          description: Current-price basis status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/data_freshness_notice.json:
    get:
      operationId: getDataFreshnessNotice
      summary: Get human-readable freshness metadata
      responses:
        '200':
          description: Data freshness notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/table_health.json:
    get:
      operationId: getTableHealth
      summary: Get integrated table health status
      responses:
        '200':
          description: Table health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/market_status.json:
    get:
      operationId: getMarketStatus
      summary: Get market status
      responses:
        '200':
          description: Market status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/macro_leverage.json:
    get:
      operationId: getMacroLeverage
      summary: Get macro and leverage risk status
      responses:
        '200':
          description: Macro and leverage status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/bubble_risk.json:
    get:
      operationId: getBubbleRisk
      summary: Get bubble-risk status
      responses:
        '200':
          description: Bubble-risk status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/stock_reference_manifest.json:
    get:
      operationId: getHoldingsReferenceManifest
      summary: Get privacy-safe holdings runtime reference manifest
      responses:
        '200':
          description: Public stock-reference shard manifest with no user holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/stock_reference_shards/{prefix}.json:
    get:
      operationId: getStockReferenceShard
      summary: Get one exact public stock-reference row by prefix and ticker
      description: For holdings-table runtime lookup, always send the ticker's first two digits as prefix and
        the full six-digit ticker as the required ticker query. Optionally send KOSPI or KOSDAQ as market.
        Never call this operation with prefix alone. The response contains no user holdings.
      parameters:
      - name: prefix
        in: path
        required: true
        description: First two digits of a six-digit Korean ticker
        schema:
          type: string
          pattern: ^[0-9]{2}$
      - name: ticker
        in: query
        required: true
        description: Exact six-digit Korean ticker. Its first two digits must match prefix.
        schema:
          type: string
          pattern: ^[0-9]{6}$
          example: '005930'
      - name: market
        in: query
        required: false
        description: Optional exact market filter. Use it when the user's market is known.
        schema:
          type: string
          enum:
          - KOSPI
          - KOSDAQ
      responses:
        '200':
          description: One exact public market reference row; no user holdings
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
        '400':
          description: Missing or invalid ticker, prefix mismatch, or invalid market
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/us_watchlist.json:
    get:
      operationId: getUsWatchlist
      summary: Get the S&P500 candidate table with seven embedded recommendation markings
      responses:
        '200':
          description: US S&P500 watchlist candidate rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/us_watchlist_recommend_7.json:
    get:
      operationId: getUsWatchlistRecommendations
      summary: Get the explicit-request-only US S&P500 recommendation shortlist
      responses:
        '200':
          description: US S&P500 recommendation rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
components:
  schemas:
    TwoTablePage:
      type: object
      required: [status, source_build_id, source_rules_version, source_rules_sha256, basis_date, table_id, page, page_count, total_rows, row_count, columns, headers, rows, transport]
      properties:
        status:
          type: string
          enum: [READY]
        source_build_id:
          type: string
        source_rules_version:
          type: string
        source_rules_sha256:
          type: string
        basis_date:
          type: string
        table_id:
          type: string
          enum: [kospi, decliners, decliners24]
        page:
          type: integer
        page_count:
          type: integer
        total_rows:
          type: integer
        row_count:
          type: integer
        columns:
          type: array
          items:
            type: string
        headers:
          type: array
          items:
            type: string
        rows:
          type: array
          maxItems: 30
          items:
            type: array
            minItems: 14
            maxItems: 14
            items: {}
        transport:
          type: object
          properties:
            mode:
              type: string
              enum: [production]
            next_page_url:
              type: [string, 'null']
          additionalProperties: true
      additionalProperties: true
    AnyObject:
      type: object
      description: Common response envelope used by the synchronized KRX JSON endpoints.
      properties:
        schema_version:
          type: string
        build_id:
          type: string
        script:
          type: string
        status:
          type: string
        generated_at_kst:
          type: string
        validated_at:
          type: string
        source_commit_sha:
          type: string
        source_file:
          type: string
        source_status_file:
          type: string
        table_id:
          type: string
        snapshot_id:
          type: string
        display_name:
          type: string
        api_sync_ok:
          type: boolean
        official_fresh_now:
          type: boolean
        safe_to_analyze_as_latest:
          type: boolean
        official_fresh:
          type: boolean
        fresh:
          type: boolean
        required:
          type: boolean
        row_count_ok:
          type: boolean
        current_basis_selected:
          type: boolean
        confirmed_basis_date:
          type: string
        computed_expected_official_trading_date:
          type: string
        expected_official_trading_date:
          type: string
        kospi_actual_date:
          type: string
        kosdaq_actual_date:
          type: string
        basis_date_for_display:
          type: string
        official_status_source:
          type: string
        official_status_source_run_at_kst:
          type: string
        current_price_asof_kst:
          type: string
        current_price_basis_status:
          type: string
        rules_version:
          type: string
        rules_sha256:
          type: string
        content_markdown:
          type: string
        usage_rule:
          type: string
        validation_message:
          type: string
        source_priority:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: string
        critical_errors:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        control_files:
          type: array
          items:
            type: string
        row_count:
          type: integer
        required_table_count:
          type: integer
        generated_table_count:
          type: integer
        rules:
          $ref: '#/components/schemas/FlexibleObject'
        official_data:
          $ref: '#/components/schemas/FlexibleObject'
        current_price_basis:
          $ref: '#/components/schemas/FlexibleObject'
        expected_rows:
          $ref: '#/components/schemas/FlexibleObject'
        data:
          $ref: '#/components/schemas/FlexibleObject'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/FlexibleObject'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/FlexibleObject'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/FlexibleObject'
        presentation_policy:
          $ref: '#/components/schemas/FlexibleObject'
        default_output:
          type: boolean
        explicit_request_only:
          type: boolean
      additionalProperties: true
    FlexibleObject:
      type: object
      description: Flexible nested object or stock-table row with endpoint-specific fields.
      properties:
        status:
          type: string
        name:
          type: string
        ticker:
          type: string
        code:
          type: string
        table_id:
          type: string
        api_file:
          type: string
        source_file:
          type: string
        row_count:
          type: integer
      additionalProperties: true
    HealthResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        build_version:
          type: string
        max_items:
          type: integer
        endpoints:
          type: array
          items:
            type: string
        providers:
          type: object
          additionalProperties: true
        github_proxy_policy:
          type: object
          additionalProperties: true
        us_price_policy:
          type: object
          additionalProperties: true
        generated_at:
          type: string
      additionalProperties: true
    QuoteResponse:
      type: object
      properties:
        status:
          type: string
        service:
          type: string
        version:
          type: string
        build_version:
          type: string
        request_started_at:
          type: string
        request_finished_at:
          type: string
        generated_at:
          type: string
        requested_count:
          type: integer
        ok_count:
          type: integer
        failed_count:
          type: integer
        provider_summary:
          type: object
          additionalProperties: true
        after_hours_reflected:
          type: boolean
        source_notice:
          type: string
        quotes:
          type: array
          items:
            $ref: '#/components/schemas/QuoteRow'
        failures:
          type: array
          items:
            $ref: '#/components/schemas/QuoteFailure'
        error:
          type: string
        message:
          type: string
      additionalProperties: true
    QuoteRow:
      type: object
      properties:
        input:
          type: string
        quote_key:
          type: string
        ticker:
          type:
          - string
          - 'null'
        symbol:
          type:
          - string
          - 'null'
        code:
          type:
          - string
          - 'null'
        market:
          type: string
        status:
          type: string
        ok:
          type: boolean
        current_price:
          type:
          - number
          - 'null'
        price:
          type:
          - number
          - 'null'
        currency:
          type: string
        source:
          type:
          - string
          - 'null'
        price_source:
          type:
          - string
          - 'null'
        source_kind:
          type: string
        provider_ticker:
          type:
          - string
          - 'null'
        price_time:
          type:
          - string
          - 'null'
        traded_at:
          type:
          - string
          - 'null'
        price_as_of:
          type:
          - string
          - 'null'
        price_timestamp:
          type:
          - integer
          - number
          - 'null'
        market_status:
          type: string
        session_status:
          type: string
        exchange:
          type: string
        previous_close:
          type:
          - number
          - 'null'
        after_hours_reflected:
          type: boolean
        is_after_hours:
          type: boolean
        error_code:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      additionalProperties: true
    QuoteFailure:
      type: object
      properties:
        quote_key:
          type: string
        market:
          type: string
        error_code:
          type:
          - string
          - 'null'
        error:
          type:
          - string
          - 'null'
      additionalProperties: true
