openapi: 3.1.0
info:
  title: KRX Watchlist Auto Read API
  version: 4.0.0
  description: Read-only synchronized KRX API. Default output uses one candidate table with embedded recommendation markings
    and does not expose duplicate shortlist endpoints.
servers:
- url: https://raw.githubusercontent.com
paths:
  /sehwankim0114/krx-watchlist-auto/main/api/status.json:
    get:
      operationId: getApiStatus
      summary: Get API and official-data freshness gate
      responses:
        '200':
          description: Current synchronization and freshness status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/manifest.json:
    get:
      operationId: getApiManifest
      summary: Get generated table manifest
      responses:
        '200':
          description: API manifest
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/validation_report.json:
    get:
      operationId: getApiValidationReport
      summary: Get API structural validation report
      responses:
        '200':
          description: API validation report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/stock_table_rules.json:
    get:
      operationId: getStockTableRules
      summary: Get current stock-table rules from GitHub
      responses:
        '200':
          description: Current rules and rules hash
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/watchlist.json:
    get:
      operationId: getWatchlist
      summary: Get active watchlist table
      responses:
        '200':
          description: Watchlist rows
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_candidates_30.json:
    get:
      operationId: getKospiCandidates
      summary: Get the single KOSPI candidate table with embedded recommendation markings
      responses:
        '200':
          description: KOSPI candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kosdaq_candidates_10.json:
    get:
      operationId: getKosdaqCandidates
      summary: Get the single KOSDAQ candidate table with embedded recommendation markings
      responses:
        '200':
          description: KOSDAQ candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_gainers_1m.json:
    get:
      operationId: getKospiGainers
      summary: Get KOSPI rapid-rise candidates
      responses:
        '200':
          description: KOSPI rapid-rise table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_monthly_cycle.json:
    get:
      operationId: getMonthlyCycle
      summary: Get monthly-cycle candidates
      responses:
        '200':
          description: Monthly-cycle table
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_fx_weakness_candidates_30.json:
    get:
      operationId: getFxWeaknessCandidates
      summary: Get the single FX-weakness candidate table with embedded recommendation markings
      responses:
        '200':
          description: FX-weakness candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/kospi_short_term_candidates_30.json:
    get:
      operationId: getShortTermCandidates
      summary: Get the single short-term candidate table with embedded recommendation markings
      responses:
        '200':
          description: Short-term candidates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/official_data_status.json:
    get:
      operationId: getOfficialDataStatus
      summary: Get canonical official KRX status snapshot
      responses:
        '200':
          description: Official KRX status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/current_price_basis.json:
    get:
      operationId: getCurrentPriceBasis
      summary: Get current-price adjustment status
      responses:
        '200':
          description: Current-price basis status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/data_freshness_notice.json:
    get:
      operationId: getDataFreshnessNotice
      summary: Get human-readable freshness metadata
      responses:
        '200':
          description: Data freshness notice
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/table_health.json:
    get:
      operationId: getTableHealth
      summary: Get integrated table health status
      responses:
        '200':
          description: Table health
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/market_status.json:
    get:
      operationId: getMarketStatus
      summary: Get market status
      responses:
        '200':
          description: Market status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/macro_leverage.json:
    get:
      operationId: getMacroLeverage
      summary: Get macro and leverage risk status
      responses:
        '200':
          description: Macro and leverage status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
  /sehwankim0114/krx-watchlist-auto/main/api/bubble_risk.json:
    get:
      operationId: getBubbleRisk
      summary: Get bubble-risk status
      responses:
        '200':
          description: Bubble-risk status
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnyObject'
components:
  schemas:
    AnyObject:
      type: object
      description: Common response envelope used by the synchronized KRX JSON endpoints.
      properties:
        schema_version:
          type: string
        build_id:
          type: string
        script:
          type: string
        status:
          type: string
        generated_at_kst:
          type: string
        validated_at:
          type: string
        source_commit_sha:
          type: string
        source_file:
          type: string
        source_status_file:
          type: string
        table_id:
          type: string
        snapshot_id:
          type: string
        display_name:
          type: string
        api_sync_ok:
          type: boolean
        official_fresh_now:
          type: boolean
        safe_to_analyze_as_latest:
          type: boolean
        official_fresh:
          type: boolean
        fresh:
          type: boolean
        required:
          type: boolean
        row_count_ok:
          type: boolean
        current_basis_selected:
          type: boolean
        confirmed_basis_date:
          type: string
        computed_expected_official_trading_date:
          type: string
        expected_official_trading_date:
          type: string
        kospi_actual_date:
          type: string
        kosdaq_actual_date:
          type: string
        basis_date_for_display:
          type: string
        official_status_source:
          type: string
        official_status_source_run_at_kst:
          type: string
        current_price_asof_kst:
          type: string
        current_price_basis_status:
          type: string
        rules_version:
          type: string
        rules_sha256:
          type: string
        content_markdown:
          type: string
        usage_rule:
          type: string
        validation_message:
          type: string
        source_priority:
          type: array
          items:
            type: string
        columns:
          type: array
          items:
            type: string
        critical_errors:
          type: array
          items:
            type: string
        errors:
          type: array
          items:
            type: string
        warnings:
          type: array
          items:
            type: string
        control_files:
          type: array
          items:
            type: string
        row_count:
          type: integer
        required_table_count:
          type: integer
        generated_table_count:
          type: integer
        rules:
          $ref: '#/components/schemas/FlexibleObject'
        official_data:
          $ref: '#/components/schemas/FlexibleObject'
        current_price_basis:
          $ref: '#/components/schemas/FlexibleObject'
        expected_rows:
          $ref: '#/components/schemas/FlexibleObject'
        data:
          $ref: '#/components/schemas/FlexibleObject'
        rows:
          type: array
          items:
            $ref: '#/components/schemas/FlexibleObject'
        tables:
          type: array
          items:
            $ref: '#/components/schemas/FlexibleObject'
        snapshots:
          type: array
          items:
            $ref: '#/components/schemas/FlexibleObject'
      additionalProperties: true
    FlexibleObject:
      type: object
      description: Flexible nested object or stock-table row with endpoint-specific fields.
      properties:
        status:
          type: string
        name:
          type: string
        ticker:
          type: string
        code:
          type: string
        table_id:
          type: string
        api_file:
          type: string
        source_file:
          type: string
        row_count:
          type: integer
      additionalProperties: true
