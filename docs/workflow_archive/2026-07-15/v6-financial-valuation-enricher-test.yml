name: V6 Financial Valuation Enricher Test

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: v6-financial-valuation-enricher-test-main
  cancel-in-progress: false

jobs:
  test-financial-valuation:
    runs-on: ubuntu-latest
    env:
      TZ: Asia/Seoul
      DART_API_KEY: ${{ secrets.DART_API_KEY }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install Python packages
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install pandas

      - name: Check v1.2 duplicate-code program and DART secret
        shell: bash
        run: |
          set -euo pipefail
          test -f financial_valuation_enricher.py
          test -f docs/scoring_system_v6.md
          test -d latest

          if [ -z "${DART_API_KEY:-}" ]; then
            echo "::error::DART_API_KEY secret is missing."
            exit 1
          fi

          grep -q \
            'v1.2.0-duplicate-stock-code-fix' \
            financial_valuation_enricher.py

          grep -q \
            'CORP_CODE_MAP_FILENAME' \
            financial_valuation_enricher.py

          grep -q \
            'corp-candidate-name-match-v2' \
            financial_valuation_enricher.py

          grep -q \
            'def resolve_corp_info(' \
            financial_valuation_enricher.py

          grep -Fq \
            'mapping.setdefault(stock_code, []).append(candidate)' \
            financial_valuation_enricher.py

          if grep -q \
            'CORP_CACHE_CANDIDATES' \
            financial_valuation_enricher.py; then
            echo "::error::Old corporate-code cache logic remains."
            exit 1
          fi

          echo "PROGRAM_VERSION=v1.2.0-duplicate-stock-code-fix"
          echo "DART_API_KEY_PRESENT=true"
          echo "V1_2_REQUIRED_FILES=OK"

      - name: Compile and run built-in identity self-test
        run: |
          set -euo pipefail
          python -m py_compile financial_valuation_enricher.py
          python financial_valuation_enricher.py --self-test \
            | tee /tmp/financial_self_test.txt

          grep -q \
            'SELF_TEST_STATUS=OK' \
            /tmp/financial_self_test.txt

          grep -q \
            'duplicate_stock_code_name_resolution' \
            /tmp/financial_self_test.txt

          echo "PROGRAM_COMPILE_AND_DUPLICATE_CODE_SELF_TEST=OK"

      - name: Prepare isolated identity test data
        shell: bash
        run: |
          set -euo pipefail
          rm -rf .test_financial
          mkdir -p .test_financial

          python - <<'PY'
          from pathlib import Path
          import re
          import shutil
          import pandas as pd

          source_dir = Path("latest")
          test_dir = Path(".test_financial")

          universe_files = [
              source_dir / "kospi_universe_summary_latest.csv",
              source_dir / "kosdaq_universe_summary_latest.csv",
          ]

          def read_csv(path):
              for encoding in ("utf-8-sig", "utf-8", "cp949"):
                  try:
                      return pd.read_csv(
                          path,
                          encoding=encoding,
                          dtype=str,
                      ).fillna("")
                  except UnicodeDecodeError:
                      continue
              raise RuntimeError(f"Unable to read {path}")

          def ticker_column(df):
              for name in ("ticker", "code", "종목코드", "단축코드"):
                  if name in df.columns:
                      return name
              return None

          def name_column(df):
              for name in ("name", "종목명", "회사명"):
                  if name in df.columns:
                      return name
              return None

          def valid_korean_ticker(value):
              text = str(value).strip()
              if text.endswith(".0"):
                  text = text[:-2]
              digits = re.sub(r"[^0-9]", "", text)
              if len(digits) > 6:
                  return ""
              ticker = digits.zfill(6) if digits else ""
              if not re.fullmatch(r"[0-9]{6}", ticker):
                  return ""
              if ticker == "000000":
                  return ""
              return ticker

          rows_by_ticker = {}

          for path in universe_files:
              if not path.exists():
                  continue
              df = read_csv(path)
              t_col = ticker_column(df)
              n_col = name_column(df)
              if t_col is None:
                  continue

              for _, row in df.iterrows():
                  ticker = valid_korean_ticker(
                      row.get(t_col, "")
                  )
                  if not ticker:
                      continue
                  rows_by_ticker.setdefault(
                      ticker,
                      {
                          "ticker": ticker,
                          "name": (
                              str(row.get(n_col, "")).strip()
                              if n_col
                              else ""
                          ),
                          "market": str(
                              row.get("market", "")
                          ).strip(),
                      },
                  )

          # DB하이텍을 반드시 포함해 과거 오매칭을 재검증한다.
          required_ticker = "000990"
          if required_ticker not in rows_by_ticker:
              raise SystemExit(
                  "Required DB HiTek ticker 000990 is missing "
                  "from the KOSPI universe."
              )

          preferred = [
              "000990",  # DB하이텍: 과거 오매칭 재검증
              "005930",  # 삼성전자
              "000660",  # SK하이닉스
              "042700",  # 한미반도체
              "247540",  # 에코프로비엠
          ]

          selected = []
          seen = set()

          for ticker in preferred:
              row = rows_by_ticker.get(ticker)
              if row and ticker not in seen:
                  selected.append(row)
                  seen.add(ticker)

          if len(selected) < 5:
              for ticker in sorted(rows_by_ticker):
                  if ticker in seen:
                      continue
                  selected.append(rows_by_ticker[ticker])
                  seen.add(ticker)
                  if len(selected) >= 5:
                      break

          if len(selected) < 5:
              raise SystemExit(
                  f"Five valid Korean tickers are required; "
                  f"found {len(selected)}."
              )

          sample = pd.DataFrame(selected[:5])

          if "000000" in set(sample["ticker"]):
              raise SystemExit(
                  "Invalid ticker 000000 entered the test sample."
              )
          if "000990" not in set(sample["ticker"]):
              raise SystemExit(
                  "DB HiTek 000990 is not in the test sample."
              )

          sample.to_csv(
              test_dir / "watchlist_summary_latest.csv",
              index=False,
              encoding="utf-8-sig",
          )

          # 시장가치 자료만 복사한다.
          # 과거 DART 기업코드 캐시는 복사하지 않아
          # 공식 corpCode.xml 다운로드를 강제로 검증한다.
          copied = []
          for filename in (
              "kospi_universe_summary_latest.csv",
              "kosdaq_universe_summary_latest.csv",
          ):
              source = source_dir / filename
              if source.exists():
                  shutil.copy2(source, test_dir / filename)
                  copied.append(filename)

          print(f"TEST_TICKER_COUNT={len(sample)}")
          print(
              "TEST_TICKERS="
              + ",".join(sample["ticker"].tolist())
          )
          print(
              "TEST_NAMES="
              + ",".join(sample["name"].tolist())
          )
          print(
              "COPIED_SUPPORT_FILES="
              + ",".join(copied)
          )
          print("OLD_DART_CACHE_COPIED=false")
          print("DBHITEK_REQUIRED=true")
          print("INVALID_000000_BLOCKED=true")
          PY

      - name: Run live official OpenDART identity test
        shell: bash
        run: |
          set -euo pipefail
          python financial_valuation_enricher.py \
            --output-dir .test_financial \
            --workers 2 \
            --timeout 30 \
            --max-api-calls 5 \
            --retry-hours 0

      - name: Verify corporate identity and financial results
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          import re
          import pandas as pd

          test_dir = Path(".test_financial")
          cache_path = (
              test_dir
              / "financial_valuation_cache_latest.csv"
          )
          log_path = (
              test_dir
              / "financial_valuation_run_log_latest.txt"
          )
          official_map_path = (
              test_dir
              / "dart_corp_code_map_latest.csv"
          )

          for path in (
              cache_path,
              log_path,
              official_map_path,
          ):
              if not path.exists():
                  raise SystemExit(
                      f"required test output missing: {path}"
                  )

          df = pd.read_csv(
              cache_path,
              encoding="utf-8-sig",
              dtype=str,
          ).fillna("")

          required_columns = {
              "ticker",
              "name",
              "corp_code",
              "corp_name",
              "corp_code_source",
              "corp_identity_status",
              "corp_identity_reason",
              "corp_candidate_count",
              "corp_selection_method",
              "financial_data_status",
              "financial_source_status",
              "revenue",
              "operating_profit",
              "net_income",
              "total_assets",
              "total_liabilities",
              "total_equity",
              "eps_annualized",
              "bps",
              "per_annualized",
              "pbr",
              "valuation_data_status",
          }
          missing = sorted(
              required_columns - set(df.columns)
          )
          if missing:
              raise SystemExit(
                  "missing required columns: "
                  + ",".join(missing)
              )

          if len(df) != 5:
              raise SystemExit(
                  f"test row count must be 5; got {len(df)}"
              )

          invalid_tickers = [
              ticker
              for ticker in df["ticker"].astype(str)
              if (
                  not re.fullmatch(r"[0-9]{6}", ticker)
                  or ticker == "000000"
              )
          ]
          if invalid_tickers:
              raise SystemExit(
                  "invalid ticker values: "
                  + ",".join(invalid_tickers)
              )

          unresolved_rows = df[
              ~df["corp_identity_status"].isin(
                  ["MATCH", "MATCH_NORMALIZED"]
              )
          ]
          if not unresolved_rows.empty:
              raise SystemExit(
                  "corporate identity was not resolved by name: "
                  + unresolved_rows[
                      [
                          "ticker",
                          "name",
                          "corp_name",
                          "corp_identity_status",
                          "corp_identity_reason",
                          "corp_candidate_count",
                          "corp_selection_method",
                      ]
                  ].to_json(
                      orient="records",
                      force_ascii=False,
                  )
              )

          bad_source_rows = df[
              ~df["corp_code_source"].eq(
                  "OPENDART_OFFICIAL_DOWNLOAD"
              )
          ]
          if not bad_source_rows.empty:
              raise SystemExit(
                  "non-official corporate-code source detected: "
                  + bad_source_rows[
                      [
                          "ticker",
                          "corp_code_source",
                      ]
                  ].to_json(
                      orient="records",
                      force_ascii=False,
                  )
              )

          db_rows = df[df["ticker"].eq("000990")]
          if len(db_rows) != 1:
              raise SystemExit(
                  "DB HiTek 000990 must appear exactly once."
              )

          db_row = db_rows.iloc[0]
          normalized_corp_name = re.sub(
              r"[^0-9A-Z가-힣]",
              "",
              str(db_row["corp_name"]).upper(),
          )

          if "DB하이텍" not in normalized_corp_name:
              raise SystemExit(
                  "DB HiTek corporate identity is incorrect: "
                  f"name={db_row['name']} "
                  f"corp_name={db_row['corp_name']} "
                  f"corp_code={db_row['corp_code']}"
              )

          if "IBKS" in normalized_corp_name or "스팩" in normalized_corp_name:
              raise SystemExit(
                  "Old DB HiTek/SPAC mismatch still exists."
              )

          try:
              db_candidate_count = int(
                  float(db_row["corp_candidate_count"])
              )
          except (TypeError, ValueError):
              raise SystemExit(
                  "DB HiTek candidate count is not numeric: "
                  f"{db_row['corp_candidate_count']}"
              )

          if db_candidate_count < 2:
              raise SystemExit(
                  "Duplicate-code test was not exercised for "
                  f"DB HiTek: candidate_count={db_candidate_count}"
              )

          if db_row["corp_selection_method"] not in {
              "NAME_EXACT",
              "NAME_CONTAINS",
          }:
              raise SystemExit(
                  "DB HiTek was not selected by company name: "
                  f"method={db_row['corp_selection_method']}"
              )

          accepted_identity = {
              "MATCH",
              "MATCH_NORMALIZED",
          }
          unknown_identity = sorted(
              set(df["corp_identity_status"])
              - accepted_identity
          )
          if unknown_identity:
              raise SystemExit(
                  "unexpected identity statuses: "
                  + ",".join(unknown_identity)
              )

          accepted_selection_methods = {
              "NAME_EXACT",
              "NAME_CONTAINS",
          }
          bad_selection_methods = sorted(
              set(df["corp_selection_method"])
              - accepted_selection_methods
          )
          if bad_selection_methods:
              raise SystemExit(
                  "unexpected corporate selection methods: "
                  + ",".join(bad_selection_methods)
              )

          source_ok = int(
              df["financial_source_status"].eq("OK").sum()
          )
          usable = int(
              df["financial_data_status"]
              .isin(["READY", "PARTIAL"])
              .sum()
          )
          valuation_ready = int(
              df["valuation_data_status"].eq("READY").sum()
          )

          if source_ok < 1:
              raise SystemExit(
                  "no successful DART financial record: "
                  + str(
                      df["financial_source_status"]
                      .value_counts()
                      .to_dict()
                  )
              )

          if usable < 1:
              raise SystemExit(
                  "no usable financial record: "
                  + str(
                      df["financial_data_status"]
                      .value_counts()
                      .to_dict()
                  )
              )

          # 적자·0이익 종목에는 PER를 만들지 않는다.
          for _, row in df.iterrows():
              try:
                  net_income = float(row["net_income"])
              except (TypeError, ValueError):
                  continue
              if (
                  net_income <= 0
                  and str(row["per_annualized"]).strip()
              ):
                  raise SystemExit(
                      "PER must be blank for non-positive "
                      f"net income: {row['ticker']}"
                  )

          log_text = log_path.read_text(
              encoding="utf-8"
          )

          if (
              "corp_code_source="
              "OPENDART_OFFICIAL_DOWNLOAD"
              not in log_text
          ):
              raise SystemExit(
                  "run log does not confirm official "
                  "OpenDART corporate-code download."
              )

          if (
              "CORP_IDENTITY_POLICY_VERSION="
              "corp-candidate-name-match-v2"
              not in log_text
          ):
              raise SystemExit(
                  "run log does not confirm duplicate-code "
                  "identity policy v2."
              )

          if "corp_code_duplicate_stock_code_count=" not in log_text:
              raise SystemExit(
                  "run log does not report duplicate "
                  "OpenDART stock-code candidates."
              )

          if "STATUS=OK" not in log_text:
              raise SystemExit(
                  "financial valuation run status is not OK."
              )

          print(f"TEST_ROW_COUNT={len(df)}")
          print(f"DART_SOURCE_OK_COUNT={source_ok}")
          print(f"FINANCIAL_USABLE_COUNT={usable}")
          print(
              f"VALUATION_READY_COUNT={valuation_ready}"
          )
          print(
              "DBHITEK_CORP_NAME="
              f"{db_row['corp_name']}"
          )
          print(
              "DBHITEK_CORP_CODE="
              f"{db_row['corp_code']}"
          )
          print(
              "DBHITEK_CANDIDATE_COUNT="
              f"{db_candidate_count}"
          )
          print(
              "DBHITEK_SELECTION_METHOD="
              f"{db_row['corp_selection_method']}"
          )
          print("CORP_IDENTITY_UNRESOLVED_COUNT=0")
          print("INVALID_000000_COUNT=0")
          print(
              "CORP_CODE_SOURCE="
              "OPENDART_OFFICIAL_DOWNLOAD"
          )
          print("LIVE_DUPLICATE_CODE_IDENTITY_VERIFICATION=OK")
          PY

      - name: Publish corrected test evidence
        shell: bash
        run: |
          set -euo pipefail

          cp \
            .test_financial/financial_valuation_cache_latest.csv \
            latest/financial_valuation_test_sample_latest.csv

          cp \
            .test_financial/financial_valuation_run_log_latest.txt \
            latest/financial_valuation_test_report_latest.txt

          {
            echo
            echo "TEST_WORKFLOW_VERSION=v1.2-duplicate-stock-code"
            echo "TEST_SCOPE=isolated_five_korean_tickers"
            echo "DBHITEK_IDENTITY_REQUIRED=true"
            echo "INVALID_000000_BLOCKED=true"
            echo "OFFICIAL_CORP_CODE_REQUIRED=true"
            echo "CORP_IDENTITY_UNRESOLVED_COUNT=0"
            echo "PRODUCTION_TABLES_CHANGED=false"
            echo "LIVE_TEST_STATUS=OK"
          } >> \
            latest/financial_valuation_test_report_latest.txt

          echo "----- corrected financial test report -----"
          cat latest/financial_valuation_test_report_latest.txt

      - name: Commit and push corrected test evidence
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions"
          git config user.email \
            "github-actions@users.noreply.github.com"

          git add \
            latest/financial_valuation_test_sample_latest.csv \
            latest/financial_valuation_test_report_latest.txt

          if git diff --cached --quiet; then
            echo "NO_CHANGES_TO_COMMIT=true"
            echo "PUSH_SUCCESS=true"
            exit 0
          fi

          echo "CHANGED_FILES_BEGIN"
          git diff --cached --name-status
          echo "CHANGED_FILES_END"

          git commit -m \
            "Verify v6 duplicate DART stock code matching"

          PUSHED=false
          for attempt in 1 2 3; do
            echo "PUSH_ATTEMPT=$attempt"
            git fetch origin main

            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "REBASE_FAILED=true"
              sleep $((attempt * 5))
              continue
            fi

            if git push origin HEAD:main; then
              PUSHED=true
              break
            fi

            sleep $((attempt * 5))
          done

          if [ "$PUSHED" != "true" ]; then
            echo "PUSH_SUCCESS=false"
            exit 1
          fi

          echo "COMMIT_SHA=$(git rev-parse HEAD)"
          echo "PUSH_SUCCESS=true"
